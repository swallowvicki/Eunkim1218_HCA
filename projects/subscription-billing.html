   in the row beneath and the two controls read as different sizes; `.field` gives
   both the same width so the panel's right edge is one line. Content left, unit or
   caret right — the number row then mirrors the select row. */
.row-field { width: 216px; flex: 0 0 216px; box-sizing: border-box; }
.inline-input {
  display: flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 12px;
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
}
.inline-input:hover { border-color: var(--fg-muted); }
.inline-input:focus-within { border-color: #737373; }
.inline-input .input {
  flex: 1; min-width: 0; width: auto; height: auto; padding: 0;
  border: none; background: transparent; font-variant-numeric: tabular-nums;
}
.inline-input .input:hover, .inline-input .input:focus { border: none; }
.inline-input .unit { flex-shrink: 0; font-size: 13px; color: var(--fg-muted); }


/* ============ Toast ============
   A completed event gets a transient acknowledgement, not a banner. Banners are
   for conditions that stay true; "restored" is already over by the time it shows,
   and the durable proof is the status badge flipping to Active. */
/* Toast — the design system's own component, Figma node 228:232624. Replaces a
   bottom-left white card with a green left rule, which was mine. Top right (Grace),
   380px, 14/16 padding, radius 10, shadow 0 4px 16px rgba(0,0,0,.08), tinted surface,
   28px icon circle, title 14/20 semibold over sub-text 12/16.
   THE COMPONENT HAS NO CLOSE BUTTON — it auto-dismisses (7s), so ours lost its X too.
   It also has an optional action link; recharge and on/off toasts have nowhere to send
   the vendor, so they run with showButton=false — the plain success message (Grace).
   Four variants exist in the component; we use success. */
.toast-wrap { position: fixed; right: 20px; top: 20px; z-index: 250; }
/* The prototype panel is fixed over the right edge, so in the mockup the toast steps
   inside it. The product has no panel — right: 20px is the real value. */
@media (min-width: 1240px) { body.proto-open .toast-wrap { right: 392px; } }
.toast { display: flex; align-items: center; gap: 12px; width: 380px; padding: 14px 16px; border-radius: 10px; background: var(--sonner-bg-success); box-shadow: 0 4px 16px 0 rgba(0,0,0,.08); overflow: hidden; animation: toastIn .22s cubic-bezier(.22,1,.36,1); }
@keyframes toastIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
.toast.is-info    { background: var(--sonner-bg-info); }
.toast.is-warning { background: var(--sonner-bg-warning); }
.toast.is-error   { background: var(--sonner-bg-error); }
.toast-ico { flex-shrink: 0; width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--badge-green); color: #4f8f7d; }
.toast.is-info .toast-ico    { background: var(--badge-blue); color: var(--badge-blue-fg); }
.toast.is-warning .toast-ico { background: #fdf5e6; color: #c0860e; }
.toast.is-error .toast-ico   { background: #fce8e6; color: #c0392b; }
.toast-ico svg { width: 14px; height: 14px; }
.toast-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.toast-title { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--fg); }
.toast-msg { font-size: 12px; line-height: 16px; color: #262626; }

/* ============ Prototype control panel ============ */
.proto-fab { position: fixed; right: 20px; bottom: 20px; z-index: 300; width: 48px; height: 48px; border-radius: 50%; background: #1f1f1f; color: #fff; border: none; cursor: pointer; box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: center; }
.proto-fab svg { width: 20px; height: 20px; }
.proto-panel { position: fixed; right: 20px; bottom: 80px; z-index: 300; width: 320px; max-height: calc(100vh - 120px); overflow-y: auto; background: var(--card); border: 1px solid var(--border-muted); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 16px; }
.proto-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.proto-sub { font-size: 11px; color: var(--fg-muted); margin-bottom: 14px; line-height: 15px; }
.proto-group { margin-bottom: 14px; }
.proto-group-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 6px; }
.proto-btn { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 7px; border: 1px solid transparent; background: transparent; font-size: 12.5px; color: var(--fg-secondary); cursor: pointer; margin-bottom: 2px; line-height: 17px; }
.proto-btn:hover { background: var(--muted); color: var(--fg); }
.proto-btn.is-active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.proto-btn .hint { display: block; font-size: 10.5px; color: var(--fg-muted); font-weight: 400; margin-top: 1px; }
.proto-btn.is-active .hint { color: #c2699a; }
.model-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.model-btn { padding: 8px 6px; border: 1px solid var(--border-muted); border-radius: 7px; background: var(--card); font-family: inherit; font-size: 12px; font-weight: 600; color: var(--fg-secondary); cursor: pointer; line-height: 15px; }
.model-btn span { display: block; font-size: 10px; font-weight: 400; color: var(--fg-muted); margin-top: 2px; }
.model-btn.is-on { border: 2px solid var(--accent); color: var(--fg); padding: 7px 5px; }
.proto-foot { border-top: 1px solid var(--border-elements); padding-top: 10px; font-size: 10.5px; color: var(--fg-muted); line-height: 15px; }

.note-strip { display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px; border-radius: 8px; background: var(--badge-blue); color: #3c5c8a; font-size: 12px; line-height: 17px; }
.note-strip svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }

@media (max-width: 1180px) {
  .kv-grid { grid-template-columns: 1fr 1fr; }
  .balance-grid, .compose-grid { grid-template-columns: 1fr; }
}
</style>
</head>

/* =========================================================================

// ── demo data ───────────────────────────────────────────────────────────────
// Demo dates all land on the 15th. PRD §6.3 says only "Monthly on the cycle
// date" — the anchor is undocumented, so no screen copy states it.
/* No `name`: no doc names a plan or a tier, and "Shopcord Pro" was mine. A tier
   name implies other tiers that do not exist, so the screen names nothing — there
   is one subscription at one price. State stays out of that slot too: the section
   pill and the Status field already say whether billing is healthy, and a third
   would be the same fact three times. */
const PLAN = { price: '$20.00', cycle: 'Monthly' };

/* THE DEMO CLOCK. Card billing does not exist before the 1st release, so nothing on any
   screen can be charged before Oct 1, 2026 — the whole timeline used to sit in Jun–Aug
   2026, months ahead of the first possible charge, with three subscription charges that
   could not have happened.
   Anchor: release 1's "today" is just after launch (Grace, 8/28), so a migrated vendor
   has been charged exactly ONCE. One row is not a thin table — it is the whole record
   that can exist at that moment.
   Release 2 is TBD (it ships with Jinah's project), so its dates are spacing that shows
   a settled account, not a schedule. */
/* LAUNCH is the cutover — the day card billing starts existing. It is NOT anyone's
   billing day: §6.3 anchors the cycle on the date the vendor subscribed (Gap A-12), which
   is why the subscription card says "on the date you subscribed". The two shared one
   field until 2026-08-28, and that quietly made every demo vendor bill on the 1st. */
const LAUNCH = 'Oct 1, 2026';
const CLOCK = {
  1: { today: 'Oct 28, 2026', first: 'Oct 14, 2026', next: 'Nov 14, 2026', signupNext: 'Nov 28, 2026' },
  2: { today: 'Feb 20, 2027', first: 'Oct 14, 2026', next: 'Mar 14, 2027', signupNext: 'Mar 20, 2027' },
};

/* §6.3 anchors billing on the day charging starts, so a vendor subscribing TODAY does
   not inherit the migrated vendor's 5th-of-the-month anniversary — `next` belongs to the
   account already on screen, `signupNext` to the one being created. */
const clock = () => CLOCK[isR1() ? 1 : 2];
// The charge the suspension banner is about — the newest subscription row in the
// history the vendor is looking at, so the sentence and the table cannot disagree.
const failedChargeDate = () => {
  const rows = (isR1() ? HISTORY.filter(r => r.rel === 1) : HISTORY).filter(r => r.type === 'Subscription');
  return rows.length ? rows[0].date : CLOCK[isR1() ? 1 : 2].next;
};

/* The free period is the one EXISTING vendors have been on, and it is ending (§1
   "무료 기간 만료(10월)"). New vendors subscribing after launch are charged immediately
   — Grace, 8/28. §6.4 / PB 2.4.0 still describe a 3-month grant for subscribers, so
   this is a deliberate deviation logged in the Gap doc. */
const FREE = { until: 'Dec 13, 2026', first: 'Dec 14, 2026' };

const CARDS = {
  visa:  { id: 'visa',  brand: 'VISA', name: 'Visa',       cls: 'brand-visa', last4: '4242', exp: '08 / 2027' },
  // Anchored to release 1's clock — 11/2026 on the healthy Mastercard read as "about to
  // expire" once today moved to Oct 2026, which is a state it is not supposed to be in.
  mc:    { id: 'mc',    brand: 'MC',   name: 'Mastercard', cls: 'brand-mc',   last4: '8210', exp: '05 / 2028' },
  visaX: { id: 'visaX', brand: 'VISA', name: 'Visa',       cls: 'brand-visa', last4: '4242', exp: '11 / 2026' },
  visaO: { id: 'visaO', brand: 'VISA', name: 'Visa',       cls: 'brand-visa', last4: '4242', exp: '10 / 2026' },
  c3:  { id: 'c3',  brand: 'VISA', name: 'Visa',       cls: 'brand-visa', last4: '1881', exp: '03 / 2028' },
  c4:  { id: 'c4',  brand: 'AMEX', name: 'Amex',       cls: 'brand-amex', last4: '0005', exp: '07 / 2027' },
  c5:  { id: 'c5',  brand: 'MC',   name: 'Mastercard', cls: 'brand-mc',   last4: '4444', exp: '12 / 2027' },
};

/* §4.4 — `EXPIRED` and `EXPIRE_SOON` are the two statuses we derive ourselves:
   "Balance sends no expiry statuses"; the month and year live in our DB and a local
   check runs at charge time. So this is computed from the date, not carried as a
   scenario flag — which also means it can flag a NON-default card, unlike DECLINED,
   which needs a charge attempt to exist. A card is good through the end of its
   expiry month, so only a month strictly before now counts as expired. */
const TODAY = { m: 8, y: 2026 };
function cardExpiry(c) {
  const [m, y] = c.exp.split('/').map(s => parseInt(s.trim(), 10));
  if (y < TODAY.y || (y === TODAY.y && m < TODAY.m)) return 'expired';
  const months = (y - TODAY.y) * 12 + (m - TODAY.m);
  return months <= 1 ? 'soon' : 'ok';
}

// D-9 — decided 2026-08-12: 10, adopting the FG CPC precedent (PRD Appendix A).
const MAX_CARDS = 5;   // meeting 2026-08-24 — was 10 (FG CPC precedent, D-9)

/* Demo data has to reconcile with itself, because the first thing a reviewer does is
   compare two tables. Every pack row here uses a price that exists in PACKS, and the
   three PAID pack rows are the same three purchases PURCHASES lists, same dates and
   amounts — Billing history and Purchase history are two views of one history, so
   they must agree. They differ in one intended way: Billing history is every charge
   *attempt*, so it also carries the failed and refunded rows §3.4 asks for, while
   Purchase history is only packs the vendor actually owns. */
/* `receipt: false` = no PDF URL on the row. PB 6.1.0 makes the receipt a stored URL
   from the payment response and specifies "—" for its ABSENCE, which is not the same
   thing as a failed charge: a failed charge has no receipt, but so does a successful
   one whose URL never came back. That case is live — §2.3 request #3 asks Balance to
   confirm receipts are even generated for monthly auto-billing — so one paid
   subscription row carries it, and it sits in release 1 where the question lands first. */
/* `rel: 1` = the row exists in release 1's world (Oct 2026). Everything else belongs to
   release 2's later world, which is why the release filter is by `rel` and not by type:
   a pack row is not just out of scope in release 1, it is in the future.
   `receipt: false` = no PDF URL (PB 6.1.0) — not the same as a failed charge, and live
   while §2.3 request #3 still asks Balance whether monthly auto-billing emits receipts.
   `Refunded` is gone: §3.4 v1.0 defines the status set as Paid / Failed only, because
   §5.2 retired the refund receipt outright ("환불 불가 확정"). */
const HISTORY = [
  { rel: 2, date: 'Feb 14, 2027', type: 'Subscription', card: 'Visa ····4242', amt: '$20.00',  status: 'paid' },
  { rel: 2, date: 'Jan 28, 2027', type: 'SMS pack',     card: 'Visa ····4242', amt: '$125.00', status: 'paid',   sub: '5,000 credits' },
  { rel: 2, date: 'Jan 14, 2027', type: 'Subscription', card: 'Visa ····4242', amt: '$20.00',  status: 'paid' },
  { rel: 2, date: 'Dec 22, 2026', type: 'SMS pack',     card: 'Visa ····4242', amt: '$28.00',  status: 'failed', sub: '1,000 credits · card declined', receipt: false },
  { rel: 2, date: 'Dec 14, 2026', type: 'Subscription', card: 'Visa ····4242', amt: '$20.00',  status: 'paid' },
  { rel: 2, date: 'Nov 19, 2026', type: 'SMS pack',     card: 'Visa ····4242', amt: '$28.00',  status: 'paid',   sub: '1,000 credits' },
  { rel: 2, date: 'Nov 14, 2026', type: 'Subscription', card: 'Visa ····4242', amt: '$20.00',  status: 'paid',   receipt: false },
  { rel: 1, date: 'Oct 14, 2026', type: 'Subscription', card: 'Visa ····4242', amt: '$20.00',  status: 'paid' },
];

// Paid pack rows above, date for date — the two tables describe the same purchases.
const PURCHASES = [
  { date: 'Jan 28, 2027', pack: '5,000 credits', how: 'Manual', amt: '$125.00', card: 'Visa ····4242' },
  { date: 'Nov 19, 2026', pack: '1,000 credits', how: 'Manual', amt: '$28.00',  card: 'Visa ····4242' },
];

const USAGE = [
  { date: 'Feb 14, 2027', src: 'Campaign · “Spring Preview”', type: 'SMS', used: '-480' },
  { date: 'Feb 11, 2027', src: 'Campaign · “Restock Alert”', type: 'MMS', used: '-210' },
  { date: 'Feb 09, 2027', src: '1:1 Chat replies', type: 'SMS', used: '-34' },
];

/* §7.5 deducts counts at scheduling time, so "reserved" is not an abstraction —
   each held credit belongs to a named campaign with a send date. The figure was a
   link promising exactly that breakdown and had no handler behind it (Gap doc R-3);
   these two add up to the 800 the SMS balance reports as held. */
// ── scenarios ───────────────────────────────────────────────────────────────
// Each scenario is one reviewable state of the same product.
const SCENARIOS = {
  active: {
    label: 'Active subscription', hint: 'Default state — card on file, all healthy',
    screen: 'account', tab: 'billing',
    sub: 'active', cards: ['visa', 'mc'], history: true,
    credits: { sms: 1240, smsRes: 800, mms: 320, mmsRes: 0 },
  },
  nocard: {
    label: 'No card yet', hint: 'Subscribe pitch + empty card list',
    screen: 'account', tab: 'billing',
    sub: 'none', cards: [], history: false,
    credits: { sms: 0, smsRes: 0, mms: 0, mmsRes: 0 },
  },
  free: {
    label: 'Free period', hint: 'Card mandatory, charging starts at expiry',
    screen: 'account', tab: 'billing',
    sub: 'free', cards: ['visa'], history: false,
    credits: { sms: 1000, smsRes: 0, mms: 0, mmsRes: 0 },
  },
  expiring: {
    label: 'Card expiring soon', hint: 'EXPIRE_SOON — proactive, before any failure',
    screen: 'account', tab: 'billing',
    sub: 'active', cards: ['visaX', 'mc'], history: true, expireSoon: true,
    credits: { sms: 1240, smsRes: 800, mms: 320, mmsRes: 0 },
  },
  failed: {
    label: 'Subscription charge failed', hint: 'Card-side → instant suspend, no dunning',
    screen: 'account', tab: 'billing',
    sub: 'suspended', cards: ['visa', 'mc'], history: true, cardBad: true,
    credits: { sms: 1240, smsRes: 800, mms: 320, mmsRes: 0 }, frozen: true,
  },
  pastDue: {
    label: 'Payment retrying', hint: 'Server error — §8.2 past_due, vendor unaffected',
    screen: 'account', tab: 'billing',
    sub: 'past_due', cards: ['visa', 'mc'], history: true,
    credits: { sms: 1240, smsRes: 800, mms: 320, mmsRes: 0 },
  },
  cancelling: {
    /* §7 names this CANCELLING and PB 2.7.0 gives it its rule: the subscription runs
       to the end of the paid period and resuming before then costs nothing. The mockup
       jumped `active` → `canceled`, so the vendor was told "paid features are off"
       while they still had every one of them. */
    label: 'Cancellation scheduled', hint: '§7 CANCELLING — runs to period end, resumable',
    screen: 'account', tab: 'billing',
    sub: 'cancelling', cards: ['visa', 'mc'], history: true,
    credits: { sms: 1240, smsRes: 800, mms: 320, mmsRes: 0 },
  },
  canceled: {

    sub: 'canceled', cards: ['visa', 'mc'], history: true,
    credits: { sms: 1240, smsRes: 0, mms: 320, mmsRes: 0 },
  },
  expired: {
    label: 'Card expired', hint: '§4.4 EXPIRED — card-side, so instant suspend (§10.2)',
    screen: 'account', tab: 'billing',
    sub: 'suspended', cards: ['visaO', 'mc'], history: true, cardExpired: true, frozen: true,

  restored: {

    screen: 'account', tab: 'billing',
    sub: 'active', cards: ['mc', 'visa'], history: true, restored: true,
    credits: { sms: 1240, smsRes: 800, mms: 320, mmsRes: 0 },

  cardLimit: {

    credits: { sms: 1240, smsRes: 800, mms: 320, mmsRes: 0 },
  },
  payout: {

    screen: 'account', tab: 'payout',
    sub: 'active', cards: ['visa', 'mc'], history: true,
    credits: { sms: 1240, smsRes: 800, mms: 320, mmsRes: 0 },
  },
  credits: {
    label: 'SMS credit dashboard', hint: 'Remaining / reserved / available',
    screen: 'account', tab: 'sms',
    sub: 'active', cards: ['visa', 'mc'], history: true,
    credits: { sms: 1240, smsRes: 800, mms: 320, mmsRes: 0 },

    sub: 'active', cards: ['visa', 'mc'], history: true,
    credits: { sms: 0, smsRes: 0, mms: 0, mmsRes: 0 },

  },

    label: 'Campaign — not enough credits', hint: 'Confirm-and-charge, never leaves the flow',
    screen: 'campaign',
    sub: 'active', cards: ['visa', 'mc'], history: true,
    credits: { sms: 200, smsRes: 0, mms: 320, mmsRes: 0 },
    recipients: 1000,
  },
  campaignLocked: {
    label: 'Campaign — suspended', hint: 'D-6 lock — Send and scheduling disabled',
    screen: 'campaign',
    sub: 'suspended', cards: ['visa', 'mc'], history: true, cardBad: true, frozen: true,
    credits: { sms: 1240, smsRes: 800, mms: 320, mmsRes: 0 },
    recipients: 980,

};

// ── app state ───────────────────────────────────────────────────────────────
let S = { key: 'active', tab: 'billing', sendWhen: 'now', toast: null, release: 2, creditModel: 'unified', tabLayout: 'split', modal: null, packType: 'sms', packSel: 1,
          cardAdd: false, cardFlash: false, packOpen: false, emailKey: null, docKey: null, receiptRow: null };
let sc = () => SCENARIOS[S.key];

function setScenario(key) {
  S.key = key;
  const s = SCENARIOS[key];
  // Scenarios name 'sms' as their tab; merged, that tab doesn't exist.
  S.tab = s.tab === 'sms' ? smsTab() : (s.tab || S.tab);
  S.modal = null;
  S.packOpen = false;
  S.toast = null; clearTimeout(toastTimer);
  render();
}
function go(screen) {
  if (screen === 'account') { if (sc().screen !== 'account') setScenario('active'); S.tab = 'billing'; }
  else if (screen === 'campaign' && sc().screen !== 'campaign') setScenario('campaignOk');
  render();
}
// Both billing and SMS credits are My Account tabs now — jump to a tab,
// pulling the scenario back to an account screen first if we're elsewhere.
function goTab(tab) {
  if (sc().screen !== 'account') setScenario(tab === 'sms' ? 'credits' : 'active');
  S.tab = tab;
  render();
}
function openModal(m) { S.modal = m; render(); }
let toastTimer = null;
function showToast(title, msg, kind) {
  S.toast = { title, msg, kind: kind || 'success' };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; render(); }, 7000);
  render();
}
function closeModal() { S.modal = null; render(); }

// `expSoon` is gone from the signature: both expiry states now come from the card's
// own date (§4.4), so the row is judged in one place. The scenario flag survives
// only on the banner, which needs a concrete "in 24 days" that a month can't give.
function fmtCardRow(c, { isDefault, onlyCard, bad, isNew }) {
  const badge = isDefault ? '<span class="pill solid">Default</span>' : '';
  // Expiry is derived (§4.4), so it flags whichever card it applies to — a stale
  // non-default card gets the badge with no failure attached, because we know the
  // date without ever charging it. Only the default card can be DECLINED.
  const exp = cardExpiry(c);
  const expired = exp === 'expired';
  let sub = `Expires ${c.exp}`;
  let subCls = '';
  if (bad && isDefault) { sub = 'Declined on Aug 15 — update this card to restore billing'; subCls = 'danger'; }
  else if (expired) {
    sub = isDefault
      ? `Expired ${c.exp} — add a new card to restore billing`
      : `Expired ${c.exp} — it can't be charged`;
    subCls = 'danger';
  }
  else if (exp === 'soon') { sub = `Expires ${c.exp} — replace it before the next charge`; subCls = 'warn'; }
  const stateBadge = (bad && isDefault) ? '<span class="pill red">Declined</span>'
                   : expired ? '<span class="pill red">Expired</span>'
                   : exp === 'soon' ? '<span class="pill amber">Expires soon</span>' : '';
  const removeBtn = onlyCard
    ? h`<span class="tip">
          <button class="btn btn-sm btn-ghost" disabled>Remove</button>
          <span class="tip-bubble">This is the only card on file for your subscription. Add another card before removing it.</span>
        </span>`
    : '<button class="btn btn-sm btn-danger-ghost" data-act="removeCard">Remove</button>';

  return h`
  <div class="card-row ${isDefault ? 'is-default' : ''} ${((bad && isDefault) || (expired && isDefault)) ? 'is-bad' : ''} ${isNew ? 'is-new' : ''}">
    <span class="brand-mark ${c.cls}">${c.brand}</span>
    <div class="card-main">
      <div class="card-num">
        <span class="card-dots">···· ${c.last4}</span>
        ${badge}${stateBadge}
      </div>
      <div class="card-sub ${subCls}">${sub}</div>
    </div>
    <div class="card-actions">
      ${isDefault ? '' : '<button class="btn btn-sm btn-outline" data-act="setDefault">Set as default</button>'}
      ${removeBtn}
    </div>
  </div>`;
}

// ── Subscription ────────────────────────────────────────────────
/* Status pill and primary action live outside the card body because both layouts
   need them in a different place — the 5-tab layout in the card's own head, the
   4-tab layout in the group head above it. Computing them in one function keeps the
   two from drifting apart. Pill vocabulary is §8.2's status set. */
function subPill() {
  return ({
    free:      '<span class="pill blue">Free period</span>',
    suspended: '<span class="pill red">Suspended</span>',
    canceled:  '<span class="pill gray">Canceled</span>',
    past_due:  '<span class="pill amber">Payment retrying</span>',
    /* Amber, not the gray `Canceled` wears: this is a scheduled change the vendor can
       still reverse, and two gray pills a letter apart would be one glance from being
       read as the same state. */
    cancelling: '<span class="pill amber">Canceling</span>',
  })[sc().sub] || '<span class="pill green">Active</span>';
}

/* §3.4 and Handoff §2A ask for cancel AND resume. They are two states of one
   control, not two controls. Suspension leaves the slot empty on purpose: the danger
   banner already owns Update payment, and offering Cancel mid-recovery would be
   pointing at the exit while the vendor is trying to come back. */
function subActionBtn() {
  const sub = sc().sub;
  if (sub === 'suspended') return '';
  if (sub === 'canceled' || sub === 'cancelling')
    return '<button class="btn btn-primary" data-act="resumeSub">Resume subscription</button>';
  return '<button class="btn btn-outline" data-act="cancelSub">Cancel subscription</button>';
}

function subscriptionSection() {
  const s = sc();
  const cards = s.cards.map(id => CARDS[id]);
  const def = cards[0];
  const pill = subPill();

  if (s.sub === 'none') {
    const UNLOCK = [
      ['box',  'Receive &amp; fulfill orders', 'Take orders, ship out—all in one place'],
      ['chat', 'Text your linesheets to buyers', 'Send any linesheet to buyers in one tap'],
      ['users','Manage customers &amp; run SMS campaigns', 'Organize your customer list and reach them by text'],
      ['card', 'Get paid with automatic payouts', 'Payments settle straight to your bank'],
    ];
    return h`
    <section class="section-card">
      <div class="section-head">
        <div><div class="section-title">Subscription</div></div>
      </div>
      <div class="plan-hero">
        <div>
          <span class="plan-hero-price">${PLAN.price.replace('.00','')}</span>
          <span class="plan-hero-unit">/monthly</span>
          <div class="plan-hero-note">Cancel Anytime · No Commitment</div>
        </div>
        <div class="plan-hero-cta">
          <button class="btn btn-primary" data-act="subscribe">Subscribe — ${PLAN.price.replace('.00','')}/mo</button>
        </div>
      </div>
      <!-- "New in Phase 2.5" and "in Payment methods below" describe the release
           and the page layout — reviewer facts. §6.1 is what the vendor needs:
           subscribing now requires a card. -->
      <div class="helper">${ICO.info}<span>Subscribing requires a card on file.</span></div>
    </section>

    <section class="section-card">
      <div class="section-head"><div><div class="section-title">What You Unlock</div></div></div>
      <div class="unlock-grid">
        ${UNLOCK.map(([ico, title, desc]) => h`
          <div class="unlock-item">
            <span class="unlock-ico">${ICO[ico] || ICO.card}</span>
            <div>
              <div class="unlock-title">${title}</div>
              <div class="unlock-desc">${desc}</div>
            </div>
          </div>`).join('')}
      </div>
    </section>`;
  }

  let nextVal = clock().next, foot = '', nextLabel = 'Next charge', freeUntil = '';
  if (s.sub === 'free') {
    /* An EXISTING vendor running out the free period they have always had — not a new
       signup being granted one. New subscribers are charged immediately (Grace, 8/28). */
    nextVal = FREE.first;  nextLabel = 'First charge';  freeUntil = FREE.until;
    foot = 'Your free period is ending. A card must stay on file until then.';
  } else if (s.sub === 'suspended') {
    nextVal = 'on card update';  nextLabel = 'Retries';
    foot = 'Paid features are off until your card is updated. Your store and orders are unaffected' + (hasCredits() ? ', and purchased SMS credits are frozen, not lost.' : '.');
  } else if (s.sub === 'canceled') {
    /* §8.2 names the status; §9 makes it close the SMS menu. What the docs never
       say is WHEN cancelling takes effect — this screen is the state after the
       paid period has ended, which is the one the cancel modal points at.
       Credits are still shown because §7.7 forbids forfeiture, but whether churn
       triggers a pro-rata refund is pending legal (L-1) + Finance (D-4), so the
       screen says they stay and claims nothing about money back. */
    nextVal = 'No further charges';  nextLabel = '';
    foot = 'Your store and orders keep running.' + (hasCredits() ? ' SMS credits you already bought stay on your account.' : '');
  } else if (s.sub === 'cancelling') {
    // §7 · PB 2.7.0 — still active, ends on a date, resumable at no charge.
    nextVal = clock().next;  nextLabel = 'Ends';
    foot = 'Your subscription stays active until ' + clock().next + '. Resume any time before then and nothing is charged.';
  } else if (s.sub === 'past_due') {
    // §8.2 — server-error retry in progress, short-lived. §8.3 says the vendor is
    // unaffected, so nothing here asks them to act: the card is fine.
    nextVal = 'automatically';  nextLabel = 'Retrying';
    foot = 'Your card is fine — the charge could not be completed and is being retried. Nothing is paused.';
  } else {
    /* The anchor is the signup date, not a calendar day (Grace, confirmed 2026-08-24).
       §6.3 only says "Monthly on the cycle date" and never says which date that is, so
       the screen had a next-billing date with nothing explaining where it came from.
       Gap A-12 — the PRD needs this written in. */
    foot = 'Renews automatically each month, on the date you subscribed.';
  }

  const billedTo = def
    ? h`<span class="brand-mark ${def.cls}" style="width:34px;height:23px;font-size:8px">${def.brand}</span>
        ···· ${def.last4}`
    : '<span class="t-muted">No card</span>';

  return h`
  <section class="section-card">
    <div class="section-head">
      <div>
        <div class="section-title">Subscription ${pill}</div>
        <div class="section-desc">What you pay Shopcord each month.</div>
      </div>
      ${subActionBtn()}
    </div>

    <div class="plan-row">
      <div>
        <!-- No name line: there is one subscription at one price and no doc names
             it, so a name slot would only ever hold something invented. The cadence
             is stated once, on the left — "Billed monthly" beside "$20.00 /monthly"
             said the same word twice. -->
        <div class="plan-name">Billed monthly</div>
        <!-- §3.4 asks this section for the next billing date and "Billed to Visa
             ····4242". They used to be two label/value fields under the plan box, and
             once the Status column came out the pair huddled on the left of a wide card
             with a date on one side and an icon on the other — different weights, no
             alignment (Grace: 뭔가 이상함). As one line inside the plan block they read
             as what they are: when the next charge happens and what it hits. -->
        <div class="plan-when">${freeUntil ? h`Free until <strong>${freeUntil}</strong> · ` : ''}${nextLabel} <strong>${nextVal}</strong>${def && s.sub !== 'canceled' && s.sub !== 'cancelling' ? h` · <span class="plan-card">${billedTo}</span>` : ''}</div>
        <!-- The 3,000 is a ONE-TIME welcome grant at first subscription, not part of
             the monthly plan (meeting 2026-08-24). "Includes 3,000 free 1:1 chat
             replies" sat under "Billed monthly" and read as something that arrives
             every month, which would be a recurring promise about money. The grant
             belongs to the moment it happens — the subscribe confirmation — so the
             plan card states the plan only. -->
        <!-- No sub-line here. "One subscription, one price — no tiers" was true today
             and stops being true at year end, when tiers arrive (Grace, 2026-08-24) —
             a claim with an expiry date is worse than silence. Naming a tier now would
             be the opposite mistake, since none exist yet. The slot stays empty and is
             where a plan name goes when there is one. -->
      </div>
      <div class="plan-price">${PLAN.price}</div>
    </div>

    <div class="section-foot">
      <span class="foot-note">${foot}</span>
    </div>
  </section>`;
}

// ── Payment methods ─────────────────────────────────────────────
function paymentMethodsSection() {
  const s = sc();
  const cards = s.cards.map(id => CARDS[id]);

  const list = cards.length === 0
    ? (h`<div class="empty">
          <div class="empty-ico">${ICO.card}</div>
          <div class="empty-title">No payment method yet</div>
          <div class="empty-desc">Add a card to subscribe and to buy SMS message packs.</div>
          <!-- Outline, not primary: on the unsubscribed screen Subscribe above is the
               one saturated accent, and §4.2 lets a vendor add a card on its own, so
               this is a secondary path rather than the thing to do next. -->
          <div class="empty-cta"><button class="btn btn-outline" data-act="addCard"><span class="btn-ico">${ICO.plus}</span>Add card</button></div>
        </div>`)
    : h`<div class="card-list">
          ${cards.map((c, i) => fmtCardRow(c, {
            isDefault: i === 0,
            /* PB 1.5.0 scopes the block to {free_period, active, past_due} — states
               that still bill. `canceled` has no further charge, so a vendor's last card
               is theirs to remove, and the old `sub !== 'none'` was holding it hostage.
               `suspended` is a vendor state, not one of the three, but it is still
               billing and failing: removing the only card there would remove the way
               back (§10.4). */
            onlyCard: cards.length === 1 && ['free', 'active', 'past_due', 'suspended'].includes(s.sub),
            bad: !!s.cardBad,
            isNew: i === 0 && S.cardFlash,
          })).join('')}
        </div>`;

  return h`
  <section class="section-card" id="section-cards">
    <div class="section-head">
      <div>
        <div class="section-title">Payment methods</div>
        <div class="section-desc">One card pool for everything you pay Shopcord.</div>
      </div>
      ${(cards.length) ? (cards.length >= MAX_CARDS
        ? h`<span class="tip">
              <button class="btn btn-outline" disabled><span class="btn-ico">${ICO.plus}</span>Add card</button>
              <span class="tip-bubble">You've reached the limit of ${MAX_CARDS} saved cards. Remove one to add another.</span>
            </span>`
        : h`<button class="btn btn-outline" data-act="addCard"><span class="btn-ico">${ICO.plus}</span>Add card</button>`) : ''}
    </div>

    ${list}

    <!-- Handoff §2 Section B specifies this sentence verbatim as a required
         element. The card counter and the Balance storage notice that used to sit
         beside it were mine: the counter is redundant with the disabled-Add
         tooltip that appears at the limit, and the storage notice is already in
         the card form, where it actually matters. -->
    <div class="helper">${ICO.info}<span>Your <strong>default card</strong> is used for subscription fees${hasCredits() ? ' and SMS credit purchases' : ''}.</span></div>
  </section>`;
}

// ── Billing history ─────────────────────────────────────────────
function billingHistorySection() {
  const s = sc();
  const c = s.credits;

  // §3.4 v1.0 — Paid / Failed. `Refunded` left with the refund receipt (§5.2, 환불 불가 확정).
  const statusPill = (st) => ({
    paid:   '<span class="pill green">Paid</span>',
    failed: '<span class="pill red">Failed</span>',
  })[st] || '';

  /* Release 1 ships before credits exist, so a pack row could not have happened. The
     filter loses its SMS pack option with them, and §3.4's credit summary chip waits
     for release 2. */
  /* Release 1's world is October 2026, so it holds the rows that exist by then — one
     subscription charge. The later rows are not merely out of scope, they are in the
     future. */
  /* A failed charge IS a history row (§3.4 status Failed), and the suspension banner
     names its date — without it the screen says a charge failed above a table of nothing
     but successes. It is not an EXTRA row: the newest subscription charge either went
     through or it did not, so the scenario flips that row in place. Same row, same date,
     one source for the banner (`failedChargeDate()`). */
  const base = isR1() ? HISTORY.filter(r => r.rel === 1) : HISTORY;
  const failIdx = (s.cardBad || s.cardExpired) ? base.findIndex(r => r.type === 'Subscription') : -1;
  const visible = failIdx < 0 ? base
    : base.map((r, i) => i === failIdx ? { ...r, status: 'failed', receipt: false } : r);
  /* The pager is mine, not the docs' (Audit A3-5) — table convention, and harmless
     while the table was long enough to need one. Release 1 holds three subscription
     rows, where `1 2 3 ···` claims forty rows that are not there. It renders when
     it can actually page. */
  const PAGE_SIZE = 15;
  const rows = visible.map(r => h`
    <tr>
      <td class="t-muted">${r.date}</td>
      <td>
        <div class="t-strong">${r.type}</div>
        ${r.sub ? `<div class="t-muted" style="font-size:12px;margin-top:2px">${r.sub}</div>` : ''}
      </td>
      <td class="t-muted">${r.card}</td>
      <td class="t-num t-strong">${r.amt}</td>
      <td>${statusPill(r.status)}</td>
      <td>${r.receipt === false ? '<span class="t-muted" style="font-size:12px">—</span>'
        : `<a class="receipt-link" href="#" target="_blank" rel="noopener" data-act="receipt"
             data-date="${r.date}" data-amt="${r.amt}" data-type="${r.type}">${ICO.ext}Receipt</a>`}</td>
    </tr>`).join('');

  const body = s.history
    ? h`<div class="tbl-scroll">
          <table class="tbl">
            <thead><tr>
              <th style="width:120px">Date</th><th>Type</th>
              <th style="width:150px">Card</th><th style="width:100px;text-align:right">Amount</th>
              <th style="width:110px">Status</th><th style="width:100px">Receipt</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${visible.length > PAGE_SIZE ? h`
        <div class="pager">
          <label class="pager-size">Row per page: <select class="select" style="height:32px;padding:0 8px"><option>15</option><option>30</option><option>50</option></select></label>
          <div class="pager-nav">
            <button class="pager-btn" disabled>‹ Previous</button>
            <button class="pager-btn">1</button>
            <button class="pager-btn is-cur">2</button>
            <button class="pager-btn">3</button>
            <span class="pager-dots">···</span>
            <button class="pager-btn">Next ›</button>
          </div>
        </div>` : ''}`
    : h`<div class="empty">
          <div class="empty-ico">${ICO.dl}</div>
          <div class="empty-title">No charges yet</div>
          <div class="empty-desc">${isR1() ? 'Subscription charges' : 'Subscription charges and SMS pack purchases'} will appear here, each with a downloadable receipt.</div>
        </div>`;

  /* One view only. A `Charges` / `SMS usage` switch lived here while the merged
     layout wrapped everything in invented groups; now usage history sits in the SMS
     group where §7.6 puts it, and this card is §3.4 Section 3 — charges. */
  return h`
  <section class="section-card">
    <div class="section-head">
      <div>
        <div class="section-title">Billing history</div>

// ── Banners ─────────────────────────────────────────────────────────────────
function banners() {
  const s = sc();
  const out = [];
  // Billing-tab alerts vs SMS-tab alerts — both tabs now live under My Account.
  // Merged, the billing tab IS the SMS surface, so SMS-scoped banners belong there
  // too — otherwise folding the tabs together would silently drop them.
  const onBilling = S.tab === 'billing';
  const onSms = S.tab === smsTab();
  const onCampaign = s.screen === 'campaign';

  /* The lock pattern says the banner is the one thing that carries the fix, so it
     has to reach every screen where a control actually goes disabled — the campaign
     screen included, or Send is disabled with no way out (§10.4 routes every
     failure to Subscription & Billing). Not on the SMS tab: the number card there
     already states the pause and offers Update payment, and a banner would make
     that the same control twice. */
  /* Handoff §7 is the ONLY placement any document gives an in-app notification, and it
     says **Vendor Admin banner** — the admin, not a tab. PB 7.1 agrees by implication:
     it pairs the banner with a "탭 링크", and a banner sitting on that tab would not need
     one. So this renders on every My Account tab. The other six PB 7.x triggers say
     only "인앱" with no location, so nothing else was moved (Grace, 8/28: 위치 알려준곳만).
     Everything outside My Account is beyond what this mockup draws — the real banner
     goes wider still, and where exactly is the screen owner's call. */
  const onAccount = s.screen === 'account';
  if (s.sub === 'suspended' && (onAccount || onCampaign)) out.push(h`
    <div class="alert alert-danger" role="alert">
      <span class="alert-ico">${ICO.alert}</span>
      <div class="alert-body">
        <!-- "off", not "blocked" (Grace, 2026-08-24). §8.1's own phrase is "Paid
             features blocked", but that is the spec's state description, and the same
             call that took the word out of the credits sentence applies here: the word
             stays where it names a STATE (the balance card's BLOCKED badge, §7.4) and
             leaves the sentences. "paused" was unavailable — auto-recharge already owns
             it in this product — so "off" carries the impact without the extra freight. -->
        <div class="alert-title">Payment failed — paid features are off</div>
        <!-- Same outcome, different cause. §10.2 files an expired card under
             card-side, so it suspends instantly just like a decline — but "declined"
             would be wrong, and an expired card can't be retried, only replaced
             (§4.3: update = remove + re-add, there is no in-place edit). -->
        <div class="alert-msg">${s.cardExpired
          ? `Your Visa ····4242 expired in ${CARDS.visaO.exp}, so the ${failedChargeDate()} charge couldn't go through. Add a new card and everything retries and restores immediately.`
          : `Your Visa ····4242 was declined on ${failedChargeDate()}. Update your card and everything retries and restores immediately.`} ${hasCredits() ? 'Your store, orders and purchased SMS credits are safe.' : 'Your store and orders are safe.'}</div>
        <div class="alert-actions"><button class="btn btn-primary" data-act="addCard">${s.cardExpired ? 'Add a new card' : 'Update payment method'}</button></div>
      </div>
    </div>`);

  if (s.expireSoon) out.push(h`
    <div class="alert alert-warn">
      <span class="alert-ico">${ICO.clock}</span>
      <div class="alert-body">
        <div class="alert-title">Your default card expires in 24 days</div>
        <div class="alert-msg">Visa ····4242 expires 09 / 2026. Replace it before your Sep 1 charge so nothing is interrupted.</div>
        <div class="alert-actions"><button class="btn btn-outline" data-act="addCard">Add a new card</button></div>
      </div>
    </div>`);

  // same bad card (§4.4) — the claim becomes false, and its Update payment
  // button repeats the one the number card already shows. One cause, one message.
  // "Out of credits" only makes sense to someone who had some — a never-subscribed
  // vendor is at zero by definition, and the tab already tells them to subscribe.
  if (!isR1() && s.credits && s.credits.sms === 0 && s.sub !== 'none' && onSms) out.push(h`
    <div class="alert alert-danger">
      <span class="alert-ico">${ICO.lock}</span>
      <div class="alert-body">
        <div class="alert-title">${outOfCreditsLine()}</div>
        <div class="alert-msg">Campaigns and 1:1 chat replies won't send until you buy credits.</div>
        <div class="alert-actions"><button class="btn btn-primary" data-act="buyPack" data-val="sms">Buy message pack</button></div>
      </div>
    </div>`);

  // Also on the campaign screen: "already-scheduled campaigns still go out" is
  // most relevant exactly where the vendor just found Send disabled. It used to
  // appear there only by accident, when S.tab happened to still be 'billing'.
  if (s.frozen && hasCredits() && (onBilling || onCampaign)) out.push(h`
    <div class="alert alert-info">
      <span class="alert-ico">${ICO.lock}</span>
      <div class="alert-body">
        <div class="alert-title">Your SMS credits are frozen, not lost</div>
        <!-- §10.5's other half, and the load-bearing one: campaigns already
             scheduled had their counts deducted at scheduling (§7.5), so they are
             paid for and still go out. Saying so is what keeps suspension from
             looking like paid-for service withheld. ⚠ pending legal (L-2). -->
        <div class="alert-msg">1,240 SMS and 320 MMS stay on your account. They become usable again the moment your subscription recovers. <strong>Campaigns you already scheduled still go out</strong> — those credits were reserved when you scheduled them.</div>
      </div>
    </div>`);

  return out.length ? `<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:4px">${out.join('')}</div>` : '';
}

// ── Screen: My Account ──────────────────────────────────────────────────────
function screenAccount() {
  const tabs = [
    { id: 'account', label: 'Account', tag: '' },
    { id: 'company', label: 'Company', tag: '' },
    { id: 'payout',  label: 'Payout',  tag: '' },

     Guard the renderer, not just the routes into it. */
  else if (S.tab === 'sms') content = isR1() ? (subscriptionSection() + paymentMethodsSection() + billingHistorySection()) : creditsBody();

// ── Screen: SMS credit dashboard ────────────────────────────────────────────
// The number that answers "can I send right now?" is Available, not Remaining —
// so that's the hero. Remaining and Reserved support it underneath.
/* Auto-recharge is out of Phase 2.5 (meeting, 2026-08-24), and its threshold went with
   it — but `RUNNING LOW` stays, because without auto-recharge a warning is the ONLY
   thing between a vendor and a hard stop (Grace: "충전해서 사용하는 방식이어도 넘 조금
   남아있으면 얘기는 해줄 수 있잖아"). The number is ours, not the docs' — Gap B7-6 still
   applies — and 200 is *one fifth of the smallest pack*, so the rule survives a change
   of pack sizes. Needs writing into the PRD. */
const LOW_CREDIT_THRESHOLD = 200;
const TFN = '+1 (888) 555-0182';

/* ── Credit model (D-3, pending Jinah) ────────────────────────────────────────
   split   — separate SMS and MMS balances (what the mockup assumed first)
   unified — one pool, and every message costs the same whatever its type.
             Mailchimp and Postscript charge 3x for MMS; we don't, which is what
             makes this model simple — there is nothing for the vendor to convert. */
/* ── Tab layout ────────────────────────────────────────────────────────────────
   split  — 5 tabs, SMS Settings is its own tab (Grace's 8/12 decision)
   merged — 4 tabs, SMS folded into Subscription & Billing (what PRD §3.1–3.2 and
            the README's "5 tabs → 4 tabs" actually describe)
   Both are built because the docs and the decision disagree, same as the credit
   model. `smsTab()` is the one place that knows where SMS content lives, so every
   navigation target follows the switch instead of hard-coding 'sms'. */
const isMerged = () => S.tabLayout === 'merged';
/* Scope split (meeting, 2026-08-24): Subscription & Billing ships 10/1, SMS Settings
   around 11/1. Release 1 therefore has FOUR tabs — the fifth arrives with its content —
   and its Billing history can only hold subscription charges, because credits cannot be
   bought yet. Everything SMS lives behind this flag so the two releases are one build. */
/* THIS BUILD IS THE 1st RELEASE ONLY. The full build keeps both releases behind a
   switch — see Mockup_P2.5_PaymentBilling_2026-08-24.html, which is where the 2nd
   release lives and is not to be deleted, since it ships again later.
   isR1 is pinned rather than the release branches being torn out: every `isR1()` and
   `hasCredits()` in the file already resolves correctly against it, so nothing has to be
   surgically removed and the two builds cannot drift in their logic. */
const isR1 = () => true;
/* Release 1 ships before credits exist, so every sentence that mentions a balance,
   a pack or a reservation describes property the vendor cannot have — and a
   reassurance about property you do not have reads as a promise. The clause is
   composed from here rather than written into each string, so the two releases can
   never drift apart the way the three pack prices once did. */
const hasCredits = () => !isR1();
const smsTab = () => (isR1() || isMerged()) ? 'billing' : 'sms';

const isUnified = () => S.creditModel === 'unified';
/* Meeting 2026-08-24 — D-3 decided: ONE credit pool, and the two message types cost
   different amounts of it. The scenario data still counts messages per type, so the
   pool is the conversion of both: an MMS is three credits, not three messages.
   Needs writing into the PRD — §7.1 says "counts, not dollars" but names no rate. */
const MMS_CREDITS = 3;
const CREDIT_RATE_LINE = `SMS 1 credit · MMS ${MMS_CREDITS} credits`;
const unifiedTotals = (c) => ({
  remaining: c.sms + c.mms * MMS_CREDITS,
  reserved:  c.smsRes + c.mmsRes * MMS_CREDITS,
});

/* ── Suspension lock (Handoff §7 asked for one reusable pattern · D-6) ─────────
   SCOPE — §10.5's proposed principle, NOT a settled list. It blocks NEW purchases,
   sends and scheduling, and deliberately does not block already-paid, already-
   scheduled sends: those counts are already deducted, so stopping them would be
   charging for a service and not delivering it — the exact thing that invites
   refunds and chargebacks. Pending legal (L-2); D-6 finalises the list.

     locked    buying packs · changing auto-recharge · sending · scheduling
     not locked  everything read-only, billing history, Export, and all card
                 management — card management IS the recovery path (§10.4), so
                 locking it would trap the vendor in the suspended state.

   PATTERN — one treatment, repeated. A blocked control stays VISIBLE and goes
   disabled with a tooltip saying why. Never hidden: §8.3 keeps the store and data
   intact, and a control that disappears reads as "this feature is gone" rather
   than "billing is paused". Only the banner carries the fix, because six buttons
   each offering Update payment is the same control six times over.
   This is the same disabled-plus-tooltip treatment the card limit and the
   last-card Remove already use — extended, not invented. */
const isSuspended = () => sc().sub === 'suspended';
const isCanceled  = () => sc().sub === 'canceled';
// §9 closes the SMS menu when the subscription is `canceled`, so the same controls
// are unavailable — but for the opposite reason. The card is fine; the plan is gone.
// One pattern, two causes: the treatment is identical, only the sentence changes.
const isLocked = () => isSuspended() || isCanceled();
const LOCK_COPY = {
  suspended: {
    buy:  'You can\'t buy message packs while your subscription is suspended. Update your payment method and this comes back.',
    send: 'Sending is paused while your subscription is suspended. Campaigns you already scheduled still go out.',
  },
  canceled: {
    buy:  'Message packs are part of a Shopcord subscription. Resume your subscription to buy them again.',
    send: 'Sending needs an active subscription. Resume yours to send again.',
  },
};
const lockWhy = (kind) => LOCK_COPY[isCanceled() ? 'canceled' : 'suspended'][kind];
// Wraps already-disabled markup so the reason is reachable on hover. `.tip` is
// inline-flex, so anything that needs to fill its row passes `block`.
const lockTip = (inner, why, opt) =>
  h`<span class="tip ${opt === 'below' ? 'tip-below' : ''}" ${opt === 'block' ? 'style="display:flex;width:100%"' : ''}>${inner}<span class="tip-bubble">${why}</span></span>`;

/* `scaleMax` makes the two cards comparable. The meter shows the COMPOSITION of the
   remaining balance (available vs reserved), but both bars used to fill the same
   track, so MMS at 320/320 read as a full bar beside SMS at 440/1,240 — the eye
   compares bar length as quantity and concluded MMS had more, when SMS has more.
   Dividing by the larger of the two totals instead of each card's own total makes
   length mean amount and the split still mean composition. Unified mode passes its
   own total, so nothing changes there. */
/* §7.4: "At zero: that type blocked immediately". The banner and the sending-gate row
   were two wordings of that one fact; Grace picked the banner's, then the row went away.
   Unified mode drops "SMS" because there the balance is one pool, not the SMS type.

   NO "sending is blocked" IN THE SENTENCE (Grace, 2026-08-24). It is the docs' STATE
   NAME (§7.4 · Handoff §7 "blocked state needed"), which is why the balance card keeps
   the `BLOCKED` badge — but in SMS the word already means carrier filtering or a STOP
   opt-out, so on a self-serve zero balance it points a vendor at a compliance problem
   they don't have. The line under the title already says what won't send and how to fix
   it, so the clause added the fear without the information.
   The subscription copy followed the same day: `Paid features are blocked` (§8.1's own
   phrase) became `Paid features are off` in the banner, the status value, the cancel
   modal and the canceled toast — a screen cannot carry both words for one state, and
   the banner and the subscription card sit on the same page. The word now survives in
   exactly one rendered place: the balance card's `BLOCKED` badge. */
const outOfCreditsLine = () => `You're out of ${isUnified() ? '' : 'SMS '}credits`;

function balanceCard(type, remaining, reserved, scaleMax) {
  const scale = scaleMax || remaining;
  const available = remaining - reserved;
  const pctAvail = scale ? (available / scale) * 100 : 0;
  const pctRes = scale ? (reserved / scale) * 100 : 0;
  const low = available > 0 && available <= LOW_CREDIT_THRESHOLD;
  const empty = available === 0;
  const isOpen = S.packOpen && S.packType === type.toLowerCase();

  // A status badge should be a signal, not decoration — nothing shows when healthy.
  const badge = empty ? '<span class="pill red">Blocked</span>'
              : low   ? '<span class="pill amber">Running low</span>' : '';

  return h`
  <div class="balance-card">
    <div class="balance-head">
      <div class="balance-type">${type} balance</div>
      ${isLocked()
        ? lockTip(h`<button class="btn btn-sm btn-outline" disabled>Buy ${type}</button>`, lockWhy("buy"))
        : h`<button class="btn btn-sm btn-outline ${isOpen ? 'is-on' : ''}" data-act="buyPack" data-val="${type.toLowerCase()}">Buy ${type}</button>`}
    </div>

    <!-- Two-part hero when anything is reserved. §7.5's deduct-at-scheduling is the
         distinctive part of this model — it is what makes a scheduled send unable to
         fail — and it used to be an 11px footnote under the card while occupying most
         of the meter. Reserved gets its own number, sized below available because
         available is the actionable one, and it carries the drill-down. -->
    <div class="balance-hero ${reserved ? 'has-split' : ''}">
      <div class="hero-part">
        <span class="balance-big">${n(available)}</span>
        <span class="balance-unit">ready to send</span>
      </div>
      ${reserved ? h`
      <div class="hero-sep"></div>
      <!-- A fact, not a route. §7.6 asks for the reserved count "distinct from
           available" and nothing further; the per-campaign breakdown behind this was
           mine (Gap B7-3) and came out 2026-08-24. The campaign COUNT went with it —
           the docs ask for the credits, not for how many campaigns hold them. -->
      <div class="hero-part hero-part-inline">
        <span class="balance-mid">${n(reserved)}</span>
        <span class="balance-unit">held by scheduled campaigns</span>
      </div>` : ''}
    </div>

    <div class="meter ${empty ? 'meter-empty' : low ? 'meter-low' : ''}">
      <div class="meter-fill available" style="width:${pctAvail}%"></div>
      <div class="meter-fill reserved" style="width:${pctRes}%"></div>
    </div>
    <!-- The badge lives here, not in the head or the hero: in the head it squeezed
         Buy SMS onto two lines, in the hero it wrapped at half-card width. Directly
         under the bar it sits with the colour that already signals the same thing,
         and it displaces only the auto-recharge reminder, which matters least when
         the balance is the problem. -->
    <div class="meter-legend">
      <span>${badge || '&nbsp;'}</span>
      <span>${n(remaining)} remaining</span>
    </div>

  </div>`;
}

function balanceCardUnified(remaining, reserved) {
  const available = remaining - reserved;
  const pctAvail = remaining ? (available / remaining) * 100 : 0;
  const pctRes = remaining ? (reserved / remaining) * 100 : 0;
  const low = available > 0 && available <= LOW_CREDIT_THRESHOLD;
  const empty = available === 0;
  const isOpen = S.packOpen;

  const badge = empty ? '<span class="pill red">Blocked</span>'
              : low   ? '<span class="pill amber">Running low</span>' : '';

  return h`
  <div class="balance-card">
    <div class="balance-head">
      <div class="balance-type">Message credits</div>
      ${isLocked()
        ? lockTip(h`<button class="btn btn-sm btn-outline" disabled>Buy credits</button>`, lockWhy("buy"))
        : h`<button class="btn btn-sm btn-outline ${isOpen ? 'is-on' : ''}" data-act="buyPack" data-val="credits">Buy credits</button>`}
    </div>

    <!-- Full width, so the numbers run ACROSS it instead of stacking down the left
         edge with the right 60% empty (Grace, 2026-08-24). Hierarchy is §7.6's:
         Available is the hero because it answers "can I send right now?", Reserved and
         Remaining support it from the right, and the meter under them is the same three
         numbers as a picture. The rate captions the lot. -->
    <!-- Three loose numbers (1,400 available · 800 held · 2,200 remaining) made the
         vendor do the arithmetic to see how they relate — Grace: 너무 헷갈려. Only the
         actionable one stays a number on its own; the other two become ONE sentence
         that states the relation, and the meter beside the hero shows the same split as
         a picture. §7.6's three elements are all still here, just not as three columns. -->
    <div class="u-top">
      <div class="u-hero">
        <span class="balance-big">${n(available)}</span>
        <span class="balance-unit">credits available ${badge}</span>
      </div>
      <div class="u-meter">
        <div class="meter ${empty ? 'meter-empty' : low ? 'meter-low' : ''}">
          <div class="meter-fill available" style="width:${pctAvail}%"></div>
          <div class="meter-fill reserved" style="width:${pctRes}%"></div>
        </div>
      </div>
    </div>
    ${reserved ? h`
    <div class="u-explain"><strong>${n(reserved)}</strong> of your <strong>${n(remaining)}</strong> credits are held by scheduled campaigns</div>`
    : h`<div class="u-explain"><strong>${n(remaining)}</strong> credits, none held by scheduled campaigns</div>`}
    ${creditRateStrip()}
  </div>`;
}

// The auto-recharge card sits below the two balances in split mode, and beside
// the single balance in unified mode — so it lives in its own function.
/* PRD §9 gates on three things — vendor active, subscription not canceled, a
   registered card — plus sufficient counts to send. The tab showed only the
   counts, so a suspended vendor saw a balance with no hint that nothing would
   send. The number is the subject of the card because it is the thing that
   sends, so the status badge belongs to it.

   Setup is already done by the time a vendor reaches this tab — only a vendor
   that has been active can see it — so the carrier-registration lifecycle never
   appears here. What changes the number's state is *payment*, and that is fully
   documented, so none of this copy is invented:

     Active    vendor `active`   — §8.1 "Operating normally"
     Pending   `past_due`        — §8.2 "Server-error retry in progress
                                  (short-lived)"; §8.3 "vendor unaffected", so
                                  sending continues and there is nothing to fix
     Inactive  vendor `suspended`— §8.1 "Paid features blocked"; §7.7 credits are
                                  frozen, never forfeited; §10.2 recovery is a
                                  card update, instant and self-service

   The CTA target is specified: §10.4 sends every failure banner to the
   Subscription & Billing tab > Payment methods. Pending gets no button because
   §8.3 says the vendor is unaffected — a control there would have no task. */
const NUMBER_STATES = {
  active:   { pill: 'green', label: 'Active',   blocks: false,
              text: () => `Used for campaigns and 1:1 chat` },
  pending:  { pill: 'amber', label: 'Pending',  blocks: false,
              text: () => `We're retrying your payment — sending continues` },
  inactive: { pill: 'red',   label: 'Inactive', blocks: true,
              text: () => `Sending is paused until your payment is updated — your credits are frozen, not lost`,
              cta: 'Update payment', act: 'goBilling' },
  // Same Inactive label — there are only ever three — but a different cause needs
  // a different sentence and a different way out. Nothing is wrong with the card
  // here, so telling them to update payment would be misleading. §9 closes the SMS
  // menu on `canceled`, which is why the number stops rather than "pauses".
  canceled: { pill: 'red',   label: 'Inactive', blocks: true,
              text: () => `Your subscription is canceled — resume it to start sending again`,
              cta: 'Resume subscription', act: 'resumeSub' },
};

/* The state is a payment consequence, so it is derived — never switched
   independently. An independent switch could produce states that cannot exist
   (Active above "Subscription suspended", or Inactive telling the vendor to
   update a payment that is current), and each of those read as bugs on screen.
   The mapping is §8.2's subscription status, one to one:

     active / free_period → Active     charges current, nothing in the way
     past_due             → Pending    server-error retry, vendor unaffected
     suspended / canceled / none → Inactive   paid features blocked (§8.1)

   Pending is reachable through the `pastDue` scenario. */
function numState() {
  const sub = sc().sub;
  if (sub === 'past_due') return 'pending';
  if (sub === 'canceled') return 'canceled';
  if (sub === 'suspended' || sub === 'none') return 'inactive';
  return 'active';
}

function sendingStatusCard() {
  const s = sc();
  const c = s.credits;
  const cards = s.cards.map(id => CARDS[id]);
  const num = NUMBER_STATES[numState()];
  const available = isUnified()
    ? unifiedTotals(c).remaining - unifiedTotals(c).reserved
    : (c.sms - c.smsRes);

  const checks = [
    { key: 'sub',
      ok: s.sub !== 'suspended' && s.sub !== 'none' && s.sub !== 'canceled',
      okText: 'Subscription active',
      badText: s.sub === 'suspended' ? 'Subscription suspended — payment failed'
             : s.sub === 'canceled'  ? 'Subscription canceled — sending is off'
             : 'No active subscription',
      act: s.sub === 'canceled' ? 'resumeSub' : 'goBilling',
      cta: s.sub === 'canceled' ? 'Resume' : 'Fix payment' },
    { ok: cards.length > 0,
      okText: 'Payment method on file',
      badText: 'No payment method — packs can\'t be charged',
      act: 'addCard', cta: 'Add card' },
    /* The credits row lived here until 2026-08-24 and was removed: the out-of-credits
       BANNER on this same screen carries the identical sentence and its own Buy button,
       so the gate listed the blocker twice with two ways to fix it. Zero credits still
       shows on the balance card as BLOCKED (§7.4), so the state is not lost — only the
       second copy of it. This list is now the blockers the banner does NOT cover. */
  ];
  // The head already carries the number's own state and action, so the list
  // below is the other blockers only. Guard on that list — not on every blocker
  // — or a number-only problem leaves an empty bordered div.
  // A blocked number IS the subscription problem surfacing on the number — whether
  // suspended or canceled — so showing the subscription row too would state one
  // fact twice with two identical buttons. Keyed, not matched on the action, so it
  // keeps holding when the action differs by cause (Fix payment vs Resume).
  const otherBlockers = checks.filter(x => !x.ok && !(num.blocks && x.key === 'sub'));

  // Identity-card pattern (SendGrid Sender Identity, Klaviyo sending domain,
  // Twilio phone numbers): icon tile, the identifier as the hero, its own status,
  // one line on what it's for, and the action. Blockers append below.
  return h`
  <section class="section-card num-card ${num.pill}">
    <div class="num-head">
      <div class="num-main">
        <div class="num-label">Your SMS number</div>
        <div class="num-value">${TFN}</div>
        <!-- The three consumers in the Active line are documented: PRD §7.5 lists
             Campaign and Automated (order confirmations, flows, 1:1 chat) as what
             draws credits, and §7.6 / Handoff §5 split usage history into
             campaign / automated / 1:1 chat. -->
        <div class="num-note">${num.text()}</div>
      </div>
      <div class="num-side">
        <span class="pill ${num.pill}"><span class="num-dot"></span>${num.label}</span>
        <!-- This CTA exists because in the 5-tab layout the SMS tab has no banner,
             so the number card is the only thing offering a way out. Merged, the
             same screen always already has an owner — the danger banner when
             suspended or expired, the subscription card's Resume when canceled — so
             keeping it here would put the identical control on the page twice. -->
        ${(num.cta && !(isMerged() && num.blocks))
          ? h`<button class="btn btn-sm btn-outline" data-act="${num.act}">${num.cta}</button>` : ''}
      </div>
    </div>

    ${otherBlockers.length ? h`
      <div class="check-list">
        ${otherBlockers.map(x => h`
          <div class="check-row is-bad">
            <span class="check-ico">${ICO.alert}</span>
            <span class="check-text">${x.badText}</span>
            <button class="btn btn-sm btn-outline" data-act="${x.act}" data-val="${isUnified() ? 'credits' : 'sms'}">${x.cta}</button>
          </div>`).join('')}
      </div>` : ''}
  </section>`;
}

function smsNotSubscribed() {
  // A vendor that has never subscribed has no number, no credits and no card, so
  // every card below would describe things that do not exist — "your credits are
  // frozen" to someone who has none, a number they were never issued.
  return h`
    <section class="section-card">
      <div class="section-head"><div>
        <div class="section-title">SMS is part of the Shopcord plan</div>
        <div class="section-desc">Subscribe to get your sending number and start buying message packs.</div>
      </div>${isMerged() ? '' : '<button class="btn btn-primary" data-tab="billing">See the plan</button>'}</div>
    </section>`;
}

function smsGateAndCredits() {
  const c = sc().credits;
  return h`
    ${sendingStatusCard()}

    ${isUnified()
      ? (() => { const u = unifiedTotals(c); return balanceCardUnified(u.remaining, u.reserved); })()
      : h`<div class="balance-grid">
            ${balanceCard('SMS', c.sms, c.smsRes, Math.max(c.sms, c.mms))}
            ${balanceCard('MMS', c.mms, c.mmsRes, Math.max(c.sms, c.mms))}
          </div>`}


    ${S.packOpen ? inlinePackPurchase() : ''}`;
}

/* Expands inline under the balance grid: it attaches to the reserved figure that
   is already on the page, so by the container rule it is neither a modal nor a
   drawer. Read-only — cancelling a scheduled campaign belongs to the campaign
   screen, and returning the credits is that screen's job (§7.5). */
function purchaseHistorySection() {

    <section class="section-card">

      </div></div>
      <div class="tbl-scroll">

          <tbody>${PURCHASES.map(p => h`

}

function usageHistorySection() {
  return h`
    <section class="section-card">
      <div class="section-head"><div>
        <div class="section-title">Usage history</div>
        <div class="section-desc">What used your credits — this is consumption, not money charged.</div>
      </div>
      <select class="select"><option>All sources</option><option>Campaigns</option><option>1:1 chat</option></select>
      </div>
      <div class="tbl-scroll">
        <table class="tbl">
          <thead><tr><th style="width:130px">Date</th><th>Source</th><th style="width:90px">Type</th><th style="width:110px;text-align:right">Credits</th></tr></thead>
          <tbody>${USAGE.map(u => h`
            <tr><td class="t-muted">${u.date}</td><td>${u.src}</td><td class="t-muted">${u.type}</td><td class="t-num t-strong">${u.used}</td></tr>`).join('')}
          </tbody>
        </table>

    </section>`;
}

// 5-tab layout: SMS Settings owns the whole SMS story, so it keeps both of its own
// history tables. Merged, those two collapse — Purchase history into Billing history,
// Usage history into the segmented history region. See mergedBillingBody().
function creditsBody() {
  if (sc().sub === 'none') return smsNotSubscribed();
  return smsGateAndCredits() + purchaseHistorySection() + usageHistorySection();
}

/* 4-tab layout (PRD §3.1–3.2's documented structure) — SMS folded into
   Subscription & Billing.

   Folding two tabs into one page is only worth doing if the result reads as FEWER
   things, not the same seven stacked in a longer column. So the tab is three named
   groups, and every card belongs to exactly one of them:

     Shopcord subscription — what you pay for the platform. The group head carries
                             the status pill and Cancel/Resume, so the card inside
                             is just plan, price, dates and billed-to.
     SMS                   — the number, the credits, auto-recharge. One subject:
                             what sends and what it draws from.
     Billing               — the card pool and the history. Both belong here because
                             both are about money moving, and the card pool serves
                             the subscription and the packs equally (§4.1).

   Two consequences worth stating. Purchase history is DROPPED, not moved: Billing
   history already carries every pack row with the same receipts. And Usage history
   is not a fourth section — it is the second view of the history region, behind a
   Charges / SMS usage switch, so the money story and the credit story share a place
   without ever sharing a screen. */
function mergedBillingBody() {
  const s = sc();
  const subscribed = s.sub !== 'none';

  /* §3.4's "three stacked sections" are the CARDS, not groups of cards — Section 1
     Subscription, Section 2 Payment methods, Section 3 Billing history, which is
     exactly what the 5-tab billing tab renders. So merged, the honest structure is
     the doc's three sections plus SMS, and the only thing needing a group header is
     SMS, because it is the only one that holds several cards.

     An earlier version wrapped all three in invented groups named Subscription /
     SMS / Billing. Grace: "청구내역이 결국 빌링이잖아?" — right, and worse, "Billing"
     collided with the tab's own name while containing the billing history. Gone.

     Usage history moves into SMS rather than living behind a switch on the history
     card: §3.4's Section 3 is charges, §7.6's usage history belongs to the credit
     dashboard, and this puts each where its own doc says it goes. */
  const smsGroup = h`
    <div class="group">
      <div class="group-head">
        <div>
          <div class="group-title">SMS</div>
          <div class="group-desc">${subscribed
            ? 'Your sending number, the credits it draws from, and what used them.'
            : 'Included once you subscribe.'}</div>
        </div>
      </div>
      <div class="group-body">${subscribed
        ? smsGateAndCredits() + usageHistorySection()
        : smsNotSubscribed()}</div>
    </div>`;

  return subscriptionSection() + smsGroup + paymentMethodsSection() + billingHistorySection();
}

// Campaign send — rebuilt on the real Phase 1 screen (Figma 3202:22463).
// Phase 2.5 only changes two things on it: the cost line becomes counts, and
// Send Time gains the credit-reservation disclosure.
function screenCampaign() {
  const s = sc();
  const need = s.recipients;
  const have = s.credits.sms;
  const short = Math.max(0, need - have);
  const scheduled = S.sendWhen === 'later';

  // The cost line already exists on this screen — it becomes the pre-send check
  // so the shortfall is known before Send is ever pressed.
  const unitWord = isUnified() ? 'credit' : 'SMS';
  /* An ESTIMATE, and the docs say so: §7.5 writes the pre-send line as "This campaign
     will use ~1,000 SMS credits" and Handoff §6 quotes the same tilde. The screen was
     stating it as an exact sum, which promises a number the send cannot guarantee —
     recipient lists move between here and the send. The arithmetic stays, because it
     explains where the figure comes from; "about" is what it needs in front of it. */
  const costLine = short === 0
    ? h`<div class="cost-line ok">About <strong>${n(need)} ${isUnified() ? 'credits' : 'SMS'}</strong> — ${n(need)} recipients × 1 ${unitWord} · about ${n(have - need)} left after sending</div>`
    : h`<div class="cost-line short">
          <span class="cost-ico">${ICO.alert}</span>
          <div>${n(need)} recipients × 1 ${unitWord} = <strong>${n(need)} ${isUnified() ? 'credits' : 'SMS'}</strong><br>

  return h`
  <div class="page-head">
    <div class="crumb">Campaigns / New Campaign</div>
    <div class="camp-title-row">
      <div class="page-title">Summer Collection 2026</div>
      <div class="camp-actions">

             sending, so locking it would destroy work the vendor already did. -->
        <button class="btn btn-secondary">Save Draft</button>
        ${isLocked()
          ? lockTip(h`<button class="btn btn-primary" disabled><span class="btn-ico">${ICO.send}</span>Send</button>`, lockWhy("send"), 'below')
          : h`<button class="btn btn-primary" data-act="${short === 0 ? 'sendNow' : 'confirmCharge'}">
                <span class="btn-ico">${ICO.send}</span>Send
              </button>`}
      </div>
    </div>
  </div>

  <div class="body">
    ${banners()}
    <div class="camp-grid">
      <div class="camp-col">
        <section class="section-card">
          <div class="camp-card-title">Select Linesheet</div>
          <select class="select" style="width:100%;margin-top:12px"><option>Summer Collection 2026</option></select>
          <div class="ls-meta">
            <div class="ls-meta-row"><span class="t-muted">Share URL:</span> <a href="#" class="linkbtn" style="font-weight:400">https://con.ct/8R3HWt</a></div>
            <div class="ls-meta-row"><span class="t-muted">Access Type:</span> <strong>Selected Buyers</strong>
              <span style="margin-left:auto" class="t-muted">Start Date <strong style="color:var(--fg)">05/26/26</strong> &nbsp; End Date <strong style="color:var(--fg)">07/15/26</strong></span>
            </div>
          </div>
        </section>

        <section class="section-card">
          <div class="camp-card-title">Select Recipients</div>
          <div class="camp-card-sub">Who are you reaching out to?</div>
          <div class="camp-row">
            <span class="pill gray" style="height:26px">${n(need)} Recipients</span>
            <button class="btn btn-sm btn-outline" style="margin-left:auto">View / Edit</button>
          </div>
        </section>

        <section class="section-card">
          <div class="camp-card-title">Message Contents</div>
          <div class="camp-card-sub">What message are you sending?</div>
          <textarea class="textarea" style="margin-top:12px">Hi, check out {vendor_dba}'s new collection released today!</textarea>
          <div class="camp-row" style="margin-top:14px">
            <button class="btn btn-sm btn-outline"><span class="btn-ico">${ICO.plus}</span>Add Image (MMS)</button>
            <button class="btn btn-sm btn-outline" style="margin-left:auto">Send Test</button>
          </div>
        </section>

        <section class="section-card">
          <div class="camp-card-title">Send Time</div>
          <div class="camp-card-sub">When should we send this message?</div>
          <!-- §10.5 blocks new scheduling as well as new sends, so both options
               go disabled together. The whole group is one decision, so one tooltip
               on the group beats two identical ones. -->
          ${isLocked() ? lockTip(h`
          <div class="radio-list" style="width:100%">
            <button class="radio-card ${!scheduled ? 'is-sel' : ''}" disabled>
              <span class="radio">${!scheduled ? '<span class="radio-dot"></span>' : ''}</span>

            <button class="radio-card ${scheduled ? 'is-sel' : ''}" disabled>
              <span class="radio">${scheduled ? '<span class="radio-dot"></span>' : ''}</span>
              <span class="radio-body">
                <span class="radio-label">Schedule for Later</span>
                <span class="radio-desc">Pick a date &amp; time to send.</span>
              </span>
            </button>
          </div>`, lockWhy("send"), 'block') : h`
          <div class="radio-list">
            <button class="radio-card ${!scheduled ? 'is-sel' : ''}" data-act="sendWhen" data-val="now">

            <div class="bubble">Hi, check out {vendor_dba}'s new collection released today!<br><br>Reply STOP to opt out.</div>
          </div>
          <div class="preview-note">Actual rendering may not be identical to this preview depending on the user's environment.</div>
          ${costLine}
        </section>
      </div>
    </div>
  </div>`;
}

/* "Which card gets charged" — used by the pack purchase, the campaign shortfall
   confirmation and the subscribe confirmation. It states the fact and stops there:
   the `Change` link that used to sit here walked the vendor out of the flow they
   were in the middle of (Grace, 2026-08-24), and §4.1 keeps card management in one
   place anyway. With NO card the row becomes the one thing that must happen first,
   and the entry modal opens over the flow instead of replacing it.
   The card is derived — the two overlay copies used to hard-code Visa ····4242. */
/* What a credit buys. This is the rule that decides everything a vendor plans — an
   MMS costs three times an SMS — so it is a component with structure, not a muted
   caption (Grace, 2026-08-24). The same strip appears on the balance card and in the
   buy flow, so the rate is in front of them when they read a balance and when they pay
   for one. Not in the docs: §7.1 says "counts, not dollars" and names no rate. */
/* The buy flow gets the rate as a BANNER, not two chips — the shape 리디 · 카카오 ·
   네이버 all use at the top of a top-up screen: an icon, one bold line, one line of
   explanation. Chips were fine as a footnote on the balance card, but at the moment of

function payWithRow() {
  const def = CARDS[sc().cards[0]];

     row survived the removal of its "Change" link and still read as clickable, which is
     worse than before: it invites a press that does nothing (Grace, 2026-08-24). A
     caption line can't make that promise. Without a card there IS something to do, so
     that variant keeps a box and a button — the contrast is the point. */
  return def ? h`
      <div class="pay-with-line">
