    ${content}
  </div>`;
}

// ── Screen: SMS credit dashboard ────────────────────────────────────────────
// The number that answers "can I send right now?" is Available, not Remaining —
// so that's the hero. Remaining and Reserved support it underneath.
/* Auto-recharge is out of Phase 2.5 (meeting, 2026-08-24), and its threshold went with
   it — but `RUNNING LOW` stays, because without auto-recharge a warning is the ONLY
   thing between a vendor and a hard stop (Grace: "충전해서 사용하는 방식이어도 넘 조금
   남아있으면 얘기는 해줄 수 있잖아"). The number is ours, not the docs' — Gap B7-6 still
   applies — and 200 is *one fifth of the smallest pack*, so the rule survives a change
   of pack sizes. Needs writing into the PRD. */
const LOW_CREDIT_THRESHOLD = 200;
const TFN = '+1 (888) 555-0182';

/* ── Credit model (D-3, pending Jinah) ────────────────────────────────────────
   split   — separate SMS and MMS balances (what the mockup assumed first)
   unified — one pool, and every message costs the same whatever its type.
             Mailchimp and Postscript charge 3x for MMS; we don't, which is what
             makes this model simple — there is nothing for the vendor to convert. */
/* ── Tab layout ────────────────────────────────────────────────────────────────
   split  — 5 tabs, SMS Settings is its own tab (Grace's 8/12 decision)
   merged — 4 tabs, SMS folded into Subscription (what PRD §3.1–3.2 and
            the README's "5 tabs → 4 tabs" actually describe)
   Both are built because the docs and the decision disagree, same as the credit
   model. `smsTab()` is the one place that knows where SMS content lives, so every
   navigation target follows the switch instead of hard-coding 'sms'. */
const isMerged = () => S.tabLayout === 'merged';
/* Scope split (meeting, 2026-08-24): Subscription ships 10/1, SMS Settings
   around 11/1. Release 1 therefore has FOUR tabs — the fifth arrives with its content —
   and its Billing history can only hold subscription charges, because credits cannot be
   bought yet. Everything SMS lives behind this flag so the two releases are one build. */
/* THIS BUILD IS THE 1st RELEASE ONLY. The full build keeps both releases behind a
   switch — see Mockup_P2.5_PaymentBilling_2026-08-24.html, which is where the 2nd
   release lives and is not to be deleted, since it ships again later.
   isR1 is pinned rather than the release branches being torn out: every `isR1()` and
   `hasCredits()` in the file already resolves correctly against it, so nothing has to be
   surgically removed and the two builds cannot drift in their logic. */
const isR1 = () => true;
/* Release 1 ships before credits exist, so every sentence that mentions a balance,
   a pack or a reservation describes property the vendor cannot have — and a
   reassurance about property you do not have reads as a promise. The clause is
   composed from here rather than written into each string, so the two releases can
   never drift apart the way the three pack prices once did. */
const hasCredits = () => !isR1();
const smsTab = () => (isR1() || isMerged()) ? 'billing' : 'sms';

const isUnified = () => S.creditModel === 'unified';
/* Meeting 2026-08-24 — D-3 decided: ONE credit pool, and the two message types cost
   different amounts of it. The scenario data still counts messages per type, so the
   pool is the conversion of both: an MMS is three credits, not three messages.
   Needs writing into the PRD — §7.1 says "counts, not dollars" but names no rate. */
const MMS_CREDITS = 3;
const CREDIT_RATE_LINE = `SMS 1 credit · MMS ${MMS_CREDITS} credits`;
const unifiedTotals = (c) => ({
  remaining: c.sms + c.mms * MMS_CREDITS,
  reserved:  c.smsRes + c.mmsRes * MMS_CREDITS,
});

/* ── Suspension lock (Handoff §7 asked for one reusable pattern · D-6) ─────────
   SCOPE — 2차 PRD §5's A안, NOT a settled list. It blocks NEW purchases,
   sends and scheduling, and deliberately does not block already-paid, already-
   scheduled sends: those counts are already deducted, so stopping them would be
   charging for a service and not delivering it — the exact thing that invites
   refunds and chargebacks. Pending legal (L-2); D-6 finalises the list.

     locked    buying packs · changing auto-recharge · sending · scheduling
     not locked  everything read-only, billing history, Export, and all card
                 management — card management IS the recovery path (§12.3), so
                 locking it would trap the vendor in the suspended state.

   PATTERN — one treatment, repeated. A blocked control stays VISIBLE and goes
   disabled with a tooltip saying why. Never hidden: §5.5.2 keeps the store and data
   intact, and a control that disappears reads as "this feature is gone" rather
   than "billing is paused". Only the banner carries the fix, because six buttons
   each offering Update payment is the same control six times over.
   This is the same disabled-plus-tooltip treatment the card limit and the
   last-card Remove already use — extended, not invented. */
/* §5.5 · §4.2 — grace does NOT lock anything: the service is kept for the whole seven
   days, and only `canceled` (or never having subscribed) loses paid features. The lock
   pattern therefore has one cause left, where it used to have two. */
const isSuspended = () => false;
const isCanceled  = () => sc().sub === 'canceled';
// §9 closes the SMS menu when the subscription is `canceled`, so the same controls
// are unavailable — but for the opposite reason. The card is fine; the plan is gone.
// One pattern, two causes: the treatment is identical, only the sentence changes.
const isLocked = () => isSuspended() || isCanceled();
/* Role predicate — mirrors the 8/24 build so both files gate the same way. */
const isMaster = () => (sc().role ?? 'master') === 'master';

/* Master / Sub account. A sub account cannot register a payment method, change the default
   or remove a card — and Grace, 9/11: "서브계정은 어차피 버튼이 다 사라질거야. 서브계정
   유져는 CTA버튼을 볼 수 없어." So these controls are NOT rendered, not rendered-disabled.
   Six of them: both Add buttons, Set as default, Remove, and the two banner CTAs.
   What a sub account still sees is the card list itself — brand, last 4, expiry, which one
   is default — and every banner's text. They are told what is happening; they simply have no
   control to act on it, and a dead control would only offer one.
   Absent `role` on a scenario = master, so every existing state is untouched.
   NOT IN THE PAYMENT PRD — v2.1 has no master/sub or permission model at all (Gap H-8). */

const LOCK_COPY = {
  suspended: {
    buy:  'You can\'t buy message packs while your subscription is suspended. Update your payment method and this comes back.',
    send: 'Sending is paused while your subscription is suspended. Campaigns you already scheduled still go out.',
  },
  canceled: {
    buy:  'Message packs are part of a Shopcord subscription. Resume your subscription to buy them again.',
    send: 'Sending needs an active subscription. Resume yours to send again.',
  },
};
const lockWhy = (kind) => LOCK_COPY['canceled'][kind];
// Wraps already-disabled markup so the reason is reachable on hover. `.tip` is
// inline-flex, so anything that needs to fill its row passes `block`.
const lockTip = (inner, why, opt) =>
  h`<span class="tip ${opt === 'below' ? 'tip-below' : ''}" ${opt === 'block' ? 'style="display:flex;width:100%"' : ''}>${inner}<span class="tip-bubble">${why}</span></span>`;

/* `scaleMax` makes the two cards comparable. The meter shows the COMPOSITION of the
   remaining balance (available vs reserved), but both bars used to fill the same
   track, so MMS at 320/320 read as a full bar beside SMS at 440/1,240 — the eye
   compares bar length as quantity and concluded MMS had more, when SMS has more.
   Dividing by the larger of the two totals instead of each card's own total makes
   length mean amount and the split still mean composition. Unified mode passes its
   own total, so nothing changes there. */
/* 2차 PRD §4: at zero the deduct API refuses, so that type is blocked. The banner and the sending-gate row
   were two wordings of that one fact; Grace picked the banner's, then the row went away.
   Unified mode drops "SMS" because there the balance is one pool, not the SMS type.

   NO "sending is blocked" IN THE SENTENCE (Grace, 2026-08-24). It is the docs' STATE
   NAME (2차 PRD §4 · Handoff §7 "blocked state needed"), which is why the balance card keeps
   the `BLOCKED` badge — but in SMS the word already means carrier filtering or a STOP
   opt-out, so on a self-serve zero balance it points a vendor at a compliance problem
   they don't have. The line under the title already says what won't send and how to fix
   it, so the clause added the fear without the information.
   The subscription copy followed the same day: `Paid features are blocked` (the old §8.1's
   phrase) became `Paid features are off` in the banner, the status value, the cancel
   modal and the canceled toast — a screen cannot carry both words for one state, and
   the banner and the subscription card sit on the same page. The word now survives in
   exactly one rendered place: the balance card's `BLOCKED` badge. */
const outOfCreditsLine = () => `You're out of ${isUnified() ? '' : 'SMS '}credits`;

function balanceCard(type, remaining, reserved, scaleMax) {
  const scale = scaleMax || remaining;
  const available = remaining - reserved;
  const pctAvail = scale ? (available / scale) * 100 : 0;
  const pctRes = scale ? (reserved / scale) * 100 : 0;
  const low = available > 0 && available <= LOW_CREDIT_THRESHOLD;
  const empty = available === 0;
  const isOpen = S.packOpen && S.packType === type.toLowerCase();

  // A status badge should be a signal, not decoration — nothing shows when healthy.
  const badge = empty ? '<span class="pill red">Blocked</span>'
              : low   ? '<span class="pill amber">Running low</span>' : '';

  return h`
  <div class="balance-card">
    <div class="balance-head">
      <div class="balance-type">${type} balance</div>
      ${isLocked()
        ? lockTip(h`<button class="btn btn-sm btn-outline" disabled>Buy ${type}</button>`, lockWhy("buy"))
        : h`<button class="btn btn-sm btn-outline ${isOpen ? 'is-on' : ''}" data-act="buyPack" data-val="${type.toLowerCase()}">Buy ${type}</button>`}
    </div>

    <!-- Two-part hero when anything is reserved. 통합 v0.6 §7.5's deduct-at-scheduling is the
         distinctive part of this model — it is what makes a scheduled send unable to
         fail — and it used to be an 11px footnote under the card while occupying most
         of the meter. Reserved gets its own number, sized below available because
         available is the actionable one, and it carries the drill-down. -->
    <div class="balance-hero ${reserved ? 'has-split' : ''}">
      <div class="hero-part">
        <span class="balance-big">${n(available)}</span>
        <span class="balance-unit">ready to send</span>
      </div>
      ${reserved ? h`
      <div class="hero-sep"></div>
      <!-- A fact, not a route. 통합 v0.6 §7.6 asks for the reserved count "distinct from
           available" and nothing further; the per-campaign breakdown behind this was
           mine (Gap B7-3) and came out 2026-08-24. The campaign COUNT went with it —
           the docs ask for the credits, not for how many campaigns hold them. -->
      <div class="hero-part hero-part-inline">
        <span class="balance-mid">${n(reserved)}</span>
        <span class="balance-unit">held by scheduled campaigns</span>
      </div>` : ''}
    </div>

    <div class="meter ${empty ? 'meter-empty' : low ? 'meter-low' : ''}">
      <div class="meter-fill available" style="width:${pctAvail}%"></div>
      <div class="meter-fill reserved" style="width:${pctRes}%"></div>
    </div>
    <!-- The badge lives here, not in the head or the hero: in the head it squeezed
         Buy SMS onto two lines, in the hero it wrapped at half-card width. Directly
         under the bar it sits with the colour that already signals the same thing,
         and it displaces only the auto-recharge reminder, which matters least when
         the balance is the problem. -->
    <div class="meter-legend">
      <span>${badge || '&nbsp;'}</span>
      <span>${n(remaining)} remaining</span>
    </div>

  </div>`;
}

function balanceCardUnified(remaining, reserved) {
  const available = remaining - reserved;
  const pctAvail = remaining ? (available / remaining) * 100 : 0;
  const pctRes = remaining ? (reserved / remaining) * 100 : 0;
  const low = available > 0 && available <= LOW_CREDIT_THRESHOLD;
  const empty = available === 0;
  const isOpen = S.packOpen;

  const badge = empty ? '<span class="pill red">Blocked</span>'
              : low   ? '<span class="pill amber">Running low</span>' : '';

  return h`
  <div class="balance-card">
    <div class="balance-head">
      <div class="balance-type">Message credits</div>
      ${isLocked()
        ? lockTip(h`<button class="btn btn-sm btn-outline" disabled>Buy credits</button>`, lockWhy("buy"))
        : h`<button class="btn btn-sm btn-outline ${isOpen ? 'is-on' : ''}" data-act="buyPack" data-val="credits">Buy credits</button>`}
    </div>

    <!-- Full width, so the numbers run ACROSS it instead of stacking down the left
         edge with the right 60% empty (Grace, 2026-08-24). Hierarchy is 통합 v0.6 §7.6's:
         Available is the hero because it answers "can I send right now?", Reserved and
         Remaining support it from the right, and the meter under them is the same three
         numbers as a picture. The rate captions the lot. -->
    <!-- Three loose numbers (1,400 available · 800 held · 2,200 remaining) made the
         vendor do the arithmetic to see how they relate — Grace: 너무 헷갈려. Only the
         actionable one stays a number on its own; the other two become ONE sentence
         that states the relation, and the meter beside the hero shows the same split as
         a picture. 통합 v0.6 §7.6's three elements are all still here, just not as three columns. -->
    <div class="u-top">
      <div class="u-hero">
        <span class="balance-big">${n(available)}</span>
        <span class="balance-unit">credits available ${badge}</span>
      </div>
      <div class="u-meter">
        <div class="meter ${empty ? 'meter-empty' : low ? 'meter-low' : ''}">
          <div class="meter-fill available" style="width:${pctAvail}%"></div>
          <div class="meter-fill reserved" style="width:${pctRes}%"></div>
        </div>
      </div>
    </div>
    ${reserved ? h`
    <div class="u-explain"><strong>${n(reserved)}</strong> of your <strong>${n(remaining)}</strong> credits are held by scheduled campaigns</div>`
    : h`<div class="u-explain"><strong>${n(remaining)}</strong> credits, none held by scheduled campaigns</div>`}
    ${creditRateStrip()}
  </div>`;
}

// The auto-recharge card sits below the two balances in split mode, and beside
// the single balance in unified mode — so it lives in its own function.
/* PRD §9 gates on three things — vendor active, subscription not canceled, a
   registered card — plus sufficient counts to send. The tab showed only the
   counts, so a suspended vendor saw a balance with no hint that nothing would
   send. The number is the subject of the card because it is the thing that
   sends, so the status badge belongs to it.

   Setup is already done by the time a vendor reaches this tab — only a vendor
   that has been active can see it — so the carrier-registration lifecycle never
   appears here. What changes the number's state is *payment*, and that is fully
   documented, so none of this copy is invented:

   ⚠️ Renumbered and re-sourced against PRD v2.1 (2026-09-01). The old mapping ran off
   the retired vendor state `suspended`, which §4.1 · §5.5 abolished outright — 정지
   개념 자체를 쓰지 않음 — so the third row now hangs off the subscription state:

     Active    `active`    — §4.2, the state where paid features run
     Pending   `past_due`  — §4.2 keeps paid features in {active, past_due}, and
                             §5.1 · PB 5.2.0 call the server-error half 벤더 무통보,
                             so sending continues and there is nothing to fix
     Inactive  `canceled` / `free` — §4.2 "해지된 벤더 = 미구독 벤더와 동일", paid
                             features unavailable; 2차 PRD §5 freezes credits rather
                             than forfeiting them; recovery is 재구독 (§5.5.3)

   The CTA target is specified: §12.3 sends every failure banner to the
   Subscription tab > Payment methods. Pending gets no button because
   §5.1 says the vendor is unaffected — a control there would have no task. */
const NUMBER_STATES = {
  active:   { pill: 'green', label: 'Active',   blocks: false,
              text: () => `Used for campaigns and 1:1 chat` },
  pending:  { pill: 'amber', label: 'Pending',  blocks: false,
              text: () => `We're retrying your payment — sending continues` },
  inactive: { pill: 'red',   label: 'Inactive', blocks: true,
              text: () => `Sending is paused until your payment is updated — your credits are frozen, not lost`,
              cta: 'Update payment', act: 'goBilling' },
  // Same Inactive label — there are only ever three — but a different cause needs
  // a different sentence and a different way out. Nothing is wrong with the card
  // here, so telling them to update payment would be misleading. §9 closes the SMS
  // menu on `canceled`, which is why the number stops rather than "pauses".
  canceled: { pill: 'red',   label: 'Inactive', blocks: true,
              text: () => `Your subscription is canceled — resume it to start sending again`,
              cta: 'Resume subscription', act: 'resumeSub' },
};

/* The state is a payment consequence, so it is derived — never switched
   independently. An independent switch could produce states that cannot exist
   (Active above "Subscription suspended", or Inactive telling the vendor to
   update a payment that is current), and each of those read as bugs on screen.
   The mapping is §8.2's subscription status, one to one:

     active / free_period → Active     charges current, nothing in the way
     past_due             → Pending    server-error retry, vendor unaffected
     suspended / canceled / none → Inactive   paid features blocked (§8.1)

   Pending is reachable through the `pastDue` scenario. */
function numState() {
  const sub = sc().sub;
  if (sub === 'past_due') return 'pending';
  if (sub === 'canceled') return 'canceled';
  if (sub === 'canceled' || sub === 'free') return 'inactive';
  return 'active';
}

function sendingStatusCard() {
  const s = sc();
  const c = s.credits;
  const cards = s.cards.map(id => CARDS[id]);
  const num = NUMBER_STATES[numState()];
  const available = isUnified()
    ? unifiedTotals(c).remaining - unifiedTotals(c).reserved
    : (c.sms - c.smsRes);

  const checks = [
    { key: 'sub',
      // §4.2 — paid features run in {active, past_due}, grace included.
      ok: paidOn(),
      okText: 'Subscription active',
      badText: s.sub === 'canceled'  ? 'Subscription canceled — sending is off'
             : 'No active subscription',
      act: s.sub === 'canceled' ? 'resumeSub' : 'goBilling',
      cta: s.sub === 'canceled' ? 'Resume' : 'Fix payment' },
    { ok: cards.length > 0,
      okText: 'Payment method on file',
      badText: 'No payment method — packs can\'t be charged',
      act: 'addCard', cta: 'Add card' },
    /* The credits row lived here until 2026-08-24 and was removed: the out-of-credits
       BANNER on this same screen carries the identical sentence and its own Buy button,
       so the gate listed the blocker twice with two ways to fix it. Zero credits still
       shows on the balance card as BLOCKED (2차 PRD §4), so the state is not lost — only the
       second copy of it. This list is now the blockers the banner does NOT cover. */
  ];
  // The head already carries the number's own state and action, so the list
  // below is the other blockers only. Guard on that list — not on every blocker
  // — or a number-only problem leaves an empty bordered div.
  // A blocked number IS the subscription problem surfacing on the number — whether
  // suspended or canceled — so showing the subscription row too would state one
  // fact twice with two identical buttons. Keyed, not matched on the action, so it
  // keeps holding when the action differs by cause (Fix payment vs Resume).
  const otherBlockers = checks.filter(x => !x.ok && !(num.blocks && x.key === 'sub'));

  // Identity-card pattern (SendGrid Sender Identity, Klaviyo sending domain,
  // Twilio phone numbers): icon tile, the identifier as the hero, its own status,
  // one line on what it's for, and the action. Blockers append below.
  return h`
  <section class="section-card num-card ${num.pill}">
    <div class="num-head">
      <div class="num-main">
        <div class="num-label">Your SMS number</div>
        <div class="num-value">${TFN}</div>
        <!-- The three consumers in the Active line are documented: 통합 v0.6 §7.5 lists
             Campaign and Automated (order confirmations, flows, 1:1 chat) as what
             draws credits, and 통합 v0.6 §7.6 / Handoff §5 split usage history into
             campaign / automated / 1:1 chat. -->
        <div class="num-note">${num.text()}</div>
      </div>
      <div class="num-side">
        <span class="pill ${num.pill}"><span class="num-dot"></span>${num.label}</span>
        <!-- This CTA exists because in the 5-tab layout the SMS tab has no banner,
             so the number card is the only thing offering a way out. Merged, the
             same screen always already has an owner — the danger banner when
             suspended or expired, the subscription card's Resume when canceled — so
             keeping it here would put the identical control on the page twice. -->
        ${(num.cta && !(isMerged() && num.blocks))
          ? h`<button class="btn btn-sm btn-outline" data-act="${num.act}">${num.cta}</button>` : ''}
      </div>
    </div>

    ${otherBlockers.length ? h`
      <div class="check-list">
        ${otherBlockers.map(x => h`
          <div class="check-row is-bad">
            <span class="check-ico">${ICO.alert}</span>
            <span class="check-text">${x.badText}</span>
            <button class="btn btn-sm btn-outline" data-act="${x.act}" data-val="${isUnified() ? 'credits' : 'sms'}">${x.cta}</button>
          </div>`).join('')}
      </div>` : ''}
  </section>`;
}

function smsNotSubscribed() {
  // A vendor that has never subscribed has no number, no credits and no card, so
  // every card below would describe things that do not exist — "your credits are
  // frozen" to someone who has none, a number they were never issued.
  return h`
    <section class="section-card">
      <div class="section-head"><div>
        <div class="section-title">SMS is part of the Shopcord plan</div>
        <div class="section-desc">Subscribe to get your sending number and start buying message packs.</div>
      </div>${isMerged() ? '' : '<button class="btn btn-primary" data-tab="billing">See the plan</button>'}</div>
    </section>`;
}

function smsGateAndCredits() {
  const c = sc().credits;
  return h`
    ${sendingStatusCard()}

    ${isUnified()
      ? (() => { const u = unifiedTotals(c); return balanceCardUnified(u.remaining, u.reserved); })()
      : h`<div class="balance-grid">
            ${balanceCard('SMS', c.sms, c.smsRes, Math.max(c.sms, c.mms))}
            ${balanceCard('MMS', c.mms, c.mmsRes, Math.max(c.sms, c.mms))}
          </div>`}


    ${S.packOpen ? inlinePackPurchase() : ''}`;
}

/* Expands inline under the balance grid: it attaches to the reserved figure that
   is already on the page, so by the container rule it is neither a modal nor a
   drawer. Read-only — cancelling a scheduled campaign belongs to the campaign
   screen, and returning the credits is that screen's job (통합 v0.6 §7.5). */
function purchaseHistorySection() {
  return h`
    <section class="section-card">
      <div class="section-head"><div>
        <div class="section-title">Purchase history</div>
        <!-- No "Go to billing history →" link: no doc asks for one, and the tab it
             points at is in the tab bar above. The sentence already tells the vendor
             the receipts are there, which is the part worth saying. -->
        <div class="section-desc">Every pack you've bought. Receipts also appear in Subscription.</div>
      </div></div>
      <div class="tbl-scroll">
        <table class="tbl">
          <thead><tr><th style="width:130px">Date</th><th>Pack</th><th style="width:140px">Purchased</th><th style="width:110px;text-align:right">Amount</th><th style="width:150px">Card</th><th style="width:110px">Receipt</th></tr></thead>
          <tbody>${PURCHASES.map(p => h`
            <tr>
              <td class="t-muted">${p.date}</td>
              <td class="t-strong">${p.pack}</td>
              <td class="t-muted">${p.how}</td>
              <td class="t-num t-strong">${p.amt}</td>
              <td class="t-muted">${p.card}</td>
              <td><a class="receipt-link" href="#" data-act="receipt">${ICO.ext}Receipt</a></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </section>`;
}

function usageHistorySection() {
  return h`
    <section class="section-card">
      <div class="section-head"><div>
        <div class="section-title">Usage history</div>
        <div class="section-desc">What used your credits — this is consumption, not money charged.</div>
      </div>
      <select class="select"><option>All sources</option><option>Campaigns</option><option>1:1 chat</option></select>
      </div>
      <div class="tbl-scroll">
        <table class="tbl">
          <thead><tr><th style="width:130px">Date</th><th>Source</th><th style="width:90px">Type</th><th style="width:110px;text-align:right">Credits</th></tr></thead>
          <tbody>${USAGE.map(u => h`
            <tr><td class="t-muted">${u.date}</td><td>${u.src}</td><td class="t-muted">${u.type}</td><td class="t-num t-strong">${u.used}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </section>`;
}

// 5-tab layout: SMS Settings owns the whole SMS story, so it keeps both of its own
// history tables. Merged, those two collapse — Purchase history into Billing history,
// Usage history into the segmented history region. See mergedBillingBody().
function creditsBody() {
  if (sc().sub === 'free') return smsNotSubscribed();
  return smsGateAndCredits() + purchaseHistorySection() + usageHistorySection();
}

/* 4-tab layout (PRD §3.1–3.2's documented structure) — SMS folded into
   Subscription.

   Folding two tabs into one page is only worth doing if the result reads as FEWER
   things, not the same seven stacked in a longer column. So the tab is three named
   groups, and every card belongs to exactly one of them:

     Shopcord subscription — what you pay for the platform. The group head carries
                             the status pill and Cancel/Resume, so the card inside
                             is just plan, price, dates and billed-to.
     SMS                   — the number, the credits, auto-recharge. One subject:
                             what sends and what it draws from.
     Billing               — the card pool and the history. Both belong here because
                             both are about money moving, and the card pool serves
                             the subscription and the packs equally (§4.1).

   Two consequences worth stating. Purchase history is DROPPED, not moved: Billing
   history already carries every pack row with the same receipts. And Usage history
   is not a fourth section — it is the second view of the history region, behind a
   Charges / SMS usage switch, so the money story and the credit story share a place
   without ever sharing a screen. */
function mergedBillingBody() {
  const s = sc();
  const subscribed = s.sub !== 'free';

  /* §3.4's "three stacked sections" are the CARDS, not groups of cards — Section 1
     Subscription, Section 2 Payment methods, Section 3 Billing history, which is
     exactly what the 5-tab billing tab renders. So merged, the honest structure is
     the doc's three sections plus SMS, and the only thing needing a group header is
     SMS, because it is the only one that holds several cards.

     An earlier version wrapped all three in invented groups named Subscription /
     SMS / Billing. Grace: "청구내역이 결국 빌링이잖아?" — right, and worse, "Billing"
     collided with the tab's own name while containing the billing history. Gone.

     Usage history moves into SMS rather than living behind a switch on the history
     card: §12.3.3 is charges, 통합 v0.6 §7.6's usage history belongs to the credit
     dashboard, and this puts each where its own doc says it goes. */
  const smsGroup = h`
    <div class="group">
      <div class="group-head">
        <div>
          <div class="group-title">SMS</div>
          <div class="group-desc">${subscribed
            ? 'Your sending number, the credits it draws from, and what used them.'
            : 'Included once you subscribe.'}</div>
        </div>
      </div>
      <div class="group-body">${subscribed
        ? smsGateAndCredits() + usageHistorySection()
        : smsNotSubscribed()}</div>
    </div>`;

  return subscriptionSection() + smsGroup + paymentMethodsSection() + billingHistorySection();
}

// ── Screen: Campaign send ───────────────────────────────────────────────────
// Campaign send — rebuilt on the real Phase 1 screen (Figma 3202:22463).
// Phase 2.5 only changes two things on it: the cost line becomes counts, and
// Send Time gains the credit-reservation disclosure.
function screenCampaign() {
  const s = sc();
  const need = s.recipients;
  const have = s.credits.sms;
  const short = Math.max(0, need - have);
  const scheduled = S.sendWhen === 'later';

  // The cost line already exists on this screen — it becomes the pre-send check
  // so the shortfall is known before Send is ever pressed.
  const unitWord = isUnified() ? 'credit' : 'SMS';
  /* An ESTIMATE, and the docs say so: 통합 v0.6 §7.5 writes the pre-send line as "This campaign
     will use ~1,000 SMS credits" and Handoff §6 quotes the same tilde. The screen was
     stating it as an exact sum, which promises a number the send cannot guarantee —
     recipient lists move between here and the send. The arithmetic stays, because it
     explains where the figure comes from; "about" is what it needs in front of it. */
  const costLine = short === 0
    ? h`<div class="cost-line ok">About <strong>${n(need)} ${isUnified() ? 'credits' : 'SMS'}</strong> — ${n(need)} recipients × 1 ${unitWord} · about ${n(have - need)} left after sending</div>`
    : h`<div class="cost-line short">
          <span class="cost-ico">${ICO.alert}</span>
          <div>${n(need)} recipients × 1 ${unitWord} = <strong>${n(need)} ${isUnified() ? 'credits' : 'SMS'}</strong><br>
          You have ${n(have)} — <strong>${n(short)} short.</strong> Sending will charge a top-up.</div>
        </div>`;

  return h`
  <div class="page-head">
    <div class="crumb">Campaigns / New Campaign</div>
    <div class="camp-title-row">
      <div class="page-title">Summer Collection 2026</div>
      <div class="camp-actions">
        <!-- Save Draft stays live: a draft costs nothing and 2차 PRD §5 only blocks
             sending, so locking it would destroy work the vendor already did. -->
        <button class="btn btn-secondary">Save Draft</button>
        ${isLocked()

/* Counts follow Handoff §4's example list (SMS 500 / 1,000 / 5,000, "final
   denominations TBD, design for a flexible list"). PRICES ARE PLACEHOLDERS — no doc
   carries one; 통합 v0.6 §7.5 and Handoff §6 both write the charge as "(n messages, $XX)" and
   D-11 owns pricing.
   `save: 'Save 14%'` used to ride along and was REMOVED 2026-08-24 (Grace): volume
   discounts are a D-11 item that has not been decided, so a badge stating one turns an
   open question into a promise — and in the auto-recharge editor it reads as a nudge to
   authorise a LARGER recurring charge, the incentive pattern §6-5 records us as not
   having. If D-11 lands on volume pricing, the badge comes back with a source. */
const PACKS = {
  credits: [ { c: 1000, p: '$28.00' }, { c: 5000, p: '$125.00' }, { c: 10000, p: '$230.00' } ],
  sms: [ { c: 500, p: '$17.50' }, { c: 1000, p: '$30.00' }, { c: 5000, p: '$135.00' } ],
  mms: [ { c: 500, p: '$16.00' }, { c: 1000, p: '$30.00' }, { c: 2000, p: '$55.00' } ],
};

/* The confirmation's card is the default, shown as a row of the summary box (PM request
   2026-10-05). Change opens this picker under the box: the other saved cards, and Add a
   payment method, which leaves for the card modal and comes back (§13.1). Picking a card makes
   it the default (PB 1.4.0). Nothing renders here until Change is pressed. Balance's widget
   never mounts inside the confirmation (PM, 9/22). */
function subscribeCardSlot() {
  if (S.cardStep !== 'pick') return '';
  const others = sc().cards.slice(1).map(id => CARDS[id]).filter(Boolean);
  const row = (c) => h`
        <div class="card-row">
          <span class="brand-mark ${c.cls}">${c.brand}</span>
          <div class="card-main">
            <div class="card-num"><span class="card-dots">···· ${c.last4}</span></div>
            <div class="card-sub">Expires ${c.exp}</div>
          </div>
          <button class="btn btn-sm btn-outline" data-act="subPickCard" data-val="${c.id}">Use this card</button>
        </div>`;
  return h`
      <div class="inline-form-title" style="font-size:13px;margin-top:18px;margin-bottom:8px">Change card</div>
      ${others.length ? h`<div class="pick-list">${others.map(row).join('')}</div>`
        : h`<p class="pick-note" style="margin-top:0">No other card is saved on this account.</p>`}
      <button class="btn btn-outline btn-block pick-add" data-act="subAddCard"><span class="btn-ico">${ICO.plus}</span>Add a payment method</button>
      <p class="pick-note">Whichever card you choose becomes your <strong>default card</strong>, which also pays for SMS credit purchases.</p>
      <button class="btn btn-sm btn-outline" style="margin-top:12px" data-act="cardSlotBack">Cancel</button>`;
}

function cardFields(saved) {
  /* §13.2 — Balance's widget, in the widget's own order (PM request 2026-10-05): card number,
     expiry and CVC, then the billing address with Country or region first. The real widget
     also asks for first and last name; the mockup leaves those out. A saved card shows masked
     values in non-editable boxes: the full number never reaches Shopcord (§13.2) and a card is
     not edited in place (§13.3 ⑤). */
  const f = (label, val, cls) => h`
        <div class="pg-field"><span class="pg-field-label">${label}</span>
          <div class="pg-input ${cls || ''} ${saved ? 'is-filled' : ''}">${val}</div>
        </div>`;
  const row = (a, b) => h`<div class="pg-row">${a}${b}</div>`;
  return h`
      <div class="pg-frame">
        ${f('Card number', saved ? '•••• •••• •••• ' + saved.last4 : '1234 1234 1234 1234')}
        ${row(f('Expiry', saved ? saved.exp : 'MM / YY'), f('CVC', saved ? '•••' : 'CVC'))}
        <div class="pg-group">Billing address</div>
        ${f('Country or region', 'United States', 'is-select')}
        ${f('Address line 1', saved ? '1407 Broadway' : 'Street address')}
        ${f('Address line 2', saved ? 'Suite 902' : 'Apt, suite, unit (optional)')}
        ${f('City', saved ? 'New York' : '')}
        ${row(f('State', saved ? 'NY' : '', 'is-select'), f('ZIP', saved ? '10018' : ''))}
      </div>
`;
}

/* Split out of cardFields so the slot can put a control BETWEEN the fields and this note
   (Grace, 2026-09-22): `Use a different card` belongs directly under the last field it acts
   on, not after a security footnote. */
function cardHelper(saved) {
  return h`
      <div class="helper">${ICO.lock}<span>${saved
        ? 'This is your default card, the one every Shopcord charge uses. Balance holds the full number — Shopcord never sees or stores it.'
        : 'Card details are entered directly with Balance — Shopcord never sees or stores your full card number. Your first card becomes the default.'}</span></div>`;
}

function modalAddCard() {

// Pack purchase expands INLINE under the balance grid.
// The type is always already decided by which button was pressed (Buy SMS on the
// SMS card, Buy MMS on the MMS card, or the failed/exhausted banner), so the
// SMS/MMS tab dimension the overlay version needed is gone.
/* "Which card gets charged" — used by the pack purchase, the campaign shortfall
   confirmation and the subscribe confirmation. It states the fact and stops there:
   the `Change` link that used to sit here walked the vendor out of the flow they
   were in the middle of (Grace, 2026-08-24), and §4.1 keeps card management in one
   place anyway. With NO card the row becomes the one thing that must happen first,
   and the entry modal opens over the flow instead of replacing it.
   The card is derived — the two overlay copies used to hard-code Visa ····4242. */
/* What a credit buys. This is the rule that decides everything a vendor plans — an
   MMS costs three times an SMS — so it is a component with structure, not a muted
   caption (Grace, 2026-08-24). The same strip appears on the balance card and in the
   buy flow, so the rate is in front of them when they read a balance and when they pay
   for one. Not in the docs: §7.1 says "counts, not dollars" and names no rate. */
/* The buy flow gets the rate as a BANNER, not two chips — the shape 리디 · 카카오 ·
   네이버 all use at the top of a top-up screen: an icon, one bold line, one line of
   explanation. Chips were fine as a footnote on the balance card, but at the moment of
   paying, the rate is the thing that decides which pack is enough, so it gets a block
   of its own (Grace, 2026-08-24). */
function creditRateBanner() {
  return h`
    <div class="rate-banner">
      <span class="rate-banner-ico">${ICO.msg}</span>
      <div>
        <div class="rate-banner-title">SMS <strong>1 credit</strong> · MMS <strong>${MMS_CREDITS} credits</strong></div>
        <div class="rate-banner-sub">One pool for both, counted in messages — not dollar amounts.</div>
      </div>
    </div>`;
}

function creditRateStrip() {
  return h`
    <div class="rate-strip">
      <span class="rate-chip">SMS <strong>1 credit</strong></span>
      <span class="rate-chip">MMS <strong>${MMS_CREDITS} credits</strong></span>
    </div>`;
}

function payWithRow() {
  const def = CARDS[sc().cards[0]];
  /* With a card this is a STATEMENT — so it stops looking like a control. The bordered
     row survived the removal of its "Change" link and still read as clickable, which is
     worse than before: it invites a press that does nothing (Grace, 2026-08-24). A
     caption line can't make that promise. Without a card there IS something to do, so
     that variant keeps a box and a button — the contrast is the point. */
  return def ? h`
      <div class="pay-with-line">
        <span class="brand-mark ${def.cls}">${def.brand}</span>
        <!-- The brand mark to the left already says Visa, so the word doesn't (Grace,
             2026-08-24). Only here: everywhere without an icon — history rows, toasts,
             banners, §3.4's own "Billed to Visa ····4242" — keeps the brand name. -->
        <span>Charged to your default card, <strong>ending ····${def.last4}</strong></span>
      </div>` : h`
      <div class="pay-with is-empty">
        <span class="pay-with-ico">${ICO.alert}</span>
        <div style="flex:1">
          <div class="t-strong" style="font-size:13px">No card on file</div>
          <div class="foot-note">Add one and it becomes your default.</div>
        </div>
        <button class="btn btn-sm btn-primary" data-act="addCard">Add a payment method</button>
      </div>`;
}

function inlinePackPurchase() {
  const type = S.packType;
  const packs = PACKS[type];
  const sel = packs[S.packSel];
  const c = sc().credits;
  const cur = type === 'credits' ? unifiedTotals(c).remaining : (type === 'sms' ? c.sms : c.mms);
  const unit = type === 'credits' ? 'credits' : `${type.toUpperCase()} messages`;
  const heading = type === 'credits' ? 'Buy message credits' : `Buy ${type.toUpperCase()} messages`;

  return h`
  <section class="section-card inline-buy" id="pack-form">
    <div class="section-head">
      <div>
        <div class="section-title">${heading}</div>
        <!-- ⚠ "They never expire while your account is open" was here and is now cut.
             the old §7.7's "credits never expire" was scoped to SUSPENSION only. Credit expiry
             in general is pending Finance (D-4), and L-1 asks outright whether credit
             expiry is even lawful and whether forfeiture is permissible. A screen
             promising "never expire" would be making a standing commitment on an open
             legal question — the same failure as "billed on the 15th", with more at
             stake. §7.1 is what can be said: counts, not dollar amounts. -->
        <!-- "Packs are message counts, not dollar amounts" (§7.1) moved into the
             banner below, which says the same thing with the rate attached. Two
             sentences about one model, one of them without the numbers, was the weaker
             half. -->
      </div>
      <button class="modal-x" data-act="packCancel">${ICO.x}</button>
    </div>

      <!-- Choice on the left, consequence on the right (Grace's layout, 2026-08-24).
           Three tiles across the top left the receipt hugging the right edge with an
           empty half beside it; side by side, picking a pack and reading what it does
           to the balance is one movement, and the prices line up in a column so they
           can be compared. Collapses to one column when the panel is narrow. -->
      ${type === 'credits' ? creditRateBanner() : ''}
      <div class="buy-body">
      <div class="pack-list" role="radiogroup" aria-label="Credit pack">
        ${packs.map((p, i) => h`
          <button class="pack-opt ${S.packSel === i ? 'is-sel' : ''}" role="radio" aria-checked="${S.packSel === i}" data-act="packSel" data-val="${i}">
            <span class="pack-radio"></span>
            <span class="pack-count">${n(p.c)} <span class="pack-unit">${unit}</span></span>
            <span class="pack-price">${p.p}</span>
          </button>`).join('')}
      </div>
      <!-- D-11 note removed from screen (8/18): a decision ID is a reviewer's
           fact, and the vendor has no use for knowing the list is provisional. The
           prototype panel carries it. -->

      <!-- Was a bordered four-row table: five rules for four facts, money and credits
           alternating down one column, and the same $125.00 stated twice because a
           single line item does not need a total row. Now the box and the internal
           dividers are gone, the balance is one before → after line instead of two
           rows, and the only rule left is the one above what actually gets charged. -->
      <div class="buy-summary">
        <div class="bs-row"><span class="lbl">${n(sel.c)} ${unit}</span><span class="t-strong">${sel.p}</span></div>
        <div class="bs-row">
          <span class="lbl">Balance</span>
          <span class="bs-change">${n(cur)}<span class="bs-arrow">→</span><strong>${n(cur + sel.c)} ${type === 'credits' ? 'credits' : type.toUpperCase()}</strong></span>
        </div>

        <div class="bs-row is-total"><span>Charged today</span><span>${sel.p}</span></div>
        ${payWithRow()}
      </div>
      </div>

    <div class="inline-form-foot">
      <button class="btn btn-outline" data-act="packCancel">Cancel</button>
      <button class="btn btn-primary" data-act="packBuy">Pay ${sel.p}</button>
    </div>
  </section>`;
}

/* Grace, 2026-09-15. Subscribing with a DECLINED default charges the card that just failed:
   §5.1 sends that to the signup-failure path, so the vendor consents, gets charged nothing,
   gets a failure mail, and is back where they started — and PB 2.3.0 has stored a consent
   record for a subscription that never existed. Better to stop one screen earlier.

   SHELL: the standard .modal (480px, head/body/foot), NOT .modal-confirm. The first build of
   this used modal-confirm because sendBlocked does — but sendBlocked is a pure MESSAGE, and
   modal-confirm is built for one: 620px wide, and `.confirm-foot .btn { flex: 1 0 0 }` makes
   a lone button span the dialog. This screen carries a LIST, so it takes the shell that holds
   content — the same one modalConfirmSubscribe uses (Grace, 9/15).
   ROWS: the product's own .card-row, brand mark and buttons, so the picker IS the Payment
   methods list with one button swapped. `Use this card` is a real btn-sm btn-outline, sitting
   where `Set as default` sits on that screen; the row itself is not clickable, because a
   button inside a button is the thing that made the first version read as broken.
   Choosing here IS changing the default (PB 1.4.0 — 즉시 반영, 이후 결제는 새 기본 카드), which
   is why the note says so: the default also pays for SMS credits (§12.3.2). */
function modalSubscribeBlocked() {
  const cards = sc().cards.map(id => CARDS[id]).filter(Boolean);
  const bad = cards[0];
  const others = cards.slice(1);
  return h`
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title">Your default card was declined</div>
        <div class="modal-sub">Subscription charges always use your default card, so this one has to change before you subscribe.</div>
      </div>
      <button class="modal-x" data-act="close">${ICO.x}</button>
    </div>
    <div class="modal-body">
      <!-- The card the message is about, drawn exactly as Payment methods draws it. Naming it
           in the sub-line as well would state one fact twice. -->
      <div class="card-row is-bad">
        <span class="brand-mark ${bad.cls}">${bad.brand}</span>
        <div class="card-main">
          <div class="card-num"><span class="card-dots">···· ${bad.last4}</span><span class="pill red">Declined</span></div>
          <div class="card-sub danger">Declined on ${failedChargeDate()}</div>
        </div>
      </div>
      ${!others.length ? '' : h`
      <div class="pick-label">Use another card</div>
      <div class="pick-list">
        ${others.map(c => h`
        <div class="card-row">
          <span class="brand-mark ${c.cls}">${c.brand}</span>
          <div class="card-main">
            <div class="card-num"><span class="card-dots">···· ${c.last4}</span></div>
            <div class="card-sub">Expires ${c.exp}</div>
          </div>
          <button class="btn btn-sm btn-outline" data-act="subPickCard" data-val="${c.id}">Use this card</button>
        </div>`).join('')}
      </div>`}
      <button class="btn btn-outline btn-block pick-add" data-act="addCard"><span class="btn-ico">${ICO.plus}</span>Add a payment method</button>
      <p class="pick-note">Whichever card you choose becomes your <strong>default card</strong>, which also pays for SMS credit purchases.</p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-act="close">Not now</button>
    </div>
  </div>`;
}

function modalRemoveCard() {
  /* Which card is going matters (Grace, 9/11). The old copy was hardcoded to a non-default
     card and always said "your subscription keeps billing to your default card" — false the
     moment the vendor removes the default one, which they can do whenever a second card
     exists. §13.3.3 makes a default change take effect immediately, so the promotion has to
     be stated here, before the removal, not discovered afterwards. The last card cannot be
     removed at all while subscribed (PB 1.5.0), so a removal always leaves one behind. */
  const ids  = sc().cards;
  const id   = S.removeId && ids.includes(S.removeId) ? S.removeId : (ids[1] || ids[0]);
  const card = CARDS[id] || CARDS.mc;
  const wasDefault = ids[0] === id;
  /* Which card inherits `default` when the default one is deleted. **PRD does not say** —
     PB 1.1.1 fixes the FIRST card as default, PB 1.4.0 covers a MANUAL change, §13.3.4 blocks
     deleting the only card, but nothing names a successor, and from three cards up there are
     two candidates. Proposed to the PM 9/13 (Gap H-25): **the oldest remaining card**, which
     is the same registration-order basis PB 1.1.1 already uses rather than a new concept.
     The list is default-first then registration order (PB 1.2.0), so that is ids[1] once the
     default is dropped — written out here so the rule is stated, not merely emergent. */
  const next = CARDS[ids.filter(x => x !== id)[0]] || CARDS.visa;
  return h`

}

/* ── Email templates ───────────────────────────────────────────────────────

   carries the same four parts: a TITLE, a one-line SUBTITLE under it, the body, and one
   uppercase CTA. PB 7.x named seven triggers for the 1st release and gave each a channel
   list and nothing else — no subject, no title, no body. This is that wording. Two more
   come from section 5: the vendor recovery invoice (PB 6.2.0 / 7.8) and the buyer
   capture-failure invoice (5.3 iii), the only thing here addressed to a buyer.

   Rules that keep them from drifting away from the screens:
   - dates come from clock(), never typed
   - every "update payment" CTA lands on Subscription and Billing (section 9.3)
   - nothing promises a consequence the docs have not settled: no due date (F-6 owns the
     basis), no dunning dates (section 10's ladder is a proposal), no consequence for a
     buyer not paying (section 10 books it AR-3 and the platform absorbs it)
   - section 12's SMS sentence is MANDATORY on both migration emails. Without it a vendor
     reads "billing moved to card" and then watches their settlement get deducted anyway. */
/* §6.3.4 — the invoice is always the REMAINDER: 상계·데빗으로 못 걷은 잔액. Three lines, never
   one, because without `Recovered from payouts` the vendor cannot see that money already came
   out of their settlement, and that is the first thing they will ask about.
   §6.4-3 — 만기 = 발행 후 7일. The due date was blank until 9/14 because it was an open finance
   question (F-6, 8/31); v2.5 closed it, and §6.6 closed the ladder that follows it too. */
/* §6.3.4 (확정 9/8) — the vendor's recovery invoice is ONE document (§6.3.2) whose LINES are
   fixed strings, one per reason, in the form 제목 - 부제 (Reference): "한 인보이스에 사유가
   여럿이면 라인을 사유별로". The PRD divides nothing into cases; it gives four line strings and
   a stacking rule. So the demo invoice carries all four reasons as four stacked lines under one
   totals block (Grace, 9/17 — "PRD에 있는대로") and every string is readable in one place. A
   real invoice usually carries fewer; a chargeback and its fee are the common pair.
   Each string is rendered as ONE line with the PRD's own punctuation, never split.
   `{case description}` in the adjustment line is the PRD's variable — the value here is ours. */
/* ONE CASE PER INVOICE (운영 확인 via Grace, 2026-09-23) — so one case per email.
   §6.3.4 gives four vendor line strings and its own sentence allows stacking them: 한 인보이스에
   사유가 여럿이면 라인을 사유별로. Operations says an invoice only ever carries one, so the demo
   stopped stacking and each case became its own mail.
   🔴 That sentence is dead in practice now and the PRD needs the correction.
   🔴 And it has a consequence worth stating: a single disputed order produces TWO invoices, the
   reversal and its fee, on the same day to the same vendor.
   Every string below is §6.3.4 verbatim — 제목 - 부제 (Reference), the PRD's own punctuation.
   Figures are demo data; the SHAPE (gross → recovered → due, §6.3.4) is the spec, and 만기 =
   발행 + 7 (§6.4-3). */
const INVOICE_CASES = {
  clawback: {
    label: 'Refund clawback', no: 'SC-10428',
    line: 'Refund clawback - Buyer refund after payout (Order #FG-88214 · Refunded Feb 02, 2027)',
    gross: '$240.00', recovered: '\u2212$189.80', due: '$50.20',
    lead: 'A buyer was refunded for an order you had already been paid for.',
  },
  chargeback: {
    label: 'Chargeback reversal', no: 'SC-10431',
    line: "Chargeback reversal - Payment reversed by buyer's card issuer (Order #FG-88302 · Dispute Feb 09, 2027)",
    /* Nothing recovered — the offset had no payout to take from. Held at zero on purpose: the
       row still renders, which makes the open question (does it show at $0?) reviewable. */
    gross: '$412.00', recovered: '$0.00', due: '$412.00',
    lead: "A buyer's card issuer reversed a payment for an order you had already been paid for.",
  },
  fee: {
    label: 'Chargeback fee', no: 'SC-10432',
    line: 'Chargeback fee - Processor fee for the dispute (Order #FG-88302)',
    gross: '$15.00', recovered: '$0.00', due: '$15.00',
    /* The ORDER-payment dispute fee (§6.3.4), NOT §7.2's subscription one — different money and
       different rules. Nothing here may borrow §7.2's 승소 미청구 / 패소 전액 회수 wording. */
    lead: 'A buyer disputed a payment on one of your orders, and the card processor charged a fee for handling it.',
  },
  adjust: {
    label: 'Settlement adjustment', no: 'SC-10433',
    /* {case description} is the PRD's VARIABLE, filled per case by whoever raises the
       adjustment. This value is ours, for the demo only. */
    line: 'Settlement adjustment - Returned items credited after payout (Settlement Feb 13, 2027)',
    gross: '$88.00', recovered: '\u2212$30.00', due: '$58.00',
    lead: 'A correction to one of your settlements left a balance to return.',
  },
};
/* The document sheet and anything not case-specific read the first case. */
const INVOICE = Object.assign({ order: '#FG-88214', refunded: 'Feb 02, 2027' }, INVOICE_CASES.clawback);
/* The buyer's single line (§6.3.4 ⑤), same rule: one string, the PRD's punctuation. Only the
   shipment NUMBER appears — 발행 시점에 총 배송 횟수를 알 수 없다 (9/9), never "Shipment 2 of 3". */
const BINVOICE_LINE = () => 'Shipping — additional charge (Order ' + BINVOICE.order + ' · Shipment ' + BINVOICE.shipment + ' · Shipped ' + BINVOICE.shipped + ')';
/* The PRD's string, character for character, with the receipt's three type voices laid over
   it (Grace, 9/17: a flat 90-character sentence per line "그저 PRD에 있는것을 구겨넣은 느낌"):
   the reason in bold, the explanation plain, the reference small and grey. Nothing is added or
   removed — the hyphen and the parentheses are the PRD's own — so the string a developer copies
   is still §6.3.4's. Splits at the FIRST " - " and the LAST " (" so a subtitle may itself
   contain a hyphen or a dash. */
function fmtInvoiceLine(str) {
  const i = str.indexOf(' - ');
  const j = str.lastIndexOf(' (');
  if (i < 0 || j < 0 || j < i) return str;
  return '<b>' + str.slice(0, i) + '</b>' + str.slice(i, j) + ' <span class="ref">' + str.slice(j + 1) + '</span>';
}
/* The BUYER's invoice (§6.3.3) — a different account (#3 collects it), a different reason
   (a shipping overage that outran the authorisation) and a different aging clock: §6.6 counts
   the buyer's from the CAPTURE FAILURE, not from issue. Its own numbers, not the vendor's. */
const BINVOICE = {
  no:       'SC-20311',
  order:    '#FG-90117',
  brand:    'Bella Boutique',
  shipment: '2',
  shipped:  'Oct 24, 2026',
  issued:   'Oct 25, 2026',

const invoiceDue = () => new Date(new Date(clock().today).getTime() + INVOICE_DUE_DAYS * 864e5)

/* §6.6 · PB 7.12 · PB 6.6.0 — the ladder AFTER the recovery invoice's due date.

   so nothing here is a deadline in the vendor's hands — it is a schedule of OUR restraints.
   Two rules the whole ladder obeys and no mail may break:
   ① §6.6-1 — order receipt, order processing, linesheets and 재구독 are NEVER blocked.

const SMS_KEEPS = "SMS isn't changing. Those fees keep coming out of your settlement as they do today, and move to a credit balance later.";

const cancelBody = (withNumber) => h`

      <div class="em-group keeps">

        charge</b>. The free trial is not available a second time.</div>

      <div class="em-hr"></div>
      <div class="em-tag">Since you're using SMS</div>
      <p>Subscribe again before <b>${numberHeldUntil()}</b> and your number
        <b>+1 (855) 240-1180</b> stays yours. After that it may be released and cannot be recovered.</p>
      ${!hasCredits() ? '' : "<p class=\"em-q\"><b>How about my SMS credits?</b> They stay in your balance, and anything held for a scheduled campaign comes back to it.</p>"}`}`;

/* One body for all three reminders. The hold clock is invisible — a cancelled vendor has

/* ── Purchase order (internal PDF) ─────────────────────────────────────────
   §5.1 splits the documents three ways: Balance auto-generates the RECEIPTS, Balance
   hosts the INVOICES, and the platform builds this one — the only document we draw, and
   the only one that is not about money moving to Shopcord.

   Structure comes from the current FashionGo PO, which §5.1's attachment spec names as
   the reference. What a Shopcord order needs from it, and what it does NOT:

   TAKEN — bordered blocks; the fact box beside the title; billing/shipping split out so
   a warehouse can read one and a bookkeeper the other; the per-line SIZE GRID (a wholesale
   line is a matrix, not a row); a total-quantity block; a buyer's own PO number, which is
   how a wholesale buyer files it on their side.

   DROPPED — FG's discount stack (Collection Promotion, Redeemed Rewards, FG Coupon
   Discount, Store Credit). Those are FashionGo MARKETPLACE mechanics; a Shopcord order is
   a vendor's own linesheet sold to their own buyer, and the 8/28 spec asks for exactly
   Subtotal · Discount · Total. Printing empty promotion lines would advertise machinery
   that does not exist. The barcode goes too — that is FG's fulfilment infrastructure and
   inventing a symbology would be inventing.

   ADDED, because a Shopcord order has them and an FG order does not — LINESHEET NAME (an
   order comes from one) and ORDER STATUS as of issue, both named in the 8/28 spec.

   PACK NOTATION is where the two genuinely differ. FG lists flat per-size quantities;
   Shopcord sells packs, so the spec writes "S-M-L 1-2-1" with a pack count. Both are
   shown: the grid gives the per-size totals a warehouse picks against, the pack line gives
   the arithmetic they came from. */
/* No description field: the 8/28 spec ③ writes "Item Name/Description", but the
   description is not needed (Grace, 8/28) — logged as a deviation. The style number
   identifies the item and the buyer picked it off a linesheet that carried the detail. */
const PO_LINES = [
  { style: 'BB-1042', item: 'Linen Camp Shirt',
    sizes: ['S','M','L'], pack: '1-2-1', unit: 21.50,
    colors: [ { c: 'Ecru',  packs: 6, q: [6,12,6] },
              { c: 'Sage',  packs: 4, q: [4, 8,4] } ] },
  { style: 'BB-2210', item: 'Wide-Leg Trouser',
    sizes: ['S','M','L','XL'], pack: '1-2-2-1', unit: 34.00,
    colors: [ { c: 'Black', packs: 5, q: [5,10,10,5] } ] },
  { style: 'BB-0788', item: 'Ribbed Knit Tank',
    sizes: ['S','M','L'], pack: '2-2-2', unit: 12.00,
    colors: [ { c: 'Butter', packs: 3, q: [6,6,6] } ] },
  /* OPEN PACK. A pre-pack is bought as a fixed assortment, so its per-size counts are
     the ratio times the pack count and one row per colourway says everything. Open stock
     is picked size by size, and those quantities CANNOT be derived from anything — so an
     open line gets a row per size, or the document loses what was actually ordered. */
  { style: 'BB-3310', item: 'Cropped Cardigan', open: true,
    sizes: ['S','M','L'], unit: 28.00,
    colors: [ { c: 'Oat', q: [4, 7, 3] } ] },
];
/* NO shipping amount on the PO. PRD v2.1 §15 fixes the document's unit — "오더 단위,
   상품 금액까지만 — 배송비·결제 진행 상태는 담지 않는다" — because shipping is settled per
   SHIPMENT and its receipt is Balance's, per capture. The notice sentence stays (§15 ④):
   it is what explains the absence. Reverses the 8/28 decision to print the amount entered
   at order confirmation. */
/* A seasonal linesheet is usually sold as a PRE-ORDER with a delivery window, and then the
   buyer's first question is when it lands. It rides the header rather than the item table
   because it belongs to the order, and because a tenth column would squeeze the item name
   to nothing. Set to null for an in-stock order and the row disappears. */
const PO_PREORDER = 'Mar 15, 2027';
/* NO shipping-info field (Grace, 8/28). It came from FG's PO, not from the 8/28 spec, and
   a PO is not a shipping document: it records what was ordered and agreed, while carrier
   and tracking are later events that packing slips and shipment notices carry. At issue
   the field is empty by definition — §5.3 iii charges shipping per shipment, after the
   fact — so keeping it would be the "set at shipment" problem moved up a level, the field
   itself admitting it has nothing. The buyer's timing question is answered by the
   Delivery row in the header instead.
   Reversible: if Gap G-2e lands on "generated on demand", a re-issued PO could carry
   tracking and the field earns its place. */
const money = (v) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const lineQty = (l) => l.colors.reduce((a, c) => a + c.q.reduce((x, y) => x + y, 0), 0);

/* ── Settlement statement ──────────────────────────────────────────────────
   Design from Figma 326:823258 — the PDF settlement already sends. It is not a document
   Payment & Billing owns, and it is here because **this release changes it**: the whole
   point of §12's double-collection block is which of these adjustment lines survives.

   Today the statement deducts BOTH the subscription fee and SMS overcharges from the
   vendor's payout. §12 blocks only the subscription adjustment type at the 1st cutover
   and says the SMS one must **absolutely not** be touched, because it is the only way SMS
   is collected during the transition. The 2nd cutover blocks SMS as well (2nd PRD §6).
   So the same document has three states, and the release switch shows them.

   `until` = the last release in which the line still appears. Everything is computed:
   the reference's own figures do not reconcile (its four adjustments sum to 63.40 above a
   stated 53.40, and 1,780.00 − 53.40 is 1,726.60 rather than the 1,726.00 printed), which
   is exactly why ours are added up rather than typed.
   Signs are also made explicit here: fees deduct, credits add back. The reference prints
   every line with a minus including the credits, which is either a display bug or a
   different meaning — worth asking settlement, and not worth copying blind. */
const SETTLE = {
  no: 'STM-39949020101-001',
  orders: 1780.00,
  refunds: 0,
  adj: [
    { k: 'Subscription Fee',      v: -Number(PLAN.price.replace('$','')), until: 0,
      why: 'Blocked at the 1st cutover — the subscription is charged to the card from then (PB 9.5.0)' },
    { k: 'SMS Overcharge Fee',    v: -14.40, until: 1,
      why: 'Kept through release 1 on purpose: §12 calls this the only way SMS is collected during the transition' },
    { k: 'SMS Overcharge Credit', v:  10.00, until: 1,
      why: 'Same adjustment type as the fee, so it leaves with it at the 2nd cutover' },
    { k: 'Credit',                v:  0,     until: 9,
      why: 'Not a Phase 2.5 line — a general settlement credit, unaffected by either cutover' },
  ],
};
const settleRel = () => isR1() ? 1 : 2;
const settleVisible = () => SETTLE.adj.filter(a => settleRel() <= a.until);
const signed = (v) => (v < 0 ? '-' : '') + money(Math.abs(v));

function docSettlement() {
  const rows = settleVisible();
  const adjTotal = rows.reduce((a, r) => a + r.v, 0);
  const total = SETTLE.orders + SETTLE.refunds + adjTotal;
  return h`
  <div class="sheet"><div class="stmt">
    <div class="stmt-top">
      <div>
        <div class="stmt-title">Settlement Statement</div>
        <div class="stmt-no">Statement No. ${SETTLE.no}</div>
      </div>
      <div>
        <div class="stmt-brand">Shopcord</div>
        <div class="stmt-gen">Generated on ${clock().today}</div>
      </div>
    </div>

    <div class="stmt-card">
      <div class="stmt-cols">
        <div>
          <div class="stmt-k">Vendor</div>
          <div class="stmt-name">Bella Boutique LLC</div>
          <div class="stmt-line">1407 Broadway, Suite 902<br>New York, NY 10018<br>United States</div>
          <div class="stmt-gap stmt-line">billing@bellaboutique.com</div>
          <div class="stmt-line">+1 (212) 555 - 0148</div>
        </div>
        <div>
          <div class="stmt-k">Settlement Date</div>
          <div class="stmt-date">${clock().today}</div>
        </div>
      </div>

      <div class="stmt-sum-k">Summary</div>
      <div class="stmt-row"><span>Total Orders</span><span>${money(SETTLE.orders)}</span></div>
      <div class="stmt-row"><span>Total Refunds</span><span>${money(SETTLE.refunds)}</span></div>
      <div class="stmt-row"><span>Total Adjustments</span><span>${signed(adjTotal)}</span></div>
      ${rows.map(r => h`
        <div class="stmt-sub"><span>${r.k}</span><span>${signed(r.v)}</span></div>`).join('')}
      <div class="stmt-total"><span>Total</span><span>${money(total)}</span></div>
    </div>
  </div></div>`;
}

/* The panel view: the statement, then what the two cutovers take out of it. */
function docSettlementPanel() {
  const gone = SETTLE.adj.filter(a => settleRel() > a.until);
  return h`
  ${docSettlement()}
  <div class="ref-card" style="margin-top:28px">
    <div class="ref-warn">
      <div><b>Settlement owns this document — we change what is on it.</b> Nothing here is a redesign; the layout is
        the statement settlement already sends. What Phase 2.5 does is remove adjustment lines from it, one cutover
        at a time, and getting that wrong in either direction is the incident §12 was written to prevent.</div>
    </div>

    <div class="ref-sec">
      <div class="ref-k">What each cutover removes</div>
      <div class="ref-v">
        <table class="ref-tbl">
          <thead><tr><th>Line</th><th>What happens to it</th><th>Basis</th></tr></thead>
          <tbody>
            ${SETTLE.adj.map(a => h`
            <tr><td>${a.k}</td><td>${a.why}</td><td>${a.until === 0 ? '§12 · PB 9.5.0' : a.until === 1 ? '§12 · 2nd §6' : '—'}</td></tr>`).join('')}
          </tbody>
        </table>
        <div class="ref-src">Showing the 1st release — ${gone.length ? gone.map(g => g.k).join(', ') + ' already removed' : 'nothing removed yet'}. The 2nd cutover removes the SMS lines as well; that state is in the full build.</div>
      </div>
    </div>

    <div class="ref-sec">
      <div class="ref-k">Why the SMS line has to survive release 1</div>
      <div class="ref-v">§12 is unusually blunt about it — the SMS adjustment type is <b>"과도기 동안 SMS 요금의 유일한
        수금 수단"</b>, and blocking it by mistake is an incident where SMS fees simply cannot be collected. The
        requirement it produces is a build requirement, not a screen one: <b>the two adjustment types must be blockable
        individually</b>.
        <div class="ref-src">§12 · PB 9.5.0</div>
      </div>
    </div>

    <div class="ref-sec">
      <div class="ref-k">This is also where §12's mandatory sentence is proved</div>
      <div class="ref-v">The launch communication has to say <b>"SMS 요금은 당분간 기존처럼 정산에서 차감"</b>. This
        statement is where a vendor sees whether that is true — subscription gone from the payout, SMS still there.
        The same sentence is in both migration emails as <code>SMS_KEEPS</code>.
        <div class="ref-src">§12 · PB 7.9 · PB 7.10</div>
      </div>
    </div>

    <div class="ref-sec">
      <div class="ref-k">The reference's own figures do not reconcile</div>
      <div class="ref-v">In Figma 326:823258 the four adjustments sum to <b>63.40</b> under a stated
        <b>53.40</b>, and <b>1,780.00 − 53.40 = 1,726.60</b>, not the <b>1,726.00</b> printed. Ours are computed from
        the lines, so the same drift cannot happen — but the reference is worth checking with settlement in case the
        display, not the demo data, is what is wrong.</div>
    </div>
  </div>`;
}

/* ── Payment receipt ───────────────────────────────────────────────────────
   Balance renders the real document, so this is not a visual template to hand them. It
   is the FIELD LIST arranged the way a receipt arranges fields, because that is the form
   in which "these must be present" is reviewable — a list of field names hides whether
   the document would make sense. */

/* Billing periods run from the charge, not the calendar — §6.3 anchors on the signup
   date, so "October" is never the right label. Charge day → the day before the next. */
function periodFrom(dateStr) {
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const m = /^([A-Za-z]{3}) (\d{1,2}), (\d{4})$/.exec(dateStr || '');
  if (!m) return '—';
  const mi = M.indexOf(m[1]), d = Number(m[2]), y = Number(m[3]);
  /* The period ends the day BEFORE the next charge. For a charge on the 1st that day is
     the last of the SAME month — it does not roll into the next one. The old version
     always advanced the month and so produced "Oct 1 — Nov 31" the moment the anniversary
     moved to the 1st; a date that does not exist, on a document a buyer keeps. */
  const dim = [31,28,31,30,31,30,31,31,30,31,30,31];
  const em = d > 1 ? (mi + 1) % 12 : mi;
  const ey = (d > 1 && em === 0) ? y + 1 : y;
  const ed = d > 1 ? d - 1 : dim[mi];
  return `${m[1]} ${d}, ${y} — ${M[em]} ${ed}, ${ey}`;
}

      on time</b>, even if it clears afterwards.${buyer ? '' : ' Paying this stops the automatic debit attempts; anything recovered from your payouts in the meantime comes off the balance.'}</div>
  </div>`;
}

const rcptRow = () => S.receiptRow || { date: clock().first, amt: PLAN.price, type: 'Subscription' };
