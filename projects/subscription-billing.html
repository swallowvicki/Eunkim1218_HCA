// `expSoon` is gone from the signature: both expiry states now come from the card's
// own date (§4.4), so the row is judged in one place. The scenario flag survives
// only on the banner, which needs a concrete "in 24 days" that a month can't give.
function fmtCardRow(c, { isDefault, onlyCard, bad, isNew }) {
  const badge = isDefault ? '<span class="pill solid">Default</span>' : '';
  /* v2.5 §4.3.2 · PB 1.2.0/1.6.0 — the expiry ladder is gone. No derived `EXPIRE_SOON`
     or `EXPIRED` state, no badge, no sentence, no advance email. A card whose stored
     expiry has passed shows **the date in red and nothing else**, and it does so on
     EVERY card rather than only the default one.
     Why (§4.3.4): the issuer may already have renewed it, so asserting that the card is
     dead would be a false alarm. The vendor's real moment is a decline, and §5 speaks
     then. The red date is a quiet hint for whoever came to this screen anyway.
     It clears itself when the card is replaced or when Balance sends a card-update
     notice carrying a new expiry (issuer auto-renewal included). */
  const expPast = cardExpiry(c) === 'expired';
  let sub = expPast ? `Expires <span class="exp-past">${c.exp}</span>` : `Expires ${c.exp}`;
  let subCls = '';
  // Declined is a stored state (§4.3.1), not a derived one, so it survives the ladder's
  // removal. The date moved with the clock on 9/8; it was hardcoded to 'Aug 15' before.
  if (bad && isDefault) { sub = `Declined on ${failedChargeDate()} — update this card to restore billing`; subCls = 'danger'; }
  const stateBadge = (bad && isDefault) ? '<span class="pill red">Declined</span>' : '';
  /* Role is checked before the only-card rule. Both can be true at once, and a sub account
     gets no button either way (Grace, 9/11) — so the role branch returns nothing at all,
     while the only-card branch still renders a disabled button with its reason. Permission
     removes the control; state disables it. */
  const removeBtn = !isMaster()
    ? ''
    : onlyCard
    ? h`<span class="tip">
          <button class="btn btn-sm btn-ghost" disabled>Remove</button>
          <span class="tip-bubble">This is the only card on file for your subscription. Add another card before removing it.</span>
        </span>`
    : `<button class="btn btn-sm btn-danger-ghost" data-act="removeCard" data-val="${c.id}">Remove</button>`;

  return h`
  <!-- Only a DECLINE marks the row now. A past expiry is not a failure in v2.5 — the
       charge is still attempted — so it no longer paints the row red (§4.3.2 · §5.4). -->
  <div class="card-row ${isDefault ? 'is-default' : ''} ${(bad && isDefault) ? 'is-bad' : ''} ${isNew ? 'is-new' : ''}">
    <span class="brand-mark ${c.cls}">${c.brand}</span>
    <div class="card-main">
      <div class="card-num">
        <span class="card-dots">···· ${c.last4}</span>
        ${badge}${stateBadge}
      </div>
      <div class="card-sub ${subCls}">${sub}</div>
    </div>
    <div class="card-actions">
      ${isDefault ? '' : (isMaster()
        ? `<button class="btn btn-sm btn-outline" data-act="setDefault" data-val="${c.id}">Set as default</button>`
        : '')}
      ${removeBtn}
    </div>
  </div>`;
}

// ── Subscription ────────────────────────────────────────────────
/* Status pill and primary action live outside the card body because both layouts
   need them in a different place — the 5-tab layout in the card's own head, the
   4-tab layout in the group head above it. Computing them in one function keeps the
   two from drifting apart. Pill vocabulary is §4.2's status set. */
/* PRD v2.1 (8/27) retired three of the states this file used to switch on. Rather than
   patch every condition, the new model lives in these helpers and the call sites read
   from them — a retired state can then only come back by someone reintroducing it here.

   Subscription states are now exactly four: none · active · past_due · canceled.
     - the free period is a PLAN, not a state (§3.2)
     - CANCELLING is a scheduled-cancellation FLAG on an active subscription (§3.5)
     - there is no suspended state at all (§4.1 · §5.5); a card failure sits in past_due
       for a 7-day grace and is auto-cancelled on day 7 */
/* v2.5 §3.2 splits one v2.1 concept in two, and they are not degrees of the same thing:
     Free 플랜  — the default tier every vendor is on from signup. No card, no billing,
                  never ends. Subscription state is `free` (v2.1 called it `free`).
     무료 체험  — an attribute of the PAID plan. State is `active`, the plan IS the paid
                  plan, nothing is billed until it ends, once per vendor. */
/* The free grant expires 90 days from issue (진아 §3 · Jinah B-4). Declared here because
   the subscribe modal still names it; it was lost when MASTER_ONLY was dismantled on 9/11
   and the reference survived — harmless only because hasCredits() is false in release 1. */
const FREE_CREDIT_DAYS = 90;

/* The SMS number is HELD, not deleted, for 3 months after a subscription ends — resume
   inside that window and the vendor keeps it. Release 1 draws no SMS surface, so these
   render nothing here; they exist so the cancellation and release-reminder emails read the
   same in every build. **3 months is confirmed** (Grace, 2026-09-14) but still written in no PRD, so it
   needs adding. The copy says held-until rather than deleted-on because a permanent
   deletion is a promise we cannot keep on the carrier's behalf. */
const NUMBER_HOLD_MONTHS = 3;
const plusMonths = (dateStr, months) => {
  const d = new Date(dateStr); const day = d.getDate();
  d.setMonth(d.getMonth() + months);
  if (d.getDate() < day) d.setDate(0);   // Jan 31 + 1 month → Feb 28, not Mar 3
  return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
};
const numberHeldUntil = () => plusMonths(sc().endedAt || clock().next, NUMBER_HOLD_MONTHS);
/* A vendor may never have finished SMS onboarding, so holding a number is its own condition
   and not the same as "release 2 exists" (Grace, 9/14). Scenarios opt out with
   smsNumber: false; everything with an SMS surface holds one by default. */
const hasNumber = () => hasCredits() && sc().smsNumber !== false;

const isFreeTier    = () => sc().sub === 'free';
const isTrial       = () => !!sc().trial;
const cancelAt      = () => sc().cancelAt || null;
/* v2.5 §5.1 collapsed 8/27's three classes into a single question: **was it insufficient
   funds or not.**
     funds  — the card said insufficient funds. Grace 7 days AND a daily retry (max 7).
     other  — every other decline: limit, cancelled, stolen, invalid, past its expiry.
              Same grace, same notices, **no retry at all** — updating the card is the
              only way out, and that update charges immediately.
   The third v2.1 class is gone rather than renamed: a PG timeout or a server fault
   "벤더 상태·알림에 영향을 주지 않는다" (§5.1), so it never reaches past_due and never
   reaches this screen. FG's existing server-error handling owns it. */
const failKind      = () => sc().fail || null;                 // 'funds' | 'other'
const inGrace       = () => sc().sub === 'past_due' && !!failKind();
const graceLeft     = () => sc().graceLeft || 0;
/* The day the grace runs out: §5.5.1 counts SEVEN DAYS FROM THE FAILED CHARGE, not from
   today — which is why Grace's copy says Oct 21 for an Oct 14 failure (9/8). Deriving it
   from today + graceLeft() gave Oct 30 and quietly contradicted the charge date printed
   one line above it. The `graceLeft` countdown in the title stays scenario data: it is how
   the panel shows D0 / D+2 / D+5 against a fixed demo clock. */
const GRACE_DAYS    = 7;
const graceEnd      = () => new Date(new Date(failedChargeDate()).getTime() + GRACE_DAYS * 864e5)
  .toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
/* §4.2 — paid features are available in {active, past_due}. Grace KEEPS the service
   (§5.2), which is the whole point of it; only `canceled` and `free` lose anything. */
const paidOn        = () => sc().sub === 'active' || sc().sub === 'past_due';
// §7.1 — cancelled by a chargeback: resubscribing is blocked until it is resolved.
const isChargeback  = () => !!sc().chargeback;
/* §3.5 재구독: coming back from `canceled` runs the NEW subscription flow — same modal,
   same consent, immediate first charge, new cycle from today. The one thing it must not
   repeat is the welcome grant: 3,000 credits are a one-time grant at the FIRST
   subscription (meeting 2026-08-24), so a returning vendor has already had them. */
const isResubscribe = () => sc().sub === 'canceled';
/* PB 1.8.0 — 결제는 항상 기본 카드에만, 실패해도 다른 카드를 자동으로 시도하지 않는다. So a
   DECLINED default is not a warning, it is a blocker: the charge we are about to ask consent
   for would go to the card that just failed. DECLINED can only ever mark the default (there
   is no backup card), which is why the check is `cards[0]` and not a search. */
const defaultDeclined = () => !!sc().cardBad && sc().cards.length > 0;
/* §3.2.2 ⑦ — 부여 판정은 과거 체험 이력으로 한다. In production that is a lookup; here it is a
   demo flag, because both shapes of the confirmation screen have to be reviewable. 재구독 can
   never qualify (§3.5 · §3.2.2 ⑦ — 이력이 있으면 구독 시점에 즉시 첫 결제), so the state is
   guarded rather than trusted. */
const trialOffered = () => !!S.trialOffer && !isResubscribe();

/* §12.3.1.2 asks for the subscription status, and §4.2 names four: none / active /
   past_due / canceled. Only two of those had badges that used the state's own word.
   `Payment failed` and `Payment retrying` were mine — one enum value (past_due) shown
   under two invented names, split by cause. Removed 9/1 (Grace).

   past_due now carries no badge. It is the honest reading of the two rules that meet
   here: §4.2 keeps paid features running in {active, past_due}, so nothing is switched
   off to announce, and §5.1 · PB 5.2.0 say the server-error half is 벤더 무통보 — a badge
   there was telling the vendor the one thing the doc says not to tell them. The card
   half still has the failure banner (§16 assigns it that channel), which is where the
   deadline and the fix live. */
/* Two badges, both §4.2 words. past_due reads Active (Grace, 9/2): §4.2 keeps paid
   features running in {active, past_due}, so from the vendor's side the service IS
   active — the badge states service status, the failure banner states the problem. It
   also closes the 무통보 question for the server-error half: Active + nothing is exactly
   what §5.1 · PB 5.2.0 ask for. */
function subPill() {
  /* §4.2's own words for its own states. `free` joined them in v2.5 — it is a real state
     now (the default tier), not the absence of one, so the section carries a badge where
     it used to carry nothing. Grace's rule still holds: the badge says the STATE, never
     the cause (past_due reads Active, because §4.2 keeps paid features running). */
  if (sc().sub === 'canceled') return '<span class="pill gray">Canceled</span>';
  if (sc().sub === 'free')     return '<span class="pill gray">Free</span>';
  return '<span class="pill green">Active</span>';
}

/* §3.4 and Handoff §2A ask for cancel AND resume. They are two states of one
   control, not two controls. Suspension leaves the slot empty on purpose: the danger
   banner already owns Update payment, and offering Cancel mid-recovery would be
   pointing at the exit while the vendor is trying to come back. */
function subActionBtn() {
  /* §12.4-1 · PB 1.9.0 (확정 9/9) — 구독·해지·재개 API = MASTER 전용. Every branch below is one
     of those three, so a SUB account gets NOTHING here: permission removes the control, it
     does not disable it — the same rule the card rows have followed since 9/11. This guard
     was missing until 9/15, so `Cancel subscription` rendered for a SUB while every card
     button beside it was correctly hidden. */
  if (!isMaster()) return '';
  /* §3.5 splits the way back into two rows, and they are not one control in two states:

       재개 (해지 철회)   — "기간이 끝나기 전까지만 가능 … 추가 결제 없이 그대로 이용"
                          (PB 2.7.0: "재개 = 플래그 해제 (무결제 복귀)")
       canceled 후 재구독 — "신규 구독 플로우 · 데이터 유지 · Free 플랜 미적용 ·
                          재구독 시점부터 새 주기, 즉시 첫 결제" (§5.5.3, PB 2.7.0)

     Resume used to serve both, which made the two look like one button with two outcomes:
     a free return and a $20 charge. Worse, it skipped §14.2 — no 확인 화면 and no
     "I Consent", so the new cycle started with no consent record, and PB 2.3.0 makes that
     record the chargeback evidence. So `canceled` now gets Subscribe, §14.1.3's own name
     for the Subscription tab's standing entry point, and it enters §14.2 whole. Resume stays with
     the scheduled cancellation, which is the only case the doc gives it to.
     In grace the vendor CAN still cancel (§5.2) and the banner already carries Update
     payment, so that slot keeps Cancel rather than duplicating the fix. */
  /* §7.1 — after a chargeback the entry point is the one that gets blocked: §7.1.2's
     words are "재구독 차단", and re-subscribing is now literally what this button does.
     Disabled rather than hidden, because §7.1.2 asks for the block to be SHOWN, with its
     own clause as the reason.
     v2.5 §7.4-2 (확정 9/9) finally gives that reason: 승소 → 자금 복귀 즉시 해제 · 패소 →
     회수 인보이스 결제가 확인된 뒤 해제 · **새 카드 등록만으로는 풀지 않는다**. That last clause
     is exactly what a vendor tries first, so the tooltip says it. Until 9/15 this button
     carried no reason at all, on a comment that predated the ruling. */
  if (isChargeback())
    return h`<span class="tip" data-block="chargeback">
      <button class="btn btn-primary" disabled>Subscribe</button>
      <span class="tip-bubble">Resubscribing is blocked while the chargeback is open. It lifts when the dispute resolves in your favour, or when the recovery invoice for it is paid. Adding a new card does not lift it.</span>
    </span>`;
  /* Grace, 9/15 — a DECLINED default blocks the same button, for a different reason:
     PB 1.8.0 charges the default and never falls back, so subscribing would charge the card
     that just failed (§5.1 → the signup-failure path, and PB 2.3.0 would store a consent
     record for a subscription that never started).
     Disabled rather than a blocker modal, because THE FIX IS ON THIS SCREEN — the card list
     with `Set as default` sits directly below, so the tooltip can point at something the
     vendor can already see. The §14.1 prompt modal has no card list, so its own Subscribe
     still routes to `subscribeBlocked`, which carries the picker with it. */
  if (defaultDeclined() && (sc().sub === 'canceled' || isFreeTier()))
    return h`<span class="tip" data-block="declined">
      <button class="btn btn-primary" disabled>Subscribe</button>
      <!-- Grace, 9/15. Her wording fixes something mine got wrong: PB 1.1.1 makes only the
           FIRST card default, so a vendor who already has cards and adds another does NOT
           get a new default from that alone — "add a new one" implied they would. -->
      <span class="tip-bubble">Your default card was declined, so your subscription can't be restarted with this card. Choose a different card as your default, or add a new card and set it as your default to subscribe again.</span>
    </span>`;
  if (cancelAt())
    return '<button class="btn btn-primary" data-act="resumeSub">Resume subscription</button>';
  /* Free tier and canceled reach the same button by different routes: one has never
     subscribed, the other has and came back. §14.1.3 gives both the same standing entry
     point, and §14.2 is the same flow for both — only the trial differs, and that is
     decided by trial history (§3.2.2 ⑦), not by which state you came from. */
  if (sc().sub === 'canceled' || isFreeTier())
    return '<button class="btn btn-primary" data-act="subscribe">Subscribe</button>';
  return '<button class="btn btn-outline" data-act="cancelSub">Cancel subscription</button>';
}

/* The live Subscribe screen's own pitch (Audit A1) — shared by the unsubscribed tab
   and the §14.1 prompt modal so the two can never say different things. */
/* v2.5 §3.2.1 draws the Free/paid boundary as a table, and it is SHORT: exactly two
   things are locked — opening and confirming an order, and SMS marketing. Everything
   else (linesheets, receiving orders, the order list, products, customers, payout,
   My Account) is open on the Free plan.
   The four items here used to be the live Subscribe screen's marketing copy (Audit A1),
   and against that table three of them were false: receiving orders, managing customers
   and getting paid by payout all work without a subscription — §4.1 even says a Free
   plan vendor receives settlements. Promising them back is the fastest way to lose a
   vendor's trust on the screen that asks for money. Logged as Gap K-2. */
const UNLOCK = [
  ['box',  'Open and confirm your orders', 'On the Free plan orders arrive, but you cannot open one or process it'],
  ['chat', 'SMS marketing', 'Campaigns and 1:1 chat with your buyers'],
];
const unlockGrid = () => h`
      <div class="unlock-grid one-col">
        ${UNLOCK.map(([ico, title, desc]) => h`
          <div class="unlock-item">
            <span class="unlock-ico">${ICO[ico] || ICO.card}</span>
            <div>
              <div class="unlock-title">${title}</div>
              <div class="unlock-desc">${desc}</div>
            </div>
          </div>`).join('')}
      </div>`;

function subscriptionSection() {
  const s = sc();
  const cards = s.cards.map(id => CARDS[id]);
  const def = cards[0];
  const pill = subPill();

  if (s.sub === 'free') {
    /* v2.5 §12.3.1.1 — "미구독이어도 Free plan이 현재 플랜으로 노출된다 (빈 화면·별도 미구독
       화면 없음)". So this is no longer a marketing card standing in for an empty tab: it is
       the same Subscription section every other state uses, showing the plan the vendor is
       actually on. The badge reads `Free`, the plan block names `Free plan`, and the action
       is Subscribe — the ordinary furniture, filled in.
       §12.3.1.5 then asks this screen to say WHAT IS LOCKED, which is the conversion
       argument and the only reason the paid plan's pitch belongs here at all. */
    return h`
    <section class="section-card" id="sec-pitch">
      <div class="section-head">
        <div>
          <div class="section-title">Subscription ${subPill()}</div>
          <div class="section-desc">What you pay Shopcord each month.</div>
        </div>
        ${subActionBtn()}
      </div>

      <div class="plan-row">
        <div>
          <div class="plan-name">Free plan</div>
          <!-- No price on this row. §3.2.1 never gives the Free plan an amount — it is the
               default tier, not a $0 product — and printing "$0" would invent one. -->
          <div class="plan-when">Your current plan <span>·</span> no card on file, nothing is charged</div>
        </div>
      </div>

      <div class="section-foot" style="display:block">
        <div class="pitch-title" style="margin-top:0">What a subscription unlocks</div>
        ${unlockGrid()}
        <div class="helper">${ICO.info}<span><strong>${priceTax}</strong> /monthly · cancel anytime. Subscribing requires a card on file.</span></div>
      </div>
    </section>`;
  }

  let nextVal = clock().next, foot = '', nextLabel = 'Next charge';
  // Scheduled cancellation needs two things the other states don't: the days-left tail
  // and a footnote the vendor actually reads. Both stay off unless cancelAt() is set.
  let cancelDays = null, footIcon = false;
  if (isTrial()) {
    /* v2.5 §3.2.2 — the vendor is on the PAID plan, free for now. There is no conversion
       and no plan change at the end: the trial's last day is simply the day the first
       charge lands, which is why this keeps the ordinary `Next charge` label instead of
       a special one. §12.3.1.4 allows no separate end-date field. Nothing is billed in
       the meantime — no invoice, no receipt, not even a $0 line (§3.2.2 ⑤). */
    nextVal = TRIAL.first;
    foot = 'Nothing is charged until ' + TRIAL.first + '. Cancel before then and you keep the trial to its last day.';
  } else if (inGrace()) {
    /* §5 — the 8/27 policy change. A card failure no longer switches anything off: the
       subscription sits in past_due, SERVICE IS KEPT for seven days, and only day 7
       auto-cancels. Soft declines are retried once a day; hard declines and expired cards
       are never retried, so for those the card update is the only way out (§5.1). */
    /* Both the row and the footnote are deliberately EMPTY here (Grace, 9/8 — "둘 다 빼줘").
       Once the banner was rebuilt to explain the grace period properly (Gap H-11) it carried
       every fact these two held, and the screen was stating one deadline three times: the
       banner title's countdown, this row's "Cancels in N days", and the banner's end date.
       The row's wording was never documented either — §3.5 gives "Cancels on {날짜}" for a
       SCHEDULED cancellation, not for a grace countdown. The banner is the one place that
       carries a payment failure (§16), so it is the one place that says this. */
    nextVal = '';  nextLabel = '';
  } else if (s.sub === 'canceled') {
    /* §12.3.1.1 asks this row for the next billing date, and in `canceled` there isn't
       one: PB 2.7.0 removes the billing schedule on transition (결제 스케줄 제거) and
       §5.5.4 waives the unpaid cycle. So the slot states the absence rather than sitting
       empty — without it the row reads "Billed monthly … $20.00", which is what an active
       charge looks like. The $20.00 beside it is the plan's price, which is what the
       vendor would pay on 재구독 (§5.5.3), not a charge being taken.
       Credits are still shown because 2차 PRD §5 forbids forfeiture, but whether churn triggers
       a pro-rata refund is pending legal (L-1) + Finance (D-4), so the screen says they
       stay and claims nothing about money back. */
    /* No copy here. The PRD gives no string for this slot in `canceled` — "No further
       charges" was mine — and the fact it stated (PB 2.7.0 결제 스케줄 제거 · §5.5.4 미납
       주기 waive) is documented but unworded. Removed 9/1, logged as Gap H-1. */
    nextVal = '';  nextLabel = '';
    /* One sentence for both causes. §5.5.2 treats a cancelled vendor the same however the
       cancellation happened — orders and data access continue — so a chargeback gets no
       sentence of its own here. The block itself is shown on the Subscribe button. */
    /* PM 9/2: the vendor is not told it was a chargeback, but must see that something is in
       dispute and that resubscribing is blocked until it clears — visibly, not in a hover.
       The sentence is §7.1.2's own clause; it says "dispute", never "chargeback". */
    foot = 'Your store and orders keep running.' + (hasCredits() ? ' SMS credits you already bought stay on your account.' : '')
         /* The chargeback clause moved OUT of this footnote on 9/15. §7.4 carries a 확정 카피
            (9/9) that announces the cancellation itself — "A dispute was filed … so your
            subscription has been canceled" — which is a banner's job, not a trailing clause
            on a sentence about the storefront. Saying it in both places would state it twice. */
         ;
  } else if (cancelAt()) {
    /* §3.5 — a flag on an active subscription, not a status. The wording the PRD uses is
       "Cancels on {date}", and it can be withdrawn any time before that date. */
    nextVal = cancelAt();  nextLabel = 'Cancels on';
    /* PM 9/4, via Grace: the scheduled end has to READ as scheduled. The vendor has already
       paid this month, so nothing stops today — but the row sat in the same slot and weight
       as "Next charge {date}" and the one sentence saying so was in the muted footnote.
       Three changes, all existing components, nothing invented:
         · days left after the date — the Free plan card's grammar for the same "runs until
           a date" shape, which is the version Grace settled on after three rejections (9/2)
         · no card chip on this row (below) — a card beside a cancel date says we charge it
           that day, and §3.5 charges nothing
         · the sentence promoted from .foot-note to the .helper treatment already used for
           "Your default card is used for subscription fees", with the date in <strong> */
    cancelDays = daysUntil(cancelAt());
    footIcon = true;
    foot = 'Your subscription stays active until <strong>' + cancelAt() + '</strong>. Resume any time before then and nothing is charged.';
  /* No branch for the server error, on purpose (Grace, 9/1). §4.2 · §5.1 · PB 5.2.0 all
     say the same thing about it — past_due + 자동 재시도 + 벤더 무통보 → 성공 시 복귀 — and
     the retry is ours to run, not the vendor's to act on: the card is fine and there is no
     control here they could press. "Retrying automatically" and a reassuring footnote were
     mine, and they told the vendor exactly what the doc says not to. So this state falls
     through and reads as a normal subscription, which is what 무통보 means on a screen.
     §5.1 leaves the retry count and interval to dev (🔴), so there is no defined end to
     this state yet — if the errors never clear, nothing here would ever say so. Logged. */
  } else {
    /* The anchor is the signup date, not a calendar day (Grace, confirmed 2026-08-24).
       §6.3 only says "Monthly on the cycle date" and never says which date that is, so
       the screen had a next-billing date with nothing explaining where it came from.
       Gap A-12 — the PRD needs this written in. */
    foot = 'Renews automatically each month, on the date you subscribed.';
  }

  const billedTo = def
    ? h`<span class="brand-mark ${def.cls}" style="width:34px;height:23px;font-size:8px">${def.brand}</span>
        ···· ${def.last4}`
    : '<span class="t-muted">No card</span>';
  /* PM decision 9/2: no "Billed to" label and no Change link — §12.3.2.5 and Handoff §2A
     asked for both, so this is a logged deviation (Gap H-3). What the section must say is
     WHEN the next charge is and WHICH card it hits, so the card rides on the date row. */
  const cardChip = def && s.sub !== 'canceled' ? h`<span>·</span><span class="plan-card">${billedTo}</span>` : '';

  /* Free plan card — the paid card's exact grammar, only the content differs (Grace, 9/2,
     after three versions: "지저분하게 보이고 글이 읽히는 디자인이 아니야"). One component, one
     voice: the plan name where "Billed monthly" sits, two label/value lines in the same
     13px register as "Next charge", the price on the right as on the paid card. No badge,
     no eyebrow, no second type scale — the days left is plain text after the date. This is
     also what the research found: end date, then what follows, as short lines. */
  /* The paid card's grammar with one line added, because that is what a trial is — the
     paid plan, not billed yet. The old version named the plan `Free plan`, which v2.5
     §3.2.2 ③ makes wrong: during a trial the plan is the paid one. Its two date lines
     collapse to one, the trial's end and the first charge being the same day. */
  const trialRow = h`
    <div class="plan-row">
      <div>
        <div class="plan-name">Billed monthly</div>
        <div class="plan-when">Free trial <span>·</span> ${daysUntil(TRIAL.first)} days left</div>
        <div class="plan-when">Next charge <strong>${TRIAL.first}</strong>${cardChip}</div>
      </div>
      <div class="plan-price">${PLAN.price}<span> + tax /monthly</span></div>
    </div>`;

  return h`
  <section class="section-card" id="sec-subscription">
    <div class="section-head">
      <div>
        <div class="section-title">Subscription ${pill}</div>
        <div class="section-desc">What you pay Shopcord each month.</div>
      </div>
      ${subActionBtn()}
    </div>

    <!-- No plan block in canceled (Grace, 9/2 — "삭제"; closes Gap H-1). §12.3.1's four
         items describe a subscription that is running; PB 2.7.0 has removed this one's
         billing schedule, so a price and a cycle here read as a charge being taken. The
         shipped product does the same (Figma 1:22438 shows no fee, no cycle). The badge
         says the state and Subscribe says the way back. -->
    ${s.sub === 'canceled' ? '' : isTrial() ? trialRow : h`
    <div class="plan-row">
      <div>
        <!-- No name line: there is one subscription at one price and no doc names
             it, so a name slot would only ever hold something invented. The cadence
             is stated once, on the left — "Billed monthly" beside "$20.00 /monthly"
             said the same word twice. -->
        <!-- §12.3.1 asks the section for a plan name, and Free plan is the first real
             one there has ever been (§3.1 makes plans data). The paid plan still has no
             name — tiers arrive at year end and inventing one now would be worse. -->
        <div class="plan-name">Billed monthly</div>
        <!-- §3.4 asks this section for the next billing date and "Billed to Visa
             ····4242". They used to be two label/value fields under the plan box, and
             once the Status column came out the pair huddled on the left of a wide card
             with a date on one side and an icon on the other — different weights, no
             alignment (Grace: 뭔가 이상함). As one line inside the plan block they read
             as what they are: when the next charge happens and what it hits. -->
        <!-- The row only renders when it has something to say. In canceled it has nothing:
             §12.3.1.1 asks this slot for the next billing date and there is no next date,
             and the PRD gives no copy for the absence — so the slot is empty rather than
             filled with a sentence we wrote. Gap H-1. -->
        ${nextVal ? h`<div class="plan-when">${nextLabel} <strong>${nextVal}</strong>${cancelDays === null ? cardChip : h`<span>·</span>${cancelDays} days left`}</div>` : ''}

        <!-- The 3,000 is a ONE-TIME welcome grant at first subscription, not part of
             the monthly plan (meeting 2026-08-24). "Includes 3,000 free 1:1 chat
             replies" sat under "Billed monthly" and read as something that arrives
             every month, which would be a recurring promise about money. The grant
             belongs to the moment it happens — the subscribe confirmation — so the
             plan card states the plan only. -->
        <!-- No sub-line here. "One subscription, one price — no tiers" was true today
             and stops being true at year end, when tiers arrive (Grace, 2026-08-24) —
             a claim with an expiry date is worse than silence. Naming a tier now would
             be the opposite mistake, since none exist yet. The slot stays empty and is
             where a plan name goes when there is one. -->
      </div>
      <div class="plan-price">${PLAN.price}<span> + tax</span></div>
    </div>`}

    <!-- No footnote block at all when there is nothing to say — an empty one would leave
         its top border behind as a stray rule under the plan card (grace, since 9/8). -->
    ${!foot ? '' : h`<div class="section-foot">
      ${footIcon
        ? h`<span class="helper" style="margin-top:0">${ICO.info}<span>${foot}</span></span>`
        : h`<span class="foot-note">${foot}</span>`}
    </div>`}
  </section>`;
}

// ── Payment methods ─────────────────────────────────────────────
function paymentMethodsSection() {
  const s = sc();
  // PM 9/2: a vendor who has never subscribed sees no card management — the card is
  // collected inside the subscribe flow (§14.2 ②). §12.3.2.6's empty state is therefore
  // reachable only after a subscription existed (canceled with cards removed).
  if (s.sub === 'free') return '';
  const cards = s.cards.map(id => CARDS[id]);

  const list = cards.length === 0
    ? (h`<div class="empty">
          <div class="empty-title">No payment method yet</div>
          <div class="empty-desc">Add a card to subscribe and to buy SMS message packs.</div>
          <!-- Outline, not primary: on the unsubscribed screen Subscribe above is the
               one saturated accent, and §4.2 lets a vendor add a card on its own, so
               this is a secondary path rather than the thing to do next. -->
          <!-- One label everywhere now (Grace, 9/11). The docs gave two — §12.3.2.6 names this
               empty-state CTA "Add a payment method", §12.3.2.4 / PB 1.1.0 call the list button
               "Add card" — but one action under two names reads as two actions. Deviation
               logged in Gap H-22; the documents themselves are unchanged. -->
          <div class="empty-cta">${isMaster()
            ? h`<button class="btn btn-outline" data-act="addCard"><span class="btn-ico">${ICO.plus}</span>Add a payment method</button>`
            : ''}</div>
        </div>`)
    : h`<div class="card-list">
          ${cards.map((c, i) => fmtCardRow(c, {
            isDefault: i === 0,
            /* PB 1.5.0 scopes the block to {free_period, active, past_due} — states
               that still bill. `canceled` has no further charge, so a vendor's last card
               is theirs to remove, and the old `sub !== 'free'` was holding it hostage.
               `suspended` is a vendor state, not one of the three, but it is still
               billing and failing: removing the only card there would remove the way
               back (§12.3). */
            // PB 1.5.0 (v2.1) — blocked while the subscription still bills: {active
            // (Free plan included), past_due}. `canceled` and `free` never charge again.
            onlyCard: cards.length === 1 && ['active', 'past_due'].includes(s.sub),
            bad: !!s.cardBad,
            isNew: i === 0 && S.cardFlash,
          })).join('')}
        </div>`;

  return h`
  <section class="section-card" id="section-cards">
    <div class="section-head">
      <div>
        <div class="section-title">Payment methods</div>
        <div class="section-desc">One card pool for everything you pay Shopcord.</div>
      </div>
      ${(cards.length) ? (cards.length >= MAX_CARDS
        ? h`<span class="tip">
              <button class="btn btn-outline" disabled><span class="btn-ico">${ICO.plus}</span>Add a payment method</button>
              <span class="tip-bubble">You've reached the limit of ${MAX_CARDS} saved cards. Remove one to add another.</span>
            </span>`
        : (isMaster()
            ? h`<button class="btn btn-outline" data-act="addCard"><span class="btn-ico">${ICO.plus}</span>Add a payment method</button>`
            : '')) : ''}
    </div>

    ${list}

    <!-- Handoff §2 Section B specifies this sentence verbatim as a required
         element. The card counter and the Balance storage notice that used to sit
         beside it were mine: the counter is redundant with the disabled-Add
         tooltip that appears at the limit, and the storage notice is already in
         the card form, where it actually matters. -->
    <div class="helper">${ICO.info}<span>Your <strong>default card</strong> is used for subscription fees${hasCredits() ? ' and SMS credit purchases' : ''}.</span></div>
    <!-- PB 1.3.0 asks for "비활성 + 툴팁", and the tooltip is on the button — but a hover
         bubble on a disabled control is mouse-only: disabled buttons leave the tab order,
         and there is no hover on touch. The reason a control is dead has to be readable
         without pointing at it, so at the limit it also states itself here, in the line
         the section already uses for standing facts. The tooltip stays for the vendor
         whose cursor is already on the button. -->
    ${cards.length >= MAX_CARDS ? h`<div class="helper">${ICO.info}<span>You've reached the limit of <strong>${MAX_CARDS} saved cards</strong>. Remove one to add another.</span></div>` : ''}
    <!-- PB 1.5.0's other disabled control, given the same treatment as the 5-card limit: the
         reason a Remove button is dead has to be readable without hovering it. The two are
         mutually exclusive — one card versus five — so only ever one of these lines shows. -->
    ${cards.length === 1 && ['active', 'past_due'].includes(s.sub) ? h`<div class="helper">${ICO.info}<span>Your subscription needs a card on file, so <strong>the last card can't be removed</strong>. Add another one first.</span></div>` : ''}
  </section>`;
}

// ── Billing history ─────────────────────────────────────────────
/* ONE source for the table and for the file. Export has to hand back exactly what the
   table holds, so the row set cannot be computed in two places — that is precisely how a
   file and a screen drift apart.
   PM 9/2: the table lists PAID charges only, so there is no Status column and a failed
   attempt is not a row — the failure banner is where that lives. §12.3.3's
   "상태(Paid/Failed)" is therefore a logged deviation (Gap H-3). */
function historyRows() {
  const base = isR1() ? HISTORY.filter(r => r.rel === 1) : HISTORY;
  const failIdx = inGrace() ? base.findIndex(r => r.type === 'Subscription') : -1;
  return base.filter((r, i) => r.status === 'paid' && i !== failIdx);
}

/* Export = the WHOLE table, never the page on screen (Grace asked, 9/14: "Export하면 몇 개가
   추출되는거야?"). Pagination is a reading aid; the file is the record, and a vendor who
   exported page 2 of 3 and filed it would be missing two thirds of their year.
   §12.3.3.2 gives this control the word `Export` and PB 6.3.0 makes it the replacement for
   the statement — neither names a FORMAT. CSV is ours, for the same reason the SMS tables
   use it: it is what the reference set hands back (Klaviyo · Postscript · Mailchimp,
   Research doc 9/8) and what a vendor can open without us.
   THREE money columns, not one. The table cell shows the total because the charge already
   happened, but a statement replacement has to be reconcilable — so the file carries
   pre-tax, tax and total separately (§3.3.1 · PB 6.1.0's receipt fields).
   Tax is SUBSCRIPTION-ONLY: a credit pack row has no tax line, so those cells stay empty
   rather than printing $0.00, which would assert a zero-rated sale we never computed.
   Receipt is availability, not a number — no PRD gives a receipt-number format (Grace
   asked, 9/14), so inventing one in a file a vendor keeps would be a promise. */
function exportBillingHistory() {
  const rows = historyRows();
  const esc = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const line = (a) => a.map(esc).join(',');
  const csv = [line(['Date', 'Type', 'Card', 'Subtotal', 'Sales tax', 'Total', 'Receipt'])].concat(
    rows.map(r => {
      const taxed = r.type === 'Subscription';
      return line([
        r.date,
        r.type + (r.sub ? ' · ' + r.sub : ''),
        r.card,
        r.amt,
        taxed ? TAX.amt + ' (' + TAX.place + ' ' + TAX.rate + ')' : '',
        taxed ? TAX.total : r.amt,
        r.receipt === false ? '—' : 'Available',
      ]);
    })).join('\r\n');
  const stamp = new Date(clock().today).toISOString().slice(0, 10);
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `shopcord-billing-history-${stamp}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Export ready', `${rows.length} rows · shopcord-billing-history-${stamp}.csv`);
}

function billingHistorySection() {
  const s = sc();
  if (s.sub === 'free') return '';   // PM 9/2 — nothing has ever been charged
  const c = s.credits;


  /* Release 1 ships before credits exist, so a pack row could not have happened. The
     filter loses its SMS pack option with them, and §3.4's credit summary chip waits
     for release 2. */
  /* Release 1's world is October 2026, so it holds the rows that exist by then — one
     subscription charge. The later rows are not merely out of scope, they are in the
     future. */
  /* A failed charge IS a history row (§3.4 status Failed), and the suspension banner
     names its date — without it the screen says a charge failed above a table of nothing
     but successes. It is not an EXTRA row: the newest subscription charge either went
     through or it did not, so the scenario flips that row in place. Same row, same date,
     one source for the banner (`failedChargeDate()`). */
  const visible = historyRows();
  /* The pager is mine, not the docs' (Audit A3-5) — table convention. Five rows a page
     (Grace, 9/14). It renders only when there is a second page, so release 1's single
     charge shows no pager rather than one claiming pages that do not exist. The numbers
     used to be hardcoded `1 2 3 ···` and paged nothing; they work now. */
  const PAGE_SIZE = 5;
  const pageCount = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
  const page = Math.min(Math.max(S.histPage || 0, 0), pageCount - 1);
  const from = page * PAGE_SIZE;
  const shown = visible.slice(from, from + PAGE_SIZE);
  const nums = [];
  if (pageCount <= 7) { for (let i = 0; i < pageCount; i++) nums.push(i); }
  else {
    const near = [0, 1, page - 1, page, page + 1, pageCount - 2, pageCount - 1]
      .filter(i => i >= 0 && i < pageCount);
    let last = -1;
    for (const i of [...new Set(near)].sort((a, b) => a - b)) {
      if (last >= 0 && i - last > 1) nums.push('...');
      nums.push(i); last = i;
    }
  }
  const numHtml = nums.map(i => i === '...'
    ? '<span class="pager-dots">···</span>'
    : `<button class="pager-btn ${i === page ? 'is-cur' : ''}" data-act="histPage" data-val="${i}">${i + 1}</button>`).join('');
  const pager = pageCount < 2 ? '' : `
        <div class="pager">
          <span class="pager-range">${from + 1}\u2013${from + shown.length} of ${visible.length}</span>
          <div class="pager-nav">
            <button class="pager-btn" data-act="histPage" data-val="${page - 1}" ${page === 0 ? 'disabled' : ''}>\u2039 Previous</button>
            ${numHtml}
            <button class="pager-btn" data-act="histPage" data-val="${page + 1}" ${page === pageCount - 1 ? 'disabled' : ''}>Next \u203a</button>
          </div>
        </div>`;
  const rows = shown.map(r => h`
    <tr>
      <td>${r.date}</td>
      <td>
        <div>${r.type}</div>
        ${r.sub ? `<div class="t-muted" style="font-size:12px;margin-top:2px">${r.sub}</div>` : ''}
      </td>
      <td>${r.card}</td>
      <!-- The charge already happened, so this CELL shows the TOTAL the card was debited,
           tax included — unlike every forward-looking price, which can only say "+ tax"
           because the rate is looked up at charge time (§3.3.1 · PB 2.12.0).
           The amount field itself stays PRE-TAX and that is what the Receipt link passes
           on: the receipt's line item and subtotal are the pre-tax figure, and only its
           bottom line is the total. Handing the total to both made the paper read as if
           tax were owed twice (Grace, 9/14). One field, one meaning. -->
      <td class="t-tab">${r.type === 'Subscription' ? TAX.total : r.amt}</td>
      <td>${r.receipt === false ? '<span class="t-muted" style="font-size:12px">—</span>'
        : `<a class="receipt-link" href="#" target="_blank" rel="noopener" data-act="receipt"
             data-date="${r.date}" data-amt="${r.amt}" data-type="${r.type}">${ICO.ext}Receipt</a>`}</td>
    </tr>`).join('');

  const noRows = !s.history || visible.length === 0;
  const body = !noRows
    ? h`<div class="tbl-scroll">
          <table class="tbl">
            <thead><tr>
              <!-- PROPORTIONAL, not fixed px. With one flexible column and four fixed ones,
                   the flexible column swallowed every spare pixel: Date/Type clustered at the
                   left, Card/Amount/Receipt at the right, and half the table was a canyon in
                   between (Grace, 2026-09-08). Percentages spread the columns and the same
                   ratios are used by Purchase history, so the two tables of the same purchases
                   line up column for column. -->
              <!-- Figma Table(01) column widths, left-aligned throughout: Date 160 ·
                   subject flexible (min 200) · Card 160 · Amount 100 · Receipt 100.
                   Purchase history uses the identical set, so the two tables of the same
                   purchases line up column for column. -->
              <th style="width:160px">Date</th><th style="min-width:200px">Type</th>
              <th style="width:160px">Card</th><th style="width:100px">Amount</th>
              <th style="width:100px">Receipt</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${pager}`
    : h`<div class="empty">
          <div class="empty-title">No charges yet</div>
          <div class="empty-desc">${isR1() ? 'Subscription charges' : 'Subscription charges and SMS pack purchases'} will appear here, each with a downloadable receipt.</div>
        </div>`;

  /* One view only. A `Charges` / `SMS usage` switch lived here while the merged
     layout wrapped everything in invented groups; now usage history sits in the SMS
     group where 통합 v0.6 §7.6 puts it, and this card is §12.3.3 — charges. */
  return h`
  <section class="section-card" id="sec-history">
    <div class="section-head">
      <div>
        <div class="section-title">Billing history</div>
        <div class="section-desc">Everything you\'ve been charged, with receipts.</div>
      </div>
    </div>

    <!-- The chip exists to carry the balance across to a tab the vendor isn't on
         (§3.4 asks for a balance summary here). Merged, the real balance cards are
         a few hundred pixels up the same page, so the chip would be the same
         numbers twice and its link would point at the section above it. -->
    ${(isMerged() || isR1()) ? '' : h`
    <div class="credit-chip">
      ${isUnified()
        ? h`<div class="credit-chip-item"><span class="credit-chip-num">${n(unifiedTotals(c).remaining)}</span><span class="credit-chip-label">credits remaining</span></div>`

    <div class="toolbar">

}

// ── Banners ─────────────────────────────────────────────────────────────────
function banners() {
  const s = sc();
  const out = [];
  // Billing-tab alerts vs SMS-tab alerts — both tabs now live under My Account.
  // Merged, the billing tab IS the SMS surface, so SMS-scoped banners belong there
  // too — otherwise folding the tabs together would silently drop them.
  /* The banner CTA is a shortcut TO Payment methods (§12.3: every card-management route
     ends on this tab). On the Subscription tab that section is already on screen just
     below, so the button is the same control twice — Grace, 9/8: "이런버튼은 솔직히 그냥
     밑으로 보내는거잖아! 삭제해줘". It is kept on every other tab and on the campaign
     screen, where the banner is the only way across. */
  const nearCards = s.screen === 'account' && S.tab === 'billing' && s.sub !== 'free';
  /* The grace banner escalates instead of shouting from day one (Grace, 9/8: "저건 2일
     남았다든지 하는 그럴때 나와야하고 우선은 간단하게 한줄"). §5.3 · PB 5.3.0 already stage
     it that way — D0 알림 → D+3 리마인더 → D+7 자동 해지 — so the screen follows the same
     two beats: one line while there is time, the full consequence once the reminder is due.
     7-day grace, so D+3 is 4 days left. */
  const graceLate = graceLeft() <= 4;
  const onBilling = S.tab === 'billing';
  const onSms = S.tab === smsTab();
  const onCampaign = s.screen === 'campaign';

  /* The lock pattern says the banner is the one thing that carries the fix, so it
     has to reach every screen where a control actually goes disabled — the campaign
     screen included, or Send is disabled with no way out (§12.3 routes every
     failure to Subscription). Not on the SMS tab: the number card there
     already states the pause and offers Update payment, and a banner would make
     that the same control twice. */
  /* Handoff §7 is the ONLY placement any document gives an in-app notification, and it
     says **Vendor Admin banner** — the admin, not a tab. PB 7.1 agrees by implication:
     it pairs the banner with a "탭 링크", and a banner sitting on that tab would not need
     one. So this renders on every My Account tab. The other six PB 7.x triggers say
     only "인앱" with no location, so nothing else was moved (Grace, 8/28: 위치 알려준곳만).
     Everything outside My Account is beyond what this mockup draws — the real banner
     goes wider still, and where exactly is the screen owner's call. */
  const onAccount = s.screen === 'account';
  /* No chargeback banner. §16 lists the banner's uses as the payout reminder and payment
     failure only, and PB 7.x has no chargeback trigger at all, so a banner here would be
     a channel the docs have not assigned. §7.1 asks for "재구독 차단 표시" — that is the
     disabled Resume below, nothing more. Logged, not designed around. */

  if (inGrace() && (onAccount || onCampaign)) out.push(h`
    <div class="alert alert-danger" role="alert">
      <span class="alert-ico">${ICO.alert}</span>
      <div class="alert-body">
        <!-- "off", not "blocked" (Grace, 2026-08-24). The old §8.1's phrase was "Paid
             features blocked", but that is the spec's state description, and the same
             call that took the word out of the credits sentence applies here: the word
             stays where it names a STATE (the balance card's BLOCKED badge, 2차 PRD §4) and
             leaves the sentences. "paused" was unavailable — auto-recharge already owns
             it in this product — so "off" carries the impact without the extra freight. -->
        <!-- The old title said paid features were off. Under §5 they are not — saying so
             would be the same mistake as telling a vendor "paid features are off" the
             instant they scheduled a cancellation. What is true is the deadline. -->
        <!-- §5.5's own word. Grace, 9/8: "Grace Period기간이라는것도 명시해주고" — the vendor
             was being given a countdown without being told what the countdown IS. -->
        <!-- The countdown is the same either way; what differs is what the days are FOR.
             v2.5 §5.1 retries only insufficient_funds, so on every other decline "left to
             retry" promised something that never happens — and on the D+3 form it sat directly
             above a bullet reading "This card will not be retried" (caught 9/15). The body
             already branched; the title did not. -->
        <div class="alert-title">Payment failed — ${graceLeft()} ${graceLeft() === 1 ? 'day' : 'days'} left to ${failKind() === 'funds' ? 'retry' : 'update your card'}</div>
        <!-- Cause on the first line, consequences as lines under it. Soft declines retry
             daily; hard declines and expired cards never do (§5.1). The title still states
             the deadline rather than announcing a shutdown — what changed on 9/8 is that
             §5.5.1's automatic cancellation is now said out loud instead of implied. -->
        <!-- One lead for both classes. v2.5 §5.1 no longer distinguishes an expired card from
             any other decline — expiry is not a state (§4.3.2), so the card was simply charged
             and refused. What still differs is whether we retry, and that is the first bullet. -->
        <div class="alert-msg">Your Visa ····4242 was declined on ${failedChargeDate()}.${graceLate ? '' : (failKind() !== 'funds'
          ? ' Please update your card or add a new payment method — we charge it the moment you do.'
          : ' Please update your card or add a new payment method.')}
          ${!graceLate ? '' : h`<ul>
            <!-- Grace, 9/8: lead with what the VENDOR does and say what it is for. The old
                 line opened with "We retry it once a day", which reads as something already
                 being handled rather than something waiting on them. -->
            <li>${failKind() !== 'funds'
              ? 'This card will not be retried. Please update it or add a new payment method — we charge it the moment you do.'
              : 'Please update your card or add a new payment method so we can retry the payment. We\'ll try once a day.'}</li>
            <!-- "while we retry the payment" is only true on the soft path. Saying it under a
                 first bullet that just said an expired card can't be retried was two lines
                 contradicting each other (caught 9/8 when the expired card got a full-length
                 stage of its own). Hard declines get the neutral clause. -->
            <li>${hasCredits() ? 'Your store, orders and purchased SMS credits will continue running' : 'Your store and orders will continue running'}${failKind() !== 'funds' ? ' in the meantime.' : ' while we retry the payment.'}</li>
            <li>If the payment is still unsuccessful by <strong>${graceEnd()}</strong>, your subscription will be <strong>canceled</strong>. To restore paid features, you'll need to subscribe again.</li>
          </ul>`}</div>
        <!-- The banner keeps its text for a sub account but loses its button: they need to know
             a payment failed even though fixing it is not theirs to do (Grace, 9/11). -->
        ${nearCards ? '' : h`<div class="alert-actions">${isMaster()
          ? h`<button class="btn btn-primary" data-act="addCard">Update payment method</button>`
          : ''}</div>`}
      </div>
    </div>`);

  /* Grace, 9/1 — the banner is for the DEFAULT card only. That is the card that gets
     charged, so it is the only expiry that interrupts anything; a stale non-default card
     gets its `Expires soon` badge in the card list (§12.3.2.2) and nothing more. The
     condition is derived from the card's own date, not the scenario flag alone, so a
     banner can never appear over a row the list is calling healthy. */
  const expDef = CARDS[s.cards[0]];
  /* PM 9/2: expiring and expired are ONE message — the card needs updating either way. Not
     shown during grace, where the failure banner already carries the expiry and the
     deadline. Title is PB 7.1's own string. */
  /* The second past_due outcome (Grace, 9/8). §5.5.1 — 7일째까지 미해결이면 자동 해지 — and
     PB 7.1.2 assigns that trigger 이메일+SMS+**인앱**, with Handoff §7 making the banner this
     project's in-app container. So unlike the chargeback case, this notice is a channel the
     docs hand us. It exists because `canceled` alone does not say WHY: a vendor who cancelled
     on purpose already knows, and this one was cancelled without ever pressing anything. */
  if (s.viaGrace && onAccount) out.push(h`
    <div class="alert alert-danger" role="alert">
      <span class="alert-ico">${ICO.alert}</span>
      <div class="alert-body">
        <div class="alert-title">Your subscription was canceled</div>
        <!-- No "your store keeps running" here — the section footnote below already says it
             (§5.5.2), and the banner would be the same sentence twice. -->
        <!-- Grace's wording, 9/8. Her first draft said "We made additional attempts…", which
             is the soft-decline path only — §5.1 never retries a hard decline or an expired
             card. She resolved it by naming the cause both paths share ("카드를 너가 업뎃
             안 해서 이렇게 되었다"): the card was not updated in time. One sentence, no
             soft/hard branch, and it does not describe retries that may not have happened. -->
        <div class="alert-msg">Your ${failedChargeDate()} payment was declined and your card was not updated during the 7-day grace period, so your subscription has now been canceled.
          <p>Subscribe again to turn paid features back on. A new subscription cycle will start with an immediate first charge.</p></div>
      </div>
    </div>`);

  /* §7.4 (확정 9/9) gives this one as a STRING, not a fact — one of the few clauses that does,
     like §6.3.4's invoice lines. It is 법무's own sentence, so it is pasted rather than written:
     "A dispute was filed with your card issuer for a subscription payment, so your subscription
     has been canceled. You can subscribe again once the dispute is resolved or a different
     payment method is verified. Questions? Contact {support}."
     사기·부정 같은 단정 표현 금지 — 정당한 분쟁일 수 있다 (§7.4).
     The chargeback cancellation is the only IMMEDIATE one in the product (§7.1-2); every other
     cancellation waits for the period to end. That is why this screen gets its own banner and
     does not share `canceled`'s.
     🔴 TWO THINGS ARE UNRESOLVED HERE — see annotation 18:
     ① {support} has no destination in any document. The link is a placeholder.
     ② "a different payment method is verified" is 법무's phrase; §7.4-2's operating rule is
        "새 카드 등록만으로는 풀지 않는다 … 미납분을 그 수단으로 결제하면 복원". The disabled
        Subscribe button's tooltip carries that operating meaning, so banner and tooltip layer
        rather than contradict — but only if `verified` means "paid", which Jennie must confirm. */
  if (isChargeback() && onAccount) out.push(h`
    <div class="alert alert-danger" role="alert" data-banner="chargeback">
      <span class="alert-ico">${ICO.alert}</span>
      <div class="alert-body">
        <div class="alert-title">Your subscription was canceled</div>
        <div class="alert-msg">A dispute was filed with your card issuer for a subscription payment, so your
          subscription has been canceled. You can subscribe again once the dispute is resolved or a different
          payment method is verified. Questions? Contact support at <b>vendorsupport@shopcord.com</b><button
          class="alert-copy" data-act="copyText" data-val="vendorsupport@shopcord.com" title="Copy address"
          aria-label="Copy email address">${ICO.copy}</button></div>
      </div>
    </div>`);

  /* No card-expiry banner (v2.5 §4.3.2 · §16). The three-step ladder — D-30 / D-7 / the
     day itself, email plus an admin notice — is abolished along with PB 7.3~7.5, so there
     is no trigger left for one. Everything that remains about an expiring card is the red
     date in the list. */

  // same bad card (§4.4) — the claim becomes false, and its Update payment
  // button repeats the one the number card already shows. One cause, one message.
  // "Out of credits" only makes sense to someone who had some — a never-subscribed
  // vendor is at zero by definition, and the tab already tells them to subscribe.
  if (!isR1() && s.credits && s.credits.sms === 0 && s.sub !== 'free' && onSms) out.push(h`
    <div class="alert alert-danger">
      <span class="alert-ico">${ICO.lock}</span>
      <div class="alert-body">
        <div class="alert-title">${outOfCreditsLine()}</div>
        <div class="alert-msg">Campaigns and 1:1 chat replies won't send until you buy credits.</div>
        <div class="alert-actions"><button class="btn btn-primary" data-act="buyPack" data-val="sms">Buy message pack</button></div>
      </div>
    </div>`);

  // Also on the campaign screen: "already-scheduled campaigns still go out" is
  // most relevant exactly where the vendor just found Send disabled. It used to
  // appear there only by accident, when S.tab happened to still be 'billing'.
  if (s.frozen && hasCredits() && (onBilling || onCampaign)) out.push(h`
    <div class="alert alert-info">
      <span class="alert-ico">${ICO.lock}</span>
      <div class="alert-body">
        <div class="alert-title">Your SMS credits are frozen, not lost</div>
        <!-- 2차 PRD §5's other half, and the load-bearing one: campaigns already
             scheduled had their counts deducted at scheduling (통합 v0.6 §7.5), so they are
             paid for and still go out. Saying so is what keeps suspension from
             looking like paid-for service withheld. ⚠ pending legal (L-2). -->
        <div class="alert-msg">1,240 SMS and 320 MMS stay on your account. They become usable again the moment your subscription recovers. <strong>Campaigns you already scheduled still go out</strong> — those credits were reserved when you scheduled them.</div>
      </div>
    </div>`);

  return out.length ? `<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:4px">${out.join('')}</div>` : '';
}

function screenAccount() {

    { id: 'payout',  label: 'Payout',  tag: '' },

  else if (S.tab === 'account') content = simpleTab('Account', 'Your vendor profile.');
  else if (S.tab === 'company') content = simpleTab('Company', 'Company information.');
  /* The tab bar never offers `sms` in release 1 and `smsTab()` never returns it, so
     this is belt-and-braces — but it is the one branch that can render credit UI, and
     the cost of it firing is a release-1 screen showing a balance that cannot exist.
     Guard the renderer, not just the routes into it. */
  else if (S.tab === 'sms') content = isR1() ? (subscriptionSection() + paymentMethodsSection() + billingHistorySection()) : creditsBody();
  else if (isMerged() && !isR1()) content = mergedBillingBody();
  else content = subscriptionSection() + paymentMethodsSection() + billingHistorySection();

  <!-- The page heading is the active tab's name (Grace, 9/2: "Myaccount가 아니라 Subscription &

       the Payout tab does not read "Subscription". -->
  <div class="page-head${wide}">

  </div>

  <div class="body${wide}">
