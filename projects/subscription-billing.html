<!DOCTYPE html>
<!-- PM share, 2026-09-02 (Grace → Jennie). Snapshot of Mockup_P2.5_PaymentBilling_1st_2026-08-28.html
     in the 1st · Oct 5 / Unified / 4 tabs state, with the "Card expired — hard decline" scenario removed
     (the screen shows expiring and expired as one message per the 9/2 decision). Edit the source file,
     not this one; regenerate when the source changes. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopcord · Subscription — 1st release (Oct 5) · PM share 2026-09-02</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Design tokens (Figma variables, node 140:14350 — same set as Phase 2 mockup) ============ */
:root {
  --bg:                #fdfcfa;
  --sidebar-bg:        #fefefd;
  --card:              #ffffff;
  --border:            #f2ede7;
  --border-elements:   #ececec;
  --border-muted:      #e4e4e7;
  --fg:                #1f1f1f;
  --fg-secondary:      #6b6b6b;
  --fg-muted:          #a3a3a3;
  --primary:           #e11d74;
  --primary-soft:      #fdf2f8;
  --primary-soft-60:   #fdf2f899;
  --destructive:       #ef4444;
  --destructive-soft:  #fef2f2;

  --badge-red:         #f6eef1;
  --badge-red-fg:      #9e4a5e;
  --badge-green:       #ebf4f1;
  --badge-green-fg:    #4f8f7c;
  --badge-amber:       #fdf5ec;
  --badge-amber-fg:    #a17a4a;
  --badge-blue:        #eef2f8;

  /* Toast surfaces — Figma "Payment & Billing Update" node 228:232624 (base/sonner-bg-*).
     The icon circles reuse our badge tokens where the two already agree: blue is an
     exact match on both background and glyph, green matches on background. */
  --sonner-bg-success: #f6fbf9;
  --sonner-bg-warning: #fffcf5;
  --sonner-bg-error:   #fef7f6;
  --sonner-bg-info:    #f5f8fc;
  /* base/sonner-forground-Error — the glyph inside the confirmation popup's icon
     circle (node 1:22320). The circle's fill is --sonner-bg-error above. */
  --sonner-fg-error:   #c0392b;

  /* Email palette — Figma node 317:816391, confirmed by Grace 2026-08-28. These are the
     EMAIL's colours, not the product's: the accent is #e53a85, which is NOT --primary
     (#e11d74), and the canvas is warmer than --bg. Declared here so the two cannot drift
     apart across eight templates. */
  --email-bg:          #fdf9f7;
  --email-accent:      #e53a85;
  --badge-blue-fg:     #4a6fa5;
  --badge-gray:        #f4f4f5;
  --badge-gray-fg:     #8a8a8a;

  --accent:            #404040;   /* base/accent — selection + active container border */
  --success:           #16a34a;
  --muted:             #f7f7f7;

  /* Content width — 1024 by default; sections that carry a table widen to 1280.
     The +gutters absorb the 32px inset so the cards themselves land on the number. */
  --content-w: 1024px;
  /* 1024 for tables too (Grace, 2026-09-08). The 1280 measure came from 8/12 — tables
     needed room the 1024 column could not give. Figma 695:28270 settles it instead: at a
     1024 card the table's own columns (160 · flex · 160 · 100 · 100) leave the flexible
     column exactly the 456px the design shows, so the wider measure buys nothing. */
  --content-w-table: 1024px;
  --content-gutter: 48px;   /* Figma 1:10019 — content sits at x=48 in the wrap */

  --shadow-xs: 0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-sm: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
  --shadow-lg: 0 20px 40px -12px rgba(0,0,0,.22), 0 4px 12px -4px rgba(0,0,0,.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 20px;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
[hidden] { display: none !important; }

/* ============ Layout ============ */
.app { display: flex; min-height: 100vh; max-width: 1920px; margin: 0 auto; padding: 16px; }
@media (min-width: 1240px) { body.proto-open .app { padding-right: 372px; } }

/* ============ Sidebar ============ */
.sidebar {
  width: 256px; background: var(--sidebar-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 12px; display: flex; flex-direction: column; flex-shrink: 0;
  position: sticky; top: 16px; height: calc(100vh - 32px);
}
/* Sidebar matched to Figma node 1:7750 (Payment & Billing Update) */
.sb-brand { display: flex; align-items: center; gap: 8px; padding: 8px 12px 20px; }
.sb-logo-mark { width: 18px; height: 23.6px; flex-shrink: 0; display: block; }
.sb-logo-word { width: 103.31px; height: 21.554px; flex-shrink: 0; display: block; }

.sb-toggle { position: absolute; right: -12px; top: 23px; width: 24px; height: 24px; border-radius: 12px; background: #fff; border: 1px solid var(--border-muted); box-shadow: 0 2px 3px rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--fg-muted); padding: 0; z-index: 20; }
.sb-toggle:hover { border-color: var(--fg-muted); color: var(--fg); }
.sb-toggle svg { width: 12px; height: 12px; }

.sb-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.sb-item { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--fg-secondary); cursor: pointer; }
.sb-item:hover { background: rgba(0,0,0,.03); }
.sb-item.active { background: var(--primary-soft-60); color: var(--primary); font-weight: 600; }
.sb-ico { width: 16px; height: 16px; flex-shrink: 0; }
.sb-ico svg { width: 100%; height: 100%; }
.sb-sep { height: 1px; background: var(--border); margin: 8px 12px; }

.sb-foot { position: relative; display: flex; align-items: center; gap: 10px; padding: 11px 10px 10px; border-top: 1px solid var(--border); cursor: pointer; }
.sb-avatar { width: 32px; height: 32px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
.sb-avatar svg { width: 16px; height: 16px; }
.sb-foot-name { flex: 1; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--fg); }
.sb-foot-chev { color: var(--fg-muted); display: flex; }
.sb-foot-chev svg { width: 16px; height: 16px; }

.sb-dot { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 6px; height: 6px; border-radius: 3px; background: var(--primary); }
.sb-foot .sb-dot { right: 32px; }

/* ============ Main wrap ============ */
.wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ============ Buttons ============ */
/* Button — design system node 4559:2178 (shadcn Button).
   default h-9 36px · px-4 py-2 · gap 8 · radius 8 · Inter Medium 14/20
   sm 32px / 12px · primary carries shadow-xs */
.btn { height: 36px; padding: 0 16px; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 1px solid transparent; background: transparent; color: inherit; }
/* Figma's disabled state is the whole control at `opacity/opacity-30` - 30%, not 45%, and
   not a separate grey palette (Variant=Secondary, State=Disabled, node 3:1468). One value
   covers every variant, which is why the token exists. */
.btn:disabled { opacity: .3; cursor: not-allowed; }
/* Outline needs a border that reads as a control edge, not a card edge:
   --border #f2ede7 is the card colour and vanishes on white. shadcn's outline
   variant also carries shadow-xs, which lifts it off the surface. */
/* Figma defines Outline at ONE size — `Variant=Outline, State=Default, Size=sm`
   (695:27210): 32px tall, 12px side padding, 12px/16 medium text, white ground, a 1px
   `base/foreground` **#1f1f1f** stroke and NO shadow. Ours was a light #e4e4e7 border with
   a shadow at the default 36px/14px, which is why the Export button did not look like the
   design's button at all. The Default variant stays the pink 36px one (.btn-primary). */
.btn-outline { background: var(--card); border-color: var(--fg); color: var(--fg); box-shadow: none;
               /* NO SIZE HERE (Grace, 2026-09-09). Figma's Button keeps variant and size on
                  separate axes - `Variant=Secondary, State=Default, Size=default` - and this
                  rule had `sm`'s box baked into a STYLE variant, so every default-size outline
                  button silently rendered at 32 with 12px type. Size now comes only from
                  .btn / .btn-sm / .btn-lg. Stroke, ground and shadow stay as node 695:28332
                  specified them. */ }
/* Selected outline uses the design system's 2px #404040 selection border, not the
   accent — a button going pink to say "my panel is open" spends the screen's one
   saturated colour on state, while the panel's own submit needs it. */
.btn-outline.is-on { border: 2px solid #404040; }
/* Hover used to LIGHTEN the border, which reads as the control weakening on approach —
   backwards now the stroke is the dark one Figma specifies. The ground moves instead. */
.btn-outline:hover:not(:disabled) { background: #fafafa; }
.btn-outline:disabled { box-shadow: none; background: var(--muted); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: var(--shadow-xs); }
/* Secondary — near-black fill, white text. Same geometry as Default; only the
   fill differs. Used for the peer commit action beside a pink primary
   (Save Draft beside Send). Figma variant "Secondary", node 4559:2244. */
.btn-secondary { background: var(--fg); color: #fff; border-color: var(--fg); box-shadow: var(--shadow-xs); }
.btn-secondary:hover:not(:disabled) { filter: brightness(1.25); }
.btn-primary:hover:not(:disabled) { filter: brightness(.96); }
.btn-ghost { background: transparent; color: var(--fg-secondary); }
.btn-ghost:hover { background: rgba(0,0,0,.04); color: var(--fg); }
/* destructive actions stay neutral until reached for — a card list shouldn't
   lead with Remove */
.btn-danger-ghost { background: transparent; color: var(--fg-secondary); }
.btn-danger-ghost:hover:not(:disabled) { background: var(--destructive-soft); color: var(--destructive); }
/* The three sizes are Figma's, read off the Button component's own variables (2026-09-09):
     default  height/h-9  36 · padding spacing/4 16 · text-sm 14/20   <- .btn
     sm       height/h-8  32 · padding spacing/3 12 · text-xs 12/16   <- .btn-sm
     lg       height/h-10 40 · padding spacing/8 32 · text-sm 14/20   <- .btn-lg
   gap spacing/2 = 8 and border-radius rounded-md = 8 on all three.
   WHICH SIZE WHERE: a .section-head action is `default`, a control living inside a row
   (card row, check row) is `sm`. That is the line the Figma screens draw. */
.btn-sm { height: 32px; padding: 0 12px; font-size: 12px; line-height: 16px; }
.btn-lg { height: 40px; padding: 0 32px; font-size: 14px; }
.btn-ico { display: inline-flex; width: 16px; height: 16px; }
.btn-ico svg { width: 16px; height: 16px; }
.linkbtn { background: none; border: none; padding: 0; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }

/* ============ Page head ============ */
.page-head { padding: 40px var(--content-gutter) 0; }
.page-title { font-size: 30px; line-height: 36px; font-weight: 700; }
.page-sub { margin-top: 6px; font-size: 13px; color: var(--fg-secondary); }

/* ============ Account tabs (4) ============ */
/* Tab menu — Figma node 1:10023 (shadcn Tabs).
   A 64px band above the page title: bordered rounded-2xl card holding pill tabs. */
.tabbar {
  height: 64px; margin: 0 16px;
  background: var(--sidebar-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 8px 16px;
  display: flex; align-items: center;
  overflow-x: auto; scrollbar-width: none;
}
.tabbar::-webkit-scrollbar { display: none; }
.acct-tabs { display: flex; align-items: center; border-radius: 10px; }
.acct-tab {
  flex-shrink: 0; white-space: nowrap;
  padding: 6px 24px; border: none; border-radius: 8px; background: transparent;
  font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500;
  color: var(--fg); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.acct-tab:hover:not(.is-active) { background: rgba(0,0,0,.03); }
.acct-tab.is-active { background: var(--primary-soft-60); color: var(--primary); }

/* ============ Body ============ */
/* Width is decided per TAB, not per section: a tab that contains a table runs
   at 1280 throughout so the cards above it line up with the table edges.
   (Figma 1:10019 — the Account tab is 1280 because Sub Accounts is a table.) */
.body { padding: 24px var(--content-gutter) 64px; display: flex; flex-direction: column; gap: 20px; max-width: calc(var(--content-w-table) + var(--content-gutter) * 2); }
.body > * { width: 100%; max-width: var(--content-w); }
.body.wide > * { max-width: var(--content-w-table); }
.page-head { max-width: calc(var(--content-w) + var(--content-gutter) * 2); }
.page-head.wide { max-width: calc(var(--content-w-table) + var(--content-gutter) * 2); }

/* ============ Alerts / banners ============ */
.alert { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border-radius: 10px; border: 1px solid transparent; }
.alert-ico { flex-shrink: 0; width: 20px; height: 20px; display: inline-flex; }
.alert-ico svg { width: 20px; height: 20px; }
.alert-body { flex: 1; font-size: 13px; line-height: 19px; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "title actions" "msg actions"; column-gap: 20px; align-items: center; }
.alert-title { font-weight: 700; grid-area: title; }
.alert-msg { grid-area: msg; }
/* The grace banner carries four facts. As one paragraph they did not get read
   (Grace, 9/8: "너무 길어....... 눈에 들어오지도 않아"), so the cause leads and the
   rest are lines — the same shape the cancel confirmation already uses. */
.alert-msg ul { margin: 5px 0 0; padding-left: 17px; list-style: disc; }
.alert-msg p { margin: 5px 0 0; }
.alert-msg li + li { margin-top: 1px; }
/* The address is the only thing this banner can hand over, and the vendor admin is desktop-only
   (Grace, 9/17) — a mailto: is silently dead for anyone on webmail, so the control copies instead
   of launching. Icon only: the address sits right beside it and already says what gets copied. */
.alert-copy { display: inline-flex; vertical-align: -3px; margin-left: 5px; padding: 2px; border: 0;
  background: none; color: inherit; opacity: .6; cursor: pointer; border-radius: 4px; }
.alert-copy:hover { opacity: 1; background: rgba(0,0,0,.07); }
.alert-copy.is-done { opacity: 1; }
.alert-copy svg { width: 14px; height: 14px; }
.alert-danger { background: var(--destructive-soft); border-color: #fecaca; color: #991b1b; }
.alert-danger .alert-ico { color: var(--destructive); }
.alert-danger .alert-msg { color: #b91c1c; }
.alert-warn { background: var(--badge-amber); border-color: #f0dcc0; color: #7c5a2e; }
.alert-warn .alert-ico { color: var(--badge-amber-fg); }
.alert-info { background: var(--badge-blue); border-color: #d8e2f0; color: #3c5c8a; }
.alert-info .alert-ico { color: var(--badge-blue-fg); }
.alert-success { background: var(--badge-green); border-color: #cfe5dc; color: #3d7666; }
.alert-success .alert-ico { color: var(--badge-green-fg); }
.alert-actions { display: flex; gap: 8px; grid-area: actions; align-self: center; white-space: nowrap; }
@media (max-width: 720px) { .alert-body { grid-template-columns: 1fr; grid-template-areas: "title" "msg" "actions"; } .alert-actions { margin-top: 10px; } }

/* ============ Cards / sections ============ */
/* card — design system: rounded-2xl 16, p-6 24 (node 4607:65613) */
.section-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
.section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.section-title { font-size: 18px; line-height: 24px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; }
.section-desc { margin-top: 4px; font-size: 13px; color: var(--fg-secondary); }

/* status pills */
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 11px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.pill.green { background: var(--badge-green); color: var(--badge-green-fg); }
.pill.blue  { background: var(--badge-blue);  color: var(--badge-blue-fg); }
.pill.amber { background: var(--badge-amber); color: var(--badge-amber-fg); }
.pill.red   { background: var(--badge-red);   color: var(--badge-red-fg); }
.pill.gray  { background: var(--badge-gray);  color: var(--badge-gray-fg); }
.pill.solid { background: var(--badge-gray); color: var(--fg); }

/* ============ Plan row ============ */
.plan-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border: 1px solid var(--border-elements); border-radius: 10px; background: var(--muted); }
.plan-name { font-size: 16px; font-weight: 700; }
.plan-meta { margin-top: 2px; font-size: 12px; color: var(--fg-secondary); }
.plan-price { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }
.plan-price span { font-size: 13px; font-weight: 500; color: var(--fg-secondary); }

/* The Status column came out on 2026-08-24: §4.2's `active` is the MEANING of
   a status, not its name, and the pill in the card head already carries the name — for
   `canceled` the two were the same word, for `past_due` the same sentence three times.
   Two facts left, so they sit side by side at their own width instead of being spread
   across thirds of the card. */
.kv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
.plan-when { margin-top: 6px; font-size: 13px; color: var(--fg-secondary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plan-when strong { font-weight: 600; color: var(--fg); }
.plan-card { display: inline-flex; align-items: center; gap: 7px; color: var(--fg); font-weight: 600; }
.kv-label { font-size: 12px; color: var(--fg-secondary); }
.kv-value { margin-top: 6px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kv-value.muted { font-weight: 500; color: var(--fg-secondary); }

.section-foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-elements); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.foot-note { font-size: 12px; color: var(--fg-muted); }

/* ============ Card list ============ */
/* Two across, not five down. The limit is 5 cards (D-9), and as a single column the
   list ran the height of the section with each row's actions ~800px from the card they
   act on. auto-fill drops to one column when the container is narrow. */
/* One card per row (Grace, 9/1). It was an auto-fill grid that turned into two columns
   past ~850px, which put the second card BESIDE the default one instead of under it —
   and §12.3.2.1 orders the list "기본 카드 최상단", which only reads as an order when
   there is one column. */
.card-list { display: grid; grid-template-columns: 1fr; gap: 10px; align-items: stretch; }
.card-row { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--border-elements); border-radius: 10px; background: var(--card); }
/* The default card is the selected item in a list, so it uses the system's
   selection treatment — 2px accent border (node 4607:65567), not pink.
   Pink-soft is reserved for the active *tab*, a different pattern. */
.card-row.is-default { border: 2px solid var(--accent); padding: 15px 17px; }
.card-row.is-bad { border-color: #f3b9b9; background: #fffafa; }
.brand-mark { width: 44px; height: 30px; border-radius: 5px; border: 1px solid var(--border-muted); background: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; letter-spacing: .04em; flex-shrink: 0; }
.brand-visa { color: #1a1f71; }
.brand-mc { color: #eb001b; }
.brand-amex { color: #016fd0; }
.card-main { flex: 1; min-width: 0; }
.card-num { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-dots { font-family: 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .06em; }
.card-sub { margin-top: 3px; font-size: 12px; color: var(--fg-secondary); }
/* The blocker's picker is the Payment methods list — same .card-row, same .brand-mark, same
   button slot — so it needs no list styling of its own. Only the section label, the spacing
   between the declined card and the alternatives, and the footnote are new. */
.pick-label { margin: 20px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--fg-secondary); }
.pick-list { display: grid; gap: 8px; }
.pick-add { margin-top: 10px; }
.pick-note { margin: 14px 0 0; font-size: 12px; line-height: 18px; color: var(--fg-muted); }
.card-sub.danger { color: var(--destructive); font-weight: 600; }
.card-sub.warn { color: var(--badge-amber-fg); font-weight: 600; }
.card-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

/* tooltip on disabled action */
.tip { position: relative; display: inline-flex; }
/* For controls sitting at the top of a page, where the default upward bubble
   would clip off-screen (the campaign Send button). */
.tip.tip-below .tip-bubble { bottom: auto; top: calc(100% + 8px); }
.tip .tip-bubble { position: absolute; bottom: calc(100% + 8px); right: 0; width: 210px; white-space: normal; font-weight: 400; padding: 8px 10px; background: #1f1f1f; color: #fff; font-size: 11px; line-height: 15px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 40; }
.tip:hover .tip-bubble { opacity: 1; }

.helper { margin-top: 14px; font-size: 12px; color: var(--fg-secondary); display: flex; align-items: flex-start; gap: 6px; }
.helper svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; color: var(--fg-muted); }

/* ============ Empty state ============ */
.empty { padding: 40px 24px; border: 1px dashed var(--border-muted); border-radius: 12px; text-align: center; }
.empty-title { font-size: 15px; font-weight: 600; }
.empty-desc { margin-top: 4px; font-size: 13px; color: var(--fg-secondary); }
.empty-cta { margin-top: 16px; }

/* ============ Toolbar / filters ============ */
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
/* Input — design system node 4607:65616 (shadcn Input).
   36px tall · radius 8 · 12px inset · border base/elements-border
   focus base/ring #737373 · error base/destructive · disabled base/muted @50% */
.select, .input {
  height: 36px; padding: 0 12px;
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; line-height: 20px; color: var(--fg); font-family: inherit;
}
.select::placeholder, .input::placeholder { color: var(--fg-muted); }
/* Figma DropdownMenu 695:28331 — 36px, 16px side padding, 14px/20 **medium**, label in
   `base/secondary` #6b6b6b, 1px `base/elements-border` #f2ede7, radius 8. Only the select:
   an .input holds text the vendor typed, which stays full-contrast and regular weight. */
.select { padding: 0 16px; font-weight: 500; color: var(--fg-secondary); }
.select:hover, .input:hover { border-color: var(--fg-muted); }
.select:focus, .input:focus { outline: none; border-color: #737373; }
.select:disabled, .input:disabled { background: #f2f2f2; opacity: .5; cursor: not-allowed; }
.input.is-error, .select.is-error { border-color: var(--destructive); }
.field-desc { margin-top: 8px; font-size: 12px; line-height: 1; color: var(--fg-muted); }
.field-desc.is-error { color: var(--destructive); }
.toolbar-right { margin-left: auto; display: flex; gap: 8px; }

/* credit summary chip */
.credit-chip { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border: 1px solid var(--border-elements); border-radius: 10px; background: var(--muted); margin-bottom: 16px; flex-wrap: wrap; }
.credit-chip-item { display: flex; align-items: baseline; gap: 6px; }
.credit-chip-num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.credit-chip-label { font-size: 12px; color: var(--fg-secondary); }
.credit-chip-sep { width: 1px; height: 22px; background: var(--border-muted); }
/* Inline variant: sits inside a card that already has its own spacing, and carries
   settings rather than balances, so the figure drops to reading size. */
/* Three settings need ~650px on one line. Full width (split model) has 770; beside the
   balance card (unified) there are 380-500, so the row wrapped and left the 22px
   dividers stranded mid-air. Stacked, the line break does the divider's job. Rows stay
   label-then-value inline rather than a label column — an aligned column would rebuild
   the three-column grid this chip replaced. */
/* Stacked overrides is-inline's fit-content: the right-aligned values have to land on
   the CARD's right edge, not on the widest row's — hugged, the block floated mid-card
   with 130px of dead space to its right and the alignment stopped meaning anything. */
/* Values flush right (Grace, 2026-08-21): stacked, a ragged value edge made three
   settings look like three unrelated sentences. Right-aligned, tabular-nums lines the
   figures up in a column and the labels stay a left-hand rail. */

/* ============ Table ============ */
.tbl { width: 100%; border-collapse: collapse; }
/* Figma `Table(01)` — node 695:28334 inside the Billing History card 695:28270.
   Head 36px · Cell 64px · 12px side padding · 14/20 text · 1px `base/border` #f2ede7 rules
   · NO fill behind the header (so no top radius either) · every column LEFT-aligned,
   amounts included · body text at full contrast, not muted.
   What this replaced was ours: a 12px 600 header on a grey band, 13px body, 15/14 padding,
   right-aligned amounts, muted dates and cards. */
.tbl th { height: 36px; padding: 0 12px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--fg-secondary); text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
/* The first and last columns sat 14px from the card's edge, which read as content jammed
   against the border on a wide table (Grace, 2026-09-08). 22px gives them room and keeps
   every table's ending line identical, since all three get the same inset. */
.tbl th:first-child { border-top-left-radius: 8px; }
.tbl th:last-child { border-top-right-radius: 8px; }
.tbl td { height: 64px; padding: 0 12px; font-size: 14px; line-height: 20px; border-bottom: 1px solid var(--border); vertical-align: middle; }
/* Tabular figures without an alignment of their own — `.t-num` also right-aligns, which is
   right in the settlement and PO sheets and wrong here (Figma left-aligns Amount). */
.t-tab { font-variant-numeric: tabular-nums; }
/* Figma keeps the rule under the last row — the table ends on a line, not on air. */
.tbl tbody tr:hover td { background: #fcfbfa; }
.t-muted { color: var(--fg-secondary); }
.t-num { font-variant-numeric: tabular-nums; text-align: right; }
/* Every .tbl is width:100%, so the tables already share their edges — what did not line up
   was the CONTENT of the last column: a right-aligned number ends at the cell's padding,
   a left-aligned Receipt link ends wherever its text stops. Right-aligning the receipt
   column puts all three tables' last column on one ending line (Grace, 2026-09-08). */
.t-right { text-align: right; }
.t-strong { font-weight: 600; }
/* Figma 695:28379 — 12px medium, UNDERLINED, near-black, 14px icon, 4px gap. It read as
   muted grey with no underline before, which is why it did not look like a link at all. */
.receipt-link { display: inline-flex; align-items: center; gap: 4px; color: var(--fg); font-size: 12px; font-weight: 500; text-decoration: underline; }
.receipt-link:hover { color: var(--primary); }
.receipt-link svg { width: 14px; height: 14px; }
.tbl-scroll { overflow-x: auto; }

/* ============ Credit dashboard ============ */
.balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
.balance-grid > .section-card, .balance-grid > .balance-card { display: flex; flex-direction: column; }
.balance-card { border: 1px solid var(--border); border-radius: 16px; background: var(--card); padding: 24px; }
/* Aligned to Figma card(01) (443:169300): the head row is that component's `header`
   frame — which has a right-hand slot of its own — the number is `Data`, and the unit
   line is `Sub title`. Gaps are the component's: header→Data spacing/2 = 8,
   Data→Sub spacing/1-5 = 6. */
.balance-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; min-height: 28px; }
/* the title row must stay on one line — wrapping it changes the header
   height and knocks this card out of alignment with the one beside it */
.balance-type { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--fg-secondary); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.balance-big { font-size: 30px; line-height: 36px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1.12px; }
.balance-unit { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--fg-secondary); }
.balance-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-elements); }
.split-label { font-size: 11px; color: var(--fg-secondary); display: flex; align-items: center; gap: 5px; }
.split-dot { width: 7px; height: 7px; border-radius: 2px; }
.split-dot.reserved { background: var(--badge-blue-fg); }
.split-dot.available { background: var(--success); }
.split-val { margin-top: 4px; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
/* Meter — a bar is only readable against a reference point, so the auto-recharge
   threshold is marked on it (Vercel Geist: "progress relative to a limit"). */
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--muted); display: flex; overflow: hidden; margin-top: 18px; }
/* Pinned to the bottom of the card so the two balance cards line up even though one
   has a two-part hero (available + reserved) and the other a single number. */
.balance-card .meter { margin-top: auto; }
.balance-card .balance-hero { margin-bottom: 18px; }
.balance-hero .hero-part .balance-unit { margin-top: -2px; }
.meter-fill { height: 100%; }
.meter-fill.available { background: var(--success); }
.meter-fill.reserved { background: var(--badge-blue-fg); opacity: .4; }
.meter-low .meter-fill.available { background: var(--badge-amber-fg); }
.meter-empty .meter-fill.available { background: var(--destructive); }
/* The tick has to read on green, on blue-grey and on the empty track alike,
   so it carries a halo in the card colour instead of relying on opacity. */
.meter-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--fg-secondary); box-shadow: 0 0 0 2px var(--card); }
.meter-legend { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--fg-muted); }

/* ── Sending status (PRD §9) ────────────────────────────────────────────────
   Quiet when everything passes — one line of reassurance. Loud only when
   something actually blocks sending, and then each blocker carries its fix. */
.send-status.is-blocked { border-color: #f3b9b9; background: #fffafa; }
/* Number identity card */
.num-card { padding: 20px 24px; }
.num-head { display: flex; align-items: center; gap: 16px; }
.num-main { padding-left: 0; }
.num-card.red, .num-card.amber { border-color: var(--border-muted); }
.num-main { flex: 1; min-width: 0; }
.num-label { font-size: 12px; color: var(--fg-secondary); }
.num-value { margin-top: 1px; font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.num-note { margin-top: 3px; font-size: 12px; color: var(--fg-muted); }
.num-side { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.num-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; }
.num-card .check-list { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-elements); }
@media (max-width: 720px) { .num-head { flex-wrap: wrap; } .num-side { width: 100%; justify-content: flex-start; } }

/* healthy: a strip, not a card */
.send-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border: 1px solid var(--border); border-radius: 10px; background: var(--sidebar-bg); font-size: 13px; flex-wrap: wrap; }
.send-bar-left { display: inline-flex; align-items: center; gap: 10px; }
.send-bar-left strong { font-weight: 600; }
.send-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
.send-label { color: var(--fg-secondary); }
.send-num { font-weight: 600; color: var(--fg); }
.check-list { display: flex; flex-direction: column; gap: 10px; }
.check-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.check-ico { width: 18px; height: 18px; flex-shrink: 0; color: var(--success); display: inline-flex; }
.check-ico svg { width: 18px; height: 18px; }
.check-row.is-bad .check-ico { color: var(--destructive); }
.check-row.is-bad .check-text { color: #991b1b; font-weight: 500; }
.check-text { flex: 1; }

/* ── Unified balance card ────────────────────────────────────────────────────
   One balance is a different shape of problem from two, so it gets its own
   layout: the hero anchors the left, the meter takes the width it wants, and
   the rate + reservation sit on one footer line. */

.u-foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border-elements); flex-wrap: wrap; }
.u-foot .balance-note { margin: 0; padding: 0; border: none; }


@media (max-width: 900px) {
  .u-body { flex-direction: column; align-items: stretch; gap: 16px; }
  .u-meter { padding-bottom: 0; }
}

/* Hero figure: what the vendor can actually send right now */
.balance-hero { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
/* Two-part hero: ready-to-send keeps the big number because it is the actionable
   one; reserved gets its own line at a smaller size and carries the drill-down.
   Stacked, not side by side — these cards are half-width, and two columns squeezed
   the labels into three-line wraps. Stacking also mirrors the meter's two segments. */
.balance-hero.has-split { align-items: stretch; gap: 10px; }
.balance-hero .hero-part { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
/* Reserved reads as one line (Grace, 2026-08-24): the number and what holds it are a
   single fact, and stacked they also made this card ~26px taller than a sibling with
   nothing reserved, which is where the empty block in the MMS card came from. */
.balance-hero .hero-part-inline { flex-direction: row; align-items: baseline; gap: 7px; }
.balance-hero .hero-part-inline .balance-unit { margin-top: 0; }
.hero-sep { height: 1px; background: var(--border-elements); margin: 2px 0; }
.balance-mid { font-size: 20px; line-height: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.6px; color: var(--fg-secondary); }


/* Reserved is the only figure the hero and legend don't already carry, so it
   gets one line — and only when there is something reserved. */
.balance-note { display: flex; align-items: center; gap: 7px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-elements); font-size: 12px; }
.balance-note-text { font-size: 12px; font-weight: 500; color: var(--fg-secondary); }

.balance-head + .foot-note { margin-top: 0; }
.auto-main { flex: 1; }
/* ── stat-card — Figma `card(01)`, node 443:169300 ──────────────────────────────
   From "Linesheet Details-Statistics (Option02)" (443:169270), the final design.
   Measurements pulled node by node rather than eyeballed:
     card      padding spacing/6 = 24 · radius rounded-2xl = 16 · border base/elements-border
     label     text/xs 12/16 · font-weight/medium 500 · base/secondary #6b6b6b
     value     text/3xl 30/36 · bold · tracking -1.12px · base/foreground #1f1f1f
     sub       text/xs 12/16 · font-weight/normal 400 · base/secondary
     gaps      label→value spacing/2 = 8 · value→sub spacing/1-5 = 6 · card→card 16

   ⚠ Token naming is inverted between Figma and this file: Figma's
   `base/elements-border` (#f2ede7) is our `--border`, while our `--border-elements`
   is #ececec — a different value. The card uses `--border`.

   Separate cards, not one panel with internal dividers: the live screenshot showed
   dividers but the final design does not, and this is the shipped component.

   ⚠ NOT used for the auto-recharge summary. This is a KPI card — the 30px value slot
   exists to make a headline number loud, which is right for `Total Sales $162,400`
   and wrong for `200`, a threshold the vendor set. Applying it there gave settings
   the weight of results. Kept defined because the balance cards are a real candidate:
   `440` + `ready to send` is exactly this Data + Sub title shape. */
.stat-row { display: flex; flex-wrap: wrap; gap: 16px; }
.stat-card { flex: 1 1 190px; min-width: 0; display: flex; flex-direction: column; gap: 6px;
  padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
.stat-title { display: flex; flex-direction: column; gap: 8px; }
.stat-label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--fg-secondary); }
.stat-value { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -1.12px;
  color: var(--fg); font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--fg-secondary); }

.toggle-inline { display: inline-flex; align-items: center; gap: 8px; margin-left: 10px; }
.onoff-btn { border: none; background: transparent; padding: 3px 11px; border-radius: 6px; font: inherit;
  font-size: 11.5px; font-weight: 700; letter-spacing: .03em; color: var(--fg-muted); cursor: pointer; }


/* ============ Billing history pager (Figma 1:16551) ============ */
/* NO border-top (Grace, 2026-09-09: 마지막 라인이 2개라서 중복이어보이는데 한개로 해줘).
   `.tbl td` already draws a bottom border on the last row, so the pager's own top rule

.pager-nav { display: inline-flex; align-items: center; gap: 2px; }
.pager-btn { height: 32px; min-width: 32px; padding: 0 10px; border: none; background: transparent; border-radius: 6px; font-family: inherit; font-size: 13px; color: var(--fg-secondary); cursor: pointer; }
.pager-btn:hover:not(:disabled):not(.is-cur) { background: var(--muted); color: var(--fg); }
.pager-btn.is-cur { background: var(--muted); color: var(--fg); font-weight: 600; }
.pager-btn:disabled { color: var(--fg-muted); cursor: not-allowed; }
.pager-dots { color: var(--fg-muted); padding: 0 4px; }
/* v2.5 §4.3.2 — the only thing a past expiry gets: the number, in red. */
.exp-past { color: var(--destructive); }
.pager-range { margin-right: auto; font-size: 12.5px; color: var(--fg-secondary); font-variant-numeric: tabular-nums; }
.ext-link { display: inline-flex; width: 12px; height: 12px; color: var(--fg-muted); vertical-align: -1px; }
.ext-link svg { width: 12px; height: 12px; }

/* ============ Subscribe — unsubscribed state (Figma 1:21950) ============ */
.plan-hero { display: flex; align-items: center; gap: 20px; padding: 22px 24px; background: var(--muted); border-radius: 10px; flex-wrap: wrap; }
.plan-hero-price { font-size: 40px; line-height: 44px; font-weight: 700; color: var(--primary); letter-spacing: -.02em; }

.precheck.ok { background: var(--badge-green); color: #3d7666; }

.precheck.short { background: var(--badge-amber); color: #7c5a2e; }
