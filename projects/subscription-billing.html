const ordEffSel = () => S.ordAll ? ORDERS.map(o => o.no) : (S.ordSel || []);
const ordMoney = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* Orders without their own line list render one line for the whole order, so the item table,
   the summary card and the list row always agree on the amount. */
const ordItems = (o) => o.no === 'ORD-20240314' ? ORD_ITEMS_0314
  : [{ grp: 'In Stock', rows: [{ name: o.ls, sku: 'FS25-' + o.no.slice(-6), o1: 'Assorted', o2: '', qty: 1, price: o.amt }] }];

function screenOrders() {
  const size = S.ordSize || 10;
  const pageCount = Math.max(1, Math.ceil(ORDERS.length / size));
  const page = Math.min(Math.max(0, S.ordPage || 0), pageCount - 1);
  const shown = ORDERS.slice(page * size, page * size + size);
  const sel = new Set(ordEffSel());
  const onPage = shown.filter(o => sel.has(o.no)).length;
  const headState = onPage === 0 ? '' : onPage === shown.length ? 'is-on' : 'is-mixed';
  const withPO = [...sel].filter(no => ordHasPO(ordFind(no))).length;

  const noShip = (o) => /^0 out/.test(o.ship);
  const awaiting = ORDERS.filter(o => o.status === 'New').length;
  const prep = ORDERS.filter(o => o.status === 'In Progress' && noShip(o) && !o.late).length;
  const pastDue = ORDERS.filter(o => o.status === 'In Progress' && noShip(o) && o.late).length;
  const card = (n, step, name, line, desc, red) => `
      <div class="ord-card">
        <div class="ord-card-top">
          <div class="ord-card-head">
            <span class="ord-card-num${red ? ' red' : ''}">${n}</span>
            <span>${step ? `<span class="ord-card-step">${step}</span>` : ''}<span class="ord-card-name${red ? ' red' : ''}">${name}</span></span>
          </div>
          <button class="ord-card-go${red ? ' is-hot' : ''}" aria-label="${name}">${OI.dbl}</button>
        </div>
        <div class="ord-card-line"><b>${line}</b><span>${desc}</span></div>
      </div>`;
  const cards = card(awaiting, 'Step 1', 'Awaiting Confirmation', 'Confirm orders to notify buyers', 'Review items, adjust qty, and set est. ship dates. Buyers are waiting for your confirmation.')
    + card(prep, 'Step 2', 'Prepare Shipment', 'Group items and create shipments', 'Confirmed orders not yet in a shipment. Create shipments at least 7 days before est. ship date.')
    + card(pastDue, '', 'Past Due', 'Create a shipment or update the date', 'Est. ship date has passed with no shipment created. Buyers are waiting — act now.', true);

  const th = (label, sort) => `<th><span class="ord-th">${label}${sort ? OI.sort : ''}</span></th>`;
  // Figma's column measures, plus the selection column this build adds in front of them.
  const cols = [32, 140, 214.8, 214.8, 214.8, 132, 214.8, 214.8, 132].map(w => `<col style="width:${w}px">`).join('');
  const pageBox = `<th class="ord-cb"><button class="ord-cb-btn" data-act="ordTogglePage" aria-label="Select all orders on this page"><span class="chk ${headState}">${OI.tick}</span></button></th>`;
  /* §15 — only a confirmed order has a PO, so the button counts those and says so. */
  const dlBtn = withPO === 0
    ? `<span class="tip tip-below"><button class="ord-sel-act" disabled>${ICO.dl}Download POs</button><span class="tip-bubble">None of the selected orders has a PO yet. A PO is created when an order is confirmed.</span></span>`
    : `<button class="ord-sel-act" data-act="ordDownloadPOs">${ICO.dl}Download ${withPO} PO${withPO === 1 ? '' : 's'}</button>`;
  const N = ORDERS.length;
  const pageLink = S.ordAll
    ? 'All orders that match these filters are selected'
    : (onPage === shown.length && N > shown.length
        ? (N <= ORD_MAX
            ? `<button class="ord-sel-link" data-act="ordSelMatching">Select all ${N} orders that match these filters</button>`
            : `Up to ${ORD_MAX} orders per download`)
        : '');
  const head = `<tr>
        ${pageBox}
        ${th('Order Date', 1)}${th('Order #', 0)}${th('Buyer', 1)}${th('Linesheet', 1)}${th('Total', 1)}${th('Shipment Created', 1)}${th('Next Ship Deadline', 1)}${th('Status', 1)}
      </tr>`;
  const selbar = sel.size === 0 ? '' : `
        <div class="ord-selbar" role="region" aria-label="Selected orders">
          <b>${sel.size} selected</b>${pageLink ? `<span class="ord-sel-sep">·</span>${pageLink}` : ''}
          <div class="ord-sel-right">
            ${dlBtn}
            <span class="ord-sel-div" aria-hidden="true"></span>
            <button class="ord-sel-act" data-act="ordClear">Clear selection</button>
          </div>
        </div>`;
  const rows = shown.map(o => {
    const on = sel.has(o.no);
    return `
      <tr class="${on ? 'is-sel' : ''}">
        <td class="ord-cb"><button class="ord-cb-btn" data-act="ordToggle" data-val="${o.no}" aria-label="Select ${o.no}"><span class="chk${on ? ' is-on' : ''}">${OI.tick}</span></button></td>
        <td>${o.date}</td>
        <td><button class="ord-no" data-act="ordOpen" data-val="${o.no}">${o.no}</button></td>
        <td><span class="ord-clip">${o.buyer}</span></td>
        <td><span class="ord-clip">${o.ls}</span></td>
        <td>${o.total}</td>
        <td>${o.ship}</td>
        <td>${o.dl ? `<div>${o.dl}</div><div class="ord-sub${o.late ? ' red' : ''}">${o.dlSub}</div>` : '-'}</td>
        <td>${o.status}</td>
      </tr>`;
  }).join('');

  const nums = Array.from({ length: pageCount }, (_, i) =>
    `<button class="pager-btn ${i === page ? 'is-cur' : ''}" data-act="ordPage" data-val="${i}">${i + 1}</button>`).join('');
  const sizes = [10, 30, 50].map(n => `<option ${n === size ? 'selected' : ''}>${n}</option>`).join('');
  const foot = `
      <div class="ord-foot">
        <label class="ord-size">Row per page: <select class="select" id="ord-size">${sizes}</select></label>
        <span class="ord-total">Total<b>${ORDERS.length}</b></span>
        <div class="pager-nav">
          <button class="pager-btn" data-act="ordPage" data-val="${page - 1}" ${page === 0 ? 'disabled' : ''}>‹ Previous</button>
          ${nums}
          <button class="pager-btn" data-act="ordPage" data-val="${page + 1}" ${page === pageCount - 1 ? 'disabled' : ''}>Next ›</button>
        </div>
      </div>`;

  return h`
  <div class="tabbar-sticky">
  <div class="tabbar" role="tablist">
    <div class="acct-tabs">
      <button class="acct-tab is-active">Order List</button>
      <button class="acct-tab">Shipment List<span class="ord-count">8</span></button>
      <button class="acct-tab">Draft List</button>
    </div>
  </div>
  </div>
  <div class="page-head ord">
    <div class="ord-titlebar">
      <div class="page-title">Order List</div>
      <button class="btn btn-primary"><span class="btn-ico">${ICO.plus}</span>Create Order</button>
    </div>
  </div>
  <div class="body ord">
    <div class="ord-cards">${cards}</div>
    <section class="section-card" id="ord-list">
      <div class="toolbar${sel.size ? ' is-selecting' : ''}">
        <div class="ord-join">
          <div class="ord-search">${OI.search}<input class="input" placeholder="Search order #, buyer, linesheet"></div>
          <select class="select"><option>All Statuses</option><option>New</option><option>In Progress</option><option>Closed</option></select>
        </div>
        <div class="ord-join">
          <span class="ord-join-label">Created on</span>
          <select class="select"><option>This Month</option><option>Last 30 days</option><option>Last 3 months</option></select>
        </div>
        <div class="toolbar-right">
          <button class="btn btn-outline" data-act="ordExport"><span class="btn-ico">${ICO.dl}</span>Export<span class="ord-caret">${OI.down}</span></button>
        </div>${selbar}
      </div>
      <div class="tbl-scroll"><table class="tbl ord-tbl"><colgroup>${cols}</colgroup><thead>${head}</thead><tbody>${rows}</tbody></table></div>
      ${foot}
    </section>
  </div>`;
}

function screenOrderDetail() {
  const o = ordCur();
  const po = ordHasPO(o);
  const groups = ordItems(o);
  const flat = groups.flatMap(g => g.rows);
  const pcs = flat.reduce((a, r) => a + r.qty, 0);
  const sub = flat.reduce((a, r) => a + r.qty * r.price, 0);
  const b = o.no === 'ORD-20240314' ? ORD_BUYER_0314
    : { email: 'orders@' + o.buyer.toLowerCase().replace(/[^a-z]+/g, '') + '.com', phone: '+1 (123) 456 - 7890', ship: ORD_BUYER_0314.ship };
  const dlLabel = `<span class="btn-ico">${ICO.dl}</span>Download PO`;
  const dl = po
    ? `<button class="btn btn-outline ord-dl" data-act="ordDownloadPO">${dlLabel}</button>`
    : `<span class="tip tip-below"><button class="btn btn-outline ord-dl" disabled>${dlLabel}</button><span class="tip-bubble">A PO is created when this order is confirmed.</span></span>`;
  const kv = (k, v) => `<div class="ord-kv"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const inp = (v, cls) => `<span class="ord-in ${cls}">${v}</span>`;
  const shipCell = (g) => inp((g.grp.startsWith('Ship by ') ? g.grp.slice(8) : 'In Stock') + OI.cal, 'date');
  const itemRows = groups.map(g => `
        <tr class="ord-grp"><td class="ord-cb"><span class="chk">${OI.tick}</span></td>
          <td colspan="7"><b>${g.grp}</b><span class="ord-count-muted">${g.rows.length} item${g.rows.length === 1 ? '' : 's'}</span></td>
          <td>${shipCell(g)}</td><td></td></tr>`
    + g.rows.map(r => `
        <tr>
          <td class="ord-cb"><span class="chk">${OI.tick}</span></td>
          <td>${r.name ? `<div class="ord-item">${r.name}</div>` : ''}<div class="ord-sku">${r.sku}</div></td>
          <td>${r.o1}</td><td>${r.o2}</td>
          <td>${inp(r.qty, 'qty')} <span class="ord-count-muted">pcs</span></td>
          <td>${inp('0', 'disc')} ${inp('$' + OI.down, 'cur')}</td>
          <td>${ordMoney(r.price)}</td><td>${ordMoney(r.qty * r.price)}</td>
          <td>${shipCell(g)}</td>
          <td class="ord-act">${OI.trash}</td>
        </tr>`).join('')).join('');

  return h`
  <div class="tabbar-sticky">
  <div class="tabbar ord-topbar">
    <button class="ord-back" data-act="ordBack">${OI.back}Back to Order List</button>
  </div>
  </div>
  <div class="page-head ord">
    <div class="ord-titlebar">
      <div class="ord-title-l"><div class="page-title">Order #${o.no}</div><span class="pill ${o.status === 'In Progress' ? 'blue' : 'gray'}">${o.status.replace(' ', '-')}</span></div>
      ${dl}
    </div>
  </div>
  <div class="body ord">
    <div class="ord-info">
      <div class="ord-info-main">
        <div class="ord-info-col">
          <div class="ord-info-h">Order Summary</div>
          ${kv('Ordered On', o.date)}${kv('Linesheet', `<span class="ord-clip1">${o.ls}</span>`)}${kv('Payment Method', 'Credit Card')}
        </div>
        <div class="ord-info-col">
          <div class="ord-info-h">Buyer Information</div>
          ${kv('Company', o.buyer)}${kv('Email', b.email)}${kv('Phone Number', b.phone)}
        </div>
        <div class="ord-info-col ord-info-split">
          <div>
            <div class="ord-info-h">Shipping Address<span class="ord-info-ico">${ICO.copy}${OI.edit}</span></div>
            <div class="ord-addr">${b.ship.join('<br>')}</div>
          </div>
          <div class="ord-notes"><div class="ord-info-h" style="margin:0">Notes (Internal)<span class="ord-info-ico">${OI.edit}</span></div></div>
        </div>
      </div>
      <div class="ord-totals">
        <div class="ord-info-h">Order Summary</div>
        <div class="row"><span>Subtotal (${pcs} pcs)</span><span>${ordMoney(sub)}</span></div>
        <div class="row"><span>Discount</span><span>-$0.00</span></div>
        <div class="row"><span>Shipping Fee</span><span>-$0.00</span></div>
        <div class="row tot"><span>Total</span><span>${ordMoney(sub)}</span></div>
      </div>
    </div>
    <section class="section-card">
      <div class="section-head">
        <div class="section-title">All Items<span class="ord-count-muted">${flat.length} total</span></div>

      </div>
      <div class="tbl-scroll"><table class="tbl ord-items">
        <thead><tr><th class="ord-cb"><span class="chk">${OI.tick}</span></th><th>Item</th><th>Option1</th><th>Option2</th><th>Qty / Packs</th><th>Discount</th><th>Price</th><th>Amount</th><th><span class="ord-th">Est. Ship Date${OI.sort}</span></th><th>Action</th></tr></thead>
        <tbody>${itemRows}</tbody>
      </table></div>
    </section>
  </div>`;
}

/* Export stays a CSV of the orders in the current view — POs are a separate action. */
function exportOrders() {
  const esc = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const line = (a) => a.map(esc).join(',');
  const csv = [line(['Order Date', 'Order #', 'Buyer', 'Linesheet', 'Total', 'Shipment Created', 'Next Ship Deadline', 'Status'])]
    .concat(ORDERS.map(o => line([o.date, o.no, o.buyer, o.ls, o.total, o.ship, o.dl, o.status]))).join('\r\n');
  const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `shopcord-orders-${ORD_TODAY}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Export ready', `${ORDERS.length} orders · shopcord-orders-${ORD_TODAY}.csv`);
}

function render() {
  const s = sc();
  const screen = s.screen;

  document.getElementById('main').innerHTML =
    screen === 'orders' ? screenOrders()
    : screen === 'orderDetail' ? screenOrderDetail()
    : screen === 'campaign' ? screenCampaign()
    : screenAccount();

  // sidebar active state
  document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('active'));
  // Figma shows the footer with no selected state — "My Account" is always bold.
  if (screen === 'campaign') document.querySelector('[data-goto="campaign"]').classList.add('active');
  if (screen === 'orders' || screen === 'orderDetail') document.querySelector('[data-goto="orders"]').classList.add('active');
  document.getElementById('sb-acct-dot').hidden =
    !(inGrace() || (s.credits && s.credits.sms === 0));   // expiry no longer signals anything (§4.3.2)

  // transient event acknowledgement
  document.getElementById('toast-root').innerHTML = S.toast ? h`
    <div class="toast-wrap"><div class="toast ${S.toast.kind && S.toast.kind !== 'success' ? 'is-' + S.toast.kind : ''}" role="status" aria-live="polite">
      <span class="toast-ico">${S.toast.kind === 'info' ? ICO.info : ICO.check}</span>
      <div class="toast-body">
        <div class="toast-title">${S.toast.title}</div>
        <div class="toast-msg">${S.toast.msg}</div>
      </div>
    </div></div>` : '';

  // overlay — drawer for input, modal for confirmation only
  const root = document.getElementById('modal-root');
  if (!S.modal) root.innerHTML = '';
  else {
    const o = OVERLAYS[S.modal];
    root.innerHTML = o.kind === 'drawer'
      ? `<div class="drawer-scrim" data-act="scrim"></div><aside class="drawer" role="dialog">${o.render()}</aside>`
      : `<div class="scrim" data-act="scrim">${o.render()}</div>`;
  }

  // Annotation pins are positioned from the live DOM, so they re-place after every render.
  // This must run AFTER the overlay is painted: anTargets() scopes to the open modal, and
  // an empty #modal-root would leave the page's own pins sitting on top of the scrim.
  // Synchronous, not requestAnimationFrame: a backgrounded tab suspends animation frames
  // and the pins would then describe the previous state.
  if (typeof anSync === 'function' && typeof AN !== 'undefined' && AN.on) anSync();

  renderProto();
}

// ── Events ──────────────────────────────────────────────────────────────────
window.addEventListener('afterprint', () => { delete document.body.dataset.print; });

document.addEventListener('click', (e) => {
  const scEl = e.target.closest('[data-scenario]');
  if (scEl) { setScenario(scEl.dataset.scenario); return; }

  const tabEl = e.target.closest('[data-tab]');
  if (tabEl) { goTab(tabEl.dataset.tab); return; }

  const gotoEl = e.target.closest('[data-goto]');
  if (gotoEl) { go(gotoEl.dataset.goto); return; }

  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const act = actEl.dataset.act;

  switch (act) {
    // Orders — the PO's download entry points (§15.2 ① · PB 6.4.0)
    case 'ordToggle': {
      const no = actEl.dataset.val;
      if (S.ordAll) { S.ordSel = ORDERS.map(o => o.no); S.ordAll = false; }
      const set = new Set(S.ordSel || []);
      if (set.has(no)) set.delete(no); else set.add(no);
      S.ordSel = [...set]; render(); break;
    }
    case 'ordTogglePage': {
      const size = S.ordSize || 10, page = S.ordPage || 0;
      const shown = ORDERS.slice(page * size, page * size + size).map(o => o.no);
      if (S.ordAll) { S.ordAll = false; S.ordSel = []; render(); break; }
      const set = new Set(S.ordSel || []);
      const all = shown.every(no => set.has(no));
      shown.forEach(no => { if (all) set.delete(no); else set.add(no); });
      S.ordSel = [...set]; render(); break;
    }
    case 'ordSelMatching': S.ordAll = true; render(); break;
    case 'ordClear':       S.ordSel = []; S.ordAll = false; render(); break;
    case 'ordPage':        S.ordPage = Number(actEl.dataset.val); S.ordSel = []; S.ordAll = false; render(); break;   // a selection belongs to its page
    case 'ordDownloadPOs': {
      const picked = ordEffSel();
      const n = picked.filter(no => ordHasPO(ordFind(no))).length;
      const skip = picked.length - n;
      S.ordSel = []; S.ordAll = false;
      showToast(`${n} PO${n === 1 ? '' : 's'} downloaded`,
        `POs_${ORD_TODAY}.zip` + (skip ? ` · ${skip} not yet confirmed, skipped` : ''));
      render(); break;
    }
    case 'ordOpen': {
      const o = ordFind(actEl.dataset.val);
      setScenario(ordHasPO(o) ? 'orderDetail' : 'orderDetailNew');
      S.ordNo = o.no; render(); break;
    }
    case 'ordBack':       setScenario('ordersList'); break;
    case 'ordDownloadPO': S.docKey = 'po'; openModal('doc'); break;
    case 'ordExport':     exportOrders(); break;
    // Card entry is inline: land on Payment methods, expand the form, focus it.
    case 'addCard':
      if (sc().screen !== 'account') setScenario(sc().cardBad ? 'failed' : 'active');
      S.cardFlash = false;
      openModal('addCard');   // an overlay — no need to leave the screen
      break;
    case 'cardCancel':   closeModal(); break;
    case 'saveCard':
      S.modal = null;
      if (S.key === 'failed') {
        setScenario('restored');
        showToast('Payment restored',
          'Mastercard ····8210 was charged $20.00. Your subscription is active again' + (hasCredits() ? ' and your SMS credits are unfrozen.' : '.'));
      } else if (S.cardReturn) {
        // §14.2 step 2 — enrolment returns to the confirmation, it is not the end of the
        // flow. Without this the vendor has a card and no subscription. The flag is set by
        // whoever sent them here, so the picker's Add and the no-card path both come back.
        if (!sc().cards.length) sc().cards = ['visa'];   // the card just saved — it stays saved if the vendor stops at the confirmation
        S.modal = S.cardReturn; S.cardReturn = null; S.cardStep = null; render(); break;
      }
      S.cardFlash = true; render();
      setTimeout(() => { S.cardFlash = false; render(); }, 1800);
      break;

    // §6.2 step 1 → 2 or 3: no card enrols first, an existing card goes straight
    // to the confirmation. Either way consent is recorded before anything charges.
    case 'subscribe':
      S.consent = false;   // a fresh dialog is never pre-consented (PB 2.3.0)
      S.cardStep = null;   // and it opens on the card that is actually on file
      // A declined default is checked BEFORE the confirmation screen: consenting to a charge
      // we expect to fail is worse than one extra step (PB 1.8.0 · §5.1).
      // 🔴 That check is also why "the default card is declined" cannot arise INSIDE the
      // popup today. If K-22 is ever reversed, the card slot needs a change control here.
      if (defaultDeclined()) { S.tab = 'billing'; openModal('subscribeBlocked'); }
      // §14.2 step 2 — no card enrols FIRST, in its own modal, because Balance's widget cannot
      // be embedded in the confirmation (PM, 9/22). saveCard brings the vendor back here.
      else if (!sc().cards.length) { S.cardReturn = 'confirmSubscribe'; S.tab = 'billing'; openModal('addCard'); }
      else { S.tab = 'billing'; S.modal = 'confirmSubscribe'; render(); }
      break;
    // Adding a card from the confirmation's picker: same modal, same return.
    case 'subAddCard': S.cardReturn = 'confirmSubscribe'; openModal('addCard'); break;
    /* Choosing a card here IS setting the default (PB 1.4.0), so it reorders the list exactly
       the way `setDefault` does, then carries the vendor on to the confirmation screen rather
       than dropping them back on the page to press Subscribe a second time. */
    case 'subPickCard': {
      const id = actEl.dataset.val;
      sc().cards = [id, ...sc().cards.filter(x => x !== id)];
      sc().cardBad = false;   // the declined card is no longer the one being charged
      S.cardStep = null;      // back to the filled view, now showing the card just chosen
      S.modal = 'confirmSubscribe'; render();
      showToast('Default card changed', `${CARDS[id].name} ···· ${CARDS[id].last4} will be charged.`);
      break;
    }
    // Confirming the cancel modal used to just close it, leaving the vendor on the
    // screen they were cancelling from — the state they landed in didn't exist.
    case 'doCancelSub':
      S.modal = null; setScenario('cancelling'); S.tab = 'billing';   // the scenario carrying cancelAt
      // Not `canceled` — that is the state after the period ends (§7). Telling the
      // vendor "paid features are off" the instant they confirm was false for a month.
      showToast('Cancellation scheduled',
        `Your subscription stays active until ${clock().next}. Resume any time before then and nothing is charged.`);
      render();
      break;
    /* §3.5 재개 (해지 철회) ONLY — the period is still running, so this clears the flag and
       charges nothing (PB 2.7.0 "무결제 복귀"). The subscription and its consent are the
       same ones, so §14.2 is not re-run. Coming back from `canceled` is a different thing
       — "신규 구독 플로우" — and goes through `subscribe`. */
    case 'resumeSub': {
      S.modal = null; setScenario('active'); S.tab = 'billing';
      showToast('Subscription resumed',
        'Your subscription continues as normal. Nothing was charged — the current period was already paid for.');
      render();
      break;
    }
    // PB 2.3.0 stores the consent, so the box has to be ticked before anything is recorded.
    case 'consentToggle': S.consent = !S.consent; render(); break;
    // The card slot's three views (Grace, 9/22) — never a second dialog.
    case 'cardPick':     S.cardStep = 'pick'; render(); break;
    case 'cardSlotBack': S.cardStep = null;   render(); break;
    case 'doSubscribe': {
      /* §14.2 ④⑤ resolve here: consent stored, subscription started, card charged (nothing on
         a trial). A card always exists by now — the card modal ran first if there was none
         (§14.2 ②) — so PB 2.3.0's record can carry the card ID. */
      const trial = trialOffered();   // read before setScenario clears S.trialOffer
      S.modal = null;
      /* §3.2.2 ⑦ — 부여 판정은 과거 체험 이력. No history lands on the trial; history is
         charged on the spot (§3.5 · §5.5.3). */
      setScenario(trial ? 'trial' : 'active');
      S.tab = 'billing';
      showToast('Subscription started', trial
        ? `Your ${TRIAL_MONTHS}-month free trial has started. Nothing is charged until ${TRIAL.first}.`
        : `${TAX.total} was charged to your default card. Your subscription is active.`);
      render();
      break;
    }
    // Pack purchase is inline on the credit dashboard; the button pressed decides the type.
    case 'buyPack':
      if (sc().screen !== 'account') setScenario('credits');
      S.tab = smsTab(); S.modal = null; S.packType = actEl.dataset.val || (isUnified() ? 'credits' : 'sms'); S.packSel = 1; S.packOpen = true;
      render();
      requestAnimationFrame(() => {
        document.getElementById('pack-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      break;
    case 'packCancel':   S.packOpen = false; render(); break;
    case 'histPage':     S.histPage = Number(actEl.dataset.val); render(); break;
    case 'exportHistory': exportBillingHistory(); break;
    case 'sendWhen':     S.sendWhen = actEl.dataset.val; render(); break;
    case 'packBuy':      S.packOpen = false; render(); break;
    case 'email':        S.emailKey = actEl.dataset.val; openModal('email'); break;
    case 'doc':          S.docKey = actEl.dataset.val; openModal('doc'); break;
    // The print stylesheet keys off this flag; clear it however the dialog closed.
    case 'printDoc':
      document.body.dataset.print = 'doc';
      window.print();
      break;
    case 'removeCard':   S.removeId = actEl.dataset.val || null; openModal('removeCard'); break;
    case 'cancelSub':    openModal('cancelSub'); break;
    case 'confirmCharge':openModal('confirmCharge'); break;
    case 'schedule':     openModal('schedule'); break;
    case 'scheduleDemo': setScenario('campaignOk'); openModal('schedule'); break;
    case 'confirmChargeDemo': setScenario('campaignShort'); openModal('confirmCharge'); break;
    // 'active' has a card, so this lands on §6.2 step 3 rather than enrolment.
    /* Two shapes of the confirmation, and ONE step in front of it (PM, 2026-09-22 — the widget
       has to be its own modal). The confirmation always names a card, because by the time it
       opens one exists; what forks it is 과거 체험 이력 (§3.2.2 ⑦), not card presence. The
       no-card case is therefore a demo of the STEP BEFORE: the card modal, which hands back. */
    case 'subscribeDemo':
      setScenario('nocard'); S.consent = false; S.cardStep = null;
      S.cardReturn = 'confirmSubscribe'; S.tab = 'billing'; openModal('addCard'); break;
    case 'trialSubscribeDemo':
      setScenario('active'); S.trialOffer = true; S.tab = 'billing'; openModal('confirmSubscribe'); break;
    case 'blockedSubscribeDemo': setScenario('canceledGrace'); S.tab = 'billing'; openModal('subscribeBlocked'); break;
    // The same §14.2 consent screen a returning vendor sees. Only the welcome-credit row differs.
    case 'resubscribeDemo': setScenario('canceled'); S.tab = 'billing'; openModal('confirmSubscribe'); break;
    case 'subscribePromptDemo': setScenario('nocard'); S.tab = 'billing'; openModal('subscribePrompt'); break;
    case 'sendNow':      closeModal(); break;
    case 'close':        closeModal(); break;
    case 'scrim':        if (e.target.classList.contains('scrim') || e.target.classList.contains('drawer-scrim')) closeModal(); break;
    // Only swap scenarios when we have to leave the campaign screen — from an
    // account screen this must keep the state the vendor is actually in, or
    // Update payment silently teleports them out of expired / canceled / past_due.
    case 'goBilling':
      closeModal();
      if (sc().screen !== 'account') setScenario(sc().cardBad ? 'failed' : 'active');
      S.tab = 'billing'; render();
      break;
    /* Release 1 has no SMS tab and no credits, so switching to it has to leave any
       state that only exists in release 2 — otherwise the screen shows a campaign
       spending credits that cannot be bought yet. */
    case 'release':
      S.release = Number(actEl.dataset.val); S.packOpen = false; S.modal = null;
      if (isR1()) {
        if (sc().screen !== 'account') setScenario('active');
        S.tab = 'billing';
      }
      render();
      break;
    case 'creditModel':  S.creditModel = actEl.dataset.val; S.packOpen = false; S.packType = isUnified() ? 'credits' : 'sms'; render(); break;
    // Switching to merged while sitting on the SMS tab would leave S.tab pointing
    // at a tab that no longer renders, so land on the tab that absorbed it.
    case 'tabLayout':
      S.tabLayout = actEl.dataset.val; S.packOpen = false;
      if (isMerged() && S.tab === 'sms') S.tab = 'billing';
      render();
      break;
    case 'packSel':      S.packSel = Number(actEl.dataset.val); render(); break;
    /* Promotes the card that was pressed. It used to swap slots 0 and 1 regardless of which
       row the button sat on, so with three cards the wrong one was promoted. */
    case 'setDefault': {
      const id = actEl.dataset.val;
      const c = sc().cards;
      sc().cards = id ? [id, ...c.filter(x => x !== id)] : [c[1], c[0], ...c.slice(2)].filter(Boolean);
      /* DECLINED can only ever mark the DEFAULT card — PB 1.8.0 gives no backup card, so a
         decline can only have come from the one being charged. Once that card is not the
         default any more the mark has no target, and leaving it set made the badge JUMP to
         whichever card took the top slot. */
      sc().cardBad = false;
      render(); break;
    }
    case 'copyText':     copyText(actEl.dataset.val, actEl); break;
    case 'scrollCards':  document.getElementById('section-cards')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); break;
    /* In the product this link opens Balance's HOSTED PDF — §6.2 "Balance 자동 PDF 링크",
       §12.3.3.1 "영수증 링크", PB 6.1.0 "결제 성공 응답의 PDF URL 저장 → 히스토리 링크". There is
       no in-app receipt viewer in any doc. The prototype opens a modal because we cannot
       render Balance's file: the modal stands in for that PDF and shows what it must carry
       (the field list is the Balance request, G-2d / F-5 ③). The email's `View receipt`
       button points at the same URL. */
    // The row is the receipt's subject, so the link carries it.
    case 'receipt':
      e.preventDefault();
      S.receiptRow = { date: actEl.dataset.date, amt: actEl.dataset.amt, type: actEl.dataset.type };
      S.receiptSent = false;
      openModal('receipt');
      break;
    case 'emailReceipt':
      // PM 9/2 flow: the button becomes the confirmation and cannot be pressed twice for the
      // same receipt; the toast says where it went. What arrives is EMAILS.receipt.
      S.receiptSent = true;
      showToast('Receipt sent', 'Sent to your account email.');
      render();
      break;
  }
});

      '<b>Seven columns:</b> Date · Type · Card · <b>Subtotal · Sales tax · Total</b> · Receipt. Three money columns, not one — the cell on screen shows the total because the charge already happened, but a statement replacement has to be <b>reconcilable</b> (§3.3.1 · PB 6.1.0\'s receipt fields).',
      '<b>Policy.</b> §12.3.3.2 gives the control the word <code>Export</code>; <b>PB 6.3.0 makes it the statement\'s replacement</b>. That is why it has to be complete rather than convenient — it is the only statement a vendor gets.',
    ],
    edge: [
      '<b>The format is ours.</b> Neither document names one. CSV follows the reference set (Klaviyo · Postscript · Mailchimp — Research doc 9/8) and the two SMS tables on the next tab, so all three exports match.',
      '<b>Tax is subscription-only.</b> A credit-pack row leaves the tax cells <b>empty</b>, not <code>$0.00</code> — printing a zero asserts a zero-rated sale we never computed.',
      '<b>Receipt is availability, not a number</b> — <code>Available</code> or <code>—</code>. No PRD gives a receipt-number format (asked 9/14), and inventing one inside a file the vendor keeps would be a promise.',
      '🔲 <b>The filters are decorative in this prototype</b>, so Export takes the whole table. In production the file must follow the filter, and the two have to move together — a filtered screen beside an unfiltered file is the worst of both.',
      'The disable condition is <b>zero rows</b>, not "unsubscribed" — any empty state behaves the same way.',
    ],
    refs: '§12.3.3.2 · §3.3.1 · PB 6.3.0 · PB 6.1.0' },

  { id: '9', sel: '#sec-history .receipt-link', title: 'Receipt link', tags: 'DEV / PM',
    bullets: [
      '<b>We make the receipt, not Balance.</b> v2.5 §6.1 reversed this: the payment-success notice triggers <b>our own PDF</b>, we store it, we email it and we link it from here. Balance\'s receipt PDF and Balance\'s receipt email are <b>not used</b> (PB 6.1.0, 9/10).',
      '<b>No URL renders as <code>—</code></b>, which must stay distinguishable from a failed charge: a successful charge whose URL never came back is a real case.',
      'There is no in-app receipt viewer. <b>The modal in this prototype stands in for that PDF</b> and shows the fields it has to carry.',
      '<code>Send to email</code> sends to the account email, flips the button to a sent state (no double send) and toasts. The mail carries a summary and a link to the receipt. 🔴 No PDF is attached (2026-09-23).',
    ],
    edge: [
      '<b>PB 6.1.0 is the id</b> (9/10) — this was filed as "no PB id, PB 6.1.x" until 9/14. It also makes the <b>automatic</b> send the main path: a successful charge emails the receipt without anyone asking. The modal\'s <code>Send to email</code> is a second route to the same document.',
      'There is <b>nothing to fetch from Balance</b>. The PDF is ours, generated and stored on the payment-success notice (§6.1), so the file the Receipt link opens is one we already hold. 🔴 It is no longer attached to the mail (2026-09-23).',
      '<b>That question closed by ownership.</b> It used to be unknown whether Balance\'s hosted URL opened without a login; the document is ours now (v2.5 §6.1), so the auth rule is ours to set — decide it deliberately, because a vendor clicking from a mail app has no session.',
    ],
    refs: '§6.2 · §12.3.3.1 · PB 6.1.0' },

  { id: '16', sel: '#sec-history .pager', title: 'Rows per page and pagination', tags: 'DEV / PM',
    bullets: [
      '<b>UX.</b> <b>Five rows a page</b> (Grace, 9/14), with a range label — <code>1–5 of 8</code> — then <code>‹ Previous</code>, the numbers, <code>Next ›</code>. The range label is there so the vendor knows how much history exists before they start clicking.',
      '<b>It renders only when there is a second page.</b> Release 1\'s single charge shows no pager at all, rather than one claiming pages that do not exist.',
      '<b>Behaviour — the page index is clamped, not trusted.</b> The scenario and the filter both change how many rows exist, and a stale index would render an empty table under a working pager.',
      '<b>Behaviour — the numbers are windowed.</b> All of them up to seven pages; beyond that, first and last plus the current page\'s neighbours, with <code>···</code> for the gap, so a long history cannot run the row off the edge.',
      '<b>Policy — neither PRD specifies a page size, or a pager at all</b> (Audit A3-5). §12.3.3 describes the table and its columns and stops there. The pager is table convention and <b>five is Grace\'s call</b>, not a documented rule.',
    ],
    edge: [
      '<b>Paging does not change what Export writes</b> — the file is the whole table (see <b>8</b>). Paging is for reading; the file is the record.',
      '<b>The numbers used to be decorative</b> — a hardcoded <code>1 2 3 ···</code> that paged nothing. They work as of 9/14.',
      '🔲 <b>Page size is undocumented.</b> If it goes into the PRD it belongs beside §12.3.3\'s table spec, with the same 5 the SMS credit tables use.',
    ],
    refs: '§12.3.3 · Audit A3-5' },

  // ── G4 Banners ──────────────────────────────────────────────────────────────
  { id: 'G4', group: true, sel: '#main .alert', title: 'Banners', tags: 'DEV / PM',

  // ── G5 Grace timeline (pins onto the failure banner) ────────────────────────
  { id: 'G5', group: true, sel: '#main .alert-danger .alert-msg', title: 'Grace — the seven-day clock', tags: 'DEV / PM',
    bullets: [
      '<b>D0</b> the charge fails → subscription moves to <code>past_due</code>, <b>service is kept</b>, and PB 7.1 fires email + SMS + this banner.',
      '<b>D+1…D+6</b> — <b>insufficient funds only</b> is retried, <b>once a day, up to seven times</b>. Every other decline is <b>never retried</b>: the card update is the only way out and it charges on the spot. The classifier is one comparison — is the reason code <code>insufficient_funds</code> (v2.5 §5.1).',
      '<b>D+3</b> reminder if still unresolved — email + in-app (PB 7.1.1).',
      '<b>D+7</b> unresolved → <b>automatic cancellation</b>, email + SMS + in-app (PB 7.1.2). The vendor is told they can resubscribe and use it right away.',
      'Updating the card during grace <b>re-charges immediately</b> for the full unpaid cycle and clears the state; PB 7.2 then sends the restored notice.',
      'The seven days is a <b>policy value operations can change</b> — do not hard-code it (§5.2.3).',
    ],
    edge: [
      'Retries hit the <b>default card only</b> — never fall back to another saved card (PB 1.8.0).',
      'If the vendor cancels during grace, or D+7 passes, the <b>unpaid cycle is waived</b> and never pursued (§5.3.2 · §5.5.4).',
      '<b>Server errors are a different track</b> — retried silently with no notification and no screen change (§5.1 · PB 5.2.0). Retry count and interval are still 🔴 with dev, so that state currently has no defined end.',
    ],
    refs: '§5.1 · §5.2 · §5.3 · PB 5.3.0 · PB 7.1 · PB 7.1.1 · PB 7.1.2 · PB 7.2' },

  { id: '17', sel: '#sec-subscription .tip[data-block="declined"]', title: 'Subscribe blocked — declined default card', tags: 'DEV / PM',
    bullets: [
      '<b>The card is the problem here</b>, and that is what separates this from the chargeback block (<b>18</b>) even though both grey out the same button. Fixing it is a card change; nothing about the account is in dispute.',
      '<b>Hover copy is invisible in a screenshot</b>, so the string lives here: <i>"Your default card was declined, so your subscription can\'t be restarted with this card. Choose a different card as your default, or add a new card and set it as your default to subscribe again."</i>',
      '<b>Why it says "and set it as your default":</b> PB 1.1.1 makes only the <b>FIRST</b> card default. A vendor who already has cards and adds another does <b>not</b> get a new default from that alone, so "add a new one" would have been a dead end. Grace caught this on 9/15.',
      '<b>The rule underneath is PB 1.8.0:</b> 결제는 항상 기본 카드에만, 실패해도 다른 카드를 자동으로 시도하지 않는다. Subscribing on a declined default would charge the card that just failed — §5.1 sends that to the signup-failure path, and PB 2.3.0 would store a consent record for a subscription that never started.',
      '<b>Disabled works here because the fix is on this screen.</b> The card list with <code>Set as default</code> sits directly below, so the tooltip points at something the vendor can already see, and pressing it releases the button. That is the condition for choosing disable over a blocker — not a general preference.',
      '<b>The declined mark clears with the change.</b> <code>DECLINED</code> can only ever mark the default (PB 1.8.0 gives no backup card), so once that card is not the one being charged the mark has no target.',
    ],
    edge: [
      '<b>🔴 This case is not in the PRD.</b> PB 1.8.0 forbids the automatic fallback and stops — what should happen when the only chargeable card is declined is undefined. Jennie to confirm.',
      '<b>🔴 It hangs on the DECLINED badge, which is itself unresolved</b> — §12.3.2.2 enumerates the card row and does not include it. If the badge goes, this block needs another signal. Decide the two together.',
      '<b>The §14.1 prompt modal keeps the blocker modal instead</b> (<code>subscribeBlocked</code>, still in the build). That modal has no card list, so a tooltip there would point at nothing — it carries the picker with it. <b>Same policy, two surfaces, chosen by what is on screen.</b>',
      '<b>Considered and rejected on 9/15:</b> leaving Subscribe live everywhere and raising the blocker modal, on the <code>sendBlocked</code> precedent. Grace chose the disabled button. The cost to watch: <b>hover does not exist on touch</b>, so on a phone the greyed button has no reason attached.',
      '<b>Two pre-existing bugs fell out of this</b> (fixed 9/15): <code>setDefault</code> swapped slots 0 and 1 regardless of which row was pressed, so with three cards it promoted the wrong one; and it left <code>cardBad</code> set, which made the <code>DECLINED</code> badge <b>jump to whichever card took the top slot</b>.',
    ],
    refs: 'PB 1.8.0 · PB 1.4.0 · PB 1.1.1 · PB 2.3.0 · §5.1 · §12.3.2.2' },

  { id: '18', sel: '[data-banner="chargeback"], #sec-subscription .tip[data-block="chargeback"]', title: 'Chargeback — banner and blocked Subscribe', tags: 'DEV / PM',
    bullets: [
      '<b>Two surfaces, and they LAYER rather than repeat</b> (9/15). The banner carries 법무\'s approved sentence; the disabled button\'s tooltip carries what it means in practice. Read either alone and the screen is incomplete.',
      '<b>§7.4 gives the banner as a STRING (확정 9/9)</b>, one of the few clauses that does — like §6.3.4\'s invoice lines. It is pasted, not written: <i>"A dispute was filed with your card issuer for a subscription payment, so your subscription has been canceled. You can subscribe again once the dispute is resolved or a different payment method is verified. Questions? Contact {support}."</i> §7.4 also forbids 사기·부정 같은 단정 표현 — 정당한 분쟁일 수 있다.',
      '<b>It is a banner, not a clause on the section footnote.</b> Until 9/15 the block was a trailing sentence appended to "your store keeps running"; §7.4\'s copy announces the cancellation itself, which is a banner\'s job. The footnote no longer repeats it.',
      '<b>Why this screen gets its own banner at all:</b> the chargeback cancellation is the only IMMEDIATE one in the product (§7.1-2). Every other cancellation waits for the period to end, so <code>canceled</code>\'s banner cannot speak for this one.',
      '<b>The card is NOT the problem here.</b> This vendor\'s payment method may be perfectly good — what is blocked is the account, because a charge was reversed. Same greyed button as <b>17</b>, entirely different cause, and a different screen: the chargeback banner and §7.1-2\'s 즉시 해지 apply here, not a card decline.',
      '<b>§7.1.2\'s words are 재구독 차단</b>, and re-subscribing is literally what this button does — so the entry point is the thing that gets blocked. <b>Disabled rather than hidden</b>, because §7.1.2 asks for the block to be SHOWN with its own clause as the reason.',
      '<b>The tooltip string, since hover does not survive a screenshot:</b> <i>"Resubscribing is blocked while the chargeback is open. It lifts when the dispute resolves in your favour, or when the recovery invoice for it is paid. Adding a new card does not lift it."</i>',
      '<b>v2.5 §7.4-2 (확정 9/9) supplied that reason</b>, which this button carried no text for until 9/15: <b>승소</b> → 자금 복귀 즉시 해제, 수수료 청구 없음 (§7.2) · <b>패소</b> → 분쟁 금액 + PG 수수료를 #3 회수 인보이스로 청구하고 <b>결제가 확인된 뒤</b> 해제.',
      '<b>새 카드 등록만으로는 풀지 않는다</b> — §7.4-2\'s own clause, and the first thing a vendor will try. The reasoning: 결제를 한 번 뒤집은 벤더에게 상계·데빗 사다리로 다시 외상을 주는 셈이라서. 법무\'s "대체 결제 수단 제공 시 복원" is operated as "미납분을 그 수단으로 결제하면 복원".',
      '<b>No date is promised</b>, because the release depends on a dispute we do not control. The tooltip names the two conditions and stops.',
    ],
    edge: [
      '<b>🔴 The banner and the tooltip only agree if <code>verified</code> means PAID.</b> §7.4\'s copy says <i>a different payment method is verified</i>; §7.4-2\'s rule says <b>새 카드 등록만으로는 풀지 않는다</b> and operates 법무\'s <i>대체 결제 수단 제공 시 복원</i> as <b>미납분을 그 수단으로 결제하면 복원</b>. So the banner is 법무\'s phrase and the tooltip is the operating meaning — <b>a layer, not a contradiction, PROVIDED Jennie confirms that reading</b>. If <code>verified</code> turns out to mean mere registration, §7.4-2\'s rule changes and the tooltip has to go.',
      '<b>🔴 <code>{support}</code> has no destination in any document</b>, so the address is written into the sentence rather than hidden behind a link: <i>Contact support at vendorsupport@shopcord.com</i>. A <code>mailto:</code> is silently dead for anyone on webmail, and this admin is desktop-only (Grace, 9/17) — a cancellation notice whose one exit does nothing when clicked is the worst place for that. Printed as text it cannot fail, and a help centre can replace it later.',
      '<b>🔴 That address is the billing mail\'s SENDER</b> (<code>vendorsupport@shopcord.com</code>), and this banner is the first screen in the product to tell a vendor to write to it. Whether chargeback enquiries belong in that inbox rather than a dispute queue is an operations call — the PRD has no support-channel clause at all.',
      '<b>🔴 법무 확인 대기 (§7.4-2)</b> — 수수료 완납을 재구독 조건으로 두는 것이 8/26 승인 범위(합리적·실비·법 허용 한도) 안인지, 그리고 ToS 차지백 조항에 명시가 필요한지.',
      '<b>It outranks the card block.</b> A chargeback vendor with a declined card sees this reason, not <b>17</b>\'s — the card is the smaller problem and fixing it would not help.',
      'The subscription was already <b>immediately canceled</b> by the chargeback (§7.1-2), unlike every other cancellation in the product, which waits for the period to end. So this screen is <code>canceled</code> for a reason none of the other canceled screens share.',
      '<b>Repeat chargebacks:</b> §7.4-4 leaves 영구 폐쇄 검토 to a human. Nothing here may imply the block is permanent, and nothing may imply it is not.',
    ],
    refs: '§7.4 · §7.1.2 · §7.2 · §7.4-2 · §7.4-4 · PB 2.7.0' },

  { id: '11', sel: '#sub-summary', title: 'Confirmation — the five facts and the card row', tags: 'DEV / PM',
    bullets: [
      'Before consent the screen states plan · price · cycle · card · first charge date (§14.2 ③) as four rows: <code>Price</code>, <code>Charged today</code>, <code>Next charge</code>, <code>Card</code>.',
      'The <code>Card</code> row shows the default card, the one that is charged (PB 1.8.0): brand and last four, then <code>Change</code>.',

      'No trial history → the trial shape: the same rows, <code>Charged today $0.00</code>, and <code>Next charge</code> is the trial end, which is the first charge (§14.2 ③ · §3.2.2 ④). Trial history → charged today (§3.2.2 ⑦).',

    refs: '§14.2 · §3.2.2 · §3.3 · PB 1.4.0 · PB 1.8.0' },

  /* ── Email (§16 · PB 7.x) — eleven notifications ─────────────────────────────── */
  { id: 'E1', sel: '.email-modal', title: 'Notification emails — the set', tags: 'DEV / PM', group: true,
    bullets: [
      '<b>Twenty in this panel, grouped by WHERE EACH ONE COMES FROM</b> (Grace, 9/18). <b>13 are in the PRD</b> — the clause names the trigger and the channel. <b>7 are ours</b>: no PRD trigger exists for the mail at all, and every one needs a PB id before it ships. The 2차 SMS mails are absent from this release entirely. The green / amber chip in each header says which.',
      '<b>A second axis, and a different question: the Figma board.</b> The PRD says what we OWE; board <b>326:826552</b> says what has been DRAWN. <b>10 of the 27 have a frame there, 17 do not</b> — and the two sets barely predict each other. Six PRD-specified mails have no frame (the automatic receipt and the whole five-stage past-due ladder), while four frames that DO exist are stale captures of this build from early September and contradict v2.5 today. Each header prints the node id, or says the board has none, with the known mismatch beside it (Gap K-30 · K-32).',
      '<b>The channel is part of the spec, not a delivery choice.</b> §16 assigns them: email+SMS+in-app for the urgent money events (D0 failure, D+7 auto-cancel, the card campaign), and <b>email only</b> for the trial-end notice, the recovery invoice and every cancellation mail.',
      'Every send is a <b>trigger</b>, never a schedule — the vendor\'s own timeline produces them.',
    ],
    edge: [
      '<b>v2.5 deleted three of these.</b> PB 7.3~7.5, the card-expiry ladder, is abolished — no derived state, no badge, no banner, no mail. The only expiry surface left is the <b>date shown in red</b> on the card (§4.3 · PB 1.2.0). A test case for an expiry warning is testing a deleted feature.',
      '<b>Seven have no PB id and need one</b> — the amber group. The signup-charge decline (§5 covers failures on an EXISTING subscription; a first charge that never starts one is undefined), the receipt sent on request (PM 9/2 — PB 6.1.0 specifies only the automatic send), the two shapes of the ended-subscription notice (§3.5 gives the policy, PB 7.1.2 covers only the D+7 automatic cancellation), and the three number reminders — whose 3-month hold rule is itself in no PRD.',
      '<b>Where the board and the build disagree, the build is newer.</b> The four stale frames: <code>payFail</code> still shows features off during grace and no retries (§5.1 · §5.2 say the opposite), <code>recovery</code> predates §6.3.4\'s fixed line strings and the three-line total, and both migration mails promise that nothing about selling changes — which §10.1 reversed on 9/3, when order processing became a subscription gate. Two more frames are merely misnamed: the trial-end mail sits under <i>September card campaign</i>, and the buyer invoice has an obsolete twin (<code>317:819111</code>) that should be deleted.',
      '<b>PB 7.1.1 (D+3 reminder) has no email drawn here</b> — the trigger exists in the spec and the screen escalates at D+3 (H-16), but the reminder mail itself was never designed. <b>Nor does PB 7.1.2\'s auto-cancel mail</b>; only its banner and its canceled screen exist.',
      'Wording for none of these is in the PRD — <b>still true at v2.5</b>, which revises triggers and channels but never the body copy. Everything here is ours, so it answers to <b>ten house rules</b> instead of a spec: sentence case · contractions except consequences · no em-dash joins · one shape per series · the countdown only in subject and heading · one clause per bullet · positive framing · action first · no spec references in customer copy. <b>Treat trigger and channel as the spec, and the rules as the style contract</b> — the QA reference carries the full list.',
    ],
    refs: '§16 · PB 7.1 – 7.12 · Figma 326:826552' },

  { id: 'E2', sel: '.em-subj', title: 'Subject line', tags: 'DEV',
    bullets: [
      'Every subject names <b>the thing and its identifier</b> — amount, card, invoice number or date — so the mail is findable in a search months later.',
      'No urgency words in the subject. The deadline goes in the body, where the date can be exact.',
    ],
    edge: ['Sender is <code>vendorsupport@shopcord.com</code> across all of them (Grace, 9/2).'],
    refs: '§16' },

  { id: 'E3', sel: '.em-cta', title: 'The CTA', tags: 'DEV',
    bullets: [
      'One action per mail. §12.3 sends <b>every card-management route to the Subscription tab</b>, so that is where the recovery CTAs land.',
      '<b>The exception is the recovery invoice\'s <code>Pay now</code></b> — it lands on Balance\'s payment page (card or ACH) and must work with <b>no saved card and no session</b>. 🔴 Nothing is attached to that mail any more (2026-09-23), so the payment page is the only sight of the document \u2014 §6.1 puts our PDF on it for the vendor and §6.2 does not say the same for the buyer.',
    ],
    edge: ['<b>Receipt auth is ours to decide</b> now that we generate and host the PDF (v2.5 §6.1). The old 🔴 with Balance is closed; what replaces it is a deliberate choice about whether that link needs a session.'],
    refs: '§6.2 · §12.3 · PB 6.1.0' },

  { id: 'M-signupFail', sel: '.email-modal[data-email="signupFail"] .em-card', title: 'Signup charge declined', tags: 'DEV / PM',
    bullets: ['The very first charge fails, so <b>the subscription never starts</b> — this is not the grace flow. There is nothing to keep running and no 7-day clock.',
      'Card-side only. A PG timeout or server fault at signup never touches vendor state or notifications (v2.5 §5.1) — FG\'s existing handling owns it.'],
    edge: ['<b>No PB id.</b> PB 7.1 covers a failure on an existing subscription; this moment is not in the table.'],
    refs: '§5.1 · §14.2' },

  { id: 'M-payFail', sel: '.email-modal[data-email="payFail"] .em-card', title: 'Subscription charge failed — D0', tags: 'DEV',
    bullets: ['Sent <b>the day the charge fails</b>, opening the 7-day grace (§5.2).',
      '<b>Email + in-app banner.</b> The banner reaches every My Account tab and the campaign screen — it is the one surface carrying the fix (§12.3).',
      '<b>🔴 The spec also assigns SMS, and it is not drawn.</b> PB 7.1 says 이메일+SMS+인앱 배너, and §16 reserves 이메일+SMS for <b>긴급성 높은 것만</b> — this trigger and the D+7 auto-cancel, nothing else. But <b>no document defines who receives it</b>: §12.4-4 and PB 1.9.0 both fix 빌링 알림 수신자 = MASTER <b>이메일</b>, and no clause names a vendor phone number, a consent for one, or a PB row that builds the path. Dropped on 9/17 (Grace) rather than drawn against an addressee that does not exist.',
      'Says <b>Update your card</b> and links the tab (PB 7.1\'s own wording).',
      '<b>The sub-line carries the deadline, not a loss.</b> Inside the grace the vendor keeps everything (§5.2), so it reads <i>your subscription is active until {grace end}</i>. Until 9/14 it said <i>your paid features are off</i>, which contradicted §5.2 and this mail\'s own next line.',
      '<b>The amount carries tax.</b> §3.3.1 names the failure notice as one of the nine surfaces where sales tax must appear — the figure is the taxed total that failed, never the $20.00 list price.'],
    edge: ['<b>One mail, two bodies</b> (corrected 9/14). v2.5 §5.1 cut three failure classes to two and the mail now branches on <code>failKind()</code>: <code>insufficient_funds</code> says we retry once a day, everything else says <b>we will not retry</b>. The fixed "not retrying" line that used to sit here was wrong half the time.',
      '<b>It does not fire on a PG timeout or server fault.</b> v2.5 §5.1 keeps those out of vendor state and notifications entirely — they never reach <code>past_due</code>.'],
    refs: 'PB 7.1 · §5.1 · §5.2' },

  { id: 'M-restored', sel: '.email-modal[data-email="restored"] .em-card', title: 'Payment restored', tags: 'DEV',
    bullets: ['Fires when the grace <b>resolves</b> — the vendor updated the card and the charge went through, settling the missed cycle in full.',
      'Email + in-app, <b>no SMS</b>: good news is not urgent.'],
    edge: ['This is the only positive notification in the set. Without it the vendor who fixed their card never hears that it worked.'],
    refs: 'PB 7.2 · §5.2' },

  { id: 'M-trialEnding', sel: '.email-modal[data-email="trialEnding"] .em-card', title: 'Trial ends in 7 days', tags: 'DEV / PM',
    bullets: [
      '<b>PB 7.11, confirmed 9/3 and unbuilt until 9/14.</b> §3.2.2 \u2465 writes down both the mail and its reason: three months is long enough that "I thought it was free" is the default reaction to the first charge.',
      '<b>It is a chargeback defence, not a courtesy.</b> That reaction becomes a chargeback, and a chargeback costs a fee + immediate cancellation + a resubscribe block (§7). The clickwrap (§3.4) is the other half of the same defence.',
      'Four facts are fixed by the spec: <b>trial end date · first charge date · amount · card last 4</b>. The end date and the first charge date are <b>one date</b> (§3.2.2 \u2463 \u2014 the end is not a conversion, it is the first charge on the same plan), so the box carries it once.',
      'Amount is <b>\uc138\uc804 + \uc608\uc0c1 \uc138\uc561</b>. The rate is looked up at charge time (§3.3.1 · PB 2.12.0), so both lines read <b>Estimated</b> and the mail says the total may move.',
    ],
    edge: [
      '<b>Email only \u2014 no banner, no SMS</b> (§3.2.2 \u2465). A permanent in-app countdown pushes vendors to cancel <i>during</i> the trial, and the end date is on the Subscription tab year-round already (§12.3.1).',
      '<b>No card-update nudge</b> (9/9). v2.5 abolished card-expiry prompting everywhere (§4.3), and this mail is not an exception.',
      '<b>No CTA.</b> Same reasoning as <code>restored</code> and <code>cutover</code>: there is nothing the vendor has to do, and a button that only navigates asks for a click we are not owed.',
      '\ud83d\udd34 <b>The cancel sentence is ours.</b> §3.2.3 gives the fact (cancelling in a trial keeps it to its last day), but §3.2.2 \u2465 kept the trial clock off the product surface to avoid prompting churn. The sentence is in, the link is not \u2014 Jennie to confirm.',
    ],
    refs: 'PB 7.11 · §3.2.2 \u2463\u2465 · §3.2.3 · §3.3.1 · PB 2.12.0' },

  { id: 'M-subCanceled', sel: '.email-modal[data-email="subCanceled"] .em-card, .email-modal[data-email="subCanceledNoTfn"] .em-card', title: 'Subscription canceled', tags: 'DEV / PM',
    bullets: [
      '<b>The half of §3.5 that had no mail.</b> A subscription ends two ways — the vendor cancels, or grace expires — and only the automatic one was notified (PB 7.1.2). A vendor who cancelled on purpose still needs the record of what stopped and what did not.',
      '<b>Two groups, opposite markers</b> (PM layout, 9/14). A vendor opens this asking two things — what did I lose, and what do I still have — and one flat list answered both at the same weight. <code>What still works</code> carries §5.5.2, <code>Paused until you subscribe again</code> carries §3.2.1.',
      'The paused set is §3.2.1\'s boundary, <b>exactly two rows</b>: opening/confirming an order, and <b>SMS Campaigns and Chat</b> — which is how §3.2.1 itself names it (<code>SMS 마케팅 (캠페인·챗)</code>) and how the vendor sees it in the nav.',
      '<b>재구독 is a condition, not a status</b>, so it leaves the list and sits in its own block: new cycle, immediate first charge, <b>no second trial</b> (§3.2.2 ⑦ · §5.5.3).',
      'CTA stays <b>Subscribe again</b>, the same words as the Subscription tab button. The PM draft had <i>Subscribe Again to Keep Your Number</i>; keeping the number is the D-30/7/1 reminders\' hook, and a number-specific button cannot be shared by the no-SMS shape.',
    ],
    edge: [
      '<b>🔴 No PB id — needs one.</b> PB 7.1.2 covers only the D+7 automatic cancellation.',
      '<b>Two entries, one template.</b> The panel lists <i>with SMS number</i> and <i>no SMS number</i> side by side so both shapes can be reviewed. Production sends one, picked by whether the vendor ever onboarded SMS.',
      '<b>No number means no SMS anywhere in the mail</b> (Grace, 9/14) — the credits line and the number block drop out, and the locked-feature line names only order opening/confirming. Telling a vendor who never switched SMS on that it is now off is noise. Release 1 has no SMS surface, so it always sends this shape.',
      'The number is described as <b>held until a date</b>, never as deleted on one — we cannot promise a carrier will keep it, and no PRD carries the rule at all. The PM draft said <i>removed for good</i>; that states a certainty we do not have.',
      '<b>🔴 Cut pending dev: "your SMS Campaigns &amp; Chat history is removed".</b> No PRD carries a retention or deletion rule for message history, <code>NUMBER_HOLD_MONTHS</code> covers the number only, and the claim contradicts this same mail\'s <i>your store, orders and data are all still here</i>. Opt-out records may also carry a legal retention duty. Grace, 9/14: 개발팀 확인 후 결정.',
      'Held credits are <b>pre-deduction</b>, so a scheduled campaign\'s hold releases back to Available rather than being lost (선불 스펙 — Hold 해제, 차감 전이므로 환불 아님). The mail says they come back, which is better news than "they stay held".',
    ],
    refs: '§3.5 · §5.5.2 · §5.5.3 · §3.2.1' },

  { id: 'M-numberD30', sel: '.email-modal[data-email="numberD30"] .em-card', title: 'Reserved number — 30 days left', tags: 'DEV / PM',
    bullets: [
      '<b>First of three.</b> The hold is <b>3 months</b> from the day the subscription ended, and the reminders land at <b>D-30, D-7 and D-1</b> (Grace, 9/14).',
      '<b>Why three and not one:</b> the hold clock is invisible. A cancelled vendor has stopped visiting, so nothing on screen counts it down — and a number a business has printed on its materials <b>cannot be recovered</b> once released.',
      'Only this one <b>names the remaining schedule</b>. By D-7 the vendor already knows, and telling someone with a day left that more reminders are coming would be absurd.',
      'All three share <b>one body builder</b>, and since 9/14 the body is <b>identical</b> in all three: the countdown lives in the subject and the heading only. It used to repeat in the body as well, which stated one fact five times over subject, heading, sub-line, body and the reserved-until row (Grace: <i>"어차피 제목에 있잖아"</i>).',
      '<b>Each one says the credits are safe</b> (Grace, 9/14). This mail is the moment a vendor is most likely to assume their credits go with the number, because it is telling them something they own may be taken away. Credits are held, never forfeited (2차 PRD §5) — the line reassures and draws the distinction at once.',
    ],
    edge: [
      '<b>🔴 No PB id, and no PRD carries the hold rule</b> — 3 months is confirmed (Grace, 9/14) but written nowhere. Both need adding.',
      'Only for vendors who hold a number; absent from the release-1 panel entirely.',
    ],
    refs: '§3.5 · NUMBER_HOLD_MONTHS' },

  { id: 'M-numberD7', sel: '.email-modal[data-email="numberD7"] .em-card', title: 'Reserved number — 7 days left', tags: 'DEV',
    bullets: [
      'Second reminder. <b>Identical body</b> — the countdown is in the subject and the heading, not the prose. See <b>M-numberD30</b> for why the ladder exists.',
      'Drops the "we will remind you again" line: at this point the vendor has had one and there is only one left.',

    edge: ['<b>🔴 No PB id.</b>'],
    refs: '§3.5 · NUMBER_HOLD_MONTHS' },

  { id: 'M-numberD1', sel: '.email-modal[data-email="numberD1"] .em-card', title: 'Reserved number — released tomorrow', tags: 'DEV / PM',
    bullets: [
      '<b>Last chance.</b> The heading says <b>Tomorrow is the last day</b> rather than a date — at one day out, a date makes the reader do arithmetic they have no time for. It is the one place the series breaks parallel, and that break is the urgency.',
      'Still says the number <b>may be released</b>, never that it will be deleted: what happens to a released number is the carrier\'s, not ours to promise.',
    ],
    edge: [
      '<b>🔴 No PB id.</b>',
      '<b>Nothing follows this.</b> There is no "your number was released" mail — worth deciding whether one is owed, since the vendor who ignores all three learns only by trying to use it.',

    refs: '§3.5 · NUMBER_HOLD_MONTHS' },

  { id: 'M-receipt', sel: '.email-modal[data-email="receiptAuto"] .em-card, .email-modal[data-email="receipt"] .em-card', title: 'Receipt', tags: 'DEV / PM',
    bullets: ['<b>Two entries, one document.</b> <i>Sent automatically</i> is PB 6.1.0\'s main path: payment succeeds → our receipt PDF is generated and stored → <b>the email goes out</b>, with a link in Billing history (§12.3.3-3, 확정 9/9). <i>Sent on request</i> is the receipt modal\'s <code>Send to email</code> (PM 9/2), a second route to the same file.',
      '<b>One builder, one opening sentence apart.</b> Same PDF, same box, same references — only the first line knows which moment it is: <i>your subscription charge went through</i> versus <i>the receipt you asked for</i>. Two builders would have drifted into looking like two different receipts.',
      'Both go to the <b>MASTER account email</b> (§12.4-4), never an address typed at send time.',
      '<b>The PDF is ours</b> (§6.1 · PB 6.1.0) and carries the six fields the spec names: pre-tax, tax, total, card last 4, charge date and the <b>Balance transaction number</b>. The last one prints in the paper\'s Payment block and in the mail\'s reference lines; it had come off on 9/2, when v2.1 named no receipt fields, and is back under v2.5 (9/17). The charge time prints as <b>12:00 AM PT</b> — the batch time (§3.3-3), not a clock time. Balance\'s own receipt PDF and email are switched off by configuration.',
      '🔴 <b>No attachment (Grace, 2026-09-23 — 첨부가 안 된다는 회신).</b> §12.3.3-3 specifies 영수증 PDF를 <b>첨부한</b> 이메일, so this is a deviation from doc-specified behaviour and the PRD needs the correction. What replaces it: the box in this mail carries all six PB 6.1.0 fields, so the <b>mail itself is a usable receipt</b>, and <code>View receipt</code> is the route to the stored PDF. A vendor who never clicks still has the numbers.',
      '<b>The mail renders in a plain client frame</b>, not the branded card — sender row, subject, then the body (the attachment strip went with the attachment, 2026-09-23). A receipt is a document, not a campaign. <code>Credit purchase receipt</code> is the only other mail drawn this way.',
      '<b>The body is three tiers, not six equal rows</b> (Grace, 9/14). <b>①</b> the AMOUNT as a hero — <code>$21.78</code> with <i>Paid {date} · Visa ····4242</i> under it — because that is what the mail was opened for. <b>②</b> the BREAKDOWN — Subtotal · Sales tax with its place and rate · Total — which is what gets checked when the figure moves, and it now can, month to month (§3.3.1). <b>③</b> the REFERENCES in small grey type — service period and receipt no. — what they come back for weeks later.',
      '<b>Flat rows made the receipt number as loud as the money.</b> They also made the figure repeat three times: in the sentence, in a <code>Charged</code> row and in the total. Hierarchy fixed both at once.',
      '<b>The line item is PRE-TAX.</b> Subtotal is <code>$20.00</code> and only the bottom line is <code>$21.78</code> — handing the total to both made the paper read as though tax were owed twice (Grace, 9/14). One field, one meaning.'],
    edge: ['<b>The automatic send had no screen until 9/14</b> (Gap K-9 → K-20). PB 6.1.0 makes it the main path — it fires twelve times a year without anyone asking — and the mockup only drew the on-request one, so the send that actually matters had nothing to test against.',
      '<b>The spec id was stale until 9/14</b> — this was filed as "no PB id, PB 6.1.X". PB 6.1.0 has existed since the 9/10 revision.',
      '<b>PB 6.1.0 lists the PDF\'s fields</b>, and the body shows the same set: 세전 · 세금 · 합계 · 카드 끝4 · 결제일 · Balance 거래번호. The mail is a summary of the document, so a field in one and not the other is a defect either way.',
      '<b>The receipt-number format is ours</b> — no PRD gives one (asked 9/14). <code>SC-R-2026-04182</code> is a placeholder, and it is printed on a file the vendor keeps, so the format needs deciding rather than inheriting.'],
    refs: '§6.1 · §6.2 · §12.3.3 · PB 6.1.0' },




  { id: 'M-recovery', sel: '.email-modal[data-email="recovery"] .em-card', title: 'Recovery invoice issued', tags: 'DEV',
    bullets: ['<b>This is never a subscription bill.</b> §6.3.1 is explicit — 구독료로 인보이스가 나가는 경우는 없다 (정리 9/8): seven unresolved days auto-cancels and waives the arrears, so "long overdue" does not exist for a subscription. This is a <b>settlement-side debt</b> (§6.3.2) — money already paid out to the vendor that has to come back.',
      'Sent when that balance <b>could not be collected</b> — payout offset first, then a bank debit retried daily for seven days, both short (§6.3.2). Non-US vendors skip the debit and invoice as soon as the offset falls short (9/9).',
      '<b>The lines are §6.3.4\'s, verbatim, each as ONE string</b> — <code>제목 - 부제 (Reference)</code>, the PRD\'s punctuation and nothing added. One of the few places the PRD gives STRINGS rather than facts, and it divides nothing into cases: <b>one invoice, one line per reason</b> (한 인보이스에 사유가 여럿이면 라인을 사유별로). The demo stacks all four so each string can be read: <code>Refund clawback - Buyer refund after payout (Order #FG-xxxxx · Refunded {date})</code> · <code>Chargeback reversal - Payment reversed by buyer\'s card issuer (Order #FG-xxxxx · Dispute {date})</code> · <code>Chargeback fee - Processor fee for the dispute (Order #FG-xxxxx)</code> · <code>Settlement adjustment - {case description} (Settlement {date})</code>. A real invoice usually carries fewer; a chargeback and its fee are the common pair.',
      '<b>The string is intact; the type is tiered.</b> Reason in bold, explanation plain, reference small and grey — the receipt mail\'s three voices laid over §6.3.4\'s line, split at the first " - " and the last " (". Copy the line and you get the PRD\'s characters; read it and you see three things, not one 90-character sentence (Grace, 9/17). Above the lines sits the amount and the due date, the two facts that make the vendor act; below them the totals §6.3.4 fixes; the issue date and invoice number are quiet references underneath.',
      '<b>Three totals, never one</b> (§6.3.4): <code>Invoice amount → Recovered from payouts → Total due</code>. The invoice is always the REMAINDER — 상계·데빗으로 못 걷은 잔액 — and <b>without the middle line the vendor cannot see that money already came out of their settlement</b>, which is the first thing they ask.',
      '<b>Due = issued + 7 days</b> (§6.4-3 · PB 6.2.0). ACH that reaches <code>processing</code> inside the window counts as paid, and the payment page stays valid past the date — 만기는 우리의 연체 판정 기준일일 뿐, there is no link expiry.',
      '<b>No sales tax</b> (§6.4-6) — 회수금이라 매출이 아니다. Tax rides on the subscription charge only.',
      '<b>One way out, and it is in the mail:</b> <code>Pay now</code> settles this invoice by card or ACH <b>with no saved card required</b> (§6.2). 🔴 The second CTA was <b>deleted 2026-09-23</b> (Grace) even though §6.2 and PB 6.2.0 both name it — <i>Pay now + Update payment</i>. The saved card pays the SUBSCRIPTION; this debt was chased through payout offset and then a bank debit (§6.3.2), neither of which the card touches, so the link pointed at something that had not failed. The PRD needs the correction, or the link comes back.',
      'Email only — this one has no SMS or banner.'],
    edge: ['<b>Our PDF, our email, our invoice number</b> (§6.1 · PB 6.2.0). Balance runs in <b>external-invoice mode</b>: it supplies the payment page and nothing else, with our PDF attached to it. A Balance-generated invoice, or one carrying a Balance number, is a defect. <i>This used to read "#3 SHOPCORD INVOICING hosted, not our screen" — corrected 9/14.</i>',
      '<b>Issuing stops the debit retries, not the offset</b> (§6.4-5, 9/9). The settlement batch keeps running, anything it recovers reduces the invoice by credit note, and a full recovery closes it — otherwise the vendor pays on the payment page for money we already took. The last line of the mail says exactly that.',
      '<b>The due date appears twice on purpose</b> — the header line and the amount hero. A deliberate exception to the set\'s no-repeat rule: it is the one fact that makes the vendor act, and every printed invoice carries it in both places.',
      '<b>The invoice number format is ours.</b> PB 6.2.0 says 인보이스 번호 = 우리 번호 and stops — the same gap the receipt number has. It is what a vendor quotes back to support, so it deserves a deliberate decision.',
      '<b><code>{case description}</code> is the PRD\'s variable, not a string</b> — the adjustment line\'s middle part is filled per case by whoever raises the adjustment. The demo value (<i>Returned items credited after payout</i>) is ours; the other three lines have no variable besides order number and date.',
      '<b>Invoice amount is the sum of the lines</b> ($755.00 here), Recovered from payouts is what the settlement batch already took, Total due is the remainder — the same three figures on the mail and on the PDF. The PDF\'s Description column IS the §6.3.4 line; the earlier Description / Reference split re-punctuated the PRD\'s string and is gone.',
      'Under 50¢ nothing is issued at all — Balance cannot raise an invoice below $0.50 and collection would cost more than the debt (§6.2).'],
    refs: 'PB 7.8 · PB 6.2.0 · §6.2 · §6.3' },

  /* One annotation for one policy. The five mails are stages of the same ladder, and their
     reasoning does not divide per stage — splitting it five ways would repeat §6.6's two
     rules five times and let them drift apart. */
