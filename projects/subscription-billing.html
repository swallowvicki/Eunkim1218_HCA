<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopcord · Subscription &amp; Billing — 1st release (Oct 1) · 2026-08-28</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Design tokens (Figma variables, node 140:14350 — same set as Phase 2 mockup) ============ */
:root {
  --bg:                #fdfcfa;
  --sidebar-bg:        #fefefd;
  --card:              #ffffff;
  --border:            #f2ede7;
  --border-elements:   #ececec;
  --border-muted:      #e4e4e7;
  --fg:                #1f1f1f;
  --fg-secondary:      #6b6b6b;
  --fg-muted:          #a3a3a3;
  --primary:           #e11d74;
  --primary-soft:      #fdf2f8;
  --primary-soft-60:   #fdf2f899;
  --destructive:       #ef4444;
  --destructive-soft:  #fef2f2;

  --badge-red:         #f6eef1;
  --badge-red-fg:      #9e4a5e;
  --badge-green:       #ebf4f1;
  --badge-green-fg:    #4f8f7c;
  --badge-amber:       #fdf5ec;
  --badge-amber-fg:    #a17a4a;
  --badge-blue:        #eef2f8;

  /* Toast surfaces — Figma "Payment & Billing Update" node 228:232624 (base/sonner-bg-*).
     The icon circles reuse our badge tokens where the two already agree: blue is an
     exact match on both background and glyph, green matches on background. */
  --sonner-bg-success: #f6fbf9;
  --sonner-bg-warning: #fffcf5;
  --sonner-bg-error:   #fef7f6;
  --sonner-bg-info:    #f5f8fc;
  /* base/sonner-forground-Error — the glyph inside the confirmation popup's icon
     circle (node 1:22320). The circle's fill is --sonner-bg-error above. */
  --sonner-fg-error:   #c0392b;

  /* Email palette — Figma node 317:816391, confirmed by Grace 2026-08-28. These are the
     EMAIL's colours, not the product's: the accent is #e53a85, which is NOT --primary
     (#e11d74), and the canvas is warmer than --bg. Declared here so the two cannot drift
     apart across eight templates. */
  --email-bg:          #fdf9f7;
  --email-accent:      #e53a85;
  --badge-blue-fg:     #4a6fa5;
  --badge-gray:        #f4f4f5;
  --badge-gray-fg:     #8a8a8a;

  --accent:            #404040;   /* base/accent — selection + active container border */
  --success:           #16a34a;
  --muted:             #f7f7f7;

  /* Content width — 1024 by default; sections that carry a table widen to 1280.
     The +gutters absorb the 32px inset so the cards themselves land on the number. */
  --content-w: 1024px;
  --content-w-table: 1280px;
  --content-gutter: 48px;   /* Figma 1:10019 — content sits at x=48 in the wrap */

  --shadow-xs: 0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-sm: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
  --shadow-lg: 0 20px 40px -12px rgba(0,0,0,.22), 0 4px 12px -4px rgba(0,0,0,.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 20px;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
[hidden] { display: none !important; }

/* ============ Layout ============ */
.app { display: flex; min-height: 100vh; max-width: 1920px; margin: 0 auto; padding: 16px; }
@media (min-width: 1240px) { body.proto-open .app { padding-right: 372px; } }

/* ============ Sidebar ============ */
.sidebar {
  width: 256px; background: var(--sidebar-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 12px; display: flex; flex-direction: column; flex-shrink: 0;
  position: sticky; top: 16px; height: calc(100vh - 32px);
}
/* Sidebar matched to Figma node 1:7750 (Payment & Billing Update) */
.sb-brand { display: flex; align-items: center; gap: 8px; padding: 8px 12px 20px; }
.sb-logo-mark { width: 18px; height: 23.6px; flex-shrink: 0; display: block; }
.sb-logo-word { width: 103.31px; height: 21.554px; flex-shrink: 0; display: block; }

.sb-toggle { position: absolute; right: -12px; top: 23px; width: 24px; height: 24px; border-radius: 12px; background: #fff; border: 1px solid var(--border-muted); box-shadow: 0 2px 3px rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--fg-muted); padding: 0; z-index: 20; }
.sb-toggle:hover { border-color: var(--fg-muted); color: var(--fg); }
.sb-toggle svg { width: 12px; height: 12px; }

.sb-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.sb-item { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--fg-secondary); cursor: pointer; }
.sb-item:hover { background: rgba(0,0,0,.03); }
.sb-item.active { background: var(--primary-soft-60); color: var(--primary); font-weight: 600; }
.sb-ico { width: 16px; height: 16px; flex-shrink: 0; }
.sb-ico svg { width: 100%; height: 100%; }
.sb-sep { height: 1px; background: var(--border); margin: 8px 12px; }

.sb-foot { position: relative; display: flex; align-items: center; gap: 10px; padding: 11px 10px 10px; border-top: 1px solid var(--border); cursor: pointer; }
.sb-avatar { width: 32px; height: 32px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
.sb-avatar svg { width: 16px; height: 16px; }
.sb-foot-name { flex: 1; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--fg); }
.sb-foot-chev { color: var(--fg-muted); display: flex; }
.sb-foot-chev svg { width: 16px; height: 16px; }

.sb-dot { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 6px; height: 6px; border-radius: 3px; background: var(--primary); }
.sb-foot .sb-dot { right: 32px; }

/* ============ Main wrap ============ */
.wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ============ Buttons ============ */
/* Button — design system node 4559:2178 (shadcn Button).
   default h-9 36px · px-4 py-2 · gap 8 · radius 8 · Inter Medium 14/20
   sm 32px / 12px · primary carries shadow-xs */
.btn { height: 36px; padding: 0 16px; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 1px solid transparent; background: transparent; color: inherit; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
/* Outline needs a border that reads as a control edge, not a card edge:
   --border #f2ede7 is the card colour and vanishes on white. shadcn's outline
   variant also carries shadow-xs, which lifts it off the surface. */
.btn-outline { background: var(--card); border-color: var(--border-muted); color: var(--fg); box-shadow: var(--shadow-xs); }
/* Selected outline uses the design system's 2px #404040 selection border, not the
   accent — a button going pink to say "my panel is open" spends the screen's one
   saturated colour on state, while the panel's own submit needs it. */
.btn-outline.is-on { border: 2px solid #404040; }
.btn-outline:hover:not(:disabled) { border-color: var(--fg-muted); background: #fcfcfc; }
.btn-outline:disabled { box-shadow: none; background: var(--muted); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: var(--shadow-xs); }
/* Secondary — near-black fill, white text. Same geometry as Default; only the
   fill differs. Used for the peer commit action beside a pink primary
   (Save Draft beside Send). Figma variant "Secondary", node 4559:2244. */
.btn-secondary { background: var(--fg); color: #fff; border-color: var(--fg); box-shadow: var(--shadow-xs); }
.btn-secondary:hover:not(:disabled) { filter: brightness(1.25); }
.btn-primary:hover:not(:disabled) { filter: brightness(.96); }
.btn-ghost { background: transparent; color: var(--fg-secondary); }
.btn-ghost:hover { background: rgba(0,0,0,.04); color: var(--fg); }
/* destructive actions stay neutral until reached for — a card list shouldn't
   lead with Remove */
.btn-danger-ghost { background: transparent; color: var(--fg-secondary); }
.btn-danger-ghost:hover:not(:disabled) { background: var(--destructive-soft); color: var(--destructive); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 12px; }
.btn-lg { height: 40px; padding: 0 20px; font-size: 14px; }
.btn-ico { display: inline-flex; width: 14px; height: 14px; }
.btn-ico svg { width: 14px; height: 14px; }
.linkbtn { background: none; border: none; padding: 0; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }

/* ============ Page head ============ */
.page-head { padding: 40px var(--content-gutter) 0; }
.page-title { font-size: 30px; line-height: 36px; font-weight: 700; }
.page-sub { margin-top: 6px; font-size: 13px; color: var(--fg-secondary); }

/* ============ Account tabs (4) ============ */
/* Tab menu — Figma node 1:10023 (shadcn Tabs).
   A 64px band above the page title: bordered rounded-2xl card holding pill tabs. */
.tabbar {
  height: 64px; margin: 0 16px;
  background: var(--sidebar-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 8px 16px;
  display: flex; align-items: center;
  overflow-x: auto; scrollbar-width: none;
}
.tabbar::-webkit-scrollbar { display: none; }
.acct-tabs { display: flex; align-items: center; border-radius: 10px; }
.acct-tab {
  flex-shrink: 0; white-space: nowrap;
  padding: 6px 24px; border: none; border-radius: 8px; background: transparent;
  font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 500;
  color: var(--fg); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.acct-tab:hover:not(.is-active) { background: rgba(0,0,0,.03); }
.acct-tab.is-active { background: var(--primary-soft-60); color: var(--primary); }

/* ============ Body ============ */
/* Width is decided per TAB, not per section: a tab that contains a table runs
   at 1280 throughout so the cards above it line up with the table edges.
   (Figma 1:10019 — the Account tab is 1280 because Sub Accounts is a table.) */
.body { padding: 24px var(--content-gutter) 64px; display: flex; flex-direction: column; gap: 20px; max-width: calc(var(--content-w-table) + var(--content-gutter) * 2); }
.body > * { width: 100%; max-width: var(--content-w); }
.body.wide > * { max-width: var(--content-w-table); }
.page-head { max-width: calc(var(--content-w) + var(--content-gutter) * 2); }
.page-head.wide { max-width: calc(var(--content-w-table) + var(--content-gutter) * 2); }

/* ============ Alerts / banners ============ */
.alert { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border-radius: 10px; border: 1px solid transparent; }
.alert-ico { flex-shrink: 0; width: 20px; height: 20px; display: inline-flex; }
.alert-ico svg { width: 20px; height: 20px; }
.alert-body { flex: 1; font-size: 13px; line-height: 19px; }
.alert-title { font-weight: 700; }
.alert-danger { background: var(--destructive-soft); border-color: #fecaca; color: #991b1b; }
.alert-danger .alert-ico { color: var(--destructive); }
.alert-danger .alert-msg { color: #b91c1c; }
.alert-warn { background: var(--badge-amber); border-color: #f0dcc0; color: #7c5a2e; }
.alert-warn .alert-ico { color: var(--badge-amber-fg); }
.alert-info { background: var(--badge-blue); border-color: #d8e2f0; color: #3c5c8a; }
.alert-info .alert-ico { color: var(--badge-blue-fg); }
.alert-success { background: var(--badge-green); border-color: #cfe5dc; color: #3d7666; }
.alert-success .alert-ico { color: var(--badge-green-fg); }
.alert-actions { display: flex; gap: 8px; margin-top: 10px; }

/* ============ Cards / sections ============ */
/* card — design system: rounded-2xl 16, p-6 24 (node 4607:65613) */
.section-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
.section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.section-title { font-size: 18px; line-height: 24px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; }
.section-desc { margin-top: 4px; font-size: 13px; color: var(--fg-secondary); }

/* status pills */
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 11px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.pill.green { background: var(--badge-green); color: var(--badge-green-fg); }
.pill.blue  { background: var(--badge-blue);  color: var(--badge-blue-fg); }
.pill.amber { background: var(--badge-amber); color: var(--badge-amber-fg); }
.pill.red   { background: var(--badge-red);   color: var(--badge-red-fg); }
.pill.gray  { background: var(--badge-gray);  color: var(--badge-gray-fg); }
.pill.solid { background: var(--badge-gray); color: var(--fg); }

/* ============ Plan row ============ */
.plan-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border: 1px solid var(--border-elements); border-radius: 10px; background: var(--muted); }
.plan-name { font-size: 16px; font-weight: 700; }
.plan-meta { margin-top: 2px; font-size: 12px; color: var(--fg-secondary); }
.plan-price { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.plan-price span { font-size: 13px; font-weight: 500; color: var(--fg-secondary); }

/* The Status column came out on 2026-08-24: §8.2's `Charges current` is the MEANING of
   a status, not its name, and the pill in the card head already carries the name — for
   `canceled` the two were the same word, for `past_due` the same sentence three times.
   Two facts left, so they sit side by side at their own width instead of being spread
   across thirds of the card. */
.kv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
.plan-when { margin-top: 6px; font-size: 13px; color: var(--fg-secondary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plan-when strong { font-weight: 600; color: var(--fg); }
.plan-card { display: inline-flex; align-items: center; gap: 7px; color: var(--fg); font-weight: 600; }
.kv-label { font-size: 12px; color: var(--fg-secondary); }
.kv-value { margin-top: 6px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kv-value.muted { font-weight: 500; color: var(--fg-secondary); }

.section-foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-elements); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.foot-note { font-size: 12px; color: var(--fg-muted); }

/* ============ Card list ============ */
/* Two across, not five down. The limit is 5 cards (D-9), and as a single column the
   list ran the height of the section with each row's actions ~800px from the card they
   act on. auto-fill drops to one column when the container is narrow. */
.card-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 10px; align-items: stretch; }
.card-row { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--border-elements); border-radius: 10px; background: var(--card); }
/* The default card is the selected item in a list, so it uses the system's
   selection treatment — 2px accent border (node 4607:65567), not pink.
   Pink-soft is reserved for the active *tab*, a different pattern. */
.card-row.is-default { border: 2px solid var(--accent); padding: 15px 17px; }
.card-row.is-bad { border-color: #f3b9b9; background: #fffafa; }
.brand-mark { width: 44px; height: 30px; border-radius: 5px; border: 1px solid var(--border-muted); background: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; letter-spacing: .04em; flex-shrink: 0; }
.brand-visa { color: #1a1f71; }
.brand-mc { color: #eb001b; }
.brand-amex { color: #016fd0; }
.card-main { flex: 1; min-width: 0; }
.card-num { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-dots { font-family: 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .06em; }
.card-sub { margin-top: 3px; font-size: 12px; color: var(--fg-secondary); }
.card-sub.danger { color: var(--destructive); font-weight: 600; }
.card-sub.warn { color: var(--badge-amber-fg); font-weight: 600; }
.card-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

/* tooltip on disabled action */
.tip { position: relative; display: inline-flex; }
/* For controls sitting at the top of a page, where the default upward bubble
   would clip off-screen (the campaign Send button). */
.tip.tip-below .tip-bubble { bottom: auto; top: calc(100% + 8px); }
.tip .tip-bubble { position: absolute; bottom: calc(100% + 8px); right: 0; width: 210px; white-space: normal; font-weight: 400; padding: 8px 10px; background: #1f1f1f; color: #fff; font-size: 11px; line-height: 15px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 40; }
.tip:hover .tip-bubble { opacity: 1; }

.helper { margin-top: 14px; font-size: 12px; color: var(--fg-secondary); display: flex; align-items: flex-start; gap: 6px; }
.helper svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; color: var(--fg-muted); }

/* ============ Empty state ============ */
.empty { padding: 40px 24px; border: 1px dashed var(--border-muted); border-radius: 12px; text-align: center; }
.empty-ico { width: 40px; height: 40px; margin: 0 auto 12px; border-radius: 10px; background: var(--muted); color: var(--fg-muted); display: flex; align-items: center; justify-content: center; }
.empty-ico svg { width: 20px; height: 20px; }
.empty-title { font-size: 15px; font-weight: 600; }
.empty-desc { margin-top: 4px; font-size: 13px; color: var(--fg-secondary); }
.empty-cta { margin-top: 16px; }

/* ============ Toolbar / filters ============ */
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
/* Input — design system node 4607:65616 (shadcn Input).
   36px tall · radius 8 · 12px inset · border base/elements-border
   focus base/ring #737373 · error base/destructive · disabled base/muted @50% */
.select, .input {
  height: 36px; padding: 0 12px;
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; line-height: 20px; color: var(--fg); font-family: inherit;
}
.select::placeholder, .input::placeholder { color: var(--fg-muted); }
.select:hover, .input:hover { border-color: var(--fg-muted); }
.select:focus, .input:focus { outline: none; border-color: #737373; }
.select:disabled, .input:disabled { background: #f2f2f2; opacity: .5; cursor: not-allowed; }
.input.is-error, .select.is-error { border-color: var(--destructive); }
.field-desc { margin-top: 8px; font-size: 12px; line-height: 1; color: var(--fg-muted); }
.field-desc.is-error { color: var(--destructive); }
.toolbar-right { margin-left: auto; display: flex; gap: 8px; }

/* credit summary chip */
.credit-chip { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border: 1px solid var(--border-elements); border-radius: 10px; background: var(--muted); margin-bottom: 16px; flex-wrap: wrap; }
.credit-chip-item { display: flex; align-items: baseline; gap: 6px; }
.credit-chip-num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.credit-chip-label { font-size: 12px; color: var(--fg-secondary); }
.credit-chip-sep { width: 1px; height: 22px; background: var(--border-muted); }
/* Inline variant: sits inside a card that already has its own spacing, and carries
   settings rather than balances, so the figure drops to reading size. */
/* Three settings need ~650px on one line. Full width (split model) has 770; beside the
   balance card (unified) there are 380-500, so the row wrapped and left the 22px
   dividers stranded mid-air. Stacked, the line break does the divider's job. Rows stay
   label-then-value inline rather than a label column — an aligned column would rebuild
   the three-column grid this chip replaced. */
/* Stacked overrides is-inline's fit-content: the right-aligned values have to land on
   the CARD's right edge, not on the widest row's — hugged, the block floated mid-card
   with 130px of dead space to its right and the alignment stopped meaning anything. */
/* Values flush right (Grace, 2026-08-21): stacked, a ragged value edge made three
   settings look like three unrelated sentences. Right-aligned, tabular-nums lines the
   figures up in a column and the labels stay a left-hand rail. */

/* ============ Table ============ */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { padding: 11px 14px; font-size: 12px; font-weight: 600; color: var(--fg-secondary); background: var(--muted); text-align: left; border-bottom: 1px solid var(--border-elements); white-space: nowrap; }
.tbl th:first-child { border-top-left-radius: 8px; }
.tbl th:last-child { border-top-right-radius: 8px; }
.tbl td { padding: 15px 14px; font-size: 13px; border-bottom: 1px solid var(--border-elements); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl tbody tr:hover td { background: #fcfbfa; }
.t-muted { color: var(--fg-secondary); }
.t-num { font-variant-numeric: tabular-nums; text-align: right; }
.t-strong { font-weight: 600; }
.receipt-link { display: inline-flex; align-items: center; gap: 4px; color: var(--fg-secondary); font-size: 12px; font-weight: 500; }
.receipt-link:hover { color: var(--primary); }
.receipt-link svg { width: 12px; height: 12px; }
.tbl-scroll { overflow-x: auto; }

/* ============ Credit dashboard ============ */
.balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
.balance-grid > .section-card, .balance-grid > .balance-card { display: flex; flex-direction: column; }
.balance-card { border: 1px solid var(--border); border-radius: 16px; background: var(--card); padding: 24px; }
/* Aligned to Figma card(01) (443:169300): the head row is that component's `header`
   frame — which has a right-hand slot of its own — the number is `Data`, and the unit
   line is `Sub title`. Gaps are the component's: header→Data spacing/2 = 8,
   Data→Sub spacing/1-5 = 6. */
.balance-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; min-height: 28px; }
/* the title row must stay on one line — wrapping it changes the header
   height and knocks this card out of alignment with the one beside it */
.balance-type { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--fg-secondary); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.balance-big { font-size: 30px; line-height: 36px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1.12px; }
.balance-unit { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--fg-secondary); }
.balance-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-elements); }
.split-label { font-size: 11px; color: var(--fg-secondary); display: flex; align-items: center; gap: 5px; }
.split-dot { width: 7px; height: 7px; border-radius: 2px; }
.split-dot.reserved { background: var(--badge-blue-fg); }
.split-dot.available { background: var(--success); }
.split-val { margin-top: 4px; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
/* Meter — a bar is only readable against a reference point, so the auto-recharge
   threshold is marked on it (Vercel Geist: "progress relative to a limit"). */
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--muted); display: flex; overflow: hidden; margin-top: 18px; }
/* Pinned to the bottom of the card so the two balance cards line up even though one
   has a two-part hero (available + reserved) and the other a single number. */
.balance-card .meter { margin-top: auto; }
.balance-card .balance-hero { margin-bottom: 18px; }
.balance-hero .hero-part .balance-unit { margin-top: -2px; }
.meter-fill { height: 100%; }
.meter-fill.available { background: var(--success); }
.meter-fill.reserved { background: var(--badge-blue-fg); opacity: .4; }
.meter-low .meter-fill.available { background: var(--badge-amber-fg); }
.meter-empty .meter-fill.available { background: var(--destructive); }
/* The tick has to read on green, on blue-grey and on the empty track alike,
   so it carries a halo in the card colour instead of relying on opacity. */
.meter-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--fg-secondary); box-shadow: 0 0 0 2px var(--card); }
.meter-legend { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--fg-muted); }

/* ── Sending status (PRD §9) ────────────────────────────────────────────────
   Quiet when everything passes — one line of reassurance. Loud only when
   something actually blocks sending, and then each blocker carries its fix. */
.send-status.is-blocked { border-color: #f3b9b9; background: #fffafa; }
/* Number identity card */
.num-card { padding: 20px 24px; }
.num-head { display: flex; align-items: center; gap: 16px; }
.num-main { padding-left: 0; }
.num-card.red, .num-card.amber { border-color: var(--border-muted); }
.num-main { flex: 1; min-width: 0; }
.num-label { font-size: 12px; color: var(--fg-secondary); }
.num-value { margin-top: 1px; font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.num-note { margin-top: 3px; font-size: 12px; color: var(--fg-muted); }
.num-side { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.num-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; }
.num-card .check-list { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-elements); }
@media (max-width: 720px) { .num-head { flex-wrap: wrap; } .num-side { width: 100%; justify-content: flex-start; } }

/* healthy: a strip, not a card */
.send-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border: 1px solid var(--border); border-radius: 10px; background: var(--sidebar-bg); font-size: 13px; flex-wrap: wrap; }
.send-bar-left { display: inline-flex; align-items: center; gap: 10px; }
.send-bar-left strong { font-weight: 600; }
.send-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
.send-label { color: var(--fg-secondary); }
.send-num { font-weight: 600; color: var(--fg); }
.check-list { display: flex; flex-direction: column; gap: 10px; }
.check-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.check-ico { width: 18px; height: 18px; flex-shrink: 0; color: var(--success); display: inline-flex; }
.check-ico svg { width: 18px; height: 18px; }
.check-row.is-bad .check-ico { color: var(--destructive); }
.check-row.is-bad .check-text { color: #991b1b; font-weight: 500; }
.check-text { flex: 1; }

/* ── Unified balance card ────────────────────────────────────────────────────
   One balance is a different shape of problem from two, so it gets its own
   layout: the hero anchors the left, the meter takes the width it wants, and
   the rate + reservation sit on one footer line. */

.u-foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border-elements); flex-wrap: wrap; }
.u-foot .balance-note { margin: 0; padding: 0; border: none; }


@media (max-width: 900px) {
  .u-body { flex-direction: column; align-items: stretch; gap: 16px; }
  .u-meter { padding-bottom: 0; }
}

/* Hero figure: what the vendor can actually send right now */
.balance-hero { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
/* Two-part hero: ready-to-send keeps the big number because it is the actionable
   one; reserved gets its own line at a smaller size and carries the drill-down.
   Stacked, not side by side — these cards are half-width, and two columns squeezed
   the labels into three-line wraps. Stacking also mirrors the meter's two segments. */
.balance-hero.has-split { align-items: stretch; gap: 10px; }
.balance-hero .hero-part { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
/* Reserved reads as one line (Grace, 2026-08-24): the number and what holds it are a
   single fact, and stacked they also made this card ~26px taller than a sibling with
   nothing reserved, which is where the empty block in the MMS card came from. */
.balance-hero .hero-part-inline { flex-direction: row; align-items: baseline; gap: 7px; }
.balance-hero .hero-part-inline .balance-unit { margin-top: 0; }
.hero-sep { height: 1px; background: var(--border-elements); margin: 2px 0; }
.balance-mid { font-size: 20px; line-height: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.6px; color: var(--fg-secondary); }


/* Reserved is the only figure the hero and legend don't already carry, so it
   gets one line — and only when there is something reserved. */
.balance-note { display: flex; align-items: center; gap: 7px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-elements); font-size: 12px; }
.balance-note-text { font-size: 12px; font-weight: 500; color: var(--fg-secondary); }

.balance-head + .foot-note { margin-top: 0; }
.auto-main { flex: 1; }
/* ── stat-card — Figma `card(01)`, node 443:169300 ──────────────────────────────
   From "Linesheet Details-Statistics (Option02)" (443:169270), the final design.
   Measurements pulled node by node rather than eyeballed:
     card      padding spacing/6 = 24 · radius rounded-2xl = 16 · border base/elements-border
     label     text/xs 12/16 · font-weight/medium 500 · base/secondary #6b6b6b
     value     text/3xl 30/36 · bold · tracking -1.12px · base/foreground #1f1f1f
     sub       text/xs 12/16 · font-weight/normal 400 · base/secondary
     gaps      label→value spacing/2 = 8 · value→sub spacing/1-5 = 6 · card→card 16

   ⚠ Token naming is inverted between Figma and this file: Figma's
   `base/elements-border` (#f2ede7) is our `--border`, while our `--border-elements`
   is #ececec — a different value. The card uses `--border`.

   Separate cards, not one panel with internal dividers: the live screenshot showed
   dividers but the final design does not, and this is the shipped component.

   ⚠ NOT used for the auto-recharge summary. This is a KPI card — the 30px value slot
   exists to make a headline number loud, which is right for `Total Sales $162,400`
   and wrong for `200`, a threshold the vendor set. Applying it there gave settings
   the weight of results. Kept defined because the balance cards are a real candidate:
   `440` + `ready to send` is exactly this Data + Sub title shape. */
.stat-row { display: flex; flex-wrap: wrap; gap: 16px; }
.stat-card { flex: 1 1 190px; min-width: 0; display: flex; flex-direction: column; gap: 6px;
  padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
.stat-title { display: flex; flex-direction: column; gap: 8px; }
.stat-label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--fg-secondary); }
.stat-value { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -1.12px;
  color: var(--fg); font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--fg-secondary); }

.toggle-inline { display: inline-flex; align-items: center; gap: 8px; margin-left: 10px; }
.onoff-btn { border: none; background: transparent; padding: 3px 11px; border-radius: 6px; font: inherit;
  font-size: 11.5px; font-weight: 700; letter-spacing: .03em; color: var(--fg-muted); cursor: pointer; }


/* ============ Billing history pager (Figma 1:16551) ============ */
.pager { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 4px 0; margin-top: 4px; border-top: 1px solid var(--border-elements); flex-wrap: wrap; }
.pager-size { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-secondary); }
.pager-nav { display: inline-flex; align-items: center; gap: 2px; }
.pager-btn { height: 32px; min-width: 32px; padding: 0 10px; border: none; background: transparent; border-radius: 6px; font-family: inherit; font-size: 13px; color: var(--fg-secondary); cursor: pointer; }
.pager-btn:hover:not(:disabled):not(.is-cur) { background: var(--muted); color: var(--fg); }
.pager-btn.is-cur { background: var(--muted); color: var(--fg); font-weight: 600; }
.pager-btn:disabled { color: var(--fg-muted); cursor: not-allowed; }
.pager-dots { color: var(--fg-muted); padding: 0 4px; }
.ext-link { display: inline-flex; width: 12px; height: 12px; color: var(--fg-muted); vertical-align: -1px; }
.ext-link svg { width: 12px; height: 12px; }

/* ============ Subscribe — unsubscribed state (Figma 1:21950) ============ */
.plan-hero { display: flex; align-items: center; gap: 20px; padding: 22px 24px; background: var(--muted); border-radius: 10px; flex-wrap: wrap; }
.plan-hero-price { font-size: 40px; line-height: 44px; font-weight: 700; color: var(--primary); letter-spacing: -.02em; }
.plan-hero-unit { font-size: 14px; font-weight: 500; }
.plan-hero-note { margin-top: 2px; font-size: 12px; color: var(--fg-secondary); }
.plan-hero-cta { margin-left: auto; }
.unlock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.unlock-item { display: flex; gap: 12px; padding: 16px; border: 1px solid var(--border-elements); border-radius: 10px; }
.unlock-ico { width: 32px; height: 32px; border-radius: 8px; background: var(--muted); color: var(--fg-secondary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.unlock-ico svg { width: 16px; height: 16px; }
.unlock-title { font-size: 13px; font-weight: 600; }
.unlock-desc { margin-top: 3px; font-size: 12px; line-height: 16px; color: var(--fg-secondary); }
@media (max-width: 720px) { .unlock-grid { grid-template-columns: 1fr; } }

/* ============ Campaign send screen ============ */
.compose-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: start; }
.field { margin-bottom: 16px; }
/* label — Inter Medium 12/16, base/secondary (design system 4607:65665) */
.field-label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--fg-secondary); margin-bottom: 8px; display: block; }
.textarea { width: 100%; min-height: 120px; padding: 12px 14px; border: 1px solid var(--border-muted); border-radius: 8px; font-family: inherit; font-size: 13px; line-height: 20px; resize: vertical; color: var(--fg); }
.recipients-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border: 1px solid var(--border-elements); border-radius: 10px; background: var(--muted); }
.precheck { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-radius: 10px; font-size: 13px; line-height: 19px; margin-top: 4px; }
.precheck svg { width: 18px; height: 18px; flex-shrink: 0; }
.precheck.ok { background: var(--badge-green); color: #3d7666; }
.precheck.ok svg { color: var(--badge-green-fg); }
.precheck.short { background: var(--badge-amber); color: #7c5a2e; }
.precheck.short svg { color: var(--badge-amber-fg); }
.precheck.blocked { background: var(--destructive-soft); color: #991b1b; }
.precheck.blocked svg { color: var(--destructive); }
.send-actions { display: flex; gap: 8px; margin-top: 18px; }



/* ============ Billing history pager (Figma 1:16551) ============ */
.pager { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 4px 0; margin-top: 4px; border-top: 1px solid var(--border-elements); flex-wrap: wrap; }
.pager-size { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-secondary); }
.pager-nav { display: inline-flex; align-items: center; gap: 2px; }
.pager-btn { height: 32px; min-width: 32px; padding: 0 10px; border: none; background: transparent; border-radius: 6px; font-family: inherit; font-size: 13px; color: var(--fg-secondary); cursor: pointer; }
.pager-btn:hover:not(:disabled):not(.is-cur) { background: var(--muted); color: var(--fg); }
.pager-btn.is-cur { background: var(--muted); color: var(--fg); font-weight: 600; }
.pager-btn:disabled { color: var(--fg-muted); cursor: not-allowed; }
.pager-dots { color: var(--fg-muted); padding: 0 4px; }
.ext-link { display: inline-flex; width: 12px; height: 12px; color: var(--fg-muted); vertical-align: -1px; }
.ext-link svg { width: 12px; height: 12px; }

/* ============ Subscribe — unsubscribed state (Figma 1:21950) ============ */
.plan-hero { display: flex; align-items: center; gap: 20px; padding: 22px 24px; background: var(--muted); border-radius: 10px; flex-wrap: wrap; }
.plan-hero-price { font-size: 40px; line-height: 44px; font-weight: 700; color: var(--primary); letter-spacing: -.02em; }
.plan-hero-unit { font-size: 14px; font-weight: 500; }
.plan-hero-note { margin-top: 2px; font-size: 12px; color: var(--fg-secondary); }
.plan-hero-cta { margin-left: auto; }
.unlock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.unlock-item { display: flex; gap: 12px; padding: 16px; border: 1px solid var(--border-elements); border-radius: 10px; }
.unlock-ico { width: 32px; height: 32px; border-radius: 8px; background: var(--muted); color: var(--fg-secondary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.unlock-ico svg { width: 16px; height: 16px; }
.unlock-title { font-size: 13px; font-weight: 600; }
.unlock-desc { margin-top: 3px; font-size: 12px; line-height: 16px; color: var(--fg-secondary); }
@media (max-width: 720px) { .unlock-grid { grid-template-columns: 1fr; } }

/* ============ Campaign send (Figma 3202:22463) ============ */
.crumb { font-size: 12px; color: var(--fg-muted); margin-bottom: 10px; }
.camp-title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.camp-actions { display: flex; gap: 8px; flex-shrink: 0; }
.camp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.camp-col { display: flex; flex-direction: column; gap: 20px; }
.camp-card-title { font-size: 14px; font-weight: 600; }
.camp-card-sub { margin-top: 4px; font-size: 12px; color: var(--fg-secondary); }
.camp-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.ls-meta { margin-top: 10px; border: 1px solid var(--border-elements); border-radius: 8px; overflow: hidden; }
.ls-meta-row { display: flex; align-items: center; gap: 6px; padding: 9px 12px; font-size: 12px; background: var(--muted); border-bottom: 1px solid var(--border-elements); }
.ls-meta-row:last-child { border-bottom: none; }

/* radio card — design system 4607:65567 */
.radio-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.radio-card { display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer; font-family: inherit; }
.radio-card:hover { border-color: var(--accent); }
.radio-card.is-sel { border: 2px solid var(--accent); padding: 15px; background: var(--muted); }
.radio { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 50%; background: #fff; flex-shrink: 0; margin-top: 1px; display: inline-flex; align-items: center; justify-content: center; }
.radio-card.is-sel .radio { border-color: var(--fg); }
.radio-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); }
.radio-body { display: flex; flex-direction: column; gap: 6px; }
.radio-label { font-size: 14px; line-height: 1; color: var(--fg); }
.radio-card.is-sel .radio-label { font-weight: 500; }
.radio-desc { font-size: 12px; line-height: 16px; color: var(--fg-secondary); }
.sched-detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-elements); }

/* preview */
.preview-card { position: sticky; top: 16px; }
.phone { margin-top: 14px; border: 1px solid var(--border-elements); border-radius: 12px; padding: 18px 16px; min-height: 300px; }
.phone-num { text-align: center; font-size: 12px; font-weight: 500; background: var(--muted); border-radius: 999px; padding: 5px 12px; display: inline-block; margin: 0 auto 16px; width: auto; }
.phone { text-align: center; }
.bubble { text-align: left; display: inline-block; max-width: 78%; background: var(--muted); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 19px; }
.preview-note { margin-top: 14px; font-size: 11px; line-height: 16px; color: var(--fg-muted); }

/* the cost line is where the pre-send check lives — it already existed */
.cost-line { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-elements); font-size: 12px; line-height: 17px; color: var(--fg-secondary); }
.cost-line.short { display: flex; gap: 8px; color: #7c5a2e; background: var(--badge-amber); border: 1px solid #f0dcc0; border-radius: 8px; padding: 11px 13px; margin-top: 14px; }
.cost-line.short strong { color: #6b4a22; }
.cost-ico { width: 16px; height: 16px; flex-shrink: 0; color: var(--badge-amber-fg); }
.cost-ico svg { width: 16px; height: 16px; }

@media (max-width: 1180px) { .camp-grid { grid-template-columns: 1fr; } }

/* ============ Modal ============ */
.scrim { position: fixed; inset: 0; background: rgba(31,31,31,.4); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 200; }
/* every modal is 480 max — same measure as the drawer */
.modal { width: 100%; max-width: 480px; max-height: calc(100vh - 48px); overflow-y: auto; background: var(--card); border-radius: 16px; box-shadow: var(--shadow-lg); }

.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 0; }
.modal-title { font-size: 18px; font-weight: 700; }
.modal-sub { margin-top: 4px; font-size: 13px; color: var(--fg-secondary); }
.modal-x { width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: var(--fg-muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.modal-x:hover { background: var(--muted); color: var(--fg); }
.modal-body { padding: 20px 24px; }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 24px 22px; border-top: 1px solid var(--border-elements); margin-top: 4px; }
.modal-foot .left-note { margin-right: auto; font-size: 12px; color: var(--fg-muted); }

/* Group header — only the merged 4-tab layout uses these. Folding two tabs into one
   page is only worth doing if the result reads as a few things instead of many, so
   the merged tab is three labelled groups. The header carries the group's name and,
   for the subscription group, its status and action too — the card inside then drops
   its own head rather than repeating the name one line below it. */
.group { margin-top: 26px; }
.group:first-child { margin-top: 0; }
.group-head { display: flex; align-items: flex-start; gap: 14px; padding: 0 2px 12px; }
.group-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.group-desc { margin-top: 2px; font-size: 12.5px; color: var(--fg-secondary); }
.group-actions { margin-left: auto; flex-shrink: 0; }
.group-body { display: flex; flex-direction: column; gap: 14px; }


/* Consent row — §6.2 step 4 records consent as chargeback evidence, so it has to
   be an affirmative act, not fine print. Selection uses the system's 2px #404040
   selected-state border, keeping the one saturated pink for the primary button. */
/* Clickwrap consent text. It is a STATEMENT, not a control — so it gets no box and no
   checkbox: an outlined box reads as a button on these screens, and the consenting act
   is the primary button directly below it (§6.2 "'I Consent' 명시 클릭으로 확정").
   Replaced a bordered checkbox row, whose CSS (.consent/.chk) went with it. */
.consent-note { font-size: 12.5px; line-height: 19px; color: var(--fg-secondary); margin-top: 18px; }
.consent-note strong { color: var(--fg); font-weight: 600; }

/* ============ Right drawer ============
   Project rule: modals are CONFIRMATION ONLY.
   Anything the vendor has to fill in or choose opens here, or expands inline. */
.drawer-scrim { position: fixed; inset: 0; background: rgba(31,31,31,.35); z-index: 200; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100vw;
  background: var(--card); box-shadow: var(--shadow-lg); z-index: 201;
  display: flex; flex-direction: column;
  animation: drawerIn .22s cubic-bezier(.22,1,.36,1);
}
@keyframes drawerIn { from { transform: translateX(100%); } to { transform: none; } }
@media (min-width: 1240px) { body.proto-open .drawer { right: 356px; } }
.drawer-head { flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 16px; border-bottom: 1px solid var(--border-elements); }
.drawer-title { font-size: 18px; font-weight: 700; }
.drawer-sub { margin-top: 4px; font-size: 13px; color: var(--fg-secondary); line-height: 18px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
.drawer-foot { flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--border-elements); background: var(--card); }
.drawer-foot .left-note { margin-right: auto; font-size: 12px; color: var(--fg-muted); }

/* inline card entry form (Payment methods) — a card is a row added to a list that is
   already on this page, so it expands in place instead of opening an overlay. */
/* One accent per screen: the form is a quiet neutral surface and lets the
   primary button carry the only saturated pink in view. */
.inline-form { border: 1px solid var(--border-muted); border-radius: 12px; background: var(--muted); padding: 20px; margin-bottom: 14px; animation: inlineIn .18s ease-out; }
/* Card entry became a modal on 2026-08-24. Its inner markup still uses the inline-form
   classes, so the padding that .inline-form used to supply moves onto the modal. */
.modal.card-modal { padding: 20px 22px 22px; }

/* ============ Email ============
   Figma node 317:816391 — the transactional shell Shopcord ALREADY sends, so these
   templates are dressed in it rather than in something invented. Two things it does
   not share with the product: the type is Arial, because it is email and web-safe
   fonts are the constraint; and the CTA pink is the email's own #e53a85, not
   --primary. Measurements are the node's — 600 canvas, 540 card, 480 content column,
   30px gutters, 50px CTA, 0.64px tracking on the uppercase label.

   The preview around it is reviewer scaffolding: the header carries the PB id, the
   recipient and the channels, and the subject line sits in a mail-client bar, because
   the subject is as much of the deliverable as the body. */
.email-modal { width: 100%; max-width: 700px; max-height: calc(100vh - 48px); display: flex; flex-direction: column;
  background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-lg); }
.em-head { flex-shrink: 0; padding: 16px 20px; border-bottom: 1px solid var(--border-elements); background: var(--bg);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.em-spec { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-muted); }
.em-meta { margin-top: 7px; font-size: 12px; line-height: 18px; color: var(--fg-secondary); }
.em-chan { display: inline-flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
.em-chip { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; padding: 2px 7px; border-radius: 999px;
  background: var(--badge-blue); color: #4a6285; }
.em-chip.off { background: #f4f4f5; color: var(--fg-muted); }
.em-scroll { flex: 1; overflow-y: auto; background: #e7e2dc; padding: 22px; }
.em-frame { width: 600px; max-width: 100%; margin: 0 auto; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.10); }
.em-subj { background: #fff; padding: 13px 20px; border-bottom: 1px solid var(--border-elements);
  font-size: 11.5px; line-height: 17px; color: var(--fg-muted); }
.em-subj b { display: block; margin-top: 3px; font-size: 13.5px; color: var(--fg); font-weight: 600; }

/* ---- the shell itself ---- */
.em-canvas { background: var(--email-bg); padding: 30px 0 40px; font-family: Arial, Helvetica, sans-serif; }
.em-logo { text-align: center; font-size: 20px; line-height: 21px; font-weight: 700; letter-spacing: -.03em; color: #1f1f1f; }
.em-logo span { color: var(--email-accent); }
.em-card { width: 540px; max-width: calc(100% - 24px); margin: 30px auto 0; background: #fff; border-radius: 8px;
  padding: 30px 30px 38px; color: #333; }
.em-title { font-size: 22px; line-height: 32px; font-weight: 700; text-align: center; }
.em-sub { margin-top: 8px; font-size: 16px; line-height: 24px; font-weight: 700; text-align: center; }
.em-rule { width: 60px; height: 1px; background: #d8d3ce; margin: 30px auto 0; }
.em-content { margin-top: 30px; display: flex; flex-direction: column; gap: 24px; font-size: 16px; line-height: 24px; }
.em-content > p { margin: 0; }
.em-link { font-weight: 700; text-decoration: underline; color: #333; }
.em-cta { display: block; height: 50px; line-height: 50px; border-radius: 8px; background: var(--email-accent); color: #fff;
  text-align: center; font-size: 16px; font-weight: 700; letter-spacing: .64px; text-transform: uppercase; text-decoration: none; }
.em-sign { margin-top: 30px; font-size: 16px; line-height: 24px; color: #333; }
.em-footer { width: 540px; max-width: calc(100% - 24px); margin: 50px auto 0; text-align: center;
  font-family: Arial, Helvetica, sans-serif; font-size: 11px; line-height: 18px; color: #666; }
.em-footer div + div { margin-top: 4px; }
.em-footer u { text-decoration: underline; }
/* Not in the node — invoices need a figure the eye can land on, and a sentence cannot
   carry four numbers. Kept in the shell's type and colour so it reads as part of it. */
.em-box { border: 1px solid #e5e0da; border-radius: 8px; overflow: hidden; }
.em-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 15px; font-size: 15px; }
.em-row + .em-row { border-top: 1px solid #e5e0da; }
.em-row .k { color: #666; }
.em-row .v { font-weight: 700; text-align: right; }
.em-row.tot { background: var(--email-bg); }
.em-row.tot .v { font-size: 19px; }
.em-ul { margin: 0; padding-left: 22px; }
.em-ul li + li { margin-top: 8px; }
.em-sms { width: 540px; max-width: calc(100% - 24px); margin: 18px auto 0; }
.em-sms-k { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #7d766c; }
.em-sms-bubble { margin-top: 7px; background: #fff; border-radius: 12px; padding: 12px 15px;
  font-size: 13px; line-height: 19px; box-shadow: var(--shadow-xs); }
.em-open { width: 540px; max-width: calc(100% - 24px); margin: 16px auto 0; background: var(--sonner-bg-warning);
  border-radius: 10px; padding: 12px 14px; font-size: 12px; line-height: 18px; color: #7c5a1f; }
.em-open b { font-weight: 700; }

/* ============ Generated document (PO) ============
   Structure follows the current FashionGo PO, which is what §5.1's attachment spec says
   to reference (Figma 326:823247 — a flattened screenshot, so there is nothing to
   pixel-match; what it offers is an information architecture that has survived real
   wholesale use). Bordered blocks, a size grid inside each line, and a totals stack.
   The CONTENT is Shopcord's, and the differences are deliberate — see docPO. */
.doc-modal { width: 100%; max-width: 940px; max-height: calc(100vh - 48px); display: flex; flex-direction: column;
  background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-lg); }
/* A viewer toolbar, not a review header. The spec id, the recipient and the chips used to
   sit here and they are the reason the thing read as "what am I looking at" — that is
   reviewer furniture on top of a document. It lives in the panel list instead, where the
   reviewer already is. What a PDF viewer shows is the file and what you can do with it. */
.doc-head { flex-shrink: 0; padding: 11px 14px 11px 18px; border-bottom: 1px solid var(--border-elements);
  background: var(--card); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.doc-name { font-size: 13px; font-weight: 600; color: var(--fg); }
.doc-actions { display: flex; align-items: center; gap: 6px; }
.doc-scroll { flex: 1; overflow-y: auto; background: #b9b4ae; padding: 26px 22px; }
/* Documents inside the viewer are SHEETS: US Letter at 96dpi (816 × 1056), real page
   margins, a shadow so the edge reads, and the gray behind them a PDF viewer uses.
   Type is sized to the page (9–11pt printed), not to the screen — that is most of what
   makes a document look like a document rather than a web page. */
.sheet { width: 816px; min-height: 1056px; margin: 0 auto; background: #fff;
  padding: 48px 54px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.sheet + .sheet { margin-top: 24px; }

/* The PO wears the SETTLEMENT statement's visual language (Figma 326:823258) — that node
   is the design reference: big left title with a muted number under it, brand and
   generated-on to the right, then ONE bordered card holding everything, muted small
   labels over bold values, thin-ruled rows, an oversized total.
   Its CONTENT is not borrowed. The content reference is the current FashionGo PO, which
   is what §5.1 names — adapted to Shopcord, because the platforms differ. The two
   references do different jobs and neither does the other's. */
/* Figma 326:823040 — the PO layout Grace's side picked. A flat table with ONE ROW PER
   COLOURWAY rather than a grid nested inside each style: the same numbers, but the page
   reads top to bottom in one pass and every row carries its own money. Header is the
   wordmark and title on the left with a fact list on the right over a heavy rule; the
   parties sit in a single bordered box split down the middle. */
.po-paper { color: #1a1a1a; font-size: 11px; line-height: 16px; }
.po-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; }
.po-brandmark { font-size: 13px; font-weight: 700; letter-spacing: -.02em; }
.po-brandmark span { color: var(--email-accent); }
.po-title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin-top: 3px; }
.po-facts { min-width: 268px; }
.po-fact { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 2.5px 0; }
.po-fact .k { color: #8a8378; }
.po-fact .v { font-weight: 700; text-align: right; }
.po-pill { display: inline-block; padding: 1px 9px; border: 1px solid #1a1a1a; border-radius: 999px;
  font-size: 9px; font-weight: 700; letter-spacing: .05em; }
.po-rule { height: 2px; background: #1a1a1a; margin: 12px 0 15px; }

.po-parties { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #ddd8d2; }
.po-party { padding: 12px 16px; }
.po-party + .po-party { border-left: 1px solid #ddd8d2; }
.po-k { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8a8378; }
.po-name { margin-top: 6px; font-size: 12px; font-weight: 700; }
.po-line { color: #3a3a3a; }
.po-sub { margin-top: 11px; padding-top: 10px; border-top: 1px dashed #ddd8d2; }
.po-sub .po-k { margin-bottom: 5px; }

.po-tbl { width: 100%; border-collapse: collapse; margin-top: 16px; }
.po-tbl th { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8a8378;
  text-align: left; padding: 0 8px 7px 0; border-bottom: 1px solid #cfc9c2; white-space: nowrap; }
.po-tbl th.n, .po-tbl td.n { text-align: right; padding-right: 0; }
.po-tbl th.n { padding-right: 0; }
.po-tbl td { padding: 9px 8px 9px 0; border-bottom: 1px solid #efece8; vertical-align: top; }
.po-opt { font-weight: 700; }
.po-style { margin-top: 1px; font-size: 10px; color: #8a8378; white-space: nowrap; }
.po-run { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; white-space: nowrap; }

.po-sums { margin-top: 14px; display: flex; justify-content: flex-end; }
.po-sums-in { min-width: 292px; }
.po-sum { display: flex; justify-content: space-between; gap: 20px; padding: 3px 0; }
.po-sum.tot { margin-top: 7px; padding-top: 10px; border-top: 1px solid #1a1a1a; font-size: 15px; font-weight: 700; }
.po-ship { margin-top: 5px; text-align: right; font-size: 10px; color: #8a8378; font-style: italic; }

/* No rule under a label. A rule between a label and the value it labels breaks the pair
   the eye is trying to read as one thing, and six of them turned this page into stripes.
   Sections are separated by SPACE — the same vocabulary the settlement statement uses,
   where rules divide rows of data and never a label from its value. */
.po-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 30px; margin-top: 30px; }
.po-meta-v { margin-top: 6px; }
.po-meta-v.soft { color: #8a8378; }
.po-note { margin-top: 28px; }
.po-note-v { margin-top: 6px; color: #3a3a3a; }
/* Terms is a labelled block like the others, not a floating outlined box — an outlined
   box reads as a control here, and the italic grey already says "placeholder". */
.po-legal { margin-top: 28px; }
.po-legal-v { margin-top: 6px; font-size: 10.5px; color: #9a9389; font-style: italic; }
.po-cont { display: flex; justify-content: space-between; gap: 20px; padding-bottom: 12px;
  border-bottom: 1px solid #ddd8d2; color: #8a8378; }
.po-cont b { color: #1a1a1a; font-weight: 700; }
.po-foot { margin-top: 24px; padding-top: 13px; border-top: 1px solid #ddd8d2; display: flex;
  justify-content: space-between; gap: 20px; font-size: 10px; color: #8a8378; }

@page { size: letter portrait; margin: 0; }
@media print {
  body[data-print="doc"] { background: #fff; }
  body[data-print="doc"] > *:not(#modal-root) { display: none !important; }
  body[data-print="doc"] #modal-root .scrim { position: static; background: none; padding: 0; display: block; }
  body[data-print="doc"] .doc-modal { max-width: none; max-height: none; border-radius: 0; box-shadow: none; display: block; }
  body[data-print="doc"] .doc-head { display: none !important; }
  body[data-print="doc"] .doc-scroll { overflow: visible; background: #fff; padding: 0; }
  body[data-print="doc"] .po-paper { max-width: none; box-shadow: none; padding: 40px 46px; }
  body[data-print="doc"] .po-line, body[data-print="doc"] .po-top,
  body[data-print="doc"] .po-boxrow, body[data-print="doc"] .po-bottom { break-inside: avoid; }
}

/* ---- settlement statement ----
   Figma 326:823258 — the PDF settlement already sends. Design taken as directed: a big
   title with a muted statement number, the brand and generation date on the right, and
   ONE bordered card holding a vendor block, a settlement date, and a summary whose
   adjustments nest under their total. */
.stmt { color: #1a1a1a; font-size: 12px; line-height: 18px; }
.stmt-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 32px; margin-bottom: 18px; }
.stmt-title { font-size: 21px; line-height: 27px; font-weight: 700; letter-spacing: -.02em; }
.stmt-no { margin-top: 6px; font-size: 13px; color: #9a9a9a; }
.stmt-brand { font-size: 19px; font-weight: 700; text-align: right; }
.stmt-gen { margin-top: 6px; font-size: 13px; color: #9a9a9a; text-align: right; }
.stmt-card { padding-top: 22px; border-top: 1px solid #e8e6e3; margin-top: 20px; }
.stmt-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.stmt-k { font-size: 13px; color: #9a9a9a; }
.stmt-name { margin-top: 8px; font-weight: 700; }
.stmt-line { color: #3a3a3a; }
.stmt-gap { margin-top: 14px; }
.stmt-date { margin-top: 8px; font-size: 17px; font-weight: 700; }
.stmt-sum-k { margin-top: 30px; font-size: 13px; color: #9a9a9a; }
.stmt-row { display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
  padding: 13px 0; border-bottom: 1px solid #efece8; font-weight: 700; }
.stmt-sub { display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
  padding: 5px 0 5px 24px; color: #7a7a7a; font-weight: 400; border-bottom: 0; }
.stmt-sub + .stmt-row { border-top: 1px solid #efece8; }
.stmt-total { display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
  padding: 18px 0 4px; font-size: 20px; font-weight: 700; }

/* ---- receipt: a FIELD SPEC drawn as the document ----
   Balance renders the real thing, so this is not a visual template to hand them. It is
   the field list arranged the way a receipt arranges fields, because that is the form in
   which "these must be present" is actually reviewable — a bulleted list of field names
   hides whether the document would make sense. Every value here is either doc-grounded
   or marked as a request. */
.rcpt { max-width: 620px; margin: 0 auto; background: #fff; border: 1px solid #e2ddd7; border-radius: 6px;
  padding: 30px 34px; color: #1c1c1c; font-size: 12.5px; line-height: 18px; }
/* Inside a sheet the page already is the paper, so the receipt drops its own frame. */
.sheet .rcpt { max-width: none; border: 0; border-radius: 0; padding: 0; }
/* In the vendor's modal the modal IS the sheet, so the paper drops its own frame. */
.modal.rcpt-modal { max-width: 680px; padding: 0; position: relative; overflow: visible; }
.rcpt-modal .rcpt { max-width: none; border: 0; border-radius: 16px; padding: 34px 38px; }
.rcpt-modal .modal-x { position: absolute; top: 14px; right: 14px; }
.rcpt-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
  padding-bottom: 18px; border-bottom: 1px solid #e2ddd7; }
.rcpt-brand { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.rcpt-brand span { color: var(--email-accent); }
.rcpt-org { margin-top: 7px; color: #6b6b6b; }
.rcpt-doc { text-align: right; }
.rcpt-doc-k { font-size: 15px; font-weight: 700; letter-spacing: .1em; }
.rcpt-paid { display: inline-block; margin-top: 7px; padding: 2px 9px; border-radius: 999px;
  background: var(--badge-green); color: var(--badge-green-fg); font-size: 10px; font-weight: 700; letter-spacing: .06em; }
.rcpt-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 20px; }
.rcpt-k { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #8a8378; }
.rcpt-v { margin-top: 6px; }
.rcpt-v .muted { color: #6b6b6b; }
.rcpt-tbl { width: 100%; border-collapse: collapse; margin-top: 22px; }
.rcpt-tbl th { text-align: left; font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: #8a8378; padding: 0 0 8px; border-bottom: 1px solid #1c1c1c; }
.rcpt-tbl th.n, .rcpt-tbl td.n { text-align: right; }
.rcpt-tbl td { padding: 11px 0; border-bottom: 1px solid #eeeae4; }
.rcpt-sums { margin-top: 14px; display: flex; justify-content: flex-end; }
.rcpt-sums-in { min-width: 250px; }
.rcpt-sum { display: flex; justify-content: space-between; padding: 4px 0; }
.rcpt-sum.tot { margin-top: 5px; padding-top: 9px; border-top: 1px solid #1c1c1c; font-size: 14px; font-weight: 700; }
.rcpt-foot { margin-top: 24px; padding-top: 14px; border-top: 1px solid #e2ddd7; color: #6b6b6b; font-size: 11px; line-height: 17px; }

/* ---- reference card: notes under the spec ----
   The receipt is Balance's PDF. Drawing a version of it would be inventing another
   company's document, and a reviewer would then measure our build against a picture
   nobody agreed to. So this states what it is, what we hand over, and what is still
   unanswered — and looks deliberately like a spec, not a design. */
.ref-card { max-width: 720px; margin: 0 auto; background: var(--card); border: 1px solid var(--border-elements);
  border-radius: 12px; padding: 24px 26px; }
.ref-warn { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--sonner-bg-warning);
  color: #7c5a1f; font-size: 13px; line-height: 19px; }
.ref-sec { margin-top: 22px; }
.ref-k { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted);
  padding-bottom: 7px; border-bottom: 1px solid var(--border-elements); }
.ref-v { margin-top: 10px; font-size: 13.5px; line-height: 20px; color: var(--fg-secondary); }
.ref-v b { color: var(--fg); font-weight: 600; }
.ref-v ul { margin: 8px 0 0; padding-left: 19px; }
.ref-v li + li { margin-top: 5px; }
.ref-src { margin-top: 4px; font-size: 11.5px; color: var(--fg-muted); }
.ref-tbl { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
.ref-tbl th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--fg-muted); padding: 0 10px 7px 0; border-bottom: 1px solid var(--border-elements); }
.ref-tbl td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--border-elements); vertical-align: top;
  color: var(--fg-secondary); line-height: 19px; }
.ref-tbl td:first-child { color: var(--fg); font-weight: 600; width: 38%; }
.ref-tbl td:last-child { padding-right: 0; font-size: 11.5px; color: var(--fg-muted); width: 30%; }
.ref-tbl tr.want td:first-child::after { content: 'REQUESTED'; margin-left: 8px; font-size: 9px; font-weight: 700;
  letter-spacing: .05em; padding: 1px 5px; border-radius: 3px; background: var(--badge-amber); color: var(--badge-amber-fg); vertical-align: 2px; }

/* ============ Confirmation popup ============
   Figma "Payment & Billing Update" node 1:22320 (Popup-Discard). The design system's
   alert-style confirm, and it is NOT the wide modal above — measured differences, all
   taken from the node: 8px radius (not 16), a 1px elements border, 24px padding and
   24px gaps, a 16/24 semibold title (not 18/700) beside a 32px error-tinted circle,
   14/20 body text at full --fg (not 13px secondary), and NO close X (hidden in the
   component).
   The two buttons are EQUAL and fill the row: the safe one carries a full-strength
   #1f1f1f border rather than the muted one, so neither choice is visually suppressed —
   which is also what keeps the cancel path from becoming a dark pattern. */
.modal.modal-confirm { max-width: 620px; padding: 24px; border: 1px solid var(--border); border-radius: 8px;
  display: flex; flex-direction: column; gap: 24px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1); }
.confirm-top { display: flex; align-items: center; gap: 8px; }
.confirm-ico { width: 32px; height: 32px; border-radius: 9999px; background: var(--sonner-bg-error);
  color: var(--sonner-fg-error); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.confirm-ico svg { width: 16px; height: 16px; }
.confirm-title { font-size: 16px; line-height: 24px; font-weight: 600; color: #0a0a0a; }
.confirm-detail { font-size: 14px; line-height: 20px; color: var(--fg); }
.confirm-detail > p { font-weight: 500; margin: 0; }
.confirm-detail ul { margin: 20px 0 0; padding-left: 21px; list-style: disc; }
.confirm-detail li { font-weight: 400; }
.confirm-detail li + li { margin-top: 2px; }
.confirm-foot { display: flex; gap: 8px; }
.confirm-foot .btn { flex: 1 0 0; min-width: 0; }
.confirm-foot .btn-outline { border-color: var(--fg); box-shadow: none; }
@keyframes inlineIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.inline-form-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.inline-form-title { font-size: 14px; font-weight: 700; }
.inline-form-sub { margin-top: 3px; font-size: 12px; color: var(--fg-secondary); }
.inline-form-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-elements); }
/* The label carries the amount, so it changes width with the selection ($28.00 →
   $230.00) and dragged Cancel sideways on every click. A floor wide enough for the
   longest amount holds both buttons still. */
.inline-form-foot .btn-primary { min-width: 132px; justify-content: center; }
.inline-form-foot .left-note { margin-right: auto; font-size: 12px; color: var(--fg-muted); }
/* height is reserved so the Balance widget growing (state field, inline errors)
   doesn't shove the card list down mid-entry */
.pg-frame.reserve { min-height: 236px; }
/* the row that was just added gets a moment of attention */
@keyframes cardFlash {
  0%, 65% { box-shadow: 0 0 0 3px var(--badge-green); border-color: var(--badge-green-fg); }
  100%    { box-shadow: 0 0 0 3px var(--primary-soft); border-color: var(--primary); }
}
.card-row.is-new { animation: cardFlash 1.8s ease-out; }

/* inline edit panel (auto-recharge) */
/* An edit panel is not a selection — it uses the same neutral surface as the
   card-entry form. Pink-soft belongs to the active tab only. */

/* Balance widget placeholder — the parent panel already provides the surface,
   so this adds no third container of its own */
.pg-frame { padding: 0; }
.pg-frame-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--badge-blue-fg); background: var(--badge-blue); padding: 3px 8px; border-radius: 10px; margin-bottom: 14px; }
.pg-frame-tag svg { width: 11px; height: 11px; flex-shrink: 0; }
.pg-field { margin-bottom: 12px; }
.pg-field-label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--fg-secondary); margin-bottom: 8px; display: block; }
.pg-input { height: 36px; background: #fff; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; line-height: 20px; color: var(--fg-muted); }
.pg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pg-note { margin-top: 12px; font-size: 11px; color: var(--fg-muted); line-height: 16px; }

/* pack picker */
/* auto-fit, so the two columns become one inside a narrow card (4-tab layout, small
   screens) instead of squeezing a receipt into 250px. */
.buy-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; align-items: start; margin-top: 16px; }
.pack-list { display: flex; flex-direction: column; gap: 10px; }
/* Selection card — design system node 4607:65567.
   default 1px border · hover 1px accent · selected 2px accent. Not pink:
   the accent border is how this system marks a chosen option. */
/* A row per pack: radio for "pick one", count on the left, price right-aligned so the
   three prices form a column you can compare. The 2px selected border is the project's
   selection treatment; the radio says it is a choice, which a border alone does not. */
.pack-opt { transition: border-color .13s ease, background-color .13s ease; display: grid; grid-template-columns: 15px 1fr auto; align-items: center; gap: 12px; padding: 15px 16px; border: 1px solid var(--border); border-radius: 10px; text-align: left; cursor: pointer; background: var(--card); font: inherit; }
.pack-radio { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border-muted); background: var(--card); }
.pack-opt.is-sel .pack-radio { border: 4px solid var(--accent); }
.pack-opt:hover { border-color: var(--fg-muted); }
.pack-opt.is-sel:hover { border-color: var(--accent); }
.pack-opt.is-sel { border: 2px solid var(--accent); padding: 14px 15px; background: var(--muted); }
.pack-opt.is-sel .pack-count { font-weight: 700; }
.pack-count { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pack-unit { font-size: 12px; font-weight: 500; color: var(--fg-secondary); }
.pack-price { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
/* Two chips that hug their text. The first attempt was a full-width two-cell bar and
   at 1,000px it was a grey slab with two short labels adrift in it — the same mistake
   the auto-recharge summary made earlier today, and the same fix: supporting facts take
   the room they need and no more. Chips keep the pair scannable without a surface that
   claims the whole width. */
.rate-banner { display: flex; align-items: flex-start; gap: 12px; margin-top: 16px; padding: 13px 16px; border-radius: 10px; background: var(--badge-blue); }
.rate-banner-ico { flex-shrink: 0; width: 28px; height: 28px; border-radius: 14px; background: #fff; color: var(--badge-blue-fg); display: flex; align-items: center; justify-content: center; }
.rate-banner-ico svg { width: 15px; height: 15px; }
.rate-banner-title { font-size: 13px; font-weight: 500; color: var(--badge-blue-fg); }
.rate-banner-title strong { font-weight: 700; }
.rate-banner-sub { margin-top: 2px; font-size: 12px; color: var(--badge-blue-fg); opacity: .85; }
.bs-change strong { animation: figureIn .22s ease-out; }
@keyframes figureIn { from { opacity: .25; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
.rate-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.section-head .rate-strip { margin-top: 0; margin-left: auto; margin-right: 14px; align-self: center; }
/* Filled, not outlined, and only slightly rounded: in this UI an outlined pill IS a
   button (.btn-outline), so the first version invited a press. A tint with no border
   reads as a label — same grouping, no affordance. */
.rate-chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 11px; border-radius: 7px; background: var(--muted); font-size: 12px; color: var(--fg-secondary); }
.rate-chip strong { font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }
.u-top { display: flex; align-items: center; gap: 28px; }
/* One line — the number and what it counts are a single fact (Grace, 2026-08-24). */
.u-hero { flex-shrink: 0; display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.u-hero .balance-unit { display: inline-flex; align-items: center; gap: 8px; margin-top: 0; }
.u-meter { flex: 1; min-width: 0; }
.u-meter .meter { margin-top: 0; }
.u-explain { margin-top: 12px; font-size: 12px; line-height: 17px; color: var(--fg-secondary); }
.u-explain strong { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
/* pack purchase expands inline under the balance grid — the current balance
   stays on screen, which is the only thing that makes a pack size judgeable */
.inline-buy { border-color: var(--accent); animation: inlineIn .18s ease-out; }
.tbd-note { margin-top: 12px; font-size: 11px; color: var(--fg-muted); }

.summary-box { margin-top: 18px; border: 1px solid var(--border-elements); border-radius: 10px; overflow: hidden; }
.summary-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; font-size: 13px; border-bottom: 1px solid var(--border-elements); }
.summary-row:last-child { border-bottom: none; }
.summary-row.total { background: var(--muted); font-weight: 700; font-size: 14px; }
/* A receipt block, not a full-width table. At the panel's width the label sat ~950px
   from its value and the eye had to travel for every line; capped and pulled right it
   sits directly above the Pay button, which is where the same numbers are going. */
.buy-summary { margin-top: 0; width: 100%; padding: 16px 18px 18px; border: 1px solid var(--border-elements); border-radius: 12px; background: var(--muted); }
.buy-summary .pay-with-line { margin-top: 12px; }
.buy-summary .pay-with { margin-top: 12px; }
.bs-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 9px 2px; font-size: 13px; }
.bs-row .lbl { color: var(--fg-secondary); }
.bs-row.is-total { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--border-elements); font-size: 15px; font-weight: 700; }
.bs-change { display: inline-flex; align-items: baseline; gap: 9px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--fg-secondary); }
.bs-change strong { font-weight: 700; color: var(--fg); }
.bs-arrow { color: var(--fg-muted); }
.summary-row .lbl { color: var(--fg-secondary); }
.pay-with { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border: 1px solid var(--border-elements); border-radius: 10px; margin-top: 14px; }
/* the read-only variant: a line, not a row you could press */
.pay-with-line { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; color: var(--fg-secondary); }
.pay-with-line .brand-mark { width: 28px; height: 19px; font-size: 7px; }
.pay-with-line strong { font-weight: 600; color: var(--fg); }
.pay-with.is-empty { border-color: var(--badge-amber-fg); background: var(--badge-amber); }
.pay-with-ico { flex-shrink: 0; width: 20px; height: 20px; color: var(--badge-amber-fg); display: flex; align-items: center; justify-content: center; }
.pay-with-ico svg { width: 18px; height: 18px; }

/* auto-recharge form */
/* THE RULE IS A SENTENCE, so the sentence is the layout. Three tries got here:
   label/value rows put each control ~480px from its label; capping the column left
   the card's right half empty; three equal columns made the two settings and the card
   look like peers of equal weight when only two of them are decisions — Grace: the
   information you have to read to decide doesn't come through.
   Inline, the causal chain is the visible structure and the only boxes on the line are
   the two things the vendor chooses, so the eye lands on them. Twilio words its
   trigger the same way ("when your balance falls below X, recharge with Y"), and
   Mailchimp's top-off choice is a first-person sentence too.
   The card is NOT a peer here: it cannot be edited in this panel (§4.1), so it sits
   under the sentence as the supporting fact it is. In the SUMMARY all three are equal
   because there all three are read-only. */
/* Naver, Kakao and Ridi all split the rule the same way: the TRIGGER sits inside a
   sentence with a dropdown in it ("남은 쿠키가 [30개] 보다 적으면"), and the AMOUNT is a
   radio LIST underneath, one row per option, each row carrying what you compare on —
   Ridi shows 적립률, Kakao shows 추가 캐시 — both are real incentives those products run.
   WE HAVE NO SUCH COLUMN and must not invent one: a 'Save 14%' badge rode along in the
   demo data until 2026-08-24, but volume discounts are undecided (D-11). Count and
   price are the whole comparison until Product says otherwise.
   A select hid the other two packs behind a click, which is exactly the information
   the vendor needs to decide. Selection is 2px --accent, the same treatment .pack-opt
   uses in the Buy flow — the one saturated pink on this screen stays on Save. */
/* A fact, not a field — same column as the controls, no box around it (§4.1: the card
   is chosen in Payment methods, so an input here would promise an edit that isn't). */
/* A row whose label carries a second line must not centre its value against the pair:
   the value belongs on the LABEL's line. Centred, it sat 12px low and read as if it
   answered the helper text instead of the label. */
/* The unit sits INSIDE the field. Outside it, the box stopped short of the select
