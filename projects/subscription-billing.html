  const unit = type === 'credits' ? 'credits' : `${type.toUpperCase()} messages`;
  const heading = type === 'credits' ? 'Buy message credits' : `Buy ${type.toUpperCase()} messages`;

  return h`
  <section class="section-card inline-buy" id="pack-form">
    <div class="section-head">
      <div>
        <div class="section-title">${heading}</div>
        <!-- ⚠ "They never expire while your account is open" was here and is now cut.
             §7.7's "credits never expire" is scoped to SUSPENSION only. Credit expiry
             in general is pending Finance (D-4), and L-1 asks outright whether credit
             expiry is even lawful and whether forfeiture is permissible. A screen
             promising "never expire" would be making a standing commitment on an open
             legal question — the same failure as "billed on the 15th", with more at
             stake. §7.1 is what can be said: counts, not dollar amounts. -->
        <!-- "Packs are message counts, not dollar amounts" (§7.1) moved into the
             banner below, which says the same thing with the rate attached. Two
             sentences about one model, one of them without the numbers, was the weaker

      </div>
      <button class="modal-x" data-act="packCancel">${ICO.x}</button>
    </div>

      <!-- Choice on the left, consequence on the right (Grace's layout, 2026-08-24).
           Three tiles across the top left the receipt hugging the right edge with an
           empty half beside it; side by side, picking a pack and reading what it does
           to the balance is one movement, and the prices line up in a column so they
           can be compared. Collapses to one column when the panel is narrow. -->
      ${type === 'credits' ? creditRateBanner() : ''}
      <div class="buy-body">
      <div class="pack-list" role="radiogroup" aria-label="Credit pack">

      <!-- D-11 note removed from screen (8/18): a decision ID is a reviewer's

      <!-- Was a bordered four-row table: five rules for four facts, money and credits
           alternating down one column, and the same $125.00 stated twice because a
           single line item does not need a total row. Now the box and the internal
           dividers are gone, the balance is one before → after line instead of two

      <div class="buy-summary">

/* PRD §6.2 — the step the mockup was missing.
   1 Subscribe · 2 no card → enrol → RETURN TO CONFIRMATION · 3 card exists →
   confirm terms + card shown · 4 CONSENT RECORDED + linked to the default card
   (the consent record is chargeback evidence, §10.6) · 5 in free period → active
   without charge.

   A modal is right here by the project rule: this confirms something about to
   happen — a recurring charge authorisation. The consent is a real checkbox, not
   fine print, because §10.6 leans on it as evidence and §16/L-3 covers the
   vendor-agreement clauses it points at.

   ⚠ "the Shopcord Terms of Use" is deliberately not a link — the vendor-only ToS is a
   legal deliverable still being written (1st PRD §15, legal-led), and a link to nowhere
   is a dead control. Give it a destination once legal delivers.
   This confirmation CHARGES: the free period belongs to the existing vendors running it
   out, and a vendor subscribing after launch pays on the spot (Grace, 8/28). */
function modalConfirmSubscribe() {
  const def = CARDS[sc().cards[0]] || CARDS.visa;
  return h`
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title">Start your Shopcord subscription?</div>
        <div class="modal-sub">${PLAN.price} is charged today, then every month on this date.</div>
      </div>
      <button class="modal-x" data-act="close">${ICO.x}</button>
    </div>
    <div class="modal-body">
      <div class="summary-box">
        <div class="summary-row"><span class="lbl">Price</span><span class="t-strong">${PLAN.price} /monthly</span></div>
        <!-- One time, on this first subscription — never again, so it is stated here
             and nowhere that renders for an existing subscriber. -->
        ${hasCredits() ? h`<div class="summary-row"><span class="lbl">Welcome credits</span><span class="t-strong">3,000 credits · one time</span></div>` : ''}
        <!-- No free-period rows. The free period is what EXISTING vendors are running
             out; a vendor subscribing now is charged today (Grace, 8/28). Saying "your
             first 3 months are free" here would be a promise the billing does not keep. -->
        <div class="summary-row"><span class="lbl">Charged today</span><span class="t-strong">${PLAN.price}</span></div>
        <div class="summary-row"><span class="lbl">Next charge</span><span class="t-strong">${clock().signupNext}</span></div>
      </div>

      ${payWithRow()}

      <!-- Legal's own example (8/26): "I agree to the Shopcord Terms of Use and
           authorize Shopcord to automatically charge my payment method $XX per month
           for my Shopcord subscription until I cancel." Two departures, both deliberate:
           the payment method is NAMED rather than left generic, since the vendor is
           looking at it; and legal's sentence has no free period in it, while every
           vendor consenting here is inside one — so the date charging actually starts is
           stated instead of implied. Amount · cycle · cancellability are all present,
           which is what §6.2 requires of the wording.
           PB 2.3.0 also requires the RECORD — acceptance timestamp, plan, card id, copy
           version. That is a data requirement, not a screen element: it belongs in the
           handoff, and nothing here claims it to the vendor. -->
      <p class="consent-note">I agree to the <strong>Shopcord Terms of Use</strong> and authorize Shopcord to
        automatically charge my <strong>${def.name} ····${def.last4}</strong> <strong>${PLAN.price} per month</strong>
        for my Shopcord subscription, <strong>starting today</strong>, until I cancel.</p>
    </div>
    <div class="modal-foot">
      <!-- "Cancel" was the wrong word in this dialog: Cancel subscription is a real and
           very different action one screen away, so the dismiss button and the churn
           button read as the same thing. The confirmation popups pair their buttons by
           OUTCOME (Keep Subscription / Yes, Cancel) — this one does the same. -->
      <button class="btn btn-outline" data-act="close">Not now</button>
      <button class="btn btn-primary" data-act="doSubscribe">I Consent</button>
    </div>
  </div>`;
}

/* Figma node 1:22320 (Popup-Discard) — the design system's confirmation popup, built to
   its measurements. The bullet list is the part worth keeping: a consequence list is
   scannable in a way a paragraph of the same facts is not, and cancellation is exactly
   where a vendor is scanning for what breaks.

   The bullets are RELEASE-AWARE, because the Figma content is written for the world
   where a subscription gates SMS. In release 1 it does not: §8 keeps the SMS menu on the
   payout `verified` gate and §12 keeps SMS on settlement deduction, so "SMS campaigns
   will stop" would be false there. Release 2 follows Figma.
   Two of Figma's lines have no home in either PRD and are logged for it — the scheduled
   sends being canceled (2차 §5 promises the opposite for SUSPENSION, and says nothing
   about cancellation) and the number being deleted after three months, which is a
   permanent-deletion promise no document makes. */
function modalCancelSub() {
  const bullets = hasCredits()
    ? [`SMS campaigns will stop after ${clock().next}.`,
       `Any SMS scheduled past that date will be canceled that day.`,
       `Your SMS number is permanently deleted 3 months later.`,
       `Credits you've already bought stay on your account.`,
       `You can resume any time before then — nothing is charged.`]
    : [`Your store and orders keep running.`,
       `SMS keeps sending — it is billed through your settlement, not your subscription.`,
       `You can resume any time before then — nothing is charged.`];
  return h`
  <div class="modal modal-confirm">
    <div class="confirm-top">
      <span class="confirm-ico">${ICO.octagonAlert}</span>
      <div class="confirm-title">Cancel your subscription?</div>
    </div>
    <div class="confirm-detail">
      <p>You'll keep your subscription until <strong>${clock().next}</strong>, then paid features are off.</p>
      <ul>${bullets.map(b => `<li>${b}</li>`).join('')}</ul>
    </div>
    <div class="confirm-foot">
      <button class="btn btn-outline" data-act="close">Keep Subscription</button>
      <button class="btn btn-secondary" data-act="doCancelSub">Yes, Cancel</button>
    </div>
  </div>`;
}

/* Overlay registry.
   PROJECT RULE: a modal is allowed ONLY when the vendor is confirming something
   that is about to happen. Anything they have to fill in, choose or configure
   opens in the right drawer, or expands inline on the page.
   Drawer vs inline: work that attaches to something already on the page expands
   inline (add card → the card list; auto-recharge → its own card). Work that is
   a self-contained task gets the drawer (buy a pack, schedule a send). */
const OVERLAYS = {
  schedule:      { kind: 'drawer', render: drawerSchedule },
  confirmCharge: { kind: 'modal',  render: modalConfirmCharge },
  removeCard:    { kind: 'modal',  render: modalRemoveCard },
  cancelSub:     { kind: 'modal',  render: modalCancelSub },
  confirmSubscribe: { kind: 'modal', render: modalConfirmSubscribe },
  /* Card entry moved from inline to a modal (meeting 2026-08-24) — onboarding has to
     be able to raise the same form outside Payment methods, and one form in two
     containers would be two things to keep in step. This is the documented shape too:
     Handoff §3 asked for a "card entry sheet" and Gap A-5 recorded our inline version
     as the deviation. It also means the project's modal rule now reads: confirmations,
     plus this one entry form. */
  addCard:       { kind: 'modal',  render: modalAddCard },
  // Reviewer scaffolding — reachable only from the panel, never from a screen.
  email:         { kind: 'modal',  render: emailPreview },
  doc:           { kind: 'modal',  render: docPreview },
  receipt:       { kind: 'modal',  render: modalReceipt },
};

   capture-failure invoice (5.3 iii), the only thing here addressed to a buyer.

   - every "update payment" CTA lands on Subscription and Billing (section 9.3)

     buyer not paying (section 10 books it AR-3 and the platform absorbs it)

     reads "billing moved to card" and then watches their settlement get deducted anyway. */
const SMS_KEEPS = 'SMS is not changing. Those fees keep coming out of your settlement as they do today, and move to a credit balance later.';

    label: 'Signup charge declined', hint: 'No PB id — card-side only, not server error',
    spec: 'Proposed · no PB id', to: 'Vendor', chan: ['Email', 'In-app'],

/* ── Purchase order (internal PDF) ─────────────────────────────────────────
   §5.1 splits the documents three ways: Balance auto-generates the RECEIPTS, Balance
   hosts the INVOICES, and the platform builds this one — the only document we draw, and
   the only one that is not about money moving to Shopcord.

   Structure comes from the current FashionGo PO, which §5.1's attachment spec names as
   the reference. What a Shopcord order needs from it, and what it does NOT:

   TAKEN — bordered blocks; the fact box beside the title; billing/shipping split out so
   a warehouse can read one and a bookkeeper the other; the per-line SIZE GRID (a wholesale
   line is a matrix, not a row); a total-quantity block; a buyer's own PO number, which is
   how a wholesale buyer files it on their side.

   DROPPED — FG's discount stack (Collection Promotion, Redeemed Rewards, FG Coupon
   Discount, Store Credit). Those are FashionGo MARKETPLACE mechanics; a Shopcord order is
   a vendor's own linesheet sold to their own buyer, and the 8/28 spec asks for exactly
   Subtotal · Discount · Total. Printing empty promotion lines would advertise machinery
   that does not exist. The barcode goes too — that is FG's fulfilment infrastructure and
   inventing a symbology would be inventing.

   ADDED, because a Shopcord order has them and an FG order does not — LINESHEET NAME (an
   order comes from one) and ORDER STATUS as of issue, both named in the 8/28 spec.

   PACK NOTATION is where the two genuinely differ. FG lists flat per-size quantities;
   Shopcord sells packs, so the spec writes "S-M-L 1-2-1" with a pack count. Both are
   shown: the grid gives the per-size totals a warehouse picks against, the pack line gives
   the arithmetic they came from. */
/* No description field: the 8/28 spec ③ writes "Item Name/Description", but the
   description is not needed (Grace, 8/28) — logged as a deviation. The style number
   identifies the item and the buyer picked it off a linesheet that carried the detail. */
const PO_LINES = [
  { style: 'BB-1042', item: 'Linen Camp Shirt',
    sizes: ['S','M','L'], pack: '1-2-1', unit: 21.50,
    colors: [ { c: 'Ecru',  packs: 6, q: [6,12,6] },
              { c: 'Sage',  packs: 4, q: [4, 8,4] } ] },
  { style: 'BB-2210', item: 'Wide-Leg Trouser',
    sizes: ['S','M','L','XL'], pack: '1-2-2-1', unit: 34.00,
    colors: [ { c: 'Black', packs: 5, q: [5,10,10,5] } ] },
  { style: 'BB-0788', item: 'Ribbed Knit Tank',
    sizes: ['S','M','L'], pack: '2-2-2', unit: 12.00,
    colors: [ { c: 'Butter', packs: 3, q: [6,6,6] } ] },
  /* OPEN PACK. A pre-pack is bought as a fixed assortment, so its per-size counts are
     the ratio times the pack count and one row per colourway says everything. Open stock
     is picked size by size, and those quantities CANNOT be derived from anything — so an
     open line gets a row per size, or the document loses what was actually ordered. */
  { style: 'BB-3310', item: 'Cropped Cardigan', open: true,
    sizes: ['S','M','L'], unit: 28.00,
    colors: [ { c: 'Oat', q: [4, 7, 3] } ] },
];
/* Entered by the vendor at order confirmation (Grace, 8/28), so the PO shows the figure
   rather than deferring it. No document says this — the 8/28 spec gives only the notice
   sentence — so it is logged as a content addition. */
const PO_SHIPPING = 45.00;
/* A seasonal linesheet is usually sold as a PRE-ORDER with a delivery window, and then the
   buyer's first question is when it lands. It rides the header rather than the item table
   because it belongs to the order, and because a tenth column would squeeze the item name
   to nothing. Set to null for an in-stock order and the row disappears. */
const PO_PREORDER = 'Mar 15, 2027';
/* NO shipping-info field (Grace, 8/28). It came from FG's PO, not from the 8/28 spec, and
   a PO is not a shipping document: it records what was ordered and agreed, while carrier
   and tracking are later events that packing slips and shipment notices carry. At issue
   the field is empty by definition — §5.3 iii charges shipping per shipment, after the
   fact — so keeping it would be the "set at shipment" problem moved up a level, the field
   itself admitting it has nothing. The buyer's timing question is answered by the
   Delivery row in the header instead.
   Reversible: if Gap G-2e lands on "generated on demand", a re-issued PO could carry
   tracking and the field earns its place. */
// The buyer's own reference, given at order time — this one IS known when the PO issues.
const PO_BUYER_REF = 'MLB-2027-0143';
const money = (v) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const lineQty = (l) => l.colors.reduce((a, c) => a + c.q.reduce((x, y) => x + y, 0), 0);

function docPO() {
  // Every figure is computed. Three prices for one line was a real bug once.
  const rows = PO_LINES.flatMap(l => l.colors.flatMap(c => l.open
    ? l.sizes.map((z, i) => c.q[i] ? { l, c, opt2: z, pack: 'Open', packs: '—', u: c.q[i], amt: c.q[i] * l.unit } : null).filter(Boolean)
    : [{ l, c, opt2: l.sizes.join('-'), pack: l.pack, packs: c.packs, u: c.q.reduce((x, y) => x + y, 0),
         amt: c.q.reduce((x, y) => x + y, 0) * l.unit }]));
  const sub = rows.reduce((a, r) => a + r.amt, 0);
  return h`
  <div class="sheet"><div class="po-paper">
    <div class="po-head">
      <div>
        <div class="po-brandmark">shop<span>c</span>ord</div>
        <div class="po-title">PURCHASE ORDER</div>
      </div>
      <div class="po-facts">
        <div class="po-fact"><span class="k">PO Number</span><span class="v">SC-PO-2026-004182</span></div>
        <div class="po-fact"><span class="k">Order Date</span><span class="v">${clock().today}</span></div>
        <!-- "at issue" is the spec's own parenthetical, 발행 시점: a PDF is a snapshot
             while a status keeps moving, so a bare "Order Status" reads as live. -->
        <div class="po-fact"><span class="k">Order Status at issue</span><span class="v"><span class="po-pill">CONFIRMED</span></span></div>
        <div class="po-fact"><span class="k">Linesheet</span><span class="v">Resort 2027 — Core</span></div>
        ${PO_PREORDER ? h`<div class="po-fact"><span class="k">Delivery</span><span class="v">Pre-order · est. ship ${PO_PREORDER}</span></div>` : ''}
      </div>
    </div>
    <div class="po-rule"></div>

    <div class="po-parties">
      <div class="po-party">
        <div class="po-k">Vendor</div>
        <div class="po-name">Bella Boutique LLC</div>
        <div class="po-line">dba Bella Boutique</div>
        <div class="po-line">1407 Broadway, Suite 902<br>New York, NY 10018</div>
        <div class="po-line">(212) 555-0148 · orders@bellaboutique.com</div>
      </div>
      <div class="po-party">
        <div class="po-k">Buyer</div>
        <div class="po-name">Marcy Lane Boutique</div>
        <div class="po-line">Attn: Marcy Ruiz</div>
        <div class="po-line">(310) 555-0102 · marcy@marcylane.com</div>
        <div class="po-sub">
          <div class="po-k">Bill to</div>
          <div class="po-line">88 Spring Street<br>Los Angeles, CA 90013</div>
        </div>
        <!-- Ship to is separate because the spec calls it out as able to differ from
             Bill to. Whether the PDF also carries this address's revision history is
             undecided; a PDF is a snapshot, so it shows the address as of issue. -->
        <div class="po-sub">
          <div class="po-k">Ship to</div>
          <div class="po-line">2210 Harbor Blvd, Dock 4<br>Long Beach, CA 90802</div>
        </div>
      </div>
    </div>

    <table class="po-tbl">
      <thead><tr>
        <!-- Generic option names, not "Color" and "Size run" (Grace, 8/28). The platform
             does not know an item HAS a colour or a size — options are whatever the vendor
             defined on the linesheet, and apparel is only one kind of seller. Naming them
             would make the document lie for anyone selling by scent, length or pack type. -->
        <th style="width:20px">#</th><th>Item</th><th style="width:74px">Option 1</th>
        <th style="width:84px">Option 2</th>
        <!-- The pack ratio is its own fact, not part of the size list (Grace, 8/28).
             Spec ③ wants the arithmetic visible — pack ratio, how many packs, and the
             units they come to — so each gets a column and none of them is a compound. -->
        <th style="width:66px">Pack</th>
        <th class="n" style="width:50px">Packs</th><th class="n" style="width:62px">Total qty</th>
        <th class="n" style="width:72px">Unit price</th><th class="n" style="width:82px">Amount</th>
      </tr></thead>
      <tbody>${rows.map((r, i) => h`
        <tr>
          <td>${i + 1}</td>
          <td><div class="po-opt">${r.l.item}</div><div class="po-style">Style No. ${r.l.style}</div></td>
          <td>${r.c.c}</td>
          <td class="po-run">${r.opt2}</td>
          <td class="po-run">${r.pack}</td>
          <td class="n">${r.packs}</td>
          <td class="n">${r.u}</td>
          <td class="n">${money(r.l.unit)}</td>
          <td class="n">${money(r.amt)}</td>
        </tr>`).join('')}
      </tbody>
    </table>

    <div class="po-sums"><div class="po-sums-in">
      <!-- No discount line: Shopcord orders do not carry one (Grace, 8/28). The 8/28 spec
           ④ lists "Subtotal · Discount · Total", so that is a logged deviation (G-2f).
           Shipping carries the amount agreed at order confirmation; the notice below is
           the spec's own sentence and explains why the captured total can differ —
           §5.3 iii charges per shipment, which is where that section's overage comes from. -->
      <div class="po-sum"><span>Subtotal</span><span>${money(sub)}</span></div>
      <div class="po-sum"><span>Shipping &amp; handling</span><span>${money(PO_SHIPPING)}</span></div>
      <div class="po-sum tot"><span>Total</span><span>${money(sub + PO_SHIPPING)}</span></div>
    </div></div>
    <div class="po-ship">Shipping &amp; handling is calculated and charged per shipment.</div>

      <div class="po-foot">
        <span>Purchase order SC-PO-2026-004182</span>
        <span>Page 1 of 2</span>
      </div>
    </div></div>

  <!-- Page 2. The bottom matter was being crushed into the first page — padding cut to
       5px, section gaps halved — to make one sheet fit, which is trading legibility for a
       number nobody measures. A wholesale PO with this many lines IS two pages; the
       continuation line means a detached second sheet still says which order it belongs
       to, which is the whole reason printed documents carry one. -->
  <div class="sheet"><div class="po-paper">
    <div class="po-cont">
      <span>Purchase order <b>SC-PO-2026-004182</b></span>
      <span><b>Bella Boutique LLC</b> → Marcy Lane Boutique</span>
    </div>

    <div class="po-meta">
      <div><div class="po-k">Payment method</div><div class="po-meta-v">Visa ····7781</div></div>
      <div><div class="po-k">Buyer's PO number</div><div class="po-meta-v">${PO_BUYER_REF}</div></div>
    </div>

    <div class="po-note">
      <!-- "Note", not "Special instructions" (Grace, 8/28). The 8/28 spec ⑥ offers both
           as "Special Instructions/Note"; Shopcord orders carry a note. -->
      <div class="po-k">Note</div>
      <div class="po-note-v">Hold full order — do not split ship. Deliver to Dock 4 before 3pm.</div>
    </div>

    <!-- FG carries a full Return Policy and Cancellation Policy here. Ours cannot be
         written yet: the spec makes this block conditional on legal, and inventing terms
         on a document a buyer keeps would be worse than an obvious gap. -->
    <div class="po-legal">
      <div class="po-k">Terms</div>
      <div class="po-legal-v">Return and cancellation terms — pending legal review.</div>
    </div>

    <div class="po-foot">
      <span>Issued ${clock().today} · 4:12 PM ET · Generated by Shopcord</span>
      <span>Page 2 of 2</span>
    </div>
  </div></div>`;
}

/* ── Settlement statement ──────────────────────────────────────────────────
   Design from Figma 326:823258 — the PDF settlement already sends. It is not a document
   Payment & Billing owns, and it is here because **this release changes it**: the whole
   point of §12's double-collection block is which of these adjustment lines survives.

   Today the statement deducts BOTH the subscription fee and SMS overcharges from the
   vendor's payout. §12 blocks only the subscription adjustment type at the 1st cutover
   and says the SMS one must **absolutely not** be touched, because it is the only way SMS
   is collected during the transition. The 2nd cutover blocks SMS as well (2nd PRD §6).
   So the same document has three states, and the release switch shows them.

   `until` = the last release in which the line still appears. Everything is computed:
   the reference's own figures do not reconcile (its four adjustments sum to 63.40 above a
   stated 53.40, and 1,780.00 − 53.40 is 1,726.60 rather than the 1,726.00 printed), which
   is exactly why ours are added up rather than typed.
   Signs are also made explicit here: fees deduct, credits add back. The reference prints
   every line with a minus including the credits, which is either a display bug or a
   different meaning — worth asking settlement, and not worth copying blind. */
const SETTLE = {
  no: 'STM-39949020101-001',
  orders: 1780.00,
  refunds: 0,
  adj: [
    { k: 'Subscription Fee',      v: -Number(PLAN.price.replace('$','')), until: 0,
      why: 'Blocked at the 1st cutover — the subscription is charged to the card from then (PB 9.5.0)' },
    { k: 'SMS Overcharge Fee',    v: -14.40, until: 1,
      why: 'Kept through release 1 on purpose: §12 calls this the only way SMS is collected during the transition' },
    { k: 'SMS Overcharge Credit', v:  10.00, until: 1,
      why: 'Same adjustment type as the fee, so it leaves with it at the 2nd cutover' },
    { k: 'Credit',                v:  0,     until: 9,
      why: 'Not a Phase 2.5 line — a general settlement credit, unaffected by either cutover' },
  ],
};
const settleRel = () => isR1() ? 1 : 2;
const settleVisible = () => SETTLE.adj.filter(a => settleRel() <= a.until);
const signed = (v) => (v < 0 ? '-' : '') + money(Math.abs(v));

function docSettlement() {
  const rows = settleVisible();
  const adjTotal = rows.reduce((a, r) => a + r.v, 0);
  const total = SETTLE.orders + SETTLE.refunds + adjTotal;
  return h`
  <div class="sheet"><div class="stmt">
    <div class="stmt-top">
      <div>
        <div class="stmt-title">Settlement Statement</div>
        <div class="stmt-no">Statement No. ${SETTLE.no}</div>
      </div>
      <div>
        <div class="stmt-brand">Shopcord</div>
        <div class="stmt-gen">Generated on ${clock().today}</div>
      </div>
    </div>

    <div class="stmt-card">
      <div class="stmt-cols">
        <div>
          <div class="stmt-k">Vendor</div>
          <div class="stmt-name">Bella Boutique LLC</div>
          <div class="stmt-line">1407 Broadway, Suite 902<br>New York, NY 10018<br>United States</div>
          <div class="stmt-gap stmt-line">billing@bellaboutique.com</div>
          <div class="stmt-line">+1 (212) 555 - 0148</div>
        </div>
        <div>
          <div class="stmt-k">Settlement Date</div>
          <div class="stmt-date">${clock().today}</div>
        </div>
      </div>

      <div class="stmt-sum-k">Summary</div>
      <div class="stmt-row"><span>Total Orders</span><span>${money(SETTLE.orders)}</span></div>
      <div class="stmt-row"><span>Total Refunds</span><span>${money(SETTLE.refunds)}</span></div>
      <div class="stmt-row"><span>Total Adjustments</span><span>${signed(adjTotal)}</span></div>
      ${rows.map(r => h`
        <div class="stmt-sub"><span>${r.k}</span><span>${signed(r.v)}</span></div>`).join('')}
      <div class="stmt-total"><span>Total</span><span>${money(total)}</span></div>
    </div>
  </div></div>`;
}

/* The panel view: the statement, then what the two cutovers take out of it. */
function docSettlementPanel() {
  const gone = SETTLE.adj.filter(a => settleRel() > a.until);
  return h`
  ${docSettlement()}
  <div class="ref-card" style="margin-top:28px">
    <div class="ref-warn">
      <div><b>Settlement owns this document — we change what is on it.</b> Nothing here is a redesign; the layout is
        the statement settlement already sends. What Phase 2.5 does is remove adjustment lines from it, one cutover
        at a time, and getting that wrong in either direction is the incident §12 was written to prevent.</div>
    </div>

    <div class="ref-sec">
      <div class="ref-k">What each cutover removes</div>
      <div class="ref-v">
        <table class="ref-tbl">
          <thead><tr><th>Line</th><th>What happens to it</th><th>Basis</th></tr></thead>
          <tbody>
            ${SETTLE.adj.map(a => h`
            <tr><td>${a.k}</td><td>${a.why}</td><td>${a.until === 0 ? '§12 · PB 9.5.0' : a.until === 1 ? '§12 · 2nd §6' : '—'}</td></tr>`).join('')}
          </tbody>
        </table>
        <div class="ref-src">Showing the 1st release — ${gone.length ? gone.map(g => g.k).join(', ') + ' already removed' : 'nothing removed yet'}. The 2nd cutover removes the SMS lines as well; that state is in the full build.</div>
      </div>
    </div>

    <div class="ref-sec">
      <div class="ref-k">Why the SMS line has to survive release 1</div>
      <div class="ref-v">§12 is unusually blunt about it — the SMS adjustment type is <b>"과도기 동안 SMS 요금의 유일한
        수금 수단"</b>, and blocking it by mistake is an incident where SMS fees simply cannot be collected. The
        requirement it produces is a build requirement, not a screen one: <b>the two adjustment types must be blockable
        individually</b>.
        <div class="ref-src">§12 · PB 9.5.0</div>
      </div>
    </div>

    <div class="ref-sec">
      <div class="ref-k">This is also where §12's mandatory sentence is proved</div>
      <div class="ref-v">The launch communication has to say <b>"SMS 요금은 당분간 기존처럼 정산에서 차감"</b>. This
        statement is where a vendor sees whether that is true — subscription gone from the payout, SMS still there.

/* Billing periods run from the charge, not the calendar — §6.3 anchors on the signup
   date, so "October" is never the right label. Charge day → the day before the next. */
function periodFrom(dateStr) {
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const m = /^([A-Za-z]{3}) (\d{1,2}), (\d{4})$/.exec(dateStr || '');
  if (!m) return '—';
  const mi = M.indexOf(m[1]), d = Number(m[2]), y = Number(m[3]);
  /* The period ends the day BEFORE the next charge. For a charge on the 1st that day is
     the last of the SAME month — it does not roll into the next one. The old version
     always advanced the month and so produced "Oct 1 — Nov 31" the moment the anniversary
     moved to the 1st; a date that does not exist, on a document a buyer keeps. */
  const dim = [31,28,31,30,31,30,31,31,30,31,30,31];
  const em = d > 1 ? (mi + 1) % 12 : mi;
  const ey = (d > 1 && em === 0) ? y + 1 : y;
  const ed = d > 1 ? d - 1 : dim[mi];
  return `${m[1]} ${d}, ${y} — ${M[em]} ${ed}, ${ey}`;
}

    !(s.sub === 'suspended' || s.expireSoon || (s.credits && s.credits.sms === 0));

window.addEventListener('afterprint', () => { delete document.body.dataset.print; });

document.addEventListener('click', (e) => {
  const scEl = e.target.closest('[data-scenario]');
  if (scEl) { setScenario(scEl.dataset.scenario); return; }

  const tabEl = e.target.closest('[data-tab]');
  if (tabEl) { goTab(tabEl.dataset.tab); return; }

  const gotoEl = e.target.closest('[data-goto]');
  if (gotoEl) { go(gotoEl.dataset.goto); return; }

  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const act = actEl.dataset.act;

  switch (act) {
    // Card entry is inline: land on Payment methods, expand the form, focus it.
    case 'addCard':
      if (sc().screen !== 'account') setScenario(sc().cardBad ? 'failed' : 'active');
      S.cardFlash = false;
      openModal('addCard');   // an overlay — no need to leave the screen
      break;
    case 'cardCancel':   closeModal(); break;
    case 'saveCard':
      S.modal = null;
      if (S.key === 'failed') {
        setScenario('restored');
        showToast('Payment restored',
          'Mastercard ····8210 was charged $20.00. Your subscription is active again' + (hasCredits() ? ' and your SMS credits are unfrozen.' : '.'));
      } else if (S.key === 'nocard') {
        // §6.2 step 2 — enrolment returns to the confirmation, it is not the end
        // of the flow. Without this the vendor has a card and no subscription.
        S.modal = 'confirmSubscribe'; render(); break;
      }
      S.cardFlash = true; render();
      setTimeout(() => { S.cardFlash = false; render(); }, 1800);
      break;

    // §6.2 step 1 → 2 or 3: no card enrols first, an existing card goes straight
    // to the confirmation. Either way consent is recorded before anything charges.
    case 'subscribe':
      if (sc().cards.length) { S.modal = 'confirmSubscribe'; render(); }
      else { S.tab = 'billing'; openModal('addCard'); }   // the form is an overlay now — nothing to scroll to
      break;
    // Confirming the cancel modal used to just close it, leaving the vendor on the
    // screen they were cancelling from — the state they landed in didn't exist.
    case 'doCancelSub':
      S.modal = null; setScenario('cancelling'); S.tab = 'billing';
      // Not `canceled` — that is the state after the period ends (§7). Telling the
      // vendor "paid features are off" the instant they confirm was false for a month.
      showToast('Cancellation scheduled',
        `Your subscription stays active until ${clock().next}. Resume any time before then and nothing is charged.`);
      render();
      break;
    // §3.4 / Handoff §2A pair resume with cancel. Consent was already recorded at
    // signup (§6.2) and the card is unchanged, so resuming does not re-ask for it.
    case 'resumeSub': {
      /* PB 2.7.0 — resuming inside the cancellation window is a no-charge return: the
         period is already paid for. Resuming from `canceled` restarts billing, which
         is a charge. One button, two different truths — saying "was charged $20.00"
         when nothing was charged is the kind of line that generates a support ticket. */
      const wasScheduled = sc().sub === 'cancelling';
      S.modal = null; setScenario('active'); S.tab = 'billing';
      showToast('Subscription resumed', wasScheduled
        ? 'Your subscription continues as normal. Nothing was charged — the current period was already paid for.'
        : 'Visa ····4242 was charged $20.00.' + (hasCredits() ? ' Sending is back on and your SMS credits are usable again.' : ' Paid features are back on.'));
      render();
      break;
    }
    case 'doSubscribe':
      /* §6.2 step 5 — a new subscriber is charged on the spot and lands `active`. The
         free period belongs to the existing population that is running it out (Grace,
         8/28), so landing a brand-new subscriber in `free` would have shown them a
         grant nobody is giving them. */
      S.modal = null;
      setScenario('active');
      showToast('You\'re subscribed',
        `Visa ····4242 was charged ${PLAN.price}. Your next charge is ${clock().signupNext} — cancel any time before then.`);
      render();
      break;
    // Pack purchase is inline on the credit dashboard; the button pressed decides the type.
    case 'buyPack':
      if (sc().screen !== 'account') setScenario('credits');
      S.tab = smsTab(); S.modal = null; S.packType = actEl.dataset.val || (isUnified() ? 'credits' : 'sms'); S.packSel = 1; S.packOpen = true;
      render();
      requestAnimationFrame(() => {
        document.getElementById('pack-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      break;
    case 'packCancel':   S.packOpen = false; render(); break;
    case 'sendWhen':     S.sendWhen = actEl.dataset.val; render(); break;
    case 'packBuy':      S.packOpen = false; render(); break;
    case 'email':        S.emailKey = actEl.dataset.val; openModal('email'); break;
    case 'doc':          S.docKey = actEl.dataset.val; openModal('doc'); break;
    // The print stylesheet keys off this flag; clear it however the dialog closed.
    case 'printDoc':
      document.body.dataset.print = 'doc';
      window.print();
      break;
    case 'removeCard':   openModal('removeCard'); break;
    case 'cancelSub':    openModal('cancelSub'); break;
    case 'confirmCharge':openModal('confirmCharge'); break;
    case 'schedule':     openModal('schedule'); break;
    case 'scheduleDemo': setScenario('campaignOk'); openModal('schedule'); break;
    case 'confirmChargeDemo': setScenario('campaignShort'); openModal('confirmCharge'); break;
    // 'active' has a card, so this lands on §6.2 step 3 rather than enrolment.
    case 'subscribeDemo': setScenario('active'); openModal('confirmSubscribe'); break;
    case 'sendNow':      closeModal(); break;
    case 'close':        closeModal(); break;
    case 'scrim':        if (e.target.classList.contains('scrim') || e.target.classList.contains('drawer-scrim')) closeModal(); break;
    // Only swap scenarios when we have to leave the campaign screen — from an
    // account screen this must keep the state the vendor is actually in, or
    // Update payment silently teleports them out of expired / canceled / past_due.
    case 'goBilling':
      closeModal();
      if (sc().screen !== 'account') setScenario(sc().cardBad ? 'failed' : 'active');
      S.tab = 'billing'; render();
      break;
    /* Release 1 has no SMS tab and no credits, so switching to it has to leave any
       state that only exists in release 2 — otherwise the screen shows a campaign
       spending credits that cannot be bought yet. */
    case 'release':
      S.release = Number(actEl.dataset.val); S.packOpen = false; S.modal = null;
      if (isR1()) {
        if (sc().screen !== 'account') setScenario('active');
        S.tab = 'billing';
      }
      render();
      break;
    case 'creditModel':  S.creditModel = actEl.dataset.val; S.packOpen = false; S.packType = isUnified() ? 'credits' : 'sms'; render(); break;
    // Switching to merged while sitting on the SMS tab would leave S.tab pointing
    // at a tab that no longer renders, so land on the tab that absorbed it.
    case 'tabLayout':
      S.tabLayout = actEl.dataset.val; S.packOpen = false;
      if (isMerged() && S.tab === 'sms') S.tab = 'billing';
      render();
      break;
    case 'packSel':      S.packSel = Number(actEl.dataset.val); render(); break;
    case 'setDefault':   { const c = sc().cards; sc().cards = [c[1], c[0], ...c.slice(2)].filter(Boolean); render(); break; }
    case 'scrollCards':  document.getElementById('section-cards')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); break;
    /* The real link opens Balance's hosted PDF in a NEW TAB, so the prototype opens one
       too. An overlay would have designed an in-app receipt viewer that does not exist —
       and the product never displays a receipt inside itself. The panel entry keeps the
       modal, because that one IS reviewer scaffolding. */
    // The row is the receipt's subject, so the link carries it.
    case 'receipt':
      e.preventDefault();
      S.receiptRow = { date: actEl.dataset.date, amt: actEl.dataset.amt, type: actEl.dataset.type };
      openModal('receipt');
      break;
  }
});

function setProtoOpen(open) {
  document.getElementById('proto-panel').hidden = !open;
  document.body.classList.toggle('proto-open', open);
}
document.getElementById('proto-fab').addEventListener('click', () => {
  setProtoOpen(document.getElementById('proto-panel').hidden);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

render();
setProtoOpen(true);
</script>
</body>
</html>
