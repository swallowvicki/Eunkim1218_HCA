<style>
  html, body { height: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #faf9f6; }
  /* keyframes referenced by the source (tailwind.config in the real app) */
  @keyframes stepInRight { from { opacity: 0; transform: translateX(26px) } to { opacity: 1; transform: none } }
  @keyframes stepInLeft  { from { opacity: 0; transform: translateX(-26px) } to { opacity: 1; transform: none } }
  @keyframes fadeInUp    { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
  .animate-step-in-right { animation: stepInRight .34s ease-out }
  .animate-step-in-left  { animation: stepInLeft .34s ease-out }
  .animate-fade-in-up    { animation: fadeInUp .4s ease-out }
  /* SMS preview: a bubble landing in the thread, and the typing dots before it. */
  @keyframes bubbleIn  { from { opacity: 0; transform: translateY(8px) scale(.94) } to { opacity: 1; transform: none } }
  @keyframes typingDot { 0%, 60%, 100% { opacity: .25; transform: none } 30% { opacity: 1; transform: translateY(-3px) } }
  .animate-bubble-in  { animation: bubbleIn .32s cubic-bezier(.22,1,.36,1) }
  .animate-typing-dot { animation: typingDot 1.1s ease-in-out infinite }
  .\[animation-delay\:0\.18s\] { animation-delay: .18s }
  .\[animation-delay\:0\.36s\] { animation-delay: .36s }
  /* rendered legal-document content (LegalDocsCard) */
  .doc-content h2 { font-size: 19px; font-weight: 700; margin: 0 0 8px; }
  .doc-content h3 { font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
  .doc-content p  { font-size: 13px; line-height: 1.6; margin: 0 0 10px; }
  .doc-content p.eff { font-size: 12px; color: #9a958d; }
  .doc-content ol { list-style: decimal inside; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .doc-content ul { list-style: disc inside; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .doc-content a  { color: #c72066; text-decoration: underline; }
</style>
</head>
