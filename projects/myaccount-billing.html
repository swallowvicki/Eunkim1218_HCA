/* The month grid. Leading and trailing days are drawn in the muted style rather than left
   blank, so the month reads as a calendar and not as a ragged block. */
function sendCalendar() {
  const anchor = S.calMonth ? dOf(S.calMonth) : dOf(S.schedDate);
  const y = anchor.getFullYear(), m = anchor.getMonth();
  const start = addDays(new Date(y, m, 1), -new Date(y, m, 1).getDay());
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    const out = d.getMonth() !== m;
    const st = out ? 'off' : dayState(d);
    const lab = d.getDate();
    if (st === 'blocked') {
      cells.push(h`<span class="tip tip-below cal-cell"><button class="cal-day is-blocked" disabled>${lab}</button><span class="tip-bubble">${TRANS_COPY.tooltip()}</span></span>`);
    } else if (st === 'on' || st === 'sel') {
      cells.push(h`<button class="cal-day ${st === 'sel' ? 'is-sel' : ''}" data-act="pickDay" data-val="${fullD(d)}">${lab}</button>`);
    } else {
      cells.push(h`<button class="cal-day is-${st}" disabled>${lab}</button>`);
    }
  }
  return h`
  <div class="cal-pop" data-cal="send">
    <div class="cal-head">
      <button class="cal-nav" data-act="calMonth" data-val="-1">&lsaquo;</button>
      <div class="cal-title">${new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</div>
      <button class="cal-nav" data-act="calMonth" data-val="1">&rsaquo;</button>
    </div>
    <div class="cal-dow">${['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(x => h`<span>${x}</span>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    ${inTransition() ? h`<div class="cal-note">${ICO.info}<span>${TRANS_COPY.strip()}</span></div>` : ''}
  </div>`;
}

// Send Time gains the credit-reservation disclosure.
/* The composer's starting message, so the segment count has something to measure. Kept as a
   constant rather than read out of the DOM: the estimate must be computable during render. */
const DEFAULT_CAMP_TEXT = "Hi, check out {vendor_dba}'s new collection released today!\n\nReply STOP to opt out.";

/* ONE SOURCE for what a campaign costs. It was computed in FOUR places with THREE different
   formulas: this screen applied a rate, the confirm modal and the schedule drawer used the
   bare recipient count, and Send re-checked with a fourth copy. All four agreed only while an
   SMS cost exactly one credit — so the 9/15 re-denomination turned a latent split into a
   visible one, and the same campaign read 980 credits on the screen and 1,960 at the gate.
   Segments stay inside here and decide one thing only — whether the send converts to MMS.
   Billing is flat (SMS PRD §4): an SMS is 2 credits however many segments, MMS is 4. */
const campMsg  = () => (S.campText == null ? DEFAULT_CAMP_TEXT : S.campText);
const campSegs = () => { const m = campMsg(); return m.length <= 160 ? 1 : Math.ceil(m.length / 153); };
const campIsMms = () => S.campMms || campSegs() >= 3;
const campRate = () => campIsMms() ? MMS_CREDITS : SMS_CREDITS;
const campNeed = (s) => (s.recipients ?? 0) * campRate();

function screenCampaign() {
  const s = sc();
  const need = campNeed(s);
  /* Available under the UNIFIED model, not the split model's `credits.sms` — that left this
     screen saying "You have 200" while the confirm modal, computed properly, said 840.
     Two numbers for one balance on two halves of the same flow. */
  const have = isUnified()
    ? unifiedTotals(s.credits).remaining - unifiedTotals(s.credits).reserved
    : s.credits.sms - s.credits.smsRes;
  const short = Math.max(0, need - have);
  const scheduled = S.sendWhen === 'later';

  // The cost line already exists on this screen — it becomes the pre-send check
  // so the shortfall is known before Send is ever pressed.
  const unitWord = isUnified() ? 'credit' : 'SMS';
  /* An ESTIMATE, and the docs say so: 통합 v0.6 §7.5 writes the pre-send line as "This campaign
     will use ~1,000 SMS credits" and Handoff §6 quotes the same tilde. The screen was
     stating it as an exact sum, which promises a number the send cannot guarantee —
     recipient lists move between here and the send. The arithmetic stays, because it
     explains where the figure comes from; "about" is what it needs in front of it. */
  /* The per-recipient rate still follows the message — the vendor attaches an image, or the
     text runs long and the backend converts it — but 진아 9/16 takes the MECHANISM off the
     screen. What the vendor sees is the rate; what decided it stays inside campRate(). */
  const msg = campMsg();
  const isMms = campIsMms();
  const perRecipient = campRate();
  /* PM: "Recipient 명 수 선택 후부터 표시 가능" — no recipients, no estimate. A cost line over
     a list nobody has chosen is a number invented from nothing. */
  const rcp = s.recipients ?? 0;
  const rate = campRate();
  const rateTxt = h`${rcp} recipients × ${rate} ${rate === 1 ? unitWord : unitWord + 's'}`;
  const costLine = rcp === 0 ? ''
    : short === 0
    ? h`<div class="cost-line ok">About <strong>${n(need)} ${isUnified() ? 'credits' : 'SMS'}</strong> — ${rateTxt} · about ${n(have - need)} left after sending</div>`
    : h`<div class="cost-line short">
          <span class="cost-ico">${ICO.alert}</span>
          <div>${rateTxt} = <strong>${n(need)} ${isUnified() ? 'credits' : 'SMS'}</strong><br>
          You have ${n(have)} — <strong>${n(short)} short.</strong> Sending will buy a top-up.</div>
        </div>`;

  return h`
  <div class="page-head camp">
    <div class="crumb">Campaigns / New Campaign</div>
    <div class="camp-title-row">
      <div class="page-title">Summer Collection 2026</div>
      <div class="camp-actions">
        <!-- The balance sits with the actions rather than in the crumb line: this is the
             screen where the vendor is about to spend it, so it belongs beside Send. -->
        ${creditChip()}
        <!-- Save Draft stays live: a draft costs nothing and 2차 PRD §5 only blocks
             sending, so locking it would destroy work the vendor already did. -->
        <button class="btn btn-secondary">Save Draft</button>
        ${isLocked()
          ? lockTip(h`<button class="btn btn-primary" disabled><span class="btn-ico">${ICO.send}</span>Send</button>`, lockWhy("send"), 'below')
          : h`<button class="btn btn-primary" data-act="${short === 0 ? 'sendNow' : 'confirmCharge'}">
                <span class="btn-ico">${ICO.send}</span>Send
              </button>`}
      </div>
    </div>
  </div>

  <div class="body camp">
    ${banners()}
    <div class="camp-grid">
      <div class="camp-col">
        <section class="section-card">
          <div class="camp-card-title">Select Linesheet</div>
          <select class="select" style="width:100%;margin-top:12px"><option>Summer Collection 2026</option></select>
          <div class="ls-meta">
            <div class="ls-meta-row"><span class="t-muted">Share URL:</span> <a href="#" class="linkbtn" style="font-weight:400">https://con.ct/8R3HWt</a></div>
            <div class="ls-meta-row">
              <span class="ls-pair"><span class="t-muted">Access Type:</span> <strong>Selected Buyers</strong></span>
              <span class="ls-pair" style="margin-left:auto"><span class="t-muted">Start Date</span> <strong>05/26/26</strong></span>
              <span class="ls-pair"><span class="t-muted">End Date</span> <strong>07/15/26</strong></span>
            </div>
          </div>
        </section>

        <section class="section-card">
          <div class="camp-card-title">Select Recipients</div>
          <div class="camp-card-sub">Who are you reaching out to?</div>
          <div class="camp-row">
            <span class="pill gray" style="height:26px">${n(need)} Recipients</span>
            <button class="btn btn-sm btn-outline" style="margin-left:auto">View / Edit</button>
          </div>
        </section>

        <section class="section-card">
          <div class="camp-card-title">Message Contents</div>
          <div class="camp-card-sub">What message are you sending?</div>
          <textarea class="textarea" style="margin-top:12px" data-camp-text>${msg}</textarea>
          <!-- Figma 864:370336 puts the estimate at the bottom right of the box: characters,
               then what it costs. The second slot used to read the SEGMENT COUNT ("1 SMS"),
               which 진아 spec 2026-09-16 takes off every vendor surface — segments are a
               backend billing and conversion concept, and the vendor is told credits only.
               So it states the per-recipient RATE instead, and goes amber when that rate is
               above the base. Amber without an explanation is the point: the vendor sees
               what it costs, not the mechanism that decided it. Characters stay — a length
               is not a segment, and it is the thing the writer is actually controlling. -->
          <div class="msg-meta" id="msg-meta">
            <span>Estimated: <span class="mm-seg">${msg.length}</span></span>
            <span class="mm-sep">|</span>
            <span class="mm-seg">${campRate() > SMS_CREDITS
              ? h`<span class="rate-flag is-mms">${campRate()} credits each</span>`
              : h`${campRate()} credits each`}</span>
            <span class="mm-ico">${ICO.info}</span>
          </div>
          <div class="camp-row" style="margin-top:14px">
            <button class="btn btn-sm btn-outline ${S.campMms ? 'is-on' : ''}" data-act="campMms"><span class="btn-ico">${ICO.plus}</span>Add Image (MMS)</button>
            <button class="btn btn-sm btn-outline" style="margin-left:auto">Send Test</button>
          </div>
        </section>

        <section class="section-card">
          <div class="camp-card-title">Send Time</div>
          <div class="camp-card-sub">When should we send this message?</div>
          <!-- 2차 PRD §5 blocks new scheduling as well as new sends, so both options
               go disabled together. The whole group is one decision, so one tooltip
               on the group beats two identical ones. -->
          ${isLocked() ? lockTip(h`
          <div class="radio-list" style="width:100%">
            <button class="radio-card ${!scheduled ? 'is-sel' : ''}" disabled>
              <span class="radio">${!scheduled ? '<span class="radio-dot"></span>' : ''}</span>
              <span class="radio-body">
                <span class="radio-label">Send Now</span>
                <span class="radio-desc">Campaign sends immediately after you click Send Now</span>
              </span>
            </button>
            <button class="radio-card ${scheduled ? 'is-sel' : ''}" disabled>
              <span class="radio">${scheduled ? '<span class="radio-dot"></span>' : ''}</span>
              <span class="radio-body">
                <span class="radio-label">Schedule for Later</span>
                <span class="radio-desc">Pick a date &amp; time to send.</span>
              </span>
            </button>
          </div>`, lockWhy("send"), 'block') : h`
          <div class="radio-list">
            <button class="radio-card ${!scheduled ? 'is-sel' : ''}" data-act="sendWhen" data-val="now">
              <span class="radio">${!scheduled ? '<span class="radio-dot"></span>' : ''}</span>
              <span class="radio-body">
                <span class="radio-label">Send Now</span>
                <span class="radio-desc">Campaign sends immediately after you click Send Now</span>
              </span>
            </button>
            <button class="radio-card ${scheduled ? 'is-sel' : ''}" data-act="sendWhen" data-val="later">
              <span class="radio">${scheduled ? '<span class="radio-dot"></span>' : ''}</span>
              <span class="radio-body">
                <span class="radio-label">Schedule for Later</span>
                <span class="radio-desc">Pick a date &amp; time to send.</span>
              </span>
            </button>
          </div>`}
          ${scheduled ? h`
          <div class="sched-detail">
            <div class="sched-fields">
              <div class="sched-field" data-sched="date">
                <span class="sched-lab">Date</span>
                <button class="input input-btn ${S.calOpen ? 'is-open' : ''}" data-act="calOpen">${slashD(dOf(S.schedDate))}${ICO.cal}</button>
                ${inTransition() ? h`<div class="sched-help">${ICO.info}<span>${TRANS_COPY.helper()}</span></div>` : ''}
                ${S.calOpen ? sendCalendar() : ''}
              </div>
              <div class="sched-field">
                <span class="sched-lab">Time (PT)</span>
                <button class="input input-btn">10:00 AM${ICO.clock}</button>
              </div>
            </div>
            <div class="note-strip" style="margin-top:12px">${ICO.info}<span><strong>${n(need)} SMS credits will be reserved now.</strong> They leave your available balance immediately and are held for this campaign. Cancel the campaign and they return instantly.</span></div>
          </div>` : ''}
        </section>
      </div>

      <div class="camp-col">
        <section class="section-card preview-card">
          <div class="camp-card-title">SMS Preview</div>
          <div class="phone">
            <div class="phone-num">+1 (800) 555-0101</div>
            <div class="bubble">Hi, check out {vendor_dba}'s new collection released today!<br><br>Reply STOP to opt out.</div>
          </div>
          <div class="preview-note">Actual rendering may not be identical to this preview depending on the user's environment.</div>
          ${costLine}
        </section>
      </div>
    </div>
  </div>`;
}

// ── Modals ──────────────────────────────────────────────────────────────────
/* SOURCED 2026-09-04 — 진아 spec §3 "팩 구성·가격" carries the real list, so none of this
   is a placeholder any more:  $20 → 1,000 · $50 → 2,500 · $100 → 5,250 (+5%) ·
   $200 → 11,000 (+10%).  Handoff §4's old 500 / 1,000 / 5,000 with prices we invented
   is retired, and D-11 is answered for pack sizes and pricing.
   Two things changed shape with it. The packs are PRICED, NOT COUNTED: the vendor picks
   a dollar amount and the credits are what it buys, at $0.02 each (§1). And the bonus is
   REAL — `save: 'Save 14%'` was removed on 2026-08-24 because a discount badge on an
   undecided price turns an open question into a promise, and it comes back here with the
   source it was missing, as BONUS CREDITS: the doc's mechanism is more credits for the
   same money, not a cheaper pack. §3 adds that the set is config-managed and moves with
   pricing policy, so the picker still holds whatever list comes back.
   The split SMS/MMS arrays below are the retired D-3 model, kept only so the panel's
   Split switch still renders — both PRDs now say one pool (진아 §3 · 2차 PRD §2) — and
   they are NOT maintained against the new price list. */
const PACKS = {
  credits: [
    { c: 2000,  p: '$20.00' },
    { c: 5000,  p: '$50.00' },
    { c: 10500, p: '$100.00', bonus: '+5%' },
    { c: 22000, p: '$200.00', bonus: '+10%' },
  ],
  sms: [ { c: 500, p: '$17.50' }, { c: 1000, p: '$30.00' }, { c: 5000, p: '$135.00' } ],
  mms: [ { c: 500, p: '$16.00' }, { c: 1000, p: '$30.00' }, { c: 2000, p: '$55.00' } ],
};

/* The confirmation's card is the default, shown as a row of the summary box (PM request
   2026-10-05). Change opens this picker under the box: the other saved cards, and Add a
   payment method, which leaves for the card modal and comes back (§13.1). Picking a card makes
   it the default (PB 1.4.0). Nothing renders here until Change is pressed. Balance's widget
   never mounts inside the confirmation (PM, 9/22). */
function subscribeCardSlot() {
  if (S.cardStep !== 'pick') return '';
  const others = sc().cards.slice(1).map(id => CARDS[id]).filter(Boolean);
  const row = (c) => h`
        <div class="card-row">
          <span class="brand-mark ${c.cls}">${c.brand}</span>
          <div class="card-main">
            <div class="card-num"><span class="card-dots">···· ${c.last4}</span></div>
            <div class="card-sub">Expires ${c.exp}</div>
          </div>
          <button class="btn btn-sm btn-outline" data-act="subPickCard" data-val="${c.id}">Use this card</button>
        </div>`;
  return h`
      <div class="inline-form-title" style="font-size:13px;margin-top:18px;margin-bottom:8px">Change card</div>
      ${others.length ? h`<div class="pick-list">${others.map(row).join('')}</div>`
        : h`<p class="pick-note" style="margin-top:0">No other card is saved on this account.</p>`}
      <button class="btn btn-outline btn-block pick-add" data-act="subAddCard"><span class="btn-ico">${ICO.plus}</span>Add a payment method</button>
      <p class="pick-note">Whichever card you choose becomes your <strong>default card</strong>, which also pays for SMS credit purchases.</p>
      <button class="btn btn-sm btn-outline" style="margin-top:12px" data-act="cardSlotBack">Cancel</button>`;
}

function cardFields(saved) {
  /* §13.2 — Balance's widget, in the widget's own order (PM request 2026-10-05): card number,
     expiry and CVC, then the billing address with Country or region first. The real widget
     also asks for first and last name; the mockup leaves those out. A saved card shows masked
     values in non-editable boxes: the full number never reaches Shopcord (§13.2) and a card is
     not edited in place (§13.3 ⑤). */
  const f = (label, val, cls) => h`
        <div class="pg-field"><span class="pg-field-label">${label}</span>
          <div class="pg-input ${cls || ''} ${saved ? 'is-filled' : ''}">${val}</div>
        </div>`;
  const row = (a, b) => h`<div class="pg-row">${a}${b}</div>`;
  return h`
      <div class="pg-frame">
        ${f('Card number', saved ? '•••• •••• •••• ' + saved.last4 : '1234 1234 1234 1234')}
        ${row(f('Expiry', saved ? saved.exp : 'MM / YY'), f('CVC', saved ? '•••' : 'CVC'))}
        <div class="pg-group">Billing address</div>
        ${f('Country or region', 'United States', 'is-select')}
        ${f('Address line 1', saved ? '1407 Broadway' : 'Street address')}
        ${f('Address line 2', saved ? 'Suite 902' : 'Apt, suite, unit (optional)')}
        ${f('City', saved ? 'New York' : '')}
        ${row(f('State', saved ? 'NY' : '', 'is-select'), f('ZIP', saved ? '10018' : ''))}
      </div>
`;
}

/* Split out of cardFields so the slot can put a control BETWEEN the fields and this note
   (Grace, 2026-09-22): `Use a different card` belongs directly under the last field it acts
   on, not after a security footnote. */
function cardHelper(saved) {
  return h`
      <div class="helper">${ICO.lock}<span>${saved
        ? 'This is your default card, the one every Shopcord charge uses. Balance holds the full number — Shopcord never sees or stores it.'
        : 'Card details are entered directly with Balance — Shopcord never sees or stores your full card number. Your first card becomes the default.'}</span></div>`;
}

function modalAddCard() {
  const fromSubscribe = S.cardReturn === 'confirmSubscribe';
  return h`
  <div class="modal card-modal" id="card-form">
    <div class="inline-form-head">
      <div>
        <!-- The widget's own title (PM request 2026-10-05). -->
        <div class="inline-form-title">Add a New Card</div>
        <div class="inline-form-sub">Used for your subscription and SMS message packs.</div>
      </div>
      <button class="modal-x" data-act="cardCancel">${ICO.x}</button>
    </div>
      ${cardFields()}
      ${cardHelper()}
      ${fromSubscribe ? h`<div class="card-next">You’ll review your plan and confirm your subscription on the next step. <strong>Nothing is charged yet.</strong></div>` : ''}
    <div class="inline-form-foot">
      <button class="btn btn-outline" data-act="cardCancel">Cancel</button>
      <button class="btn btn-primary" data-act="saveCard">Save card</button>
    </div>
  </div>`;
}

// Pack purchase expands INLINE under the balance grid.
// The type is always already decided by which button was pressed (Buy SMS on the
// SMS card, Buy MMS on the MMS card, or the failed/exhausted banner), so the
// SMS/MMS tab dimension the overlay version needed is gone.
/* "Which card gets charged" — used by the pack purchase, the campaign shortfall
   confirmation and the subscribe confirmation. It states the fact and stops there:
   the `Change` link that used to sit here walked the vendor out of the flow they
   were in the middle of (Grace, 2026-08-24), and §4.1 keeps card management in one
   place anyway. With NO card the row becomes the one thing that must happen first,
   and the entry modal opens over the flow instead of replacing it.
   The card is derived — the two overlay copies used to hard-code Visa ····4242. */
/* What a credit buys. This is the rule that decides everything a vendor plans — an
   MMS costs three times an SMS — so it is a component with structure, not a muted
   caption (Grace, 2026-08-24). The same strip appears on the balance card and in the
   buy flow, so the rate is in front of them when they read a balance and when they pay
   for one. Not in the docs: §7.1 says "counts, not dollars" and names no rate. */
/* creditRateBanner() removed 2026-09-11 (Grace). It stated the per-segment rate and
   1 credit = $0.02 inside the purchase modals. Both call sites are gone — the buy modal's on
   9/11 (the balance card behind it already carries the rate strip) and the campaign modal's
   with it, since the two shared this one function. The rate now lives in exactly two places:
   the balance card's chips, and the campaign composer's live estimate, which is where
   segments actually decide anything. `.rate-banner` CSS stays — the free-credit note on the
   balance card uses it. */

function creditRateStrip() {
  return h`
    <div class="rate-strip">
      <!-- "/ segment" removed (Grace, 2026-09-11). The qualifier was doing less work than it
           cost: 진아 9/10 §4 caps an SMS at 2 credits and auto-converts 3+ segments to MMS, so
           "per segment" implied an open-ended count that cannot happen. The composer is where
           segments actually matter and it states them live. -->
      <span class="rate-chip">SMS <strong>${SMS_CREDITS} credits</strong></span>
      <span class="rate-chip">MMS <strong>${MMS_CREDITS} credits</strong></span>
    </div>`;
}

function payWithRow() {
  const def = CARDS[sc().cards[0]];
  /* With a card this is a STATEMENT — so it stops looking like a control. The bordered
     row survived the removal of its "Change" link and still read as clickable, which is
     worse than before: it invites a press that does nothing (Grace, 2026-08-24). A
     caption line can't make that promise. Without a card there IS something to do, so
     that variant keeps a box and a button — the contrast is the point. */
  return def ? h`
      <div class="pay-with-line">
        <span class="brand-mark ${def.cls}">${def.brand}</span>
        <!-- The brand mark to the left already says Visa, so the word doesn't (Grace,
             2026-08-24). Only here: everywhere without an icon — history rows, toasts,
             banners, §3.4's own "Billed to Visa ····4242" — keeps the brand name. -->
        <!-- "Paying with", not "Charged to" (Grace, 2026-09-09: 보통 charged라는 말을써?
             난 그런말 받은적이 없어 / 구독이랑 다른데 구분잘해). She is right, and the split
             is already in this file: CHARGE vocabulary belongs to the subscription, where
             something recurs and "Charged today" earns its place beside "Next charge" -
             the PRD's own words there are "Billed monthly" and "Billed to Visa ····4242".
             This row serves the two ONE-TIME purchases (the credit pack panel and the
             campaign top-up); there is no next charge to distinguish it from, so it reads
             like a shop, not a billing statement. Same word as the button below it. -->
        <span>Paying with your default card, <strong>ending ····${def.last4}</strong></span>
      </div>` : h`
      <div class="pay-with is-empty">
        <span class="pay-with-ico">${ICO.alert}</span>
        <div style="flex:1">
          <div class="t-strong" style="font-size:13px">No card on file</div>
          <div class="foot-note">Add one and it becomes your default.</div>
        </div>
        <button class="btn btn-sm btn-primary" data-act="addCard">Add a payment method</button>
      </div>`;
}

function inlinePackPurchase() {
  /* Force the type to agree with the credit model. `S.packType` survives scenario and model
     changes, and now that this is a modal it can be opened from places that never set it —
     which showed a unified build a picker for "SMS messages", a type that does not exist in
     that model. The model decides; the button only chooses between SMS and MMS in split. */
  const type = isUnified() ? 'credits' : (S.packType === 'credits' ? 'sms' : S.packType);
  const packs = PACKS[type];
  const sel = packs[S.packSel];
  const c = sc().credits;
  const cur = type === 'credits' ? unifiedTotals(c).remaining : (type === 'sms' ? c.sms : c.mms);
  const unit = type === 'credits' ? 'credits' : `${type.toUpperCase()} messages`;
  /* Matches the campaign modal's title and the button that opens it — the tab is SMS Credits,
     the button is Buy SMS credits, and this is the same purchase. */
  const heading = type === 'credits' ? 'Buy SMS credits' : `Buy ${type.toUpperCase()} messages`;
  // Derived from the pack's own price — not a new number, just the arithmetic the vendor
  // would otherwise do to compare $20/1,000 against $200/11,000.
  const dollars = parseFloat(String(sel.p).replace(/[^0-9.]/g, '')) || 0;
  const bonusN = Math.max(0, sel.c - Math.round(dollars / CREDIT_UNIT));

  return h`
  <div class="modal" id="pack-form">
    <div class="modal-head">
      <div>
        <div class="modal-title">${heading}</div>
        <!-- ⚠ "They never expire while your account is open" was here and is now cut.
             the old §7.7's "credits never expire" was scoped to SUSPENSION only. Credit expiry
             in general is pending Finance (D-4), and L-1 asks outright whether credit
             expiry is even lawful and whether forfeiture is permissible. A screen
             promising "never expire" would be making a standing commitment on an open
             legal question — the same failure as "billed on the 15th", with more at
             stake. §7.1 is what can be said: counts, not dollar amounts. -->
        <!-- "Packs are message counts, not dollar amounts" (§7.1) moved into the
             banner below, which says the same thing with the rate attached. Two
             sentences about one model, one of them without the numbers, was the weaker
             half. -->
      </div>
      <button class="modal-x" data-act="close">${ICO.x}</button>
    </div>
    <div class="modal-body">

      <!-- Choice on the left, consequence on the right (Grace's layout, 2026-08-24).
           Three tiles across the top left the receipt hugging the right edge with an
           empty half beside it; side by side, picking a pack and reading what it does
           to the balance is one movement, and the prices line up in a column so they
           can be compared. Collapses to one column when the panel is narrow. -->
      <!-- The rate banner that used to sit here is gone (Grace, 2026-09-11): it repeated the
           rate strip on the card directly behind this modal, and rates are for working out
           whether you have ENOUGH — the campaign case — not for choosing an amount.
           What replaced it answers the two questions a vendor actually has at this moment
           (Grace: 나의 크레딧이 얼마고 클릭한 선택지에 따라 합쳐지는 크레딧수를 아는게 낫지
           않아?): what I have, and what it becomes if I pick this pack. Same .summary-box the
           campaign modal opens with, so the two entry points share one grammar — that one
           states the GAP, this one states the RESULT, because those are the two different
           things a vendor needs before choosing. The second row moves with the selection. -->
      <div class="summary-box">
        <div class="summary-row"><span class="lbl">You have</span><span class="t-strong">${n(cur)} ${type === 'credits' ? 'credits' : type.toUpperCase()}</span></div>
        <div class="summary-row"><span class="lbl">After this purchase</span><span class="t-strong">${n(cur + sel.c)} ${type === 'credits' ? 'credits' : type.toUpperCase()}</span></div>
      </div>
      <div class="buy-body">
      <div class="pack-list" role="radiogroup" aria-label="Credit pack">
        ${packs.map((p, i) => h`
          <button class="pack-opt ${S.packSel === i ? 'is-sel' : ''}" role="radio" aria-checked="${S.packSel === i}" data-act="packSel" data-val="${i}">
            <span class="pack-radio"></span>
            <span class="pack-count">${n(p.c)} <span class="pack-unit">${unit}</span>${p.bonus ? h`<span class="pack-bonus">${p.bonus} bonus</span>` : ''}</span>
            <span class="pack-price">${p.p}</span>
          </button>`).join('')}
      </div>
      <!-- D-11 note removed from screen (8/18): a decision ID is a reviewer's
           fact, and the vendor has no use for knowing the list is provisional. The
           prototype panel carries it. -->

      <!-- Was a bordered four-row table: five rules for four facts, money and credits
           alternating down one column, and the same $125.00 stated twice because a
           single line item does not need a total row. Now the box and the internal
           dividers are gone, the balance is one before → after line instead of two
           rows, and the only rule left is the one above what actually gets charged. -->
      <!-- The box stretches to end level with the pack list, so the space between the
           balance and the total used to be blank. It is filled with the two facts that
           belong to a purchase decision and were missing from it:
             · how many of the credits are the bonus, when there is one
           A "Per credit" row (2¢ · 1.9¢ · 1.8¢, derived from 진아 §1's $0.02) was there for
           an hour and removed — Grace: 필요없는 말. The vendor is choosing an amount, not
           auditing a unit rate, and the bonus already says which pack gives more.
           And the disclosure the docs REQUIRE and the screen did not have: 제니 PB 3.5.0
           asks for "non-refundable" on the purchase screen, and 진아 §3's 환불 정책 is
           법무 확인 완료. It sits under what gets charged, which is what it qualifies. -->
      <div class="buy-summary">
        <div class="bs-row"><span class="lbl">${n(sel.c)} ${unit}</span><span class="t-strong">${sel.p}</span></div>
        ${bonusN ? h`
        <div class="bs-row"><span class="lbl">Bonus included</span><span class="t-strong">+${n(bonusN)} ${unit}</span></div>` : ''}
        <!-- The before/after balance moved to the box at the TOP of this modal (2026-09-11).
             It belongs before the choice, not after it: it is what the choice is measured
             against. Keeping it in both places would state one fact twice in one modal. -->

        <!-- "You pay", not "Charged today" (Grace, 2026-09-09: 그럼 지금 오늘 차지하지 뭐
             언제 차지해???). She is right for THIS box: a credit purchase is one charge with
             no other charge to distinguish it from, so "today" did no work. The word stays in
             the SUBSCRIBE modal, where it sits beside "Next charge" and the contrast is the
             whole point. "You pay" also matches the button under it, so the label and the
             control state the same amount in the same words. -->
        <div class="bs-row is-total"><span>You pay</span><span>${sel.p}</span></div>
        ${payWithRow()}
        <!-- Figma 915:48685 replaced the one-line disclosure with three facts (Grace, 9/11).
             SUBJECT NARROWED TO "Purchased" (Grace, 2026-09-11). Figma's string said "Your
             credits", which was FALSE on the same screen: the free grant expires in 90 days and
             the balance card behind this modal counts its last days ("Use by Mar 01, 2027 · 9
             days left"). One word removes the contradiction, and it also matches the scope of
             the open question — 진아 §3's 택1 is specifically about 구매 크레딧.
             ⚠ STILL OPEN (Gap I-30 · I-31): non-expiry for PURCHASED credits is 진아 9/10 §3
             안A(만료 O) vs 안B(만료 X), 법무 대기. 제니 §5·§8 have it settled as forbidden, so
             the two docs disagree and this line promises one side of a live question. -->
        <!-- Figma 929:49270's fuller disclosure. "the campaign sends right away" is dropped
             here - there is no campaign in this entry point - and the consent names THIS
             modal's own button, because a consent line has to name the control being pressed. -->
        <div class="helper">${ICO.info}<span>The selected pack is added to your SMS credit balance as soon as payment completes. ${paidTerms()}</span></div>
        <div class="helper-consent">By clicking <strong>Pay ${sel.p}</strong>, you agree to the terms applicable to your SMS credits.</div>
      </div>
      </div>

    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-act="close">Cancel</button>
      <button class="btn btn-primary" data-act="packBuy">Pay ${sel.p}</button>
    </div>
  </div>`;
}

/* 확인-결제 — the campaign half of buying. 제니 §3 keeps the purchase LOCATION in SMS
   Settings and adds "자동 충전 없음 — 수동 구매 + (진아님 측) 캠페인 발송 시 확인-결제만";
   진아 §1.1 asks for 충전 안내 at the block and §5.1 for a 충전 option "그 순간". So the
   two places are not alternatives: SMS Settings is where a vendor CHOOSES an amount, and
   this is where they CONFIRM one charge without leaving a campaign they are mid-way
   through. That is why there is no pack picker here — one pack, one confirm.
   The pack is now COMPUTED. It was hard-coded to 1,000 / $20 from before the price list
   existed, so any shortfall over 1,000 showed the wrong pack and a negative leftover.
   ⚠ Still undecided (D-11's remaining half): what happens when NO single pack covers the
   shortfall — over 11,000 credits short. The largest pack is shown and the leftover line
   is suppressed rather than inventing a two-pack flow. */
function modalConfirmCharge() {
  const s = sc();
  // only reachable from a campaign scenario, but don't blow up if opened elsewhere
  const need = campNeed(s);
  const have = isUnified()
    ? unifiedTotals(s.credits).remaining - unifiedTotals(s.credits).reserved
    : s.credits.sms - s.credits.smsRes;
  const short = Math.max(0, need - have);
  /* ALL FOUR PACKS, not one (Grace, 2026-09-09). No document says which pack a shortfall
     charges — 통합 v0.5 gives the flow ("shortfall → on-session confirm-and-charge"), 제니 §3
     gives "확인-결제만" and hands the UX to 진아님, 진아 §5.1 gives "그 순간 선택지: 충전 /
     예약 취소 / 유지". The amount was OURS, so the honest version shows the list the doc
     does give (§3's four packs) and lets the vendor choose, exactly as SMS Settings does.
     Packs that cannot cover the shortfall are DISABLED with the reason on hover: this
     modal's own subtitle promises the campaign sends right away, and an option that leaves
     it short would break that promise. The default selection is the smallest covering pack
     — a default the vendor can see and change, not a rule hidden behind one figure. */
  const packs = PACKS.credits;
  const firstCovering = packs.findIndex(p => p.c >= short);
  /* When the shortfall is bigger than every pack, NOTHING is selected: a selected-looking
     row that is also disabled reads as a charge about to happen, and Confirm goes with it
     (below). What to do in that case is D-11's remaining half — the route out is the packs'
     own screen, where a vendor can buy twice. */
  const selIdx = firstCovering < 0 ? -1 : (S.ccPackSel != null ? S.ccPackSel : firstCovering);
  const pack = packs[selIdx] || null;
  const covers = !!pack;
  return h`
  <div class="modal">
    <div class="modal-head">
      <div>
        <!-- ONE PURCHASE, ONE TITLE (Grace, 2026-09-11). "You need more credits to send"
             named the TRIGGER, and that was fine while this was the only purchase modal.
             Now that buying opens the same container from the balance card too (9/10 meeting),
             two titles for one task read as two different things. The title names the task;
             the SUBTITLE keeps the campaign context, and the summary box right below still
             opens with "Short by 160 credits" in red — so nothing about the urgency is lost,
             it just stops being the heading. -->
        <div class="modal-title">Buy SMS credits</div>
        <div class="modal-sub">Top up here and the campaign sends right away.</div>
      </div>
      <button class="modal-x" data-act="close">${ICO.x}</button>
    </div>
    <div class="modal-body">
      <div class="summary-box">
        <!-- "This campaign needs" deleted (Grace, 2026-09-11). The composer already states it
             live — "1,000 recipients × 1 credit = 1,000 credits" sits in the preview column the
             vendor just came from — so repeating it here was the third time that figure appeared
             in one flow. What the modal has to add is what they DON'T know: the gap. -->
        <div class="summary-row"><span class="lbl">You have</span><span class="t-strong">${n(have)} credits</span></div>
        <div class="summary-row"><span class="lbl">Short by</span><span class="t-strong" style="color:var(--destructive)">${n(short)} credits</span></div>
      </div>

      <div style="margin-top:18px">
        <div class="field-label">Pick a pack</div>
        <div class="pack-list" role="radiogroup" aria-label="Credit pack">
          ${packs.map((p, i) => {
            const ok = p.c >= short;
            const inner = h`
              <button class="pack-opt ${i === selIdx ? 'is-sel' : ''}" role="radio"
                      aria-checked="${i === selIdx}" ${ok ? `data-act="ccPackSel" data-val="${i}"` : 'disabled'}>
                <span class="pack-radio"></span>
                <span class="pack-count">${n(p.c)} <span class="pack-unit">credits</span>${p.bonus ? h`<span class="pack-bonus">${p.bonus} bonus</span>` : ''}</span>
                <span class="pack-price">${p.p}</span>
              </button>`;
            // Disabled packs keep their place and say why on hover — the same treatment the
            // card limit and the Master-only controls already use.
            return ok ? inner : lockTip(inner, `${n(p.c)} credits still leaves this campaign ${n(short - p.c)} short.`, 'block');
          }).join('')}
        </div>
        ${covers ? h`<div class="foot-note" style="margin-top:10px">${n(pack.c - short)} credits left over after this send</div>` : ''}
      </div>

      ${payWithRow()}
      <!-- Same disclosure the purchase panel carries: 제니 PB 3.5.0 asks for "non-refundable"
           on the purchase screen, and this is one. -->
      <!-- Same disclosure as the campaign modal (Figma 915:48685, subject narrowed to
           "Purchased" on 2026-09-11) - one purchase, one sentence, both entry points. -->
      <!-- Figma 929:49270 — the PM's full disclosure (Grace, 2026-09-11): what the purchase
           does, then the consent naming the button. -->
      <div class="helper">${ICO.info}<span>The selected pack is added to your SMS credit balance as soon as payment completes, and the campaign sends right away. ${paidTerms()}</span></div>
      <div class="helper-consent">By clicking <strong>Confirm &amp; Send</strong>, you agree to the terms applicable to your SMS credits.</div>
      <!-- Still needed even with every pack listed: when the shortfall is bigger than the
           largest pack, no single purchase can clear it and buying twice happens where the
           packs live. ⚠ DEV: the mockup switches scenarios here, so the campaign is
           abandoned — the real flow must keep the draft. -->
      ${covers ? '' : h`<button class="linkbtn" data-act="buyPack">Buy more than one pack in SMS Credits</button>`}

    </div>
    <!-- "1,000만 살 수 있어?" — no. The single computed pack is the CONFIRM (제니 §3's
         확인-결제), and this link is the way to any other amount: it lands on the pack
         picker in SMS Settings, which is where §3 puts the purchase. One control, not a
         picker rebuilt inside a campaign — and it names its destination, because leaving
         mid-campaign should not be a surprise. It matters that more is reachable: the
         bonus tiers make the bigger packs cheaper per credit, so a vendor who is short
         twice would rather buy once.
         ⚠ DEV: in this mockup the link switches scenarios, so the campaign is abandoned.
         The real flow must keep the draft — a vendor sent to top up has to come back to
         the campaign they were writing. -->
    <div class="modal-foot">
      <button class="btn btn-outline" data-act="close">Cancel</button>
      ${covers
        ? h`<button class="btn btn-primary" data-act="close">Confirm &amp; Send</button>`
        : lockTip(h`<button class="btn btn-primary" disabled>Confirm &amp; Send</button>`,
                  `No single pack covers ${n(short)} credits. Buy more than one in SMS Credits.`)}
    </div>
  </div>`;
}

/* THE BLOCKER IS ITS OWN MODAL, and a short one (Grace, 2026-09-14: "이거 모달 너무 길어

   methods list with one button swapped. `Use this card` is a real btn-sm btn-outline, sitting

// Same design-system component as the cancel confirm (Figma 1:22320) — one popup
// pattern for both, rather than two shapes for the same kind of decision.
function modalRemoveCard() {
  /* Which card is going matters (Grace, 9/11). The old copy was hardcoded to a non-default
     card and always said "your subscription keeps billing to your default card" — false the
     moment the vendor removes the default one, which they can do whenever a second card
     exists. §13.3.3 makes a default change take effect immediately, so the promotion has to
     be stated here, before the removal, not discovered afterwards. The last card cannot be
     removed at all while subscribed (PB 1.5.0), so a removal always leaves one behind. */
  const ids  = sc().cards;
  const id   = S.removeId && ids.includes(S.removeId) ? S.removeId : (ids[1] || ids[0]);
  const card = CARDS[id] || CARDS.mc;
  const wasDefault = ids[0] === id;
  /* Which card inherits `default` when the default one is deleted. **PRD does not say** —
     PB 1.1.1 fixes the FIRST card as default, PB 1.4.0 covers a MANUAL change, §13.3.4 blocks
     deleting the only card, but nothing names a successor, and from three cards up there are
     two candidates. Proposed to the PM 9/13 (Gap H-25): **the oldest remaining card**, which
     is the same registration-order basis PB 1.1.1 already uses rather than a new concept.
     The list is default-first then registration order (PB 1.2.0), so that is ids[1] once the
     default is dropped — written out here so the rule is stated, not merely emergent. */
  const next = CARDS[ids.filter(x => x !== id)[0]] || CARDS.visa;
  return h`
  <div class="modal modal-confirm">
    <div class="confirm-top">
      <span class="confirm-ico">${ICO.octagonAlert}</span>
      <div class="confirm-title">Remove this card?</div>
    </div>
    <div class="confirm-detail">
      <p>${card.name} ····${card.last4} will be removed from your account.</p>
      <ul>
        ${wasDefault
          ? `<li>It is your default card, so <strong>${next.name} ····${next.last4} becomes the default</strong> and your subscription bills to it from now on.</li>`
          : `<li>Your subscription keeps billing to your default card, ${next.name} ····${next.last4}.</li>`}
        ${hasCredits() ? '<li>Credit purchases use the same default card.</li>' : ''}
        <li>You can add it again at any time — cards are not edited in place.</li>
      </ul>
    </div>
    <div class="confirm-foot">
      <button class="btn btn-outline" data-act="close">Keep Card</button>
      <button class="btn btn-secondary" data-act="close">Yes, Remove</button>
    </div>
  </div>`;
}

/* Figma node 1:22320 (Popup-Discard) — the design system's confirmation popup, built to
   its measurements. The bullet list is the part worth keeping: a consequence list is
   scannable in a way a paragraph of the same facts is not, and cancellation is exactly
   where a vendor is scanning for what breaks.

   The bullets are RELEASE-AWARE, because the Figma content is written for the world
   where a subscription gates SMS. In release 1 it does not: §8 keeps the SMS menu on the
   payout `verified` gate and §12 keeps SMS on settlement deduction, so "SMS campaigns
   will stop" would be false there. Release 2 follows Figma.
   Two of Figma's lines have no home in either PRD and are logged for it — the scheduled
   sends being canceled (2차 §5 promises the opposite for SUSPENSION, and says nothing
   about cancellation) and the number being deleted after three months, which is a
   permanent-deletion promise no document makes. */
function modalCancelSub() {
  const ordersBullet = `You won't be able to open or confirm orders after ${clock().next} — your store stays open and they keep arriving, but processing them needs a subscription.`;
  const bullets = hasCredits()
    ? [ordersBullet,
       `SMS campaigns will stop after ${clock().next}.`,
       `Any SMS scheduled past that date will be canceled that day.`,
       `Your number is held for ${NUMBER_HOLD_MONTHS} months after that — resume within ${NUMBER_HOLD_MONTHS} months and you keep it.`,
       `Credits you've already bought stay, but you can't use them until you resubscribe.`,
       `You can resume any time before then — nothing is charged.`]
    : [ordersBullet,
       `SMS keeps sending — it is billed through your settlement, not your subscription.`,
       `You can resume any time before then — nothing is charged.`];
  return h`
  <div class="modal modal-confirm">
    <div class="confirm-top">
      <span class="confirm-ico">${ICO.octagonAlert}</span>
      <div class="confirm-title">Cancel your subscription?</div>
    </div>
    <div class="confirm-detail">
      <p>You'll keep your subscription until <strong>${clock().next}</strong>, then paid features are off.</p>
      <ul>${bullets.map(b => `<li>${b}</li>`).join('')}</ul>
    </div>
    <div class="confirm-foot">
      <button class="btn btn-outline" data-act="close">Keep Subscription</button>
      <button class="btn btn-secondary" data-act="doCancelSub">Yes, Cancel</button>
    </div>
  </div>`;
}

/* Overlay registry.
   PROJECT RULE: a modal is allowed ONLY when the vendor is confirming something
   that is about to happen. Anything they have to fill in, choose or configure
   opens in the right drawer, or expands inline on the page.
   Drawer vs inline: work that attaches to something already on the page expands
   inline (add card → the card list; auto-recharge → its own card). Work that is
   a self-contained task gets the drawer (buy a pack, schedule a send). */
const OVERLAYS = {
  /* A PREVIEW, not a product modal - the project rule (a modal is only for confirming
     something about to happen) is untouched. It sits here because the prototype panel's
     Modal group is simply where overlays are listed, and Grace asked for it there
     (2026-09-10) after I had parked it on the PDF shelf, which was the wrong place for a

/* ── Email templates ───────────────────────────────────────────────────────

   list and nothing else — no subject, no title, no body. This is that wording. Two more
   come from section 5: the vendor recovery invoice (PB 6.2.0 / 7.8) and the buyer
   capture-failure invoice (5.3 iii), the only thing here addressed to a buyer.

     basis), no dunning dates (section 10's ladder is a proposal), no consequence for a
     buyer not paying (section 10 books it AR-3 and the platform absorbs it)

   question (F-6, 8/31); v2.5 closed it, and §6.6 closed the ladder that follows it too. */

   여럿이면 라인을 사유별로". The PRD divides nothing into cases; it gives four line strings and
   a stacking rule. So the demo invoice carries all four reasons as four stacked lines under one
   totals block (Grace, 9/17 — "PRD에 있는대로") and every string is readable in one place. A
   real invoice usually carries fewer; a chargeback and its fee are the common pair.
   Each string is rendered as ONE line with the PRD's own punctuation, never split.
   `{case description}` in the adjustment line is the PRD's variable — the value here is ours. */
/* ONE CASE PER INVOICE (운영 확인 via Grace, 2026-09-23) — so one case per email.
   §6.3.4 gives four vendor line strings and its own sentence allows stacking them: 한 인보이스에
   사유가 여럿이면 라인을 사유별로. Operations says an invoice only ever carries one, so the demo
   stopped stacking and each case became its own mail.
   🔴 That sentence is dead in practice now and the PRD needs the correction.
   🔴 And it has a consequence worth stating: a single disputed order produces TWO invoices, the
   reversal and its fee, on the same day to the same vendor.
   Every string below is §6.3.4 verbatim — 제목 - 부제 (Reference), the PRD's own punctuation.
   Figures are demo data; the SHAPE (gross → recovered → due, §6.3.4) is the spec, and 만기 =
   발행 + 7 (§6.4-3). */
const INVOICE_CASES = {

    line: 'Refund clawback - Buyer refund after payout (Order #FG-88214 · Refunded Feb 02, 2027)',

   shipment NUMBER appears — 발행 시점에 총 배송 횟수를 알 수 없다 (9/9), never "Shipment 2 of 3". */
const BINVOICE_LINE = () => 'Shipping — additional charge (Order ' + BINVOICE.order + ' · Shipment ' + BINVOICE.shipment + ' · Shipped ' + BINVOICE.shipped + ')';
/* The PRD's string, character for character, with the receipt's three type voices laid over
   it (Grace, 9/17: a flat 90-character sentence per line "그저 PRD에 있는것을 구겨넣은 느낌"):
   the reason in bold, the explanation plain, the reference small and grey. Nothing is added or
   removed — the hyphen and the parentheses are the PRD's own — so the string a developer copies
   is still §6.3.4's. Splits at the FIRST " - " and the LAST " (" so a subtitle may itself
   contain a hyphen or a dash. */
function fmtInvoiceLine(str) {
  const i = str.indexOf(' - ');
  const j = str.lastIndexOf(' (');
  if (i < 0 || j < 0 || j < i) return str;

}

/* ── Purchase order (internal PDF) ─────────────────────────────────────────
   §5.1 splits the documents three ways: Balance auto-generates the RECEIPTS, Balance
   hosts the INVOICES, and the platform builds this one — the only document we draw, and
   the only one that is not about money moving to Shopcord.

   Structure comes from the current FashionGo PO, which §5.1's attachment spec names as
   the reference. What a Shopcord order needs from it, and what it does NOT:

   TAKEN — bordered blocks; the fact box beside the title; billing/shipping split out so
   a warehouse can read one and a bookkeeper the other; the per-line SIZE GRID (a wholesale
   line is a matrix, not a row); a total-quantity block; a buyer's own PO number, which is
   how a wholesale buyer files it on their side.

   DROPPED — FG's discount stack (Collection Promotion, Redeemed Rewards, FG Coupon
   Discount, Store Credit). Those are FashionGo MARKETPLACE mechanics; a Shopcord order is
   a vendor's own linesheet sold to their own buyer, and the 8/28 spec asks for exactly
   Subtotal · Discount · Total. Printing empty promotion lines would advertise machinery
   that does not exist. The barcode goes too — that is FG's fulfilment infrastructure and
   inventing a symbology would be inventing.

   ADDED, because a Shopcord order has them and an FG order does not — LINESHEET NAME (an
   order comes from one) and ORDER STATUS as of issue, both named in the 8/28 spec.

   PACK NOTATION is where the two genuinely differ. FG lists flat per-size quantities;
   Shopcord sells packs, so the spec writes "S-M-L 1-2-1" with a pack count. Both are
   shown: the grid gives the per-size totals a warehouse picks against, the pack line gives
   the arithmetic they came from. */
/* No description field: the 8/28 spec ③ writes "Item Name/Description", but the
   description is not needed (Grace, 8/28) — logged as a deviation. The style number
   identifies the item and the buyer picked it off a linesheet that carried the detail. */
const PO_LINES = [
  { style: 'BB-1042', item: 'Linen Camp Shirt',
    sizes: ['S','M','L'], pack: '1-2-1', unit: 21.50,
    colors: [ { c: 'Ecru',  packs: 6, q: [6,12,6] },
              { c: 'Sage',  packs: 4, q: [4, 8,4] } ] },
  { style: 'BB-2210', item: 'Wide-Leg Trouser',
    sizes: ['S','M','L','XL'], pack: '1-2-2-1', unit: 34.00,
    colors: [ { c: 'Black', packs: 5, q: [5,10,10,5] } ] },
  { style: 'BB-0788', item: 'Ribbed Knit Tank',
    sizes: ['S','M','L'], pack: '2-2-2', unit: 12.00,
    colors: [ { c: 'Butter', packs: 3, q: [6,6,6] } ] },
  /* OPEN PACK. A pre-pack is bought as a fixed assortment, so its per-size counts are
     the ratio times the pack count and one row per colourway says everything. Open stock
     is picked size by size, and those quantities CANNOT be derived from anything — so an
     open line gets a row per size, or the document loses what was actually ordered. */
  { style: 'BB-3310', item: 'Cropped Cardigan', open: true,
    sizes: ['S','M','L'], unit: 28.00,
    colors: [ { c: 'Oat', q: [4, 7, 3] } ] },
];
/* NO shipping amount on the PO. PRD v2.1 §15 fixes the document's unit — "오더 단위,
   상품 금액까지만 — 배송비·결제 진행 상태는 담지 않는다" — because shipping is settled per
   SHIPMENT and its receipt is Balance's, per capture. The notice sentence stays (§15 ④):
   it is what explains the absence. Reverses the 8/28 decision to print the amount entered
   at order confirmation. */
/* A seasonal linesheet is usually sold as a PRE-ORDER with a delivery window, and then the
   buyer's first question is when it lands. It rides the header rather than the item table
   because it belongs to the order, and because a tenth column would squeeze the item name
   to nothing. Set to null for an in-stock order and the row disappears. */
const PO_PREORDER = 'Mar 15, 2027';
/* NO shipping-info field (Grace, 8/28). It came from FG's PO, not from the 8/28 spec, and
   a PO is not a shipping document: it records what was ordered and agreed, while carrier
   and tracking are later events that packing slips and shipment notices carry. At issue
   the field is empty by definition — §5.3 iii charges shipping per shipment, after the
   fact — so keeping it would be the "set at shipment" problem moved up a level, the field
   itself admitting it has nothing. The buyer's timing question is answered by the
   Delivery row in the header instead.
   Reversible: if Gap G-2e lands on "generated on demand", a re-issued PO could carry
   tracking and the field earns its place. */
const money = (v) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const lineQty = (l) => l.colors.reduce((a, c) => a + c.q.reduce((x, y) => x + y, 0), 0);

function docPO() {
  // Every figure is computed. Three prices for one line was a real bug once.
  const rows = PO_LINES.flatMap(l => l.colors.flatMap(c => l.open

    : [{ l, c, opt2: l.sizes.join('-'), pack: l.pack, packs: c.packs, u: c.q.reduce((x, y) => x + y, 0),
         amt: c.q.reduce((x, y) => x + y, 0) * l.unit }]));
  const sub = rows.reduce((a, r) => a + r.amt, 0);
  return h`
  <div class="sheet"><div class="po-paper">

/* ── Settlement statement ──────────────────────────────────────────────────
   Design from Figma 326:823258 — the PDF settlement already sends. It is not a document
   Payment & Billing owns, and it is here because **this release changes it**: the whole
   point of §12's double-collection block is which of these adjustment lines survives.

   Today the statement deducts BOTH the subscription fee and SMS overcharges from the
   vendor's payout. §12 blocks only the subscription adjustment type at the 1st cutover
   and says the SMS one must **absolutely not** be touched, because it is the only way SMS
   is collected during the transition. The 2nd cutover blocks SMS as well (2nd PRD §6).
   So the same document has three states, and the release switch shows them.

   `until` = the last release in which the line still appears. Everything is computed:
   the reference's own figures do not reconcile (its four adjustments sum to 63.40 above a
   stated 53.40, and 1,780.00 − 53.40 is 1,726.60 rather than the 1,726.00 printed), which
   is exactly why ours are added up rather than typed.
   Signs are also made explicit here: fees deduct, credits add back. The reference prints
   every line with a minus including the credits, which is either a display bug or a
   different meaning — worth asking settlement, and not worth copying blind. */
const SETTLE = {
  no: 'STM-39949020101-001',
  orders: 1780.00,
  refunds: 0,
  adj: [
    { k: 'Subscription Fee',      v: -Number(PLAN.price.replace('$','')), until: 0,
      why: 'Blocked at the 1st cutover — the subscription is charged to the card from then (PB 9.5.0)' },
    { k: 'SMS Overcharge Fee',    v: -14.40, until: 1,
      why: 'Kept through release 1 on purpose: §12 calls this the only way SMS is collected during the transition' },
    { k: 'SMS Overcharge Credit', v:  10.00, until: 1,
      why: 'Same adjustment type as the fee, so it leaves with it at the 2nd cutover' },
    { k: 'Credit',                v:  0,     until: 9,
      why: 'Not a Phase 2.5 line — a general settlement credit, unaffected by either cutover' },
  ],
};
const settleRel = () => isR1() ? 1 : 2;
const settleVisible = () => SETTLE.adj.filter(a => settleRel() <= a.until);
const signed = (v) => (v < 0 ? '-' : '') + money(Math.abs(v));

function docSettlement() {
  const rows = settleVisible();
  const adjTotal = rows.reduce((a, r) => a + r.v, 0);
  const total = SETTLE.orders + SETTLE.refunds + adjTotal;
  return h`
  <div class="sheet"><div class="stmt">
    <div class="stmt-top">
      <div>
        <div class="stmt-title">Settlement Statement</div>
        <div class="stmt-no">Statement No. ${SETTLE.no}</div>
      </div>
      <div>
        <div class="stmt-brand">Shopcord</div>
        <div class="stmt-gen">Generated on ${clock().today}</div>
      </div>
    </div>

    <div class="stmt-card">
      <div class="stmt-cols">
        <div>
          <div class="stmt-k">Vendor</div>
          <div class="stmt-name">Bella Boutique LLC</div>
          <div class="stmt-line">1407 Broadway, Suite 902<br>New York, NY 10018<br>United States</div>
          <div class="stmt-gap stmt-line">billing@bellaboutique.com</div>
          <div class="stmt-line">+1 (212) 555 - 0148</div>
        </div>
        <div>
          <div class="stmt-k">Settlement Date</div>
          <div class="stmt-date">${clock().today}</div>
        </div>

      <div class="stmt-sum-k">Summary</div>
      <div class="stmt-row"><span>Total Orders</span><span>${money(SETTLE.orders)}</span></div>
      <div class="stmt-row"><span>Total Refunds</span><span>${money(SETTLE.refunds)}</span></div>
      <div class="stmt-row"><span>Total Adjustments</span><span>${signed(adjTotal)}</span></div>
      ${rows.map(r => h`
        <div class="stmt-sub"><span>${r.k}</span><span>${signed(r.v)}</span></div>`).join('')}
      <div class="stmt-total"><span>Total</span><span>${money(total)}</span></div>

}

/* The panel view: the statement, then what the two cutovers take out of it. */
function docSettlementPanel() {
  const gone = SETTLE.adj.filter(a => settleRel() > a.until);
  return h`
  ${docSettlement()}
  <div class="ref-card" style="margin-top:28px">
    <div class="ref-warn">
      <div><b>Settlement owns this document — we change what is on it.</b> Nothing here is a redesign; the layout is
        the statement settlement already sends. What Phase 2.5 does is remove adjustment lines from it, one cutover
        at a time, and getting that wrong in either direction is the incident §12 was written to prevent.</div>
    </div>

          <tbody>

            <tr><td>${a.k}</td><td>${a.why}</td><td>${a.until === 0 ? '§12 · PB 9.5.0' : a.until === 1 ? '§12 · 2nd §6' : '—'}</td></tr>`).join('')}

        <div class="ref-src">Showing release ${settleRel()} — ${gone.length ? gone.map(g => g.k).join(', ') + ' already removed' : 'nothing removed yet'}. Switch releases at the top of the panel to see the other state.</div>
      </div>

    <div class="ref-sec">
      <div class="ref-k">Why the SMS line has to survive release 1</div>
      <div class="ref-v">§12 is unusually blunt about it — the SMS adjustment type is <b>"과도기 동안 SMS 요금의 유일한
        수금 수단"</b>, and blocking it by mistake is an incident where SMS fees simply cannot be collected. The
        requirement it produces is a build requirement, not a screen one: <b>the two adjustment types must be blockable
        individually</b>.
        <div class="ref-src">§12 · PB 9.5.0</div>
      </div>
    </div>

    <div class="ref-sec">
      <div class="ref-k">This is also where §12's mandatory sentence is proved</div>
      <div class="ref-v">The launch communication has to say <b>"SMS 요금은 당분간 기존처럼 정산에서 차감"</b>. This
        statement is where a vendor sees whether that is true — subscription gone from the payout, SMS still there.
        The same sentence is in both migration emails as <code>SMS_KEEPS</code>.
        <div class="ref-src">§12 · PB 7.9 · PB 7.10</div>
      </div>
    </div>

    <div class="ref-sec">
      <div class="ref-k">The reference's own figures do not reconcile</div>
      <div class="ref-v">In Figma 326:823258 the four adjustments sum to <b>63.40</b> under a stated
        <b>53.40</b>, and <b>1,780.00 − 53.40 = 1,726.60</b>, not the <b>1,726.00</b> printed. Ours are computed from
        the lines, so the same drift cannot happen — but the reference is worth checking with settlement in case the
        display, not the demo data, is what is wrong.</div>
    </div>
  </div>`;
}

/* ── Payment receipt ───────────────────────────────────────────────────────
   Balance renders the real document, so this is not a visual template to hand them. It
   is the FIELD LIST arranged the way a receipt arranges fields, because that is the form
   in which "these must be present" is reviewable — a list of field names hides whether
   the document would make sense. */

/* Billing periods run from the charge, not the calendar — §6.3 anchors on the signup
   date, so "October" is never the right label. Charge day → the day before the next. */
function periodFrom(dateStr) {
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const m = /^([A-Za-z]{3}) (\d{1,2}), (\d{4})$/.exec(dateStr || '');
  if (!m) return '—';
  const mi = M.indexOf(m[1]), d = Number(m[2]), y = Number(m[3]);
  /* The period ends the day BEFORE the next charge. For a charge on the 1st that day is
     the last of the SAME month — it does not roll into the next one. The old version
     always advanced the month and so produced "Oct 1 — Nov 31" the moment the anniversary
     moved to the 1st; a date that does not exist, on a document a buyer keeps. */
  const dim = [31,28,31,30,31,30,31,31,30,31,30,31];
  const em = d > 1 ? (mi + 1) % 12 : mi;
  const ey = (d > 1 && em === 0) ? y + 1 : y;
  const ed = d > 1 ? d - 1 : dim[mi];
  return `${m[1]} ${d}, ${y} — ${M[em]} ${ed}, ${ey}`;
}

   §6.4-6 — 회수 인보이스에는 세금 라인 없음: 회수금이라 매출이 아니다. There is no tax row, and

    <table class="rcpt-tbl">

  </div>`;
}

/* Guarded on the DATE, not on the object: an incomplete dataset produced an object of

const rcptRow = () => (S.receiptRow && S.receiptRow.date) ? S.receiptRow
                    : { date: clock().first, amt: PLAN.price, type: 'Subscription' };

/* What the VENDOR gets: the document and nothing else. The email previews wear a reviewer
   header — spec id, recipient, channel chips, notes underneath — because an email never
   appears in the product and only a reviewer looks at one. A receipt is the opposite: the
   vendor opens it themselves, so the same chrome would be review furniture on a screen
   they use. */
function modalReceipt() {
  return h`

    <div class="rcpt-send">${S.receiptSent
      ? h`<button class="btn btn-outline" disabled>${ICO.check}Sent to email</button>`

}

/* The panel view keeps the spec: same document, then the notes that do not belong on it. */
function docReceipt() {

/* SMS Marketing Overview — Figma 823:352793, with ONE deliberate replacement.
   The live page carries a green strip: "Free Campaign Messages · You've got 3,000 free
   messages to send" + a thin bar + "0 / 3000 used". That strip is the POSTPAID world and
   two things break under prepaid:
     · 진아 §7 replaces 3,000 free MESSAGES with 3,000 free CREDITS, so the noun is wrong;
     · the bar's denominator stops existing. "0 / 3000" worked only because the free grant
       is a fixed allowance. Once a vendor buys a pack the pool has no cap, so there is
       nothing for a bar to measure against. That is why a gauge does not belong here
       (Grace, 2026-09-10) - not a style preference, the denominator is gone.
   So the strip becomes the credits section, in the page's own grammar: a section card whose
   head carries the title and one control (where Performance puts its date picker), and
   inside it the same stat cells Performance uses. The free grant, when any is left, becomes
   a line of text - a fact, not a meter. */
/* Figma 829:48454 rewritten on Available to use / Current balance / Planned to use
   (Grace, 2026-09-10). What the postpaid card said and what replaces it:

     This month's usage          -> Message credits        (a balance has no period)
     May 1 - May 22 (In Progress) -> the rate line          (the postpaid card carried its
                                                             unit price inline on the
                                                             Billable row; prepaid needs the
                                                             same fact and has nowhere else)
     Total Messages     750      -> Current balance  1,880
     Complimentary     -300      -> Planned to use    -800
     Billable (x $0.03) 450      -> (gone)
     [Estimated amount $13.50]   -> [Available to use 1,080]
     Amount will be finalized... -> Ready to send right now.
     View Billing History        -> View SMS credit usage history

   THE MONEY LEAVES THE CARD. Postpaid ends in an amount you will owe; prepaid was already
   paid at purchase, so there is no month-end figure to estimate and no "finalized" to
   promise. The card stops being a forecast and becomes a position.
   The MINUS on Planned to use is this card's own convention (Figma writes Complimentary as
   -300) and it is also the ledger's (credit history renders "- 1,860"). It is a SIGNED
   FIGURE in a column, not the free-floating operator Grace rejected on 9/9 - that one sat
   between two numbers and had to be read as an instruction. */
/* The chip is the same object on Campaign, Chat and the dashboard (Grace, 2026-09-16), so it
   is built once. It always counts FREE credits too — the figure is Available, and free credits
   are spendable, so a vendor holding only the grant sees a real balance rather than a zero.
   The three colours read off lowThreshold(), the same function the balance card's pill uses. */
function creditChip() {
  const c = sc().credits || { sms: 0, smsRes: 0, mms: 0, mmsRes: 0 };
  const u = unifiedTotals(c);
  const available = u.remaining - u.reserved;
  return h`
    <div class="ov-bar-right">
      <button class="credit-chip-btn ${S.creditPop ? 'is-on' : ''} ${available === 0 ? 'is-empty' : available <= lowThreshold() ? 'is-low' : ''}" data-act="creditPop">Available: <strong>${n(available)}</strong> Credit ${ICO.chev}</button>
      ${S.creditPop ? h`<div class="credit-pop">${creditsCard()}</div>` : ''}
    </div>`;
}

function creditsCard() {
  const c = sc().credits || { sms: 0, smsRes: 0, mms: 0, mmsRes: 0 };
  const u = unifiedTotals(c);
  const available = u.remaining - u.reserved;
  /* Clamped to what is actually spendable, the same way the balance card does it — a free
     grant larger than the available balance would otherwise print a figure the vendor
     cannot use. */
  const free = Math.min(c.free || 0, available);
  const freeExpiry = (free && c.freeIssued) ? plusDays(c.freeIssued, FREE_CREDIT_DAYS) : null;
  return h`
  <div class="uc-wrap"><div class="usage-card">
    <div class="uc-title">Message credits</div>
    <!-- 829:791924 carries NO subtitle and NO rule under the head - both were mine, carried

          <select class="select"><option>All Statuses</option><option>New</option><option>In Progress</option><option>Closed</option></select>
