/* ============ SMS Marketing Overview (Figma 823:352793) ============
   Jinah's live campaign screen. Measured off that node, and its scale lands on our tokens
   without conversion: section title 18/24 (.section-title), stat value 30/36 (.balance-big),
   stat label 12/16, sub-box label 14/20. The one thing this page does that card(01) does
   NOT is put a DIVIDER inside each sub-box - so a rule here is the page's own grammar. */
/* ============ Credits card (Figma 829:48454) ============
   The POSTPAID usage card, recast for prepaid. Tokens are that node's own:
   base/popover #fff · base/border #f2ede7 · rounded-md 8 · min-w-xs 320 · spacing/4 16
   · shadow/sm (two drops) · title text-base/semibold 16/24/600 on popover-foreground #0a0a0a
   · rows text-sm 14/20 (label base/secondary, value base/primary-text)
   · result box base/muted + rounded-md 8 + spacing/2-5 10 · caption text-xs 12/16
   · link base/primary #e11d74, text-sm/medium.
   NOTE the structure: ONE rule, under the head - and the result is emphasised by the GREY
   BOX, not by a rule above it. That is a better device than the one I reached for in I-17:
   no operator, and nothing has to be read as "equals". */
.usage-card { min-width: 320px; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px;
              box-shadow: 0 1px 3px 0 #0000001a, 0 1px 2px -1px #0000001a; }
/* #0a0a0a is Figma's popover-foreground - darker than our --fg #1f1f1f, and it is what this
   component specifies, so it is written literally rather than borrowed from a token. */
.uc-title { font-size: 16px; line-height: 24px; font-weight: 600; color: #0a0a0a; }
.uc-sub { margin-top: 2px; font-size: 14px; line-height: 20px; color: var(--fg-secondary); }
.uc-rows { margin-top: 16px; }
.uc-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 6px 0; font-size: 14px; line-height: 20px; }
.uc-row .uc-k { color: var(--fg-secondary); }
.uc-row .uc-v { color: var(--fg); font-variant-numeric: tabular-nums; }
.uc-box { margin-top: 16px; background: var(--muted); border-radius: 8px; padding: 10px 12px; }
/* Free and Purchased are a BREAKDOWN of Current balance, and at the same left edge with the
   same weight they read as three peers in a list instead (Grace, 2026-09-16: 왼쪽정렬이 같으니까
   헷갈려). Indent plus one step down in size and colour is enough — no rule, no background,
   no new type voice: the figure column stays where it is, so the eye still reads one number
   stack, and only the labels step in. */
.uc-row.is-part { padding: 3px 0; font-size: 13px; }
.uc-row.is-part .uc-k { padding-left: 14px; }
.uc-row.is-part .uc-v { color: var(--fg-secondary); }
.uc-sub { margin-top: -1px; padding-bottom: 6px; padding-left: 14px; font-size: 12px; color: var(--fg-muted); }
.uc-box-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; font-size: 16px; line-height: 24px; }
.uc-box-row .uc-k { color: var(--fg); font-weight: 500; }
.uc-box-row .uc-v { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.uc-note { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--fg-secondary); }
.uc-link { display: block; margin-top: 16px; text-align: right; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--primary); text-decoration: underline; }
.uc-wrap { display: flex; justify-content: center; padding: 32px 0; }
/* The free-grant strip on the dashboard. A bar is allowed HERE and nowhere else on the
   balance: the grant is a fixed allowance issued once and never topped up, so it has a real
   denominator. The balance as a whole does not — buy a pack and the pool has no cap — which
   is why the gauge stayed out of the balance card (Grace, 2026-09-10). Same distinction,
   opposite answer, for a reason rather than a preference. */
.free-strip { display: flex; align-items: center; gap: 24px; margin: 14px 0 4px; padding: 12px 16px; border-radius: 10px; background: var(--badge-green); }
.free-strip-main { flex: 1; min-width: 0; }
.free-strip-title { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--badge-green-fg); }
.free-strip-title svg { width: 13px; height: 13px; }
.free-strip-desc { margin-top: 2px; font-size: 13px; color: var(--fg-secondary); }
.free-strip-meter { flex-shrink: 0; width: 280px; }
.free-strip-track { height: 6px; border-radius: 3px; background: #fff; overflow: hidden; }
.free-strip-fill { height: 100%; border-radius: 3px; background: var(--badge-green-fg); }
.free-strip-used { margin-top: 5px; font-size: 12px; color: var(--fg-secondary); text-align: right; font-variant-numeric: tabular-nums; }
/* Credit chip in the top bar (Figma 829:47631). THE CORRECTION: I had built the balance as a
   full `Credits` section in the body, replacing the postpaid green strip. 829:47631 is the
   PREPAID version of this page and it does neither - the strip is simply gone and the balance
   lives as a compact chip at the right of the tab bar, which opens the popover card
   (829:791924). That is a better answer than mine: on a campaigns page the balance is a
   reference, not a subject, and a full-width section gave it the weight of one.
   ⚠ Sizes here are measured off the screenshot (the node stopped resolving mid-session), so
   the chip's exact paddings are approximations of the design, not read variables. */
/* ============ Campaign composer credit meter (Figma 864:370336 / 864:370779) ============
   PM 요구 4가지: recipients 수와 SMS/MMS 여부로 실시간 계산 · 기본 1크레딧 · recipient 수를
   고른 뒤부터 표시 · MMS 2크레딧으로 바뀌면 색상/숫자를 바꿔 주의를 끌 것 · 잔액 부족 시
   모달로 충전.
   The ATTENTION is on the CHANGE, not on MMS as a permanent alarm: the rate chip turns amber
   only while the message is an MMS, because that is the moment the cost per recipient doubles
   and the vendor's arithmetic stops being the one they had in their head. Steady states stay
   quiet - an alarm that is always on is not an alarm. */
.msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--fg-secondary); }
.msg-meta .mm-sep { color: var(--border-muted); }
.msg-meta .mm-seg { font-variant-numeric: tabular-nums; }
.msg-meta .mm-ico { display: inline-flex; width: 14px; height: 14px; color: var(--fg-muted); }
.msg-meta .mm-ico svg { width: 14px; height: 14px; }
.rate-flag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .02em; background: var(--badge-gray); color: var(--badge-gray-fg); }
.rate-flag.is-mms { background: var(--badge-amber); color: var(--badge-amber-fg); }
.ov-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; }
.credit-chip-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); font: inherit; font-size: 12px; line-height: 16px; color: var(--fg-secondary); cursor: pointer; white-space: nowrap; }
.credit-chip-btn:hover { border-color: var(--fg-muted); }
/* THREE STATES, ONE VOCABULARY (Grace, 2026-09-16). The balance card already says these
   with an amber "Running low" pill and a red "Out of credits" pill, so the chip borrows the
   SAME tokens rather than inventing a scale — one state may not wear two colours across two
   surfaces. The accent pink is deliberately not used: it is the screen's single saturated
   colour and belongs to the active tab and primary actions, never to a status. */
.credit-chip-btn.is-low   { background: var(--badge-amber); border-color: #f0dcc0; }
.credit-chip-btn.is-low   strong, .credit-chip-btn.is-low   { color: var(--badge-amber-fg); }
.credit-chip-btn.is-empty { background: var(--badge-red);   border-color: #f2d2d2; }
.credit-chip-btn.is-empty strong, .credit-chip-btn.is-empty { color: var(--badge-red-fg); }
.credit-chip-btn.is-on { border: 2px solid var(--accent); padding: 0 9px; }
.credit-chip-btn strong { color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
.credit-chip-btn svg { width: 14px; height: 14px; }
.credit-pop { position: absolute; top: 44px; right: 0; z-index: 40; }
.ov-bar-right { position: relative; display: flex; align-items: center; }
.chat-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.ov-sub { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-secondary); }
.ov-tabs { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
.ov-tab { height: 30px; padding: 0 24px; border: none; border-radius: 8px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: var(--fg-secondary); cursor: pointer; }
.ov-tab.is-on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
/* Three groups across the section, each its own bordered box with a label, a rule and its
   stat cells. Widths are 1fr so the row keeps the Figma's equal thirds at any width. */
.ov-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 16px; }
.ov-box { border: 1px solid var(--border); border-radius: 12px; padding: 17px; }
.ov-box-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; line-height: 20px; font-weight: 600; }
.ov-box-ico { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--fg-muted); flex-shrink: 0; }
.ov-box-ico svg { width: 16px; height: 16px; }
.ov-box-rule { height: 1px; background: var(--border-elements); margin: 24px 0; }
.ov-cells { display: grid; gap: 24px; }
.ov-cells.n2 { grid-template-columns: 1fr 1fr; }
.ov-cells.n3 { grid-template-columns: 1fr 1fr 1fr; }
.ov-val { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -1.12px; font-variant-numeric: tabular-nums; }
.ov-lab { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--fg-secondary); }
/* The credits box spans the whole section: it is ONE group of three figures, not three
   groups of two, so splitting it into thirds would invent a grouping the numbers don't have. */
.ov-row.is-single { grid-template-columns: 1fr; }
.bal-stmt { margin-top: 16px; }
.bal-stmt-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 7px 0; font-size: 15px; }
.bal-stmt-row .s-lab { color: var(--fg-secondary); }
.bal-stmt-row .s-val { font-weight: 600; font-variant-numeric: tabular-nums; }
/* The one rule in the card, and it is load-bearing: it is what turns three figures into
   an arithmetic. The result keeps the card's own 30px hero size so the number a vendor
   acts on is still the largest thing here. */
.bal-stmt-row.is-result { margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--border-elements); align-items: baseline; }
.bal-stmt-row.is-result .s-lab { color: var(--fg); font-weight: 600; }
.bal-stmt-row.is-result .s-val { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -1.12px; }
.bal-stmt + .bal-note { margin-top: 8px; }
.bal-trio .t-cell { display: flex; flex-direction: column; gap: 6px; min-width: 96px; }
.bal-trio .t-lab { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--fg-secondary); white-space: nowrap; }
.bal-trio .t-val { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -1.12px; font-variant-numeric: tabular-nums; }
/* The result keeps the same figure size — only its LABEL comes up to full contrast, which is
   enough to say "this is the one you act on" without breaking the equal rank. */
/* Right-alignment follows POSITION, not role: whichever cell is last hugs the card's
   right edge so its digits land on the same 995px line as the Buy credits button above.
   Keyed to :last-child rather than to .is-result because a rule keyed to a role breaks
   the moment the role moves in the row; emphasis follows the role instead. */
.bal-trio .t-cell:last-child { align-items: flex-end; text-align: right; }
.bal-trio .is-result .t-lab { color: var(--fg); font-weight: 600; }
.bal-hero { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bal-hero .balance-unit { margin-top: 0; }
/* A deadline inside a frozen balance. Amber TEXT, no box and no icon: this is a fact about
   the balance above it, and the project gives boxes to actions (affordance rule). The only
   place amber appears on this card otherwise is the Running low pill, which is the same
   register - something with a clock on it. */
.bal-note.is-deadline { color: var(--badge-amber-fg); }
.bal-note.is-deadline strong { color: var(--badge-amber-fg); }
.bal-note + .bal-note { margin-top: 6px; }
.bal-note { margin-top: 10px; font-size: 12px; line-height: 17px; color: var(--fg-secondary); }
.bal-note strong { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.hold-block + .bal-note { margin-top: 6px; }
/* The trigger is a phrase in the sentence, in the sentence's own colour: a dotted underline
   is the only cue, and the accent pink stays off a balance figure. The card below is the
   credits popover's container (.usage-card) with the same row grammar. */
.hold-card { position: relative; display: inline-block; }
.hold-trig { cursor: pointer; color: var(--fg); font-weight: 500; text-decoration: underline dotted; text-decoration-color: var(--fg-muted); text-underline-offset: 3px; }
.hold-trig:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 3px; }
.hold-pop { display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 40; white-space: normal; box-shadow: 0 10px 28px rgba(0,0,0,.12); }
/* a bridge across the 8px gap, so moving onto the card does not drop the hover */
.hold-pop::before { content: ''; position: absolute; top: -9px; left: 0; right: 0; height: 9px; }
.hold-card:hover .hold-pop, .hold-card:focus-within .hold-pop, .hold-card.is-open .hold-pop { display: block; }

.u-top { display: flex; align-items: center; gap: 28px; }
/* One line — the number and what it counts are a single fact (Grace, 2026-08-24). */
.u-hero { flex-shrink: 0; display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.u-hero .balance-unit { display: inline-flex; align-items: center; gap: 8px; margin-top: 0; }
.u-meter { flex: 1; min-width: 0; }
.u-meter .meter { margin-top: 0; }
.u-explain { margin-top: 12px; font-size: 12px; line-height: 17px; color: var(--fg-secondary); }
.u-explain strong { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
/* pack purchase expands inline under the balance grid — the current balance
   stays on screen, which is the only thing that makes a pack size judgeable */
/* NESTED INSIDE the balance card (Grace, 2026-09-09: 매니지 크레딧 박스 안에서 SMS 1 Credit
   / segment 아래로 Buy Message credits 박스가 있어야할거같단 뜻이었어). It used to be a
   sibling .section-card below the balance, which read as a second unrelated box for what is
   one step of the balance card's own job - and left the card it belongs to looking finished
   above it. So it stops borrowing .section-card and carries its own box: radius 12 inside
   the card's 16, padding 20 inside its 24, and the same #404040 accent border this system
   uses for an active container. */
.inline-buy { margin-top: 18px; border: 1px solid var(--accent); border-radius: 12px; background: var(--card); padding: 20px; animation: inlineIn .18s ease-out; }
/* The nested head needs no bottom gap of its own - the rate banner below brings its own. */
.inline-buy > .section-head { margin-bottom: 0; }
.tbd-note { margin-top: 12px; font-size: 11px; color: var(--fg-muted); }

.summary-box { margin-top: 18px; border: 1px solid var(--border-elements); border-radius: 10px; overflow: hidden; }
.summary-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; font-size: 13px; border-bottom: 1px solid var(--border-elements); }
.summary-row:last-child { border-bottom: none; }
.summary-row.total { background: var(--muted); font-weight: 700; font-size: 14px; }
/* A receipt block, not a full-width table. At the panel's width the label sat ~950px
   from its value and the eye had to travel for every line; capped and pulled right it
   sits directly above the Pay button, which is where the same numbers are going. */
.buy-summary { display: flex; flex-direction: column; margin-top: 0; width: 100%; padding: 16px 18px 18px; border: 1px solid var(--border-elements); border-radius: 12px; background: var(--muted); }
.buy-summary .pay-with-line { margin-top: 12px; }
.buy-summary .pay-with { margin-top: 12px; }
.bs-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 9px 2px; font-size: 13px; }
.bs-row .lbl { color: var(--fg-secondary); }
.bs-row.is-total { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border-elements); font-size: 15px; font-weight: 700; }
.bs-change { display: inline-flex; align-items: baseline; gap: 9px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--fg-secondary); }
.bs-change strong { font-weight: 700; color: var(--fg); }
.bs-arrow { color: var(--fg-muted); }
.summary-row .lbl { color: var(--fg-secondary); }
.pay-with { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border: 1px solid var(--border-elements); border-radius: 10px; margin-top: 14px; }
/* the read-only variant: a line, not a row you could press */
.pay-with-line { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; color: var(--fg-secondary); }
.pay-with-line .brand-mark { width: 28px; height: 19px; font-size: 7px; }
.pay-with-line strong { font-weight: 600; color: var(--fg); }
.pay-with.is-empty { border-color: var(--badge-amber-fg); background: var(--badge-amber); }
.pay-with-ico { flex-shrink: 0; width: 20px; height: 20px; color: var(--badge-amber-fg); display: flex; align-items: center; justify-content: center; }
.pay-with-ico svg { width: 18px; height: 18px; }

/* auto-recharge form */
/* THE RULE IS A SENTENCE, so the sentence is the layout. Three tries got here:
   label/value rows put each control ~480px from its label; capping the column left
   the card's right half empty; three equal columns made the two settings and the card
   look like peers of equal weight when only two of them are decisions — Grace: the
   information you have to read to decide doesn't come through.
   Inline, the causal chain is the visible structure and the only boxes on the line are
   the two things the vendor chooses, so the eye lands on them. Twilio words its
   trigger the same way ("when your balance falls below X, recharge with Y"), and
   Mailchimp's top-off choice is a first-person sentence too.
   The card is NOT a peer here: it cannot be edited in this panel (§4.1), so it sits
   under the sentence as the supporting fact it is. In the SUMMARY all three are equal
   because there all three are read-only. */
/* Naver, Kakao and Ridi all split the rule the same way: the TRIGGER sits inside a
   sentence with a dropdown in it ("남은 쿠키가 [30개] 보다 적으면"), and the AMOUNT is a
   radio LIST underneath, one row per option, each row carrying what you compare on —
   Ridi shows 적립률, Kakao shows 추가 캐시 — both are real incentives those products run.
   WE HAVE NO SUCH COLUMN and must not invent one: a 'Save 14%' badge rode along in the
   demo data until 2026-08-24, but volume discounts are undecided (D-11). Count and
   price are the whole comparison until Product says otherwise.
   A select hid the other two packs behind a click, which is exactly the information
   the vendor needs to decide. Selection is 2px --accent, the same treatment .pack-opt
   uses in the Buy flow — the one saturated pink on this screen stays on Save. */
/* A fact, not a field — same column as the controls, no box around it (§4.1: the card
   is chosen in Payment methods, so an input here would promise an edit that isn't). */
/* A row whose label carries a second line must not centre its value against the pair:
   the value belongs on the LABEL's line. Centred, it sat 12px low and read as if it
   answered the helper text instead of the label. */
/* The unit sits INSIDE the field. Outside it, the box stopped short of the select
   in the row beneath and the two controls read as different sizes; `.field` gives
   both the same width so the panel's right edge is one line. Content left, unit or
   caret right — the number row then mirrors the select row. */
.row-field { width: 216px; flex: 0 0 216px; box-sizing: border-box; }
.inline-input {
  display: flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 12px;
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
}
.inline-input:hover { border-color: var(--fg-muted); }
.inline-input:focus-within { border-color: #737373; }
.inline-input .input {
  flex: 1; min-width: 0; width: auto; height: auto; padding: 0;

}

/* ============ Toast ============
   A completed event gets a transient acknowledgement, not a banner. Banners are
   for conditions that stay true; "restored" is already over by the time it shows,
   and the durable proof is the status badge flipping to Active. */
/* Toast — the design system's own component, Figma node 228:232624. Replaces a
   bottom-left white card with a green left rule, which was mine. Top right (Grace),
   380px, 14/16 padding, radius 10, shadow 0 4px 16px rgba(0,0,0,.08), tinted surface,
   28px icon circle, title 14/20 semibold over sub-text 12/16.
   THE COMPONENT HAS NO CLOSE BUTTON — it auto-dismisses (7s), so ours lost its X too.
   It also has an optional action link; recharge and on/off toasts have nowhere to send
   the vendor, so they run with showButton=false — the plain success message (Grace).
   Four variants exist in the component; we use success. */
.toast-wrap { position: fixed; right: 20px; top: 20px; z-index: 250; }
/* The prototype panel is fixed over the right edge, so in the mockup the toast steps
   inside it. The product has no panel — right: 20px is the real value. */
@media (min-width: 1240px) { body.proto-open .toast-wrap { right: 392px; } }
.toast { display: flex; align-items: center; gap: 12px; width: 380px; padding: 14px 16px; border-radius: 10px; background: var(--sonner-bg-success); box-shadow: 0 4px 16px 0 rgba(0,0,0,.08); overflow: hidden; animation: toastIn .22s cubic-bezier(.22,1,.36,1); }
@keyframes toastIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
.toast.is-info    { background: var(--sonner-bg-info); }
.toast.is-warning { background: var(--sonner-bg-warning); }
.toast.is-error   { background: var(--sonner-bg-error); }
.toast-ico { flex-shrink: 0; width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--badge-green); color: #4f8f7d; }
.toast.is-info .toast-ico    { background: var(--badge-blue); color: var(--badge-blue-fg); }
.toast.is-warning .toast-ico { background: #fdf5e6; color: #c0860e; }
.toast.is-error .toast-ico   { background: #fce8e6; color: #c0392b; }
.toast-ico svg { width: 14px; height: 14px; }
.toast-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.toast-title { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--fg); }
.toast-msg { font-size: 12px; line-height: 16px; color: #262626; }

/* ============ Prototype control panel ============ */
.an-fab { position: fixed; right: 20px; bottom: 78px; z-index: 300; width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: #fff; border: none; cursor: pointer; box-shadow: var(--shadow-lg); display: inline-flex; align-items: center; justify-content: center; }
.an-fab svg { width: 20px; height: 20px; }
.an-fab.is-on { background: #1f1f1f; }

/* Annotation layer. Outlines and pins are drawn OVER the real screen — never in the
   product markup — so the mockup stays the product and this stays review furniture. */
.an-mark { position: absolute; z-index: 260; pointer-events: none; border: 1.5px dashed var(--primary); border-radius: 8px; }
.an-mark.is-group { border-radius: 12px; }
.an-pin { position: absolute; z-index: 261; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; line-height: 22px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.25); pointer-events: auto; cursor: pointer; }
.an-pin.is-group { background: var(--primary); letter-spacing: .02em; }
.an-pin.is-sel { outline: 2px solid #1f1f1f; outline-offset: 1px; }
/* SPOTLIGHT — clicking a pin dims the page and leaves that element lit.
   One huge spread shadow on the selected mark does the whole dim: the hole is the mark's
   own box, so it follows the element on every re-draw without a second element to keep in
   sync. Pins sit above the dim so the other annotations stay readable and clickable —
   dimming the page should not also trap you on the pin you happened to press. */
.an-mark.is-sel { box-shadow: 0 0 0 9999px rgba(31,31,31,.45); border-color: #fff; border-style: solid; }
.an-pin { z-index: 262; }
.an-pin:not(.is-sel) { opacity: .55; }
.an-pin.is-sel { opacity: 1; }

.an-panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 320; width: 420px; max-width: 92vw; background: var(--card); border-left: 1px solid var(--border-muted); box-shadow: -8px 0 24px rgba(0,0,0,.06); display: flex; flex-direction: column; }
.an-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid var(--border-elements); }
.an-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
.an-count { font-size: 12.5px; color: var(--fg-muted); }
.an-x { margin-left: auto; background: none; border: 0; cursor: pointer; color: var(--fg-muted); display: inline-flex; }
.an-x svg { width: 18px; height: 18px; }
.an-search { padding: 12px 20px; border-bottom: 1px solid var(--border-elements); display: flex; gap: 8px; align-items: center; }
.an-scope { display: inline-flex; border: 1px solid var(--border-muted); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.an-scope button { border: 0; background: var(--card); color: var(--fg-secondary); font: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 0 9px; height: 38px; cursor: pointer; white-space: nowrap; }
.an-scope button.is-on { background: #1f1f1f; color: #fff; }
.an-search input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--border-muted); border-radius: 8px; font: inherit; font-size: 13px; background: var(--bg); color: var(--fg); }
.an-list { flex: 1; overflow-y: auto; padding: 14px 16px 28px; }
.an-card { padding: 14px 16px; border-radius: 12px; background: var(--muted); margin-bottom: 10px; scroll-margin-top: 12px; }
.an-card.is-sel { outline: 2px solid var(--primary); background: var(--primary-soft-60); }
/* An item whose element is not on screen in the current state stays listed — it is still
   part of the spec — but dims, so the bright cards are the ones the pins point at. */
/* A detail card is indented under its section's card — the relation is already in the
   data, and showing it costs no words. A rule rather than a gap, so the group it belongs
   to stays readable once the list is long. */
.an-when { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 999px; background: var(--border); color: var(--fg-muted); font-size: 10.5px; font-weight: 700; letter-spacing: .02em; vertical-align: 1px; }
.an-nostate { font-size: 12.5px; color: var(--fg-muted); font-style: italic; }
.an-card.is-child { margin-left: 14px; border-left: 2px solid var(--border); border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.an-card.is-off { opacity: .45; }
.an-card.is-off .an-badge { background: var(--fg-muted); }
.an-off-note { margin-left: 8px; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--fg-muted); text-transform: uppercase; }
.an-card-h { display: flex; align-items: center; gap: 9px; }
.an-badge { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; line-height: 24px; text-align: center; }
.an-card-t { font-size: 14px; font-weight: 700; }
.an-tags { margin-left: auto; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--fg-muted); }
.an-copy { border: 1px solid var(--border-muted); background: var(--card); color: var(--fg-secondary); font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; padding: 3px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.an-copy:hover { border-color: var(--fg-muted); color: var(--fg); }
.an-copy.is-done { border-color: var(--badge-green-fg); color: var(--badge-green-fg); }
.an-head .an-copy { margin-left: auto; }
.an-card-h .an-copy { margin-left: 8px; }
.an-ul { margin: 10px 0 0; padding: 0; list-style: none; }
.an-ul li { position: relative; padding-left: 13px; margin: 6px 0; font-size: 13px; line-height: 20px; color: var(--fg-secondary); }
.an-ul li::before { content: "·"; position: absolute; left: 2px; color: var(--fg-muted); }
.an-ul li b { color: var(--fg); font-weight: 600; }
.an-ul li code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; background: var(--card); border: 1px solid var(--border-elements); border-radius: 4px; padding: 1px 4px; }
.an-sub { margin-top: 12px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--primary); }
.an-sub.doc { color: var(--fg-muted); }
.an-none { padding: 20px; text-align: center; color: var(--fg-muted); font-size: 13px; }
body.an-open .proto-fab, body.an-open .proto-panel { display: none; }

.proto-fab { position: fixed; right: 20px; bottom: 20px; z-index: 300; width: 48px; height: 48px; border-radius: 50%; background: #1f1f1f; color: #fff; border: none; cursor: pointer; box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: center; }
.proto-fab svg { width: 20px; height: 20px; }
.proto-panel { position: fixed; right: 20px; bottom: 80px; z-index: 300; width: 320px; max-height: calc(100vh - 120px); overflow-y: auto; background: var(--card); border: 1px solid var(--border-muted); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 16px; }
.proto-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.proto-sub { font-size: 11px; color: var(--fg-muted); margin-bottom: 14px; line-height: 15px; }
.proto-group { margin-bottom: 14px; }
.proto-group-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 6px; }
.proto-btn { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 7px; border: 1px solid transparent; background: transparent; font-size: 12.5px; color: var(--fg-secondary); cursor: pointer; margin-bottom: 2px; line-height: 17px; }
.proto-btn:hover { background: var(--muted); color: var(--fg); }
.proto-btn.is-active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.proto-btn .hint { display: block; font-size: 10.5px; color: var(--fg-muted); font-weight: 400; margin-top: 1px; }

.model-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.model-btn { padding: 8px 6px; border: 1px solid var(--border-muted); border-radius: 7px; background: var(--card); font-family: inherit; font-size: 12px; font-weight: 600; color: var(--fg-secondary); cursor: pointer; line-height: 15px; }
.model-btn span { display: block; font-size: 10px; font-weight: 400; color: var(--fg-muted); margin-top: 2px; }
.model-btn.is-on { border: 2px solid var(--accent); color: var(--fg); padding: 7px 5px; }
.proto-foot { border-top: 1px solid var(--border-elements); padding-top: 10px; font-size: 10.5px; color: var(--fg-muted); line-height: 15px; }

.note-strip { display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px; border-radius: 8px; background: var(--badge-blue); color: #3c5c8a; font-size: 12px; line-height: 17px; }
.note-strip svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }

@media (max-width: 1180px) {
  .kv-grid { grid-template-columns: 1fr 1fr; }
  .balance-grid, .compose-grid { grid-template-columns: 1fr; }
}
/* ── Orders — Order List (Figma 3121:53729) · Order detail (3121:49757) ──────────────────
   Drawn with this file's own components; only the PO controls and row selection are new.
   Runs at Figma's 1526 measure — an order table with eight columns does not fit 1024. */
.page-head.ord { max-width: calc(1526px + var(--content-gutter) * 2); }
.body.ord { max-width: calc(1526px + var(--content-gutter) * 2); }
.body.ord > * { max-width: 1526px; }
.ord-titlebar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.ord-title-l { display: flex; align-items: center; gap: 10px; }
.ord-count { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--primary); color: #fff; font-size: 10px; font-weight: 700; }
.ord-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 372px)); gap: 13.5px; }
.ord-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.ord-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.ord-card-head { display: flex; align-items: center; gap: 16px; }
.ord-card-num { font-size: 30px; line-height: 36px; font-weight: 700; min-width: 20px; }
.ord-card-num.red, .ord-card-name.red { color: var(--destructive); }
.ord-card-step { display: block; font-size: 10px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted); }
.ord-card-name { display: block; font-size: 12px; line-height: 16px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.ord-card-go { width: 36px; height: 36px; flex-shrink: 0; border: 1px solid var(--border-elements); border-radius: 8px; background: var(--card); display: inline-flex; align-items: center; justify-content: center; color: var(--fg-secondary); cursor: pointer; }
.ord-card-go svg { width: 14px; height: 14px; }
.ord-card-go.is-hot { background: var(--muted); border-color: transparent; }
.ord-card-line { padding-top: 16px; border-top: 1px solid var(--border-elements); }
.ord-card-line b { display: block; font-size: 12px; line-height: 16px; font-weight: 600; margin-bottom: 8px; }
.ord-card-line span { display: block; font-size: 12px; line-height: 16px; color: var(--fg-secondary); }
/* Figma joins search + status, and "Created on" + period, into one bordered control each. */
.ord-join { display: inline-flex; align-items: stretch; }
.ord-join > * + * { margin-left: -1px; }
.ord-join .ord-search .input, .ord-join-label { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.ord-join > .select { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.ord-join-label { display: inline-flex; align-items: center; height: 36px; padding: 0 12px; background: #fff; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; color: var(--fg-secondary); white-space: nowrap; }
.ord-search { position: relative; width: 260px; }
.ord-search svg { position: absolute; left: 12px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); color: var(--fg-muted); pointer-events: none; }
.ord-search .input { width: 100%; padding-left: 34px; }
.ord-caret { display: inline-flex; }
.ord-caret svg { width: 14px; height: 14px; }
.ord-th { display: inline-flex; align-items: center; gap: 4px; }
.ord-th svg { width: 14px; height: 14px; color: var(--fg-muted); }
.ord-tbl th, .ord-tbl td, .ord-items th, .ord-items td { white-space: nowrap; }
.ord-tbl td .ord-clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; max-width: 190px; }
.tbl th.ord-cb, .tbl td.ord-cb { width: 32px; padding-right: 0; }
.ord-cb-btn { display: inline-flex; padding: 4px; margin: -4px; border: 0; background: none; cursor: pointer; }
.ord-cb-btn:focus-visible { outline: 2px solid #404040; outline-offset: 1px; border-radius: 4px; }
.chk.is-on, .chk.is-mixed { background: var(--accent); border-color: var(--accent); }
.chk.is-on svg { opacity: 1; }
.chk.is-mixed svg { display: none; }
.chk.is-mixed::after { content: ''; width: 8px; height: 2px; border-radius: 1px; background: #fff; }
.ord-tbl tbody tr.is-sel td { background: var(--muted); }
.ord-no { border: 0; background: none; padding: 0; font: inherit; color: var(--fg); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.ord-no:hover { color: var(--primary); }
.ord-sub { font-size: 12px; line-height: 16px; color: var(--fg-secondary); margin-top: 2px; }
.ord-sub.red { color: var(--destructive); }
/* While rows are selected the selection bar lies over the toolbar: the batch-action bar of
   Carbon, Material's contextual header. The toolbar keeps its box underneath, so nothing below
   moves at any width, and the download takes Export's place instead of stacking under it. */
#ord-list .toolbar { position: relative; }
#ord-list .toolbar.is-selecting > :not(.ord-selbar) { visibility: hidden; }
.ord-selbar { position: absolute; top: 0; bottom: 0; left: -8px; right: -8px; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; align-content: center; gap: 8px 12px; padding: 0 8px; background: var(--muted); border-radius: 10px; font-size: 13px; color: var(--fg-secondary); }
.ord-selbar b { color: var(--fg); font-weight: 600; padding-left: 6px; }
/* Narrow: the toolbar underneath wraps to two lines, so the right-hand group drops to the second line inside the same box. */
.ord-selbar b, .ord-sel-link { white-space: nowrap; }
/* The bar's actions are TEXT buttons, as in Carbon's batch bar and Material's contextual header
   ("use borderless buttons"): a box here was a second outlined control competing with Export. */
.ord-sel-act { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: var(--fg); cursor: pointer; white-space: nowrap; }
.ord-sel-act svg { width: 16px; height: 16px; flex-shrink: 0; }
.ord-sel-act:hover:not(:disabled) { background: rgba(0,0,0,.05); }
.ord-sel-act:disabled { color: var(--fg-muted); cursor: not-allowed; }
.ord-sel-div { width: 1px; height: 16px; background: var(--border-elements); flex-shrink: 0; }
.ord-sel-sep { color: var(--fg-muted); }
.ord-sel-link { border: 0; background: none; padding: 0; font: inherit; color: var(--fg); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.ord-sel-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.ord-foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-top: 16px; font-size: 13px; color: var(--fg-secondary); }
.ord-foot .pager-nav { justify-self: end; }
.ord-size { display: inline-flex; align-items: center; gap: 8px; }
.ord-size .select { height: 32px; padding: 0 12px; }
.ord-total b { color: var(--fg); font-weight: 600; margin-left: 4px; }
.tabbar.ord-topbar { justify-content: space-between; overflow: visible; }
.ord-back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; font-size: 14px; font-weight: 500; color: var(--fg); cursor: pointer; }
.ord-back svg { width: 16px; height: 16px; }
.ord-info { display: grid; grid-template-columns: minmax(0, 1128fr) minmax(0, 384fr); gap: 24px; }
.ord-info-main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
.ord-info-col { padding: 24px; border-right: 1px solid var(--border-elements); min-width: 0; }
.ord-info-col:last-child { border-right: 0; }
.ord-info-split { display: flex; flex-direction: column; padding: 0; }
.ord-info-split > div { padding: 24px; }
.ord-info-split .ord-notes { border-top: 1px solid var(--border-elements); }
.ord-info-h { display: flex; align-items: center; justify-content: space-between; font-size: 14px; line-height: 20px; font-weight: 600; margin-bottom: 12px; }

.ord-kv + .ord-kv { margin-top: 12px; }

.ord-clip1 { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ord-addr { font-size: 14px; line-height: 20px; }
.ord-totals { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }

<script>
/* =========================================================================
   Shopcord — Payment & Billing (Phase 2.5) mockup
   Source: PRD v0.5 (2026-08-06) + UX/UI Handoff v2
   All copy is vendor-facing English; credits are always COUNTS, never dollars.
   ========================================================================= */

// ── demo data ───────────────────────────────────────────────────────────────
// Demo dates all land on the 15th. PRD §6.3 says only "Monthly on the cycle
// date" — the anchor is undocumented, so no screen copy states it.
/* No `name`: no doc names a plan or a tier, and "Shopcord Pro" was mine. A tier
   name implies other tiers that do not exist, so the screen names nothing — there
   is one subscription at one price. State stays out of that slot too: the section
   pill and the Status field already say whether billing is healthy, and a third
   would be the same fact three times. */
/* v2.5 §3.2 · PB 2.12.0 — **$20.00 is the PRE-TAX price** and the only figure stored on
   the subscription. Sales tax is looked up at each charge (Avalara) and added, so the
   monthly amount can differ month to month and cannot be stated in advance.
   That splits every price on screen into two kinds:
     BEFORE a charge — plan row, next charge, the subscribe modal, the prompt, consent:
       `$20.00 + tax`. We do not know the rate yet and must not imply a total.
     AFTER a charge — billing history, receipts, the restored notice: the real numbers,
       with the receipt breaking out subtotal · tax · total (PB 6.1.0).
   Recovery invoices carry **no tax at all** (§3.2).
   BASIS ADDRESS = the address the vendor gave when they first onboarded to Shopcord
   (Grace, 9/14 meeting). The documents disagree and all three need correcting: §3.3.1,
   PB 2.12.0 and §20's 9/9 entry say **페이아웃 주소**, while the dev diff expects the card
   billing address. Neither is stable enough — a payout address belongs to a bank account
   (an accountant's, a parent company's), and a card is replaced and its billing address
   lives with Balance. The onboarding address is the one the vendor registered with us, so
   the rate does not move when a card or a bank account does.
   DEMO FIGURES ONLY: 8.875% is New York's rate, chosen because the mockup's vendor is at
   1407 Broadway, NY. Treat the numbers as placeholders and the STRUCTURE as the spec. */
const PLAN = { price: '$20.00', cycle: 'Monthly' };
/* PB 6.1.0 · §6.1 — the receipt carries the Balance transaction number. It is Balance's own id,
   taken from the payment-success notice; this string is a placeholder for its FORMAT, which the
   notice schema decides. The field came off on 9/2 under v2.1 (no receipt fields were specified)
   and is back on 9/17 under v2.5, which names six fields: 세전 · 세금 · 합계 · 카드 끝4 · 결제일 · Balance 거래번호. */
const RCPT_TXN = 'bal_7Kq2M9Rz4T';
const TAX  = {
  /* Derived from THIS vendor's onboarding address, which is the basis (Grace, 9/14) — not
     the card. Bella Boutique LLC is at 1407 Broadway, Suite 902, New York, NY 10018, and
     8.875% is New York City's combined rate (4% state + 4.5% city + 0.375% MCTD). Change
     the address and this whole set changes with it; that is the point of the basis rule. */
  place: 'New York, NY',
  rate:  '8.875%',
  amt:   '$1.78',      // $20.00 × 8.875% = $1.775 → $1.78
  total: '$21.78',
};
/* The forward-looking form. Grace, 2026-09-14 (meeting): "+tax로 넣어줘".
   Use it as a PRICE LABEL only — beside a figure, in a table cell, on a plan row. In a
   SENTENCE it reads wrong ("$20.00 + tax a month"), so prose says "plus sales tax"
   instead. No ecommerce service itemises tax inside a sentence either: a failure mail
   states the amount attempted and leaves the breakdown to the receipt. */
const priceTax = PLAN.price + ' + tax';

/* THE DEMO CLOCK. Card billing does not exist before the 1st release, so nothing on any
   screen can be charged before Oct 5, 2026 — the whole timeline used to sit in Jun–Aug
   2026, months ahead of the first possible charge, with three subscription charges that
   could not have happened.
   Anchor: release 1's "today" is just after launch (Grace, 8/28), so a migrated vendor
   has been charged exactly ONCE. One row is not a thin table — it is the whole record
   that can exist at that moment.
   Release 2 is TBD (it ships with Jinah's project), so its dates are spacing that shows
   a settled account, not a schedule. */
/* LAUNCH is the cutover — the day card billing starts existing. It is NOT anyone's
   billing day: §6.3 anchors the cycle on the date the vendor subscribed (Gap A-12), which
   is why the subscription card says "on the date you subscribed". The two shared one
   field until 2026-08-28, and that quietly made every demo vendor bill on the 1st. */
const LAUNCH = 'Oct 5, 2026';
const CLOCK = {
  /* Moved forward on 9/15 so release 1 has a charge history behind it: launch Oct 5 → first
     charge Oct 14 (paid) → Nov 14 renewal (the one the grace scenarios decline) → today. */
  1: { today: 'Nov 18, 2026', first: 'Oct 14, 2026', next: 'Dec 14, 2026', signupNext: 'Dec 18, 2026' },
  2: { today: 'Feb 20, 2027', first: 'Oct 14, 2026', next: 'Mar 14, 2027', signupNext: 'Mar 20, 2027' },
};

/* §6.3 anchors billing on the day charging starts, so a vendor subscribing TODAY does
   not inherit the migrated vendor's 5th-of-the-month anniversary — `next` belongs to the
   account already on screen, `signupNext` to the one being created. */
const clock = () => CLOCK[isR1() ? 1 : 2];
// The charge the suspension banner is about — the newest subscription row in the
// history the vendor is looking at, so the sentence and the table cannot disagree.
const failedChargeDate = () => {
  const rows = (isR1() ? HISTORY.filter(r => r.rel === 1) : HISTORY).filter(r => r.type === 'Subscription');
  return rows.length ? rows[0].date : CLOCK[isR1() ? 1 : 2].next;
};

/* The free period is the one EXISTING vendors have been on, and it is ending (§1
   "무료 기간 만료(10월)"). New vendors subscribing after launch are charged immediately
   — Grace, 8/28. §6.4 / PB 2.4.0 still describe a 3-month grant for subscribers, so
   this is a deliberate deviation logged in the Gap doc. */
/* v2.5 §3.2.2 · §12.3.1.4 — the trial ends and the first charge happens on the SAME day.
   v2.1 modelled a $0 plan that converted, so it needed two dates (ends Dec 13 / charges
   Dec 14); a trial is an attribute of the paid plan and its end IS the first charge, so
   there is one date and §12.3.1.4 forbids a separate end-date field. */
const TRIAL = { first: 'Dec 14, 2026' };
/* §3.2.2 ① — 체험 기간은 플랜이 가진 값, 1차 유료 플랜 = 3개월 (어드민이 6으로 오버라이드 가능,
   사유 필수 — 9/9). Named because the consent screen states it and the D-7 mail counts to it. */
const TRIAL_MONTHS = 3;

const CARDS = {
  visa:  { id: 'visa',  brand: 'VISA', name: 'Visa',       cls: 'brand-visa', last4: '4242', exp: '08 / 2027' },
  // Anchored to release 1's clock — 11/2026 on the healthy Mastercard read as "about to
  // expire" once today moved to Oct 2026, which is a state it is not supposed to be in.
  mc:    { id: 'mc',    brand: 'MC',   name: 'Mastercard', cls: 'brand-mc',   last4: '8210', exp: '05 / 2028' },
  // One month out and one month past, against whichever release's today is showing.
  visaX: { id: 'visaX', brand: 'VISA', name: 'Visa',       cls: 'brand-visa', last4: '4242', get exp() { return monthsFromToday(1); } },
  visaO: { id: 'visaO', brand: 'VISA', name: 'Visa',       cls: 'brand-visa', last4: '4242', get exp() { return monthsFromToday(-1); } },
  c3:  { id: 'c3',  brand: 'VISA', name: 'Visa',       cls: 'brand-visa', last4: '1881', exp: '03 / 2028' },
  c4:  { id: 'c4',  brand: 'AMEX', name: 'Amex',       cls: 'brand-amex', last4: '0005', exp: '07 / 2027' },
  c5:  { id: 'c5',  brand: 'MC',   name: 'Mastercard', cls: 'brand-mc',   last4: '4444', exp: '12 / 2027' },
};

/* §4.4 — `EXPIRED` and `EXPIRE_SOON` are the two statuses we derive ourselves:
   "Balance sends no expiry statuses"; the month and year live in our DB and a local
   check runs at charge time. So this is computed from the date, not carried as a
   scenario flag — which also means it can flag a NON-default card, unlike DECLINED,
   which needs a charge attempt to exist. A card is good through the end of its
   expiry month, so only a month strictly before now counts as expired. */
/* The expiry check has to run on the same "today" as the rest of the screen. This was a
   fixed { m: 8, y: 2026 } literal from an August anchor while CLOCK's today is Oct 28,
   2026 (release 1) or Feb 20, 2027 (release 2), so the two drifted apart: the `Card
   expired` scenario rendered `Expires 10 / 2026` with no Expired badge, and the
   EXPIRE_SOON scenario showed no badge at all — the two states §12.3.2.2 and §4.3.2 ask
   this list to show. Derived from CLOCK now, so it follows the release switch too. */
const MONTH_N = { Jan: 1, Feb: 2, Mar: 3, Apr: 4, May: 5, Jun: 6, Jul: 7, Aug: 8, Sep: 9, Oct: 10, Nov: 11, Dec: 12 };
const todayMY = () => {
  const p = clock().today.replace(',', '').split(' ');
  return { m: MONTH_N[p[0]], y: parseInt(p[2], 10) };
};
/* The two demo cards that exist to show EXPIRE_SOON and EXPIRED have to move with that
   clock — a pinned month is only true under one release's today. Getters, because CARDS
   is built before clock() exists; they are read at render time. */
/* Days from CLOCK's today to a "Mon D, YYYY" string — the free period's countdown (PM 9/2:
   "얼마 남았고"). Derived from the same clock as everything else, so it can never disagree
   with the dates beside it. */
const daysUntil = (d) => Math.max(0, Math.round((new Date(d) - new Date(clock().today)) / 864e5));
const monthsFromToday = (n) => {
  const t = todayMY();
  let m = t.m + n, y = t.y;
  while (m > 12) { m -= 12; y++; }
  while (m < 1)  { m += 12; y--; }
  return String(m).padStart(2, '0') + ' / ' + y;
};
function cardExpiry(c) {
  const [m, y] = c.exp.split('/').map(s => parseInt(s.trim(), 10));
  const T = todayMY();
  if (y < T.y || (y === T.y && m < T.m)) return 'expired';
  const months = (y - T.y) * 12 + (m - T.m);
  return months <= 1 ? 'soon' : 'ok';
}

/* Runs once on load. A ledger whose rows stop matching its key is a bug in the demo data, and
   this is the only way that gets noticed before a reviewer notices it. */
function assertLedgers() {
  Object.entries(LEDGERS).forEach(([total, rows]) => {
    const sum = rows.reduce((a, r) => a + r.n, 0);
    if (sum !== Number(total)) console.error(`LEDGER ${total} sums to ${sum}`);

    /* CHRONOLOGY (added 2026-09-16, Grace caught the real one). The free grant is issued at
       TFN approval and 진아 §2 only exposes top-up at vendor Active + TFN Approved — so no
       credit event can predate the grant. A ledger that says otherwise describes a vendor who
       bought credits before they were allowed to, and it reads as fact in the Credits Added
       table. The sum check would never notice: the arithmetic stays correct either way. */
    const grant = rows.find(r => r.src === 'Free credits');
    if (grant) {
      const early = rows.filter(r => new Date(r.date) < new Date(grant.date));
      if (early.length) console.error(`LEDGER ${total}: ${early.length} row(s) dated before the free grant (${grant.date}) — ${early.map(r => r.src + ' ' + r.date).join(', ')}`);
    }
  });
}

     expiry has passed shows **the date in red and nothing else**, and it does so on
     EVERY card rather than only the default one.
     Why (§4.3.4): the issuer may already have renewed it, so asserting that the card is
     dead would be a false alarm. The vendor's real moment is a decline, and §5 speaks
     then. The red date is a quiet hint for whoever came to this screen anyway.
     It clears itself when the card is replaced or when Balance sends a card-update
     notice carrying a new expiry (issuer auto-renewal included). */
  const expPast = cardExpiry(c) === 'expired';
  let sub = expPast ? `Expires <span class="exp-past">${c.exp}</span>` : `Expires ${c.exp}`;
  let subCls = '';
  // Declined is a stored state (§4.3.1), not a derived one, so it survives the ladder's
  // removal. The date moved with the clock on 9/8; it was hardcoded to 'Aug 15' before.
  if (bad && isDefault) { sub = `Declined on ${failedChargeDate()} — update this card to restore billing`; subCls = 'danger'; }
  const stateBadge = (bad && isDefault) ? '<span class="pill red">Declined</span>' : '';
  /* Role is checked before the only-card rule. Both can be true at once, and a sub account
     gets no button either way (Grace, 9/11) — so the role branch returns nothing at all,
     while the only-card branch still renders a disabled button with its reason. Permission
     removes the control; state disables it. */
  const removeBtn = !isMaster()
    ? ''
    : onlyCard
    ? h`<span class="tip">
          <button class="btn btn-sm btn-ghost" disabled>Remove</button>
          <span class="tip-bubble">This is the only card on file for your subscription. Add another card before removing it.</span>
        </span>`
    : `<button class="btn btn-sm btn-danger-ghost" data-act="removeCard" data-val="${c.id}">Remove</button>`;

  return h`
  <!-- Only a DECLINE marks the row now. A past expiry is not a failure in v2.5 — the
       charge is still attempted — so it no longer paints the row red (§4.3.2 · §5.4). -->
  <div class="card-row ${isDefault ? 'is-default' : ''} ${(bad && isDefault) ? 'is-bad' : ''} ${isNew ? 'is-new' : ''}">
    <span class="brand-mark ${c.cls}">${c.brand}</span>
    <div class="card-main">
      <div class="card-num">
        <span class="card-dots">···· ${c.last4}</span>
        ${badge}${stateBadge}
      </div>
      <div class="card-sub ${subCls}">${sub}</div>
    </div>
    <div class="card-actions">
      ${isDefault ? '' : (isMaster()
        ? `<button class="btn btn-sm btn-outline" data-act="setDefault" data-val="${c.id}">Set as default</button>`
        : '')}
      ${removeBtn}
    </div>
  </div>`;
}

// ── Subscription ────────────────────────────────────────────────
/* Status pill and primary action live outside the card body because both layouts
   need them in a different place — the 5-tab layout in the card's own head, the
   4-tab layout in the group head above it. Computing them in one function keeps the
   two from drifting apart. Pill vocabulary is §4.2's status set. */
/* PRD v2.1 (8/27) retired three of the states this file used to switch on. Rather than
   patch every condition, the new model lives in these helpers and the call sites read
   from them — a retired state can then only come back by someone reintroducing it here.

   Subscription states are now exactly four: none · active · past_due · canceled.
     - the free period is a PLAN, not a state (§3.2)
     - CANCELLING is a scheduled-cancellation FLAG on an active subscription (§3.5)
     - there is no suspended state at all (§4.1 · §5.5); a card failure sits in past_due
       for a 7-day grace and is auto-cancelled on day 7 */
/* v2.5 §3.2 splits one v2.1 concept in two, and they are not degrees of the same thing:
     Free 플랜  — the default tier every vendor is on from signup. No card, no billing,
                  never ends. Subscription state is `free` (v2.1 called it `free`).
     무료 체험  — an attribute of the PAID plan. State is `active`, the plan IS the paid
                  plan, nothing is billed until it ends, once per vendor. */
const isFreeTier    = () => sc().sub === 'free';
const isTrial       = () => !!sc().trial;
const cancelAt      = () => sc().cancelAt || null;
/* v2.5 §5.1 collapsed 8/27's three classes into a single question: **was it insufficient
   funds or not.**
     funds  — the card said insufficient funds. Grace 7 days AND a daily retry (max 7).
     other  — every other decline: limit, cancelled, stolen, invalid, past its expiry.
              Same grace, same notices, **no retry at all** — updating the card is the
              only way out, and that update charges immediately.
   The third v2.1 class is gone rather than renamed: a PG timeout or a server fault
   "벤더 상태·알림에 영향을 주지 않는다" (§5.1), so it never reaches past_due and never
   reaches this screen. FG's existing server-error handling owns it. */
const failKind      = () => sc().fail || null;                 // 'funds' | 'other'
const inGrace       = () => sc().sub === 'past_due' && !!failKind();
const graceLeft     = () => sc().graceLeft || 0;
/* The day the grace runs out: §5.5.1 counts SEVEN DAYS FROM THE FAILED CHARGE, not from
   today — which is why Grace's copy says Oct 21 for an Oct 14 failure (9/8). Deriving it
   from today + graceLeft() gave Oct 30 and quietly contradicted the charge date printed
   one line above it. The `graceLeft` countdown in the title stays scenario data: it is how
   the panel shows D0 / D+2 / D+5 against a fixed demo clock. */
const GRACE_DAYS    = 7;
const graceEnd      = () => new Date(new Date(failedChargeDate()).getTime() + GRACE_DAYS * 864e5)
  .toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
/* §4.2 — paid features are available in {active, past_due}. Grace KEEPS the service
   (§5.2), which is the whole point of it; only `canceled` and `free` lose anything. */
const paidOn        = () => sc().sub === 'active' || sc().sub === 'past_due';
// §7.1 — cancelled by a chargeback: resubscribing is blocked until it is resolved.
const isChargeback  = () => !!sc().chargeback;
/* §3.5 재구독: coming back from `canceled` runs the NEW subscription flow — same modal,
   same consent, immediate first charge, new cycle from today. The one thing it must not
   repeat is the welcome grant: 3,000 credits are a one-time grant at the FIRST
   subscription (meeting 2026-08-24), so a returning vendor has already had them. */
const isResubscribe = () => sc().sub === 'canceled';
/* PB 1.8.0 — 결제는 항상 기본 카드에만, 실패해도 다른 카드를 자동으로 시도하지 않는다. So a
   DECLINED default is not a warning, it is a blocker: the charge we are about to ask consent
   for would go to the card that just failed. DECLINED can only ever mark the default (there
   is no backup card), which is why the check is `cards[0]` and not a search. */
const defaultDeclined = () => !!sc().cardBad && sc().cards.length > 0;
/* §3.2.2 ⑦ — 부여 판정은 과거 체험 이력으로 한다. In production that is a lookup; here it is a
   demo flag, because both shapes of the confirmation screen have to be reviewable. 재구독 can
   never qualify (§3.5 · §3.2.2 ⑦ — 이력이 있으면 구독 시점에 즉시 첫 결제), so the state is
   guarded rather than trusted. */
const trialOffered = () => !!S.trialOffer && !isResubscribe();

/* §12.3.1.2 asks for the subscription status, and §4.2 names four: none / active /
   past_due / canceled. Only two of those had badges that used the state's own word.
   `Payment failed` and `Payment retrying` were mine — one enum value (past_due) shown
   under two invented names, split by cause. Removed 9/1 (Grace).

   past_due now carries no badge. It is the honest reading of the two rules that meet
   here: §4.2 keeps paid features running in {active, past_due}, so nothing is switched
   off to announce, and §5.1 · PB 5.2.0 say the server-error half is 벤더 무통보 — a badge
   there was telling the vendor the one thing the doc says not to tell them. The card
   half still has the failure banner (§16 assigns it that channel), which is where the
   deadline and the fix live. */
/* Two badges, both §4.2 words. past_due reads Active (Grace, 9/2): §4.2 keeps paid
   features running in {active, past_due}, so from the vendor's side the service IS
   active — the badge states service status, the failure banner states the problem. It
   also closes the 무통보 question for the server-error half: Active + nothing is exactly
   what §5.1 · PB 5.2.0 ask for. */
function subPill() {
  /* §4.2's own words for its own states. `free` joined them in v2.5 — it is a real state
     now (the default tier), not the absence of one, so the section carries a badge where
     it used to carry nothing. Grace's rule still holds: the badge says the STATE, never
     the cause (past_due reads Active, because §4.2 keeps paid features running). */
  if (sc().sub === 'canceled') return '<span class="pill gray">Canceled</span>';
  if (sc().sub === 'free')     return '<span class="pill gray">Free</span>';
  return '<span class="pill green">Active</span>';
}

/* §3.4 and Handoff §2A ask for cancel AND resume. They are two states of one
   control, not two controls. Suspension leaves the slot empty on purpose: the danger
   banner already owns Update payment, and offering Cancel mid-recovery would be
   pointing at the exit while the vendor is trying to come back. */
function subActionBtn() {
  /* §12.4-1 · PB 1.9.0 (확정 9/9) — 구독·해지·재개 API = MASTER 전용. Every branch below is one
     of those three, so a SUB account gets NOTHING here: permission removes the control, it
     does not disable it — the same rule the card rows have followed since 9/11. This guard
     was missing until 9/15, so `Cancel subscription` rendered for a SUB while every card
     button beside it was correctly hidden. */
  if (!isMaster()) return '';
  /* §3.5 splits the way back into two rows, and they are not one control in two states:

       재개 (해지 철회)   — "기간이 끝나기 전까지만 가능 … 추가 결제 없이 그대로 이용"
                          (PB 2.7.0: "재개 = 플래그 해제 (무결제 복귀)")
       canceled 후 재구독 — "신규 구독 플로우 · 데이터 유지 · Free 플랜 미적용 ·
                          재구독 시점부터 새 주기, 즉시 첫 결제" (§5.5.3, PB 2.7.0)

     Resume used to serve both, which made the two look like one button with two outcomes:
     a free return and a $20 charge. Worse, it skipped §14.2 — no 확인 화면 and no
     "I Consent", so the new cycle started with no consent record, and PB 2.3.0 makes that
     record the chargeback evidence. So `canceled` now gets Subscribe, §14.1.3's own name
     for the Subscription tab's standing entry point, and it enters §14.2 whole. Resume stays with
     the scheduled cancellation, which is the only case the doc gives it to.
     In grace the vendor CAN still cancel (§5.2) and the banner already carries Update
     payment, so that slot keeps Cancel rather than duplicating the fix. */
  /* §7.1 — after a chargeback the entry point is the one that gets blocked: §7.1.2's
     words are "재구독 차단", and re-subscribing is now literally what this button does.
     Disabled rather than hidden, because §7.1.2 asks for the block to be SHOWN, with its
     own clause as the reason.
     v2.5 §7.4-2 (확정 9/9) finally gives that reason: 승소 → 자금 복귀 즉시 해제 · 패소 →
     회수 인보이스 결제가 확인된 뒤 해제 · **새 카드 등록만으로는 풀지 않는다**. That last clause
     is exactly what a vendor tries first, so the tooltip says it. Until 9/15 this button
     carried no reason at all, on a comment that predated the ruling. */
  if (isChargeback())
    return h`<span class="tip" data-block="chargeback">
      <button class="btn btn-primary" disabled>Subscribe</button>
      <span class="tip-bubble">Resubscribing is blocked while the chargeback is open. It lifts when the dispute resolves in your favour, or when the recovery invoice for it is paid. Adding a new card does not lift it.</span>
    </span>`;
  /* Grace, 9/15 — a DECLINED default blocks the same button, for a different reason:
     PB 1.8.0 charges the default and never falls back, so subscribing would charge the card
     that just failed (§5.1 → the signup-failure path, and PB 2.3.0 would store a consent
     record for a subscription that never started).
     Disabled rather than a blocker modal, because THE FIX IS ON THIS SCREEN — the card list
     with `Set as default` sits directly below, so the tooltip can point at something the
     vendor can already see. The §14.1 prompt modal has no card list, so its own Subscribe
     still routes to `subscribeBlocked`, which carries the picker with it. */
  if (defaultDeclined() && (sc().sub === 'canceled' || isFreeTier()))
    return h`<span class="tip" data-block="declined">
      <button class="btn btn-primary" disabled>Subscribe</button>
      <!-- Grace, 9/15. Her wording fixes something mine got wrong: PB 1.1.1 makes only the
           FIRST card default, so a vendor who already has cards and adds another does NOT
           get a new default from that alone — "add a new one" implied they would. -->
      <span class="tip-bubble">Your default card was declined, so your subscription can't be restarted with this card. Choose a different card as your default, or add a new card and set it as your default to subscribe again.</span>
    </span>`;
  if (cancelAt())
    return '<button class="btn btn-primary" data-act="resumeSub">Resume subscription</button>';
  /* Free tier and canceled reach the same button by different routes: one has never
     subscribed, the other has and came back. §14.1.3 gives both the same standing entry
     point, and §14.2 is the same flow for both — only the trial differs, and that is
     decided by trial history (§3.2.2 ⑦), not by which state you came from. */
  if (sc().sub === 'canceled' || isFreeTier())
    return '<button class="btn btn-primary" data-act="subscribe">Subscribe</button>';
  return '<button class="btn btn-outline" data-act="cancelSub">Cancel subscription</button>';
}

/* The live Subscribe screen's own pitch (Audit A1) — shared by the unsubscribed tab
   and the §14.1 prompt modal so the two can never say different things. */
/* v2.5 §3.2.1 draws the Free/paid boundary as a table, and it is SHORT: exactly two
   things are locked — opening and confirming an order, and SMS marketing. Everything
   else (linesheets, receiving orders, the order list, products, customers, payout,
   My Account) is open on the Free plan.
   The four items here used to be the live Subscribe screen's marketing copy (Audit A1),
   and against that table three of them were false: receiving orders, managing customers
   and getting paid by payout all work without a subscription — §4.1 even says a Free
   plan vendor receives settlements. Promising them back is the fastest way to lose a
   vendor's trust on the screen that asks for money. Logged as Gap K-2. */
const UNLOCK = [
  ['box',  'Open and confirm your orders', 'On the Free plan orders arrive, but you cannot open one or process it'],
  ['chat', 'SMS marketing', 'Campaigns and 1:1 chat with your buyers'],
];
const unlockGrid = () => h`
      <div class="unlock-grid one-col">
        ${UNLOCK.map(([ico, title, desc]) => h`
          <div class="unlock-item">
            <span class="unlock-ico">${ICO[ico] || ICO.card}</span>
            <div>
              <div class="unlock-title">${title}</div>
              <div class="unlock-desc">${desc}</div>
            </div>
          </div>`).join('')}
      </div>`;

function subscriptionSection() {
  const s = sc();
  const cards = s.cards.map(id => CARDS[id]);
  const def = cards[0];
  const pill = subPill();

  if (s.sub === 'free') {
    /* v2.5 §12.3.1.1 — "미구독이어도 Free plan이 현재 플랜으로 노출된다 (빈 화면·별도 미구독
       화면 없음)". So this is no longer a marketing card standing in for an empty tab: it is
       the same Subscription section every other state uses, showing the plan the vendor is
       actually on. The badge reads `Free`, the plan block names `Free plan`, and the action
       is Subscribe — the ordinary furniture, filled in.
       §12.3.1.5 then asks this screen to say WHAT IS LOCKED, which is the conversion
       argument and the only reason the paid plan's pitch belongs here at all. */
    return h`
    <section class="section-card" id="sec-pitch">
      <div class="section-head">
        <div>
          <div class="section-title">Subscription ${subPill()}</div>
          <div class="section-desc">What you pay Shopcord each month.</div>
        </div>
        ${subActionBtn()}
      </div>

      <div class="plan-row">
        <div>
          <div class="plan-name">Free plan</div>
          <!-- No price on this row. §3.2.1 never gives the Free plan an amount — it is the
               default tier, not a $0 product — and printing "$0" would invent one. -->
          <div class="plan-when">Your current plan <span>·</span> no card on file, nothing is charged</div>
        </div>
      </div>

      <div class="section-foot" style="display:block">
        <div class="pitch-title" style="margin-top:0">What a subscription unlocks</div>
        ${unlockGrid()}
        <div class="helper">${ICO.info}<span><strong>${priceTax}</strong> /monthly · cancel anytime. Subscribing requires a card on file.</span></div>
      </div>
    </section>`;
  }

  let nextVal = clock().next, foot = '', nextLabel = 'Next charge';
  // Scheduled cancellation needs two things the other states don't: the days-left tail
  // and a footnote the vendor actually reads. Both stay off unless cancelAt() is set.
  let cancelDays = null, footIcon = false;
  if (isTrial()) {
    /* v2.5 §3.2.2 — the vendor is on the PAID plan, free for now. There is no conversion
       and no plan change at the end: the trial's last day is simply the day the first
       charge lands, which is why this keeps the ordinary `Next charge` label instead of
       a special one. §12.3.1.4 allows no separate end-date field. Nothing is billed in
       the meantime — no invoice, no receipt, not even a $0 line (§3.2.2 ⑤). */
    nextVal = TRIAL.first;
    foot = 'Nothing is charged until ' + TRIAL.first + '. Cancel before then and you keep the trial to its last day.';
  } else if (inGrace()) {
    /* §5 — the 8/27 policy change. A card failure no longer switches anything off: the
       subscription sits in past_due, SERVICE IS KEPT for seven days, and only day 7
       auto-cancels. Soft declines are retried once a day; hard declines and expired cards
       are never retried, so for those the card update is the only way out (§5.1). */
    /* Both the row and the footnote are deliberately EMPTY here (Grace, 9/8 — "둘 다 빼줘").
       Once the banner was rebuilt to explain the grace period properly (Gap H-11) it carried
       every fact these two held, and the screen was stating one deadline three times: the
       banner title's countdown, this row's "Cancels in N days", and the banner's end date.
       The row's wording was never documented either — §3.5 gives "Cancels on {날짜}" for a
       SCHEDULED cancellation, not for a grace countdown. The banner is the one place that
       carries a payment failure (§16), so it is the one place that says this. */
    nextVal = '';  nextLabel = '';
  } else if (s.sub === 'canceled') {
    /* §12.3.1.1 asks this row for the next billing date, and in `canceled` there isn't
       one: PB 2.7.0 removes the billing schedule on transition (결제 스케줄 제거) and
       §5.5.4 waives the unpaid cycle. So the slot states the absence rather than sitting
       empty — without it the row reads "Billed monthly … $20.00", which is what an active
       charge looks like. The $20.00 beside it is the plan's price, which is what the
       vendor would pay on 재구독 (§5.5.3), not a charge being taken.
       Credits are still shown because 2차 PRD §5 forbids forfeiture, but whether churn triggers
       a pro-rata refund is pending legal (L-1) + Finance (D-4), so the screen says they
       stay and claims nothing about money back. */
    /* No copy here. The PRD gives no string for this slot in `canceled` — "No further
       charges" was mine — and the fact it stated (PB 2.7.0 결제 스케줄 제거 · §5.5.4 미납
       주기 waive) is documented but unworded. Removed 9/1, logged as Gap H-1. */
    nextVal = '';  nextLabel = '';
    /* One sentence for both causes. §5.5.2 treats a cancelled vendor the same however the
       cancellation happened — orders and data access continue — so a chargeback gets no
       sentence of its own here. The block itself is shown on the Subscribe button. */
    /* PM 9/2: the vendor is not told it was a chargeback, but must see that something is in
       dispute and that resubscribing is blocked until it clears — visibly, not in a hover.
       The sentence is §7.1.2's own clause; it says "dispute", never "chargeback". */
    /* REWRITTEN for v2.5 PB 5.5.0 (2026-09-14). It used to say the store AND orders keep
       running, which was true while the order gate was payout-verified. The gate is now
       구독 ∈ {active, past_due}, so a canceled vendor cannot open, confirm or delete an
       order and buyer info is masked in the list — 진행 중 주문 예외 없음. What survives is
       the storefront (orders still arrive) and the data (nothing is deleted), so the line
       says both halves: what keeps working, and what stops. */
    foot = 'Your store stays open and orders keep arriving, but you can\'t open or confirm them until you resubscribe.' + (hasCredits() ? ' SMS credits you already bought stay on your account.' : '')
         /* The chargeback clause moved OUT of this footnote on 9/15. §7.4 carries a 확정 카피
            (9/9) that announces the cancellation itself — "A dispute was filed … so your
            subscription has been canceled" — which is a banner's job, not a trailing clause
            on a sentence about the storefront. Saying it in both places would state it twice. */
         ;
  } else if (cancelAt()) {
    /* §3.5 — a flag on an active subscription, not a status. The wording the PRD uses is
       "Cancels on {date}", and it can be withdrawn any time before that date. */
    nextVal = cancelAt();  nextLabel = 'Cancels on';
    /* PM 9/4, via Grace: the scheduled end has to READ as scheduled. The vendor has already
       paid this month, so nothing stops today — but the row sat in the same slot and weight
       as "Next charge {date}" and the one sentence saying so was in the muted footnote.
       Three changes, all existing components, nothing invented:
         · days left after the date — the Free plan card's grammar for the same "runs until
           a date" shape, which is the version Grace settled on after three rejections (9/2)
         · no card chip on this row (below) — a card beside a cancel date says we charge it
           that day, and §3.5 charges nothing
         · the sentence promoted from .foot-note to the .helper treatment already used for
           "Your default card is used for subscription fees", with the date in <strong> */
    cancelDays = daysUntil(cancelAt());
    footIcon = true;
    foot = 'Your subscription stays active until <strong>' + cancelAt() + '</strong>. Resume any time before then and nothing is charged.';
  /* No branch for the server error, on purpose (Grace, 9/1). §4.2 · §5.1 · PB 5.2.0 all
     say the same thing about it — past_due + 자동 재시도 + 벤더 무통보 → 성공 시 복귀 — and
     the retry is ours to run, not the vendor's to act on: the card is fine and there is no
     control here they could press. "Retrying automatically" and a reassuring footnote were
     mine, and they told the vendor exactly what the doc says not to. So this state falls
     through and reads as a normal subscription, which is what 무통보 means on a screen.
     §5.1 leaves the retry count and interval to dev (🔴), so there is no defined end to
     this state yet — if the errors never clear, nothing here would ever say so. Logged. */
  } else {
    /* The anchor is the signup date, not a calendar day (Grace, confirmed 2026-08-24).
       §6.3 only says "Monthly on the cycle date" and never says which date that is, so
       the screen had a next-billing date with nothing explaining where it came from.
       Gap A-12 — the PRD needs this written in. */
    foot = 'Renews automatically each month, on the date you subscribed.';
  }

  const billedTo = def
    ? h`<span class="brand-mark ${def.cls}" style="width:34px;height:23px;font-size:8px">${def.brand}</span>
        ···· ${def.last4}`
    : '<span class="t-muted">No card</span>';
  /* PM decision 9/2: no "Billed to" label and no Change link — §12.3.2.5 and Handoff §2A
     asked for both, so this is a logged deviation (Gap H-3). What the section must say is
     WHEN the next charge is and WHICH card it hits, so the card rides on the date row. */
  const cardChip = def && s.sub !== 'canceled' ? h`<span>·</span><span class="plan-card">${billedTo}</span>` : '';

  /* Free plan card — the paid card's exact grammar, only the content differs (Grace, 9/2,
     after three versions: "지저분하게 보이고 글이 읽히는 디자인이 아니야"). One component, one
     voice: the plan name where "Billed monthly" sits, two label/value lines in the same
     13px register as "Next charge", the price on the right as on the paid card. No badge,
     no eyebrow, no second type scale — the days left is plain text after the date. This is
     also what the research found: end date, then what follows, as short lines. */
  /* The paid card's grammar with one line added, because that is what a trial is — the
     paid plan, not billed yet. The old version named the plan `Free plan`, which v2.5
     §3.2.2 ③ makes wrong: during a trial the plan is the paid one. Its two date lines
     collapse to one, the trial's end and the first charge being the same day. */
  const trialRow = h`
    <div class="plan-row">
      <div>
        <div class="plan-name">Billed monthly</div>
        <div class="plan-when">Free trial <span>·</span> ${daysUntil(TRIAL.first)} days left</div>

      </div>

    </div>`;

  return h`
  <section class="section-card" id="sec-subscription">
    <div class="section-head">
      <div>
        <div class="section-title">Subscription ${pill}</div>
        <div class="section-desc">What you pay Shopcord each month.</div>
      </div>
      ${subActionBtn()}
