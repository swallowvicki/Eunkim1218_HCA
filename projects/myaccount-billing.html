    <!-- No plan block in canceled (Grace, 9/2 — "삭제"; closes Gap H-1). §12.3.1's four
         items describe a subscription that is running; PB 2.7.0 has removed this one's
         billing schedule, so a price and a cycle here read as a charge being taken. The
         shipped product does the same (Figma 1:22438 shows no fee, no cycle). The badge
         says the state and Subscribe says the way back. -->
    ${s.sub === 'canceled' ? '' : isTrial() ? trialRow : h`
    <div class="plan-row">
      <div>
        <!-- No name line: there is one subscription at one price and no doc names
             it, so a name slot would only ever hold something invented. The cadence
             is stated once, on the left — "Billed monthly" beside "$20.00 /monthly"
             said the same word twice. -->
        <!-- §12.3.1 asks the section for a plan name, and Free plan is the first real
             one there has ever been (§3.1 makes plans data). The paid plan still has no
             name — tiers arrive at year end and inventing one now would be worse. -->
        <div class="plan-name">Billed monthly</div>
        <!-- §3.4 asks this section for the next billing date and "Billed to Visa
             ····4242". They used to be two label/value fields under the plan box, and
             once the Status column came out the pair huddled on the left of a wide card
             with a date on one side and an icon on the other — different weights, no
             alignment (Grace: 뭔가 이상함). As one line inside the plan block they read
             as what they are: when the next charge happens and what it hits. -->
        <!-- The row only renders when it has something to say. In canceled it has nothing:
             §12.3.1.1 asks this slot for the next billing date and there is no next date,
             and the PRD gives no copy for the absence — so the slot is empty rather than
             filled with a sentence we wrote. Gap H-1. -->
        ${nextVal ? h`<div class="plan-when">${nextLabel} <strong>${nextVal}</strong>${cancelDays === null ? cardChip : h`<span>·</span>${cancelDays} days left`}</div>` : ''}

        <!-- The 3,000 is a ONE-TIME welcome grant at first subscription, not part of
             the monthly plan (meeting 2026-08-24). "Includes 3,000 free 1:1 chat
             replies" sat under "Billed monthly" and read as something that arrives
             every month, which would be a recurring promise about money. The grant
             belongs to the moment it happens — the subscribe confirmation — so the
             plan card states the plan only. -->
        <!-- No sub-line here. "One subscription, one price — no tiers" was true today
             and stops being true at year end, when tiers arrive (Grace, 2026-08-24) —
             a claim with an expiry date is worse than silence. Naming a tier now would
             be the opposite mistake, since none exist yet. The slot stays empty and is
             where a plan name goes when there is one. -->
      </div>
      <div class="plan-price">${PLAN.price}<span> + tax</span></div>
    </div>`}

    <!-- No footnote block at all when there is nothing to say — an empty one would leave
         its top border behind as a stray rule under the plan card (grace, since 9/8). -->
    ${!foot ? '' : h`<div class="section-foot">

        ? h`<span class="helper" style="margin-top:0">${ICO.info}<span>${foot}</span></span>`
        : h`<span class="foot-note">${foot}</span>`}
    </div>`}

function paymentMethodsSection() {
  const s = sc();
  // PM 9/2: a vendor who has never subscribed sees no card management — the card is
  // collected inside the subscribe flow (§14.2 ②). §12.3.2.6's empty state is therefore
  // reachable only after a subscription existed (canceled with cards removed).
  if (s.sub === 'free') return '';
  const cards = s.cards.map(id => CARDS[id]);

  const list = cards.length === 0
    ? (h`<div class="empty">
          <div class="empty-title">No payment method yet</div>
          <div class="empty-desc">Add a card to subscribe and to buy SMS message packs.</div>
          <!-- Outline, not primary: on the unsubscribed screen Subscribe above is the
               one saturated accent, and §4.2 lets a vendor add a card on its own, so
               this is a secondary path rather than the thing to do next. -->
          <!-- One label everywhere now (Grace, 9/11). The docs gave two — §12.3.2.6 names this
               empty-state CTA "Add a payment method", §12.3.2.4 / PB 1.1.0 call the list button
               "Add card" — but one action under two names reads as two actions. Deviation
               logged in Gap H-22; the documents themselves are unchanged. -->
          <div class="empty-cta">${isMaster()
            ? h`<button class="btn btn-outline" data-act="addCard"><span class="btn-ico">${ICO.plus}</span>Add a payment method</button>`
            : ''}</div>
        </div>`)
    : h`<div class="card-list">
          ${cards.map((c, i) => fmtCardRow(c, {
            isDefault: i === 0,
            /* PB 1.5.0 scopes the block to {free_period, active, past_due} — states
               that still bill. `canceled` has no further charge, so a vendor's last card
               is theirs to remove, and the old `sub !== 'free'` was holding it hostage.
               `suspended` is a vendor state, not one of the three, but it is still
               billing and failing: removing the only card there would remove the way
               back (§12.3). */
            // PB 1.5.0 (v2.1) — blocked while the subscription still bills: {active
            // (Free plan included), past_due}. `canceled` and `free` never charge again.
            onlyCard: cards.length === 1 && ['active', 'past_due'].includes(s.sub),
            bad: !!s.cardBad,
            isNew: i === 0 && S.cardFlash,
          })).join('')}
        </div>`;

  return h`
  <section class="section-card" id="section-cards">
    <div class="section-head">
      <div>
        <div class="section-title">Payment methods</div>
        <div class="section-desc">One card pool for everything you pay Shopcord.</div>
      </div>
      ${(cards.length) ? (cards.length >= MAX_CARDS
        ? h`<span class="tip">
              <button class="btn btn-outline" disabled><span class="btn-ico">${ICO.plus}</span>Add a payment method</button>
              <span class="tip-bubble">You've reached the limit of ${MAX_CARDS} saved cards. Remove one to add another.</span>
            </span>`
        : (isMaster()
            ? h`<button class="btn btn-outline" data-act="addCard"><span class="btn-ico">${ICO.plus}</span>Add a payment method</button>`
            : '')) : ''}
    </div>

    ${list}

    <!-- Handoff §2 Section B specifies this sentence verbatim as a required
         element. The card counter and the Balance storage notice that used to sit
         beside it were mine: the counter is redundant with the disabled-Add
         tooltip that appears at the limit, and the storage notice is already in
         the card form, where it actually matters. -->
    <div class="helper">${ICO.info}<span>Your <strong>default card</strong> is used for subscription fees${hasCredits() ? ' and SMS credit purchases' : ''}.</span></div>
    <!-- PB 1.3.0 asks for "비활성 + 툴팁", and the tooltip is on the button — but a hover
         bubble on a disabled control is mouse-only: disabled buttons leave the tab order,
         and there is no hover on touch. The reason a control is dead has to be readable
         without pointing at it, so at the limit it also states itself here, in the line
         the section already uses for standing facts. The tooltip stays for the vendor
         whose cursor is already on the button. -->
    ${cards.length >= MAX_CARDS ? h`<div class="helper">${ICO.info}<span>You've reached the limit of <strong>${MAX_CARDS} saved cards</strong>. Remove one to add another.</span></div>` : ''}
    <!-- PB 1.5.0's other disabled control, given the same treatment as the 5-card limit: the
         reason a Remove button is dead has to be readable without hovering it. The two are
         mutually exclusive — one card versus five — so only ever one of these lines shows. -->
    ${cards.length === 1 && ['active', 'past_due'].includes(s.sub) ? h`<div class="helper">${ICO.info}<span>Your subscription needs a card on file, so <strong>the last card can't be removed</strong>. Add another one first.</span></div>` : ''}
  </section>`;
}

// ── Billing history ─────────────────────────────────────────────
/* ONE source for the table and for the file. Export has to hand back exactly what the
   table holds, so the row set cannot be computed in two places — that is precisely how a
   file and a screen drift apart.
   PM 9/2: the table lists PAID charges only, so there is no Status column and a failed
   attempt is not a row — the failure banner is where that lives. §12.3.3's
   "상태(Paid/Failed)" is therefore a logged deviation (Gap H-3). */
function historyRows() {
  const base = isR1() ? HISTORY.filter(r => r.rel === 1) : HISTORY;
  const failIdx = inGrace() ? base.findIndex(r => r.type === 'Subscription') : -1;
  return base.filter((r, i) => r.status === 'paid' && i !== failIdx);
}

/* Export = the WHOLE table, never the page on screen (Grace asked, 9/14: "Export하면 몇 개가
   추출되는거야?"). Pagination is a reading aid; the file is the record, and a vendor who
   exported page 2 of 3 and filed it would be missing two thirds of their year.
   §12.3.3.2 gives this control the word `Export` and PB 6.3.0 makes it the replacement for
   the statement — neither names a FORMAT. CSV is ours, for the same reason the SMS tables
   use it: it is what the reference set hands back (Klaviyo · Postscript · Mailchimp,
   Research doc 9/8) and what a vendor can open without us.
   THREE money columns, not one. The table cell shows the total because the charge already
   happened, but a statement replacement has to be reconcilable — so the file carries
   pre-tax, tax and total separately (§3.3.1 · PB 6.1.0's receipt fields).
   Tax is SUBSCRIPTION-ONLY: a credit pack row has no tax line, so those cells stay empty
   rather than printing $0.00, which would assert a zero-rated sale we never computed.
   Receipt is availability, not a number — no PRD gives a receipt-number format (Grace
   asked, 9/14), so inventing one in a file a vendor keeps would be a promise. */
function exportBillingHistory() {
  const rows = historyRows();
  const esc = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const line = (a) => a.map(esc).join(',');
  const csv = [line(['Date', 'Type', 'Card', 'Subtotal', 'Sales tax', 'Total', 'Receipt'])].concat(
    rows.map(r => {
      const taxed = r.type === 'Subscription';
      return line([
        r.date,
        r.type + (r.sub ? ' · ' + r.sub : ''),
        r.card,
        r.amt,
        taxed ? TAX.amt + ' (' + TAX.place + ' ' + TAX.rate + ')' : '',
        taxed ? TAX.total : r.amt,
        r.receipt === false ? '—' : 'Available',
      ]);
    })).join('\r\n');
  const stamp = new Date(clock().today).toISOString().slice(0, 10);
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `shopcord-billing-history-${stamp}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Export ready', `${rows.length} rows · shopcord-billing-history-${stamp}.csv`);
}

function billingHistorySection() {
  const s = sc();
  if (s.sub === 'free') return '';   // PM 9/2 — nothing has ever been charged
  const c = s.credits;


  /* Release 1 ships before credits exist, so a pack row could not have happened. The
     filter loses its SMS pack option with them, and §3.4's credit summary chip waits
     for release 2. */
  /* Release 1's world is October 2026, so it holds the rows that exist by then — one
     subscription charge. The later rows are not merely out of scope, they are in the
     future. */
  /* A failed charge IS a history row (§3.4 status Failed), and the suspension banner
     names its date — without it the screen says a charge failed above a table of nothing
     but successes. It is not an EXTRA row: the newest subscription charge either went
     through or it did not, so the scenario flips that row in place. Same row, same date,
     one source for the banner (`failedChargeDate()`). */
  const visible = historyRows();
  /* The pager is mine, not the docs' (Audit A3-5) — table convention. Five rows a page
     (Grace, 9/14). It renders only when there is a second page, so release 1's single
     charge shows no pager rather than one claiming pages that do not exist. The numbers
     used to be hardcoded `1 2 3 ···` and paged nothing; they work now. */
  const PAGE_SIZE = 5;
  const pageCount = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
  /* Clamped, not trusted: the filter and the scenario both change how many rows exist,
     and a stale page number would render an empty table. */
  const page = Math.min(Math.max(S.histPage || 0, 0), pageCount - 1);
  const from = page * PAGE_SIZE;
  const shown = visible.slice(from, from + PAGE_SIZE);
  /* Window the numbers so a long history does not run off the row: all of them up to
     seven pages, otherwise first and last with the neighbours of the current one. */
  const nums = [];
  if (pageCount <= 7) { for (let i = 0; i < pageCount; i++) nums.push(i); }
  else {
    const near = [0, 1, page - 1, page, page + 1, pageCount - 2, pageCount - 1]
      .filter(i => i >= 0 && i < pageCount);
    let last = -1;
    for (const i of [...new Set(near)].sort((a, b) => a - b)) {
      if (last >= 0 && i - last > 1) nums.push('...');
      nums.push(i); last = i;
    }
  }
  /* Built as a plain string before the section template — nesting a multi-line arrow
     inside ${} inside h` is more than the parser takes. */
  const numHtml = nums.map(i => i === '...'
    ? '<span class="pager-dots">···</span>'
    : `<button class="pager-btn ${i === page ? 'is-cur' : ''}" data-act="histPage" data-val="${i}">${i + 1}</button>`).join('');
  const pager = pageCount < 2 ? '' : `
        <div class="pager">
          <span class="pager-range">${from + 1}\u2013${from + shown.length} of ${visible.length}</span>
          <div class="pager-nav">
            <button class="pager-btn" data-act="histPage" data-val="${page - 1}" ${page === 0 ? 'disabled' : ''}>\u2039 Previous</button>
            ${numHtml}
            <button class="pager-btn" data-act="histPage" data-val="${page + 1}" ${page === pageCount - 1 ? 'disabled' : ''}>Next \u203a</button>
          </div>
        </div>`;
  const rows = shown.map(r => h`
    <tr>
      <td>${r.date}</td>
      <td>
        <div>${r.type}</div>
        ${r.sub ? `<div class="t-muted" style="font-size:12px;margin-top:2px">${r.sub}</div>` : ''}
      </td>
      <td>${r.card}</td>
      <!-- The charge already happened, so this CELL shows the TOTAL the card was debited,
           tax included — unlike every forward-looking price, which can only say "+ tax"
           because the rate is looked up at charge time (§3.3.1 · PB 2.12.0).
           The amount field itself stays PRE-TAX and that is what the Receipt link passes
           on: the receipt's line item and subtotal are the pre-tax figure, and only its
           bottom line is the total. Handing the total to both made the paper read as if
           tax were owed twice (Grace, 9/14). One field, one meaning. -->
      <td class="t-tab">${r.type === 'Subscription' ? TAX.total : r.amt}</td>
      <td>${r.receipt === false ? '<span class="t-muted" style="font-size:12px">—</span>'
        : `<a class="receipt-link" href="#" target="_blank" rel="noopener" data-act="receipt"
             data-date="${r.date}" data-amt="${r.amt}" data-type="${r.type}">${ICO.ext}Receipt</a>`}</td>
    </tr>`).join('');

  const noRows = !s.history || visible.length === 0;
  const body = !noRows
    ? h`<div class="tbl-scroll">
          <table class="tbl">
            <thead><tr>
              <!-- PROPORTIONAL, not fixed px. With one flexible column and four fixed ones,
                   the flexible column swallowed every spare pixel: Date/Type clustered at the
                   left, Card/Amount/Receipt at the right, and half the table was a canyon in
                   between (Grace, 2026-09-08). Percentages spread the columns and the same
                   ratios are used by Purchase history, so the two tables of the same purchases
                   line up column for column. -->
              <!-- Figma Table(01) column widths, left-aligned throughout: Date 160 ·
                   subject flexible (min 200) · Card 160 · Amount 100 · Receipt 100.
                   Purchase history uses the identical set, so the two tables of the same
                   purchases line up column for column. -->
              <th style="width:160px">Date</th><th style="min-width:200px">Type</th>
              <th style="width:160px">Card</th><th style="width:100px">Amount</th>
              <th style="width:100px">Receipt</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${pager}`
    : h`<div class="empty">
          <div class="empty-title">No charges yet</div>
          <div class="empty-desc">${isR1() ? 'Subscription charges' : 'Subscription charges and SMS pack purchases'} will appear here, each with a downloadable receipt.</div>
        </div>`;

  /* One view only. A `Charges` / `SMS usage` switch lived here while the merged
     layout wrapped everything in invented groups; now usage history sits in the SMS
     group where 통합 v0.6 §7.6 puts it, and this card is §12.3.3 — charges. */
  return h`
  <section class="section-card" id="sec-history">
    <div class="section-head">
      <div>
        <div class="section-title">Billing history</div>
        <div class="section-desc">Everything you\'ve been charged, with receipts.</div>
      </div>
    </div>

    <!-- The chip exists to carry the balance across to a tab the vendor isn't on
         (§3.4 asks for a balance summary here). Merged, the real balance cards are
         a few hundred pixels up the same page, so the chip would be the same
         numbers twice and its link would point at the section above it. -->
    ${(isMerged() || isR1()) ? '' : h`
    <div class="credit-chip">
      ${isUnified()
        ? h`<div class="credit-chip-item"><span class="credit-chip-num">${n(unifiedTotals(c).remaining)}</span><span class="credit-chip-label">credits remaining</span></div>`
        : h`<div class="credit-chip-item"><span class="credit-chip-num">${n(c.sms)}</span><span class="credit-chip-label">SMS remaining</span></div>
            <div class="credit-chip-sep"></div>
            <div class="credit-chip-item"><span class="credit-chip-num">${n(c.mms)}</span><span class="credit-chip-label">MMS remaining</span></div>`}
      <!-- Handoff §2C asks for "balance summary chip/row + link to the credit
           dashboard". The summary stays; the link is gone (Grace, 8/18) — the
           destination is a tab sitting one click away in the tab bar above, so the
           link only restated the navigation the vendor can already see. Logged as a
           deviation in the Gap doc, not an omission. -->
    </div>`}

    <!-- Grace, 9/1 — nothing to filter and nothing to export when the table is empty.
         An unsubscribed vendor is empty by construction: §4.2 sends a cancellation to
         canceled, never back to none, and a migrated vendor's SMS came out of
         settlement (§10.2·§10.3), so no card charge was ever recorded. Both controls
         stay VISIBLE and disabled — the section still shows what it will do once there
         are charges — and the empty state under them says why. -->
    <div class="toolbar">
      <!-- §3.4 lists Type as "Subscription / SMS pack / SMS pack (auto)". The (auto)
             variant went with auto-recharge on 2026-08-24 — no charge in this phase can
             be made by it — so the filter carries the two types that can occur. -->
        ${isR1() ? '' : h`<select class="select" ${noRows ? 'disabled' : ''}><option>All types</option><option>Subscription</option><option>SMS pack</option></select>`}
      <select class="select" ${noRows ? 'disabled' : ''}><option>Last 6 months</option><option>Last 30 days</option><option>Last 12 months</option><option>Custom range</option></select>
      <div class="toolbar-right">
        <button class="btn btn-outline" ${noRows ? 'disabled' : ''} data-act="exportHistory"><span class="btn-ico">${ICO.dl}</span>Export</button>
      </div>
    </div>

    ${body}
  </section>`;
}

// ── Banners ─────────────────────────────────────────────────────────────────
function banners() {
  const s = sc();
  const out = [];
  // Billing-tab alerts vs SMS-tab alerts — both tabs now live under My Account.
  // Merged, the billing tab IS the SMS surface, so SMS-scoped banners belong there
  // too — otherwise folding the tabs together would silently drop them.
  /* The banner CTA is a shortcut TO Payment methods (§12.3: every card-management route
     ends on this tab). On the Subscription tab that section is already on screen just
     below, so the button is the same control twice — Grace, 9/8: "이런버튼은 솔직히 그냥
     밑으로 보내는거잖아! 삭제해줘". It is kept on every other tab and on the campaign
     screen, where the banner is the only way across. */
  const nearCards = s.screen === 'account' && S.tab === 'billing' && s.sub !== 'free';
  /* The grace banner escalates instead of shouting from day one (Grace, 9/8: "저건 2일
     남았다든지 하는 그럴때 나와야하고 우선은 간단하게 한줄"). §5.3 · PB 5.3.0 already stage
     it that way — D0 알림 → D+3 리마인더 → D+7 자동 해지 — so the screen follows the same
     two beats: one line while there is time, the full consequence once the reminder is due.
     7-day grace, so D+3 is 4 days left. */
  const graceLate = graceLeft() <= 4;
  const onBilling = S.tab === 'billing';
  const onSms = S.tab === smsTab();
  const onCampaign = s.screen === 'campaign';

  /* The lock pattern says the banner is the one thing that carries the fix, so it

  const hadScheduled = !!(s.credits && ((s.credits.smsRes || 0) + (s.credits.mmsRes || 0)) > 0);

// ── Screen: SMS credit dashboard ────────────────────────────────────────────
// The number that answers "can I send right now?" is Available, not Remaining —
// so that's the hero. Remaining and Reserved support it underneath.
/* Auto-recharge is out of Phase 2.5 (meeting, 2026-08-24), and its threshold went with
   it — but `RUNNING LOW` stays, because without auto-recharge a warning is the ONLY
   thing between a vendor and a hard stop (Grace: "충전해서 사용하는 방식이어도 넘 조금
   남아있으면 얘기는 해줄 수 있잖아").
   SOURCED 2026-09-08 (Grace: 제니 규칙으로) — the flat 200 was ours (Gap B7-6). 2차 PRD §4
   · PB 3.4.0 gives the rule instead: stage 1 fires at **20% of the last pack the vendor
   bought** — it scales itself to the vendor, no setting — and stage 2 at zero. So the
   threshold is derived from purchase history, never a constant.
   A vendor who has never bought a pack has no last pack, so there is no stage-1
   threshold and only the zero state can show. That case is real — the 3,000 free credits
   arrive before any purchase (진아 spec §3) — and NO DOC COVERS IT. Logged for the PRD
   rather than filled in with a number of ours. */
/* The threshold's "last pack" comes from the same ledger the history shows, so the RUNNING LOW
   badge and the table can never describe different purchases. */
const ledgerRows = () => LEDGERS[unifiedTotals(sc().credits).remaining] || [];
const lastPackCredits = () => {
  const buys = ledgerRows().filter(r => r.src === 'Credit purchase')
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  return buys.length ? buys[0].n : 0;
};
/* THREE RULES, NOT ONE (Grace, 2026-09-14) — this replaces PB 3.4.0's flat 20%, which is
   therefore a logged deviation until the PRD catches up:
     · never bought a pack → under 600 (the 6,000 grant ÷ 10)
     · otherwise           → 10% of the last pack bought, OR 100, whichever fires first
   "혹은" is an OR on the CONDITION (available <= 10% OR available <= 100), which is the
   LARGER of the two thresholds - hence Math.max, not Math.min.
   ⚠ With today's pack list the 100 never fires on its own: the smallest pack is 2,000, so
   10% is never below 200. It starts doing work only if a pack under 1,000 is ever configured
   (진아 §3 keeps the pack-price set in config, so that is a real possibility). It already
   has ONE live job, though - a vendor with no purchase history at all had an UNREACHABLE
   warning under the old rule (20% of nothing is 0), and now gets the floor.
   The free rule is "600 미만", strictly under, so the inclusive boundary is 599. */
const LOW_PCT = 0.1;
const LOW_FLOOR = 100;
const LOW_FREE_UNDER = 600;
const lowThreshold = () => {
  // The 600 rule is for a vendor who has never bought a pack (SMS PRD §5.1). Once a pack
  // exists its 10% is the threshold, even while free credits remain.
  const last = lastPackCredits();
  return last ? Math.max(Math.round(last * LOW_PCT), LOW_FLOOR) : LOW_FREE_UNDER - 1;
};

const TFN = '+1 (888) 555-0182';
/* MAX_INBOUND_GRACE removed 2026-09-11 — inbound grace is invisible to the vendor now
   (진아 정책 변경), so no screen in this file can reach the number. It is 10, account-wide,

/* Free credits expire **90 days** from issue (Grace, 2026-09-08). Both PRDs allow it and

   제니 §5's cited CPC precedent (실결제 무기한 / 프로모 ~3개월). The date is what the screen
   shows; the number lives here so the rule has one home.
   ⚠ The legal condition attached to promo expiry is **사전 고지** (제니 §2 · §5 checklist):
   the card's line below is the in-app half. 제니 §2 also asks for an expiry BATCH and an
   advance-notice ALERT — those are dev/notification scope and are not drawn yet. */
/* 진아 spec §1 objective — SMS $0.02 = 1 credit, MMS $0.04 = 2 credits. The packs are
   priced off this, which is why the bonus tiers can be expressed as extra credits. */
const CREDIT_UNIT = 0.01;
/* 진아 spec §7 — the postpaid→prepaid cutover. The DATE IS A PLACEHOLDER: §0 and §7 both
   say 10월 말 예상 · 재무·Operation 협의 예정, so nothing is fixed. Oct 31 is used because it
   sits just after release 1's clock (Oct 28), which is the world this notice belongs to —

   §7 asks for it 30 days ahead, ~9/25. */
const SMS_CUTOVER = 'Nov 1, 2026';

/* ── Scheduling during the prepaid switch (Send Time - Prepaid transition v0.1) ──
   A campaign scheduled past the switch would send from a credit balance that does not
   exist yet, so the picker is capped until the switch is done. ONE date drives all of
   it: the last schedulable day is the day before the switch, normal 30-day scheduling
   returns the day after, and every string below reads those two — move SMS_CUTOVER and
   the rules, the cap and the copy all move together. */
const dOf = (str) => new Date(str + ' 00:00:00');
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const shortD = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const fullD  = (d) => d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
const slashD = (d) => String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + '/' + d.getFullYear();
/* The product clock sits after the switch in both releases, so the transition would never
   be reachable for review. These three put it on either side of the window and inside it. */
const SEND_CLOCKS = { before: 'Sep 23, 2026', during: 'Oct 05, 2026', after: 'Nov 03, 2026' };
const sendToday   = () => dOf(SEND_CLOCKS[S.sendClock] || SEND_CLOCKS.during);
const schedCap    = () => addDays(dOf(SMS_CUTOVER), -1);   // last day before the switch
/* The cap can land on a weekend, and the copy has to name a day the vendor can actually
   pick — so it walks back to the last weekday rather than printing a Saturday. */
const lastPickable = () => { let d = schedCap(); while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, -1); return d; };
const schedResume = () => dOf(SMS_CUTOVER);                // scheduling reopens on the switch day
const normalMax   = () => addDays(sendToday(), 30);
/* Nothing is said before the cap actually bites: until today + 30 reaches past it, the
   picker is unchanged and no transition copy appears anywhere. */
const inTransition = () => sendToday() < schedResume() && normalMax() > schedCap();
const schedMax     = () => inTransition() ? schedCap() : normalMax();
const TRANS_COPY = {
  helper:  () => 'Available through ' + shortD(lastPickable()) + ' while we switch to prepaid credits.',
  strip:   () => 'Dates after ' + shortD(lastPickable()) + ' are unavailable while we switch to prepaid credits. 30-day scheduling returns ' + shortD(schedResume()) + '.',
  tooltip: () => 'Unavailable while we switch to prepaid credits. You can schedule this date starting ' + shortD(schedResume()) + '.',
};
/* Weekend and beyond-30-days keep the picker's existing muted style. Transition-blocked is
   the one new state, and it is a WEEKDAY that would normally be selectable. */
function dayState(d) {
  if (sameDay(d, dOf(S.schedDate))) return 'sel';
  if (d < sendToday() && !sameDay(d, sendToday())) return 'past';
  if (d.getDay() === 0 || d.getDay() === 6) return 'off';
  if (d > normalMax()) return 'off';
  if (inTransition() && d > schedCap()) return 'blocked';
  return 'on';
}
/* A stored date can fall outside the window when the clock moves, so it is pulled back to
   the last day that is actually selectable rather than left pointing at a blocked one. */
function clampSched() {
  let d = dOf(S.schedDate);
  if (d < sendToday() || d > schedMax()) d = schedMax();
  while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, -1);
  S.schedDate = fullD(d);
  S.calMonth = null;
}

  // 90 days from the day the grant was issued (TFN approval, 진아 §3).
  const freeExpiry = (free && sc().credits.freeIssued)
    ? plusDays(sc().credits.freeIssued, FREE_CREDIT_DAYS) : null;
  const freeDays = freeExpiry ? daysUntil(freeExpiry) : null;
  const lowAt = lowThreshold();
  const low = lowAt > 0 && available > 0 && available <= lowAt;
  const empty = available === 0;

  // `Blocked` → `Out of credits` (Grace, 2026-09-08) — see the note above outOfCreditsLine.
  const badge = empty ? '<span class="pill red">Out of credits</span>'
              : low   ? '<span class="pill amber">Running low</span>' : '';

  return h`
  <div class="balance-card">
    <div class="section-head">
      <!-- The badge sits beside the card's name, where the subscription card puts its own
           ("Subscription" + ACTIVE badge, §12.3.1). On the hero's unit line it competed
           with the figure it was describing. -->
      <div><div class="section-title">Message credits ${badge}</div></div>
      <!-- A sub-account keeps the whole tab and loses only the control (Grace, 9/8): the
           file's lock pattern is disabled + a tooltip that says why, never a screen swapped
           out for a sentence. Checked FIRST, so it still explains itself at zero balance,
           where the button is otherwise handed to the banner. -->
      ${!isMaster()
        ? lockTip(h`<button class="btn btn-outline" disabled>Buy SMS credits</button>`, MASTER_ONLY.buy)
      : isLocked()
        ? lockTip(h`<button class="btn btn-outline" disabled>Buy SMS credits</button>`, lockWhy("buy"))
      /* At zero the out-of-credits banner sits right above this card carrying the same Buy
         credits button, and two identical controls a few pixels apart is the repetition this
         project rules out — the same reasoning the number card's CTA already uses. */
      : empty
        ? ''
        : h`<button class="btn btn-outline" data-act="buyPack" data-val="credits">Buy SMS credits</button>`}
    </div>

    <!-- In the GAUGE preview the hero is the TOTAL, not the available figure (Grace, 9/9:
         "위의 숫자가 1,080이라 그래프의 총이 1,080 같은 느낌"). She is right, and it is
         structural rather than cosmetic: a composition bar's 100% is the balance, so a hero
         reading "available" makes two elements claim different wholes. Either the hero owns
         the bar's scale or the bar is not a composition — and with the total leading, each
         number appears exactly once and the answer to "can I send now?" is the solid segment,
         still the largest thing in the bar. That is the trade the gauge asks for; the settled
         card (switch off) keeps "available" as the hero and needs no bar to justify it. -->
    <!-- CANCELED: the card stops claiming availability. "Available balance 1,880" was false
         here - the credits are frozen (2차 §5 freezes rather than forfeits), so zero can be
         spent. Grace asked on 9/9 whether to add a banner instead; a banner under a wrong
         number argues with it rather than fixing it, and this tab would then state one fact
         three times (banner + the number card's sentence + the disabled button's tooltip).
         The three-cell view is dropped too: with Scheduled at 0 there is nothing to break
         down, and the shape itself asserts an available balance. One figure, one line - the
         card's own settled grammar. The sentence is the frozen banner's, which already
         carries this in 제니's words on Billing. -->
    <!-- Only when something is actually scheduled. With a reserve of 0 the three rows read
         3,000 / 0 / 3,000 - two of them the same figure and a rule between them accounting
         for nothing. The card already works this way elsewhere ("one sentence, and only when
         it has something to say"), so it falls back to the plain hero. -->
    ${!isCanceled() && S.balView === 'statement' && reserved ? h`
    <div class="bal-stmt">
      <div class="bal-stmt-row"><span class="s-lab">Total balance</span><span class="s-val">${n(remaining)}</span></div>
      <div class="bal-stmt-row"><span class="s-lab">Scheduled for campaigns</span><span class="s-val">${n(reserved)}</span></div>
      <div class="bal-stmt-row is-result"><span class="s-lab">Available to use</span><span class="s-val">${n(available)}</span></div>
    </div>
    ${reserved ? h`
    <div class="bal-note">Scheduled credits are held for campaigns you’ve already booked — not spent, and returned if you cancel one.</div>` : ''}` : ''}
    ${isCanceled() ? h`
    <div class="bal-hero">
      <span class="balance-big">${n(remaining)}</span>
      <span class="balance-unit">credits frozen</span>
    </div>
    ${free ? h`
    <!-- FREE FIRST, in both senses (Grace, 2026-09-11). Free credits are spent before paid
         ones (진아 §4), and here they are also the half with a clock - so they lead, and the
         paid balance reads as "the other". One word - "frozen" - had been covering two
         different behaviours: paid credits have NO deadline and come back whole on
         resubscribe; free credits keep expiring while the account is cancelled, and if the
         vendor returns after the date they are simply gone. The card said only the first.
         The free note below is suppressed in this state - its line about spending order is
         present-tense sending advice on an account that cannot send. -->
    <div class="bal-note is-deadline"><strong>${n(free)} free credits</strong> expire <strong>${freeExpiry}</strong> — resubscribe before then or they are gone.</div>
    <div class="bal-note">The other <strong>${n(remaining - free)}</strong> stay on your account with no deadline, and become usable again the moment you resubscribe.</div>`
    : h`
    <div class="bal-note">They stay on your account and become usable again the moment you resubscribe.</div>`}`
    : (S.balView === 'statement' && reserved) ? ''
    : S.balView === 'trio' ? h`
    <div class="bal-trio">
      <div class="t-cell"><span class="t-lab">Total</span><span class="t-val">${n(remaining)}</span></div>
      <div class="t-cell"><span class="t-lab">Scheduled</span><span class="t-val">${n(reserved)}</span></div>
      <div class="t-cell is-result"><span class="t-lab">Available balance</span><span class="t-val">${n(available)}</span></div>
    </div>
    <!-- What the minus sign was trying to say, said in words instead. Only ONE of the three
         labels needs explaining - Total and Available explain themselves - so the line
         defines Scheduled rather than restating the arithmetic, which is already visible
         once you know that word. Same 12px secondary voice the gauge view's line uses, and
         it appears only when something is actually scheduled. -->
    ${reserved ? h`
    <div class="bal-note">Scheduled credits are held for campaigns you’ve already booked — not spent, and returned if you cancel one.</div>` : ''}` : h`
    <div class="bal-hero">
      <span class="balance-big">${n(S.balView === 'gauge' && reserved ? remaining : available)}</span>
      <span class="balance-unit">${S.balView === 'gauge' && reserved ? 'credits total'
        : 'credits available'}</span>
    </div>`}

    <!-- Option C: the figure leads, the bar is the sentence's picture, the sentence explains
         it. Switched from the panel (Gauge · off by default) — nothing about the settled card
         changes while it is off. -->
    ${S.balView === 'gauge' && reserved ? (() => {
      const pa = (available / remaining) * 100, pr = (reserved / remaining) * 100;
      return h`
    <div class="bal-gauge">
      <div class="g-avail ${pa < 20 ? 'is-narrow' : ''}" style="width:${pa}%">${pa < 20 ? '' : h`${n(available)} available`}</div>
      <div class="g-held ${pr < 20 ? 'is-narrow' : ''}" style="width:${pr}%">${pr < 20 ? '' : h`${n(reserved)} reserved`}</div>
    </div>
    <div class="bal-total">Reserved is held for scheduled campaigns — not spent, and it returns if a campaign is canceled</div>`;
    })() : ''}

    <!-- One sentence, and only when it has something to say. 진아 spec §11-A's screen word
         for a hold is Reserve; the sentence form is Grace's from 2026-08-24, because three
         bare numbers (available · held · balance) made the vendor work out which pair adds
         up. With nothing reserved, available IS the balance and the line would only repeat
         the figure above it. -->
    ${reserved && S.balView === 'sentence' ? (() => {
      /* WHICH campaigns hold the reserve is answered on demand, not in the sentence — names
         listed inline read as a list crammed into prose, and "and 5 more" was the tell. The
         sentence keeps its short form and "scheduled campaigns" opens a hover card in the
         credits popover's own row grammar (S17) — the campaigns only. The total is already
         in the sentence right above the trigger, so the card does not state it again.
         The word on screen is Scheduled, never Pending.
         Hover, focus and click all open it. This admin is desktop-only, so hover is safe as
         the main way in — but a keyboard has to reach it, and review has to be able to pin
         it open. The rows always add up to the total: past five, the tail is one summed row. */
      const hs = schedHolds();
      const shown = hs.length <= 5 ? hs : hs.slice(0, 4);
      const rest = hs.slice(shown.length);
      const restC = rest.reduce((t, x) => t + x.credits, 0);
      const phrase = hs.length === 1 ? 'a scheduled campaign' : 'scheduled campaigns';
      return h`
    <div class="hold-block"><div class="bal-note"><strong>${n(reserved)}</strong> of your <strong>${n(remaining)}</strong> credits are reserved for <span class="hold-card ${S.holdPop ? 'is-open' : ''}"><span class="hold-trig" tabindex="0" role="button" aria-haspopup="true" data-act="holdPop">${phrase}</span><span class="hold-pop usage-card" role="tooltip">
      ${shown.map(x => h`<span class="uc-row"><span class="uc-k">${x.name} · ${x.date.replace(', 2027', '')}</span><span class="uc-v">${n(x.credits)}</span></span>`).join('')}
      ${rest.length ? h`<span class="uc-row"><span class="uc-k">${rest.length} more campaigns</span><span class="uc-v">${n(restC)}</span></span>` : ''}
    </span></span></div></div>`;
    })() : ''}
    <!-- 진아 spec §3: 3,000 free credits are issued at the FIRST TFN approval, once per
         vendor. The note used to lead with the figure and carry the campaign-only RESTRICTION
         underneath; that restriction is gone (9/10 §3), so the second line now carries the two
         facts that are left — spent before paid credits, and usable anywhere they are. -->
    ${free && !isCanceled() ? h`
    <div class="rate-banner is-free">
      <span class="rate-banner-ico">${ICO.check}</span>
      <div>
        <div class="rate-banner-title"><strong>${n(free)} free credits</strong> came with your approved number</div>
        <!-- The expiry rides on the restriction line, in the Free plan row's grammar
             ("until {date} · N days left") — the one shape Grace settled on 9/2 for a "runs
             until a date". 사전 고지 is the legal condition on promo expiry (제니 §2 · §5),
             and this line is its in-app half. -->
        <div class="rate-banner-sub">Used before your paid credits, on campaigns and 1:1 chat alike.</div>
        ${freeExpiry ? h`
        <div class="plan-when">Use by <strong>${freeExpiry}</strong> <span>·</span> ${freeDays} days left</div>` : ''}
      </div>
    </div>` : ''}
    ${creditRateStrip()}
  </div>`;
}

// The auto-recharge card sits below the two balances in split mode, and beside
// the single balance in unified mode — so it lives in its own function.
/* PRD §9 gates on three things — vendor active, subscription not canceled, a
   registered card — plus sufficient counts to send. The tab showed only the
   counts, so a suspended vendor saw a balance with no hint that nothing would
   send. The number is the subject of the card because it is the thing that
   sends, so the status badge belongs to it.

   Setup is already done by the time a vendor reaches this tab — only a vendor
   that has been active can see it — so the carrier-registration lifecycle never
   appears here. What changes the number's state is *payment*, and that is fully
   documented, so none of this copy is invented:

   ⚠️ Renumbered and re-sourced against PRD v2.1 (2026-09-01). The old mapping ran off
   the retired vendor state `suspended`, which §4.1 · §5.5 abolished outright — 정지
   개념 자체를 쓰지 않음 — so the third row now hangs off the subscription state:

     Active    `active`    — §4.2, the state where paid features run
     Pending   `past_due`  — §4.2 keeps paid features in {active, past_due}, and
                             §5.1 · PB 5.2.0 call the server-error half 벤더 무통보,
                             so sending continues and there is nothing to fix
     Inactive  `canceled` / `free` — §4.2 "해지된 벤더 = 미구독 벤더와 동일", paid
                             features unavailable; 2차 PRD §5 freezes credits rather
                             than forfeiting them; recovery is 재구독 (§5.5.3)

   The CTA target is specified: §12.3 sends every failure banner to the
   Subscription tab > Payment methods. Pending gets no button because
   §5.1 says the vendor is unaffected — a control there would have no task. */
const NUMBER_STATES = {
  active:   { pill: 'green', label: 'Active',   blocks: false,
              text: () => `Used for campaigns and 1:1 chat` },
  pending:  { pill: 'amber', label: 'Pending',  blocks: false,
              text: () => `We're retrying your payment — sending continues` },
  inactive: { pill: 'red',   label: 'Inactive', blocks: true,
              text: () => `Sending is paused until your payment is updated — your credits are frozen, not lost`,
              cta: 'Update payment', act: 'goBilling' },
  // Same Inactive label — there are only ever three — but a different cause needs
  // a different sentence and a different way out. Nothing is wrong with the card
  // here, so telling them to update payment would be misleading. §9 closes the SMS
  // menu on `canceled`, which is why the number stops rather than "pauses".
  /* PM 9/9 wanted this written out rather than left as one word, and that is right — a badge
     cannot say why. Two changes to their draft: the sentence does NOT use `reserved`, which in
     this product is the credit hold's word (진아 §11-A, and the card right below says "800 …
     are reserved for scheduled campaigns" — one word cannot mean two things on one screen),
     and it does not ask for the re-subscribe, because the button beside it already does.
     `held` is free: the credits used to own it and gave it up when they took `reserved`.
     The badge stays. It answers "can I send right now?" at a glance, which a sentence cannot,
     and Active / Pending / Inactive stays a set of three. */
  /* NO CONTROL (Grace, 9/9: 그건 Subscription 탭에서 할 일이야, 안내만 해야돼). Resuming is a
     subscription action and it belongs to the tab that owns the subscription — this card's job
     on SMS Settings is to say what is true about the number and where the fix lives. Naming
     the tab is the informative half; §12.3 already routes every recovery to that tab, so the
     sentence points the same way the docs do. (The `inactive` entry above keeps its route CTA
     and is unreachable in any case: `sub: 'free'` renders smsNotSubscribed instead.) */
  canceled: { pill: 'red',   label: 'Inactive', blocks: true,
              text: () => `Your number is held until ${numberHeldUntil()}. Resume in Subscription before then and you keep it.` },
  /* The hold ran out. NO NUMBER and therefore NO BADGE - a badge answers "can I send right
     now?" about a number, and there is no number to answer for; Active / Pending / Inactive
     stays a set of three. The card keeps its title and says what happened, which makes it an
     empty state rather than a status.
     What the copy deliberately does NOT say: whether resubscribing gets the SAME number back.
     Figma has a "number deleted after 3 months" line that no PRD carries, and same-number
     recovery is open with 진아 (C-3c) - so "set up SMS again" points at the tab without
     promising either answer. "released" rather than "deleted" for the same reason: released
     is what we can observe, deleted is a claim about their data. */
  /* ONBOARDING IS THE SECOND STEP (Grace, 2026-09-10: 너 다시 SMS온보딩까지 해야된다는거
     추가해줘). Resubscribing alone does not get SMS back - the number is gone, and 진아 §2
     gates both sending and top-up on TFN status = Approved, so the vendor has to go through
     onboarding again and wait for an approval. Leaving that out made the way back look like
     one click. Still says nothing about WHICH number: "a number is approved" is true whether
     the application returns the old one or a new one, and that is C-3c, open with 진아. */
  released: { pill: null, label: null, blocks: true, noNumber: true,
              text: () => `Your number was released on ${numberHeldUntil()}, ${NUMBER_HOLD_MONTHS} months after your subscription ended. To use SMS again, resubscribe in Subscription and go through SMS onboarding again — sending resumes once a number is approved.` },
};

/* The state is a payment consequence, so it is derived — never switched
   independently. An independent switch could produce states that cannot exist
   (Active above "Subscription suspended", or Inactive telling the vendor to
   update a payment that is current), and each of those read as bugs on screen.
   The mapping is §8.2's subscription status, one to one:

     active / free_period → Active     charges current, nothing in the way
     past_due             → Pending    server-error retry, vendor unaffected
     suspended / canceled / none → Inactive   paid features blocked (§8.1)

   Pending is reachable through the `pastDue` scenario. */
function numState() {
  const sub = sc().sub;
  if (sub === 'past_due') return 'pending';
  /* Two flavours of `canceled`, told apart by a scenario flag rather than by comparing today
     against numberHeldUntil(). Same shape as canceledGrace's `viaGrace`: the state stays
     derived from data, and the demo does not depend on date arithmetic to reach it. */
  if (sub === 'canceled') return sc().numberReleased ? 'released' : 'canceled';
  if (sub === 'canceled' || sub === 'free') return 'inactive';
  return 'active';
}

function sendingStatusCard() {
  const s = sc();
  const c = s.credits;
  const cards = s.cards.map(id => CARDS[id]);
  const num = NUMBER_STATES[numState()];
  /* The top-up gate is the two docs' UNION — four conditions (Grace, 9/8), each placed
     where it can be acted on so none is stated twice:
       구독 not canceled  2차 PRD §6  → the subscription row below, or this number's own state
       카드 등록          2차 PRD §6  → the card row below. Buying still opens with Add card,
                                        because §3 has the purchase flow raise the card form
       TFN approved       진아 §2      → NOT drawn here: the number-under-review screen already
                                        exists in the SMS onboarding flow (Grace, 9/8)
       Master 계정        진아 §2      → the Buy control, disabled with a tooltip */
  const available = isUnified()
    ? unifiedTotals(c).remaining - unifiedTotals(c).reserved
    : (c.sms - c.smsRes);

  const checks = [
    { key: 'sub',
      // §4.2 — paid features run in {active, past_due}, grace included.
      ok: paidOn(),
      okText: 'Subscription active',
      badText: s.sub === 'canceled'  ? 'Subscription canceled — sending is off'
             : 'No active subscription',
      /* Both branches ROUTE to the Subscription tab; neither performs the subscription
         action from here (Grace, 9/9). The row is filtered out for a blocked number anyway —
         the note above already carries that state — but the code should not hold a Resume
         that fires from SMS Settings in case the filter ever changes. */
      act: 'goBilling',
      cta: s.sub === 'canceled' ? 'Go to Subscription' : 'Fix payment' },
    { ok: cards.length > 0,
      okText: 'Payment method on file',
      /* "purchased", not "charged" (Grace, 2026-09-09). Same rule as payWithRow: a pack is
         a ONE-TIME purchase, so the consequence is that it cannot be bought - "charged" put
         a subscription word on it. "purchase" is already this file's noun for the event
         (the ledger's own source is "Credit purchase"), and the passive keeps the sibling
         row's shape: state, dash, consequence. */
      badText: 'No payment method — packs can\'t be purchased',
      act: 'addCard', cta: 'Add card' },
    /* The credits row lived here until 2026-08-24 and was removed: the out-of-credits
       BANNER on this same screen carries the identical sentence and its own Buy button,
       so the gate listed the blocker twice with two ways to fix it. Zero credits still
       shows on the balance card as BLOCKED (2차 PRD §4), so the state is not lost — only the
       second copy of it. This list is now the blockers the banner does NOT cover. */
  ];
  // The head already carries the number's own state and action, so the list
  // below is the other blockers only. Guard on that list — not on every blocker
  // — or a number-only problem leaves an empty bordered div.
  // A blocked number IS the subscription problem surfacing on the number — whether
  // suspended or canceled — so showing the subscription row too would state one
  // fact twice with two identical buttons. Keyed, not matched on the action, so it
  // keeps holding when the action differs by cause (Fix payment vs Resume).
  const otherBlockers = checks.filter(x => !x.ok && !(num.blocks && x.key === 'sub'));

  // Identity-card pattern (SendGrid Sender Identity, Klaviyo sending domain,
  // Twilio phone numbers): icon tile, the identifier as the hero, its own status,
  // one line on what it's for, and the action. Blockers append below.
  return h`
  <section class="section-card num-card ${num.pill}">
    <div class="section-head">
      <div>
        <!-- Pill beside the name, the way Subscription and Payout account carry theirs -
             .section-title is an inline-flex with a 10px gap built for exactly this. -->
        <div class="section-title">Your SMS number ${num.label ? h`<span class="pill ${num.pill}"><span class="num-dot"></span>${num.label}</span>` : ''}</div>
        <!-- The three consumers in the Active line are documented: 통합 v0.6 §7.5 lists
             Campaign and Automated (order confirmations, flows, 1:1 chat) as what
             draws credits, and 통합 v0.6 §7.6 / Handoff §5 split usage history into
             campaign / automated / 1:1 chat. -->
        <div class="section-desc">${num.text()}</div>
      </div>
      <!-- This CTA exists because in the 5-tab layout the SMS tab has no banner,
           so the number card is the only thing offering a way out. Merged, the
           same screen always already has an owner — the danger banner when
           suspended or expired, the subscription card's Resume when canceled — so
           keeping it here would put the identical control on the page twice. -->
      ${(num.cta && !(isMerged() && num.blocks))
        ? h`<button class="btn btn-outline" data-act="${num.act}">${num.cta}</button>` : ''}
    </div>
    ${num.noNumber ? '' : h`<div class="num-value">${TFN}</div>`}

    ${otherBlockers.length ? h`
      <div class="check-list">
        ${otherBlockers.map(x => h`
          <div class="check-row is-bad">
            <span class="check-ico">${ICO.alert}</span>
            <span class="check-text">${x.badText}</span>
            <button class="btn btn-sm btn-outline" data-act="${x.act}" data-val="${isUnified() ? 'credits' : 'sms'}">${x.cta}</button>
          </div>`).join('')}
      </div>` : ''}
  </section>`;
}

function smsNotSubscribed() {
  // A vendor that has never subscribed has no number, no credits and no card, so
  // every card below would describe things that do not exist — "your credits are
  // frozen" to someone who has none, a number they were never issued.
  return h`
    <section class="section-card">
      <div class="section-head"><div>
        <div class="section-title">SMS is part of the Shopcord plan</div>
        <div class="section-desc">Subscribe to get your sending number and start buying message packs.</div>
      </div>${isMerged() ? '' : '<button class="btn btn-primary" data-tab="billing">See the plan</button>'}</div>
    </section>`;
}

function smsGateAndCredits() {
  const c = sc().credits;
  return h`
    ${sendingStatusCard()}

    ${isUnified()
      ? (() => { const u = unifiedTotals(c); return balanceCardUnified(u.remaining, u.reserved); })()
      : h`<div class="balance-grid">
            ${balanceCard('SMS', c.sms, c.smsRes, Math.max(c.sms, c.mms))}
            ${balanceCard('MMS', c.mms, c.mmsRes, Math.max(c.sms, c.mms))}
          </div>`}


`;
}

/* SMS credit usage history — Figma 775:583263. Titled by Grace 2026-09-10; it replaced the
   old Usage history on 9/9 and holds BOTH
   directions: credits added (the welcome grant, pack purchases) and credits used (campaigns,
   1:1 chat). Grace, 9/9: 크레딧 산거 쓴거 넣어주고, 5줄 이후 페이지네이션.
   Columns are Figma's: Date · Source · Type · Credits, and an in-row reads `Credit` / `+ 3000`
   exactly as its example row does.
   Two deliberate deviations from that frame:
     · The DESCRIPTION changed. Figma still carries the old "What used your credits — this is
       consumption, not money charged", which was true when the table only held usage; with
       purchases in it the sentence is half the table. It now names both directions and says
       where the money is.
     · The "All sources" filter is GONE and Export takes its place — the frame shows Export
       only, and a filter whose options no longer match the rows would have to be redesigned
       anyway (진아 §10's four billable kinds are the axis for that — 질문지 C-5).
   What is NOT here: Release / Adjust / Expire rows. 진아 §11-B defines those ledger actions and
   제니 §2 keeps the ledger log internal (CS·차지백 증빙용, 벤더 미노출), so nothing invents them.
   ⚠ 제니 PB 3.6.0 says the vendor sees 구매 내역 with receipt links and NO usage screen at all
   ("내부 로그만"). This table is the newer Figma direction; the conflict is logged in the Gap. */
const CH_PAGE_SIZE = 5;
const creditHistory = () => creditsUsedRows0()
  /* No space after the sign, on both directions. It was "+ 5,250" against "-1,860", so the
     two directions started at different x positions in a tabular column and the table read as
     sloppy exactly where a vendor is checking arithmetic. */
  .map(r => ({ ...r, amt: (r.n > 0 ? '+' : '-') + n(Math.abs(r.n)) }))
  .sort((a, b) => new Date(b.date) - new Date(a.date));

/* Export writes the file in the browser — there is no server here, so what the table holds
   is what the file holds (every row, not the page on screen). Neither doc names a FORMAT:
   §12.3.3.2 gives Billing history the word `Export` and this table's Figma frame puts the
   same control here. CSV is the choice because it is what the reference set hands back
   (Klaviyo, Postscript and Mailchimp all export usage as CSV — Research doc, 9/8) and what a
   vendor can open without us. The signed number goes out plain (3000 / -480) so a spreadsheet
   reads it as a number. */
function exportCreditHistory() {
  const rows = creditHistory();
  const esc = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const line = (a) => a.map(esc).join(',');
  const csv = [line(['Date', 'Source', 'Type', 'Credits'])].concat(
    rows.map(r => line([
      r.date,
      r.src + (r.sub ? ' · ' + r.sub : ''),
      r.type,
      String(r.amt).replace(/[+\s,]/g, ''),
    ]))).join('\r\n');
  const stamp = new Date(clock().today).toISOString().slice(0, 10);
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `shopcord-sms-credit-history-${stamp}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Export ready', `${rows.length} rows · shopcord-sms-credit-history-${stamp}.csv`);
}

/* SMS-only Billing history (Grace, 2026-09-10: "빌리히스토리를 넣어야하는데 이건 SMS관련것만
   들어가! 아마도 크레딧 구매겠지"). Two tables on this tab now: this one is the MONEY, the
   credit history below it is the CREDITS.

   THIS CLOSES A REQUIREMENT I HAD LOGGED AS HOMELESS. 제니 PB 3.6.0 asks the vendor's credit
   screen for 구매 내역 WITH RECEIPT LINKS, and when the `Purchase history` card was deleted on
   9/9 that requirement lost its only home - the receipt link existed nowhere but the
   Subscription tab's Billing history. It has a home again.

   ROWS COME FROM THE LEDGER, not from the global HISTORY array. That is the same rule the
   balance already follows (LEDGERS keyed by the total it explains): the credit history and
   this table are TWO VIEWS OF ONE EVENT, so they read the same purchase rows and cannot
   disagree about a date or an amount. It also fixes a contradiction the split would
   otherwise have made visible on one screen - `numberReleased` carries history:false because
   the shared HISTORY describes a vendor who kept paying through Feb 2027, so a HISTORY-driven
   table would have shown nothing beside a credit history that clearly lists a 2,500 purchase.
   The dollar amount is DERIVED from PACKS by credit count, which is exactly how the vendor
   bought it - a pack is a price, and the credits are what it buys. */
const packPriceFor = (credits) => {
  const p = PACKS.credits.find(x => x.c === credits);
  return p ? { amt: p.p, bonus: p.bonus || '' } : { amt: '—', bonus: '' };
};
/* RENAMED AND RE-SPLIT 2026-09-16 (Grace). The two tables used to divide CREDITS from MONEY:
   one ledger of everything, one list of what was paid. They now divide by DIRECTION —
   "Credits Added" and "Credits Used" — which is the question a vendor actually arrives with.
   The consequence is that the free grant moves INTO the added table: it is a credit that
   arrived, and the old split kept it out only because no money changed hands. So this row set
   carries two kinds, and the money columns are blank for a grant rather than absent. */
const creditsAddedRows = () => ledgerRows()
  .filter(r => r.n > 0)
  .sort((a, b) => new Date(b.date) - new Date(a.date))
  .map(r => {
    const grant = r.src !== 'Credit purchase';
    const p = grant ? {} : packPriceFor(r.n);
    return { date: r.date, credits: r.n, amt: p.amt, bonus: p.bonus, grant };
  });

const creditsUsedRows0 = () => ledgerRows()
  .filter(r => r.n < 0)
  .sort((a, b) => new Date(b.date) - new Date(a.date))
  .map(r => ({ ...r, amt: '-' + n(Math.abs(r.n)) }));

function exportSmsBilling() {
  const rows = creditsAddedRows();
  const def = CARDS[sc().cards[0]];
  const esc = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const line = (a) => a.map(esc).join(',');
  const csv = [line(['Date', 'Item', 'Credits', 'Card', 'Amount'])].concat(
    rows.map(r => line([
      r.date,
      'SMS credits' + (r.bonus ? ' · ' + r.bonus + ' bonus' : ''),
      String(r.credits),
      def ? def.name + ' ····' + def.last4 : '—',
      r.amt,
    ]))).join('\r\n');
  const stamp = new Date(clock().today).toISOString().slice(0, 10);
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `shopcord-sms-billing-${stamp}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Export ready', `${rows.length} rows · shopcord-sms-billing-${stamp}.csv`);
}

// 5-tab layout: SMS Settings owns the whole SMS story, so it keeps both of its own
// history tables. Merged, those two collapse — Purchase history into Billing history,
// Usage history into the segmented history region. See mergedBillingBody().
/* `smsMasterOnly()` — a whole-tab "Credits are managed by the Master account" card — lived
   here from the morning of 9/8 and was removed the same day (Grace): swapping the screen for
   one sentence is not this file's pattern, and a sub-account still has business on this tab.
   The permission now sits on the Buy control as disabled + tooltip. If 진아님 confirms that
   the BALANCE is Master-only too (§2's AC says so), a no-access state comes back here. */

function creditsBody() {
  if (sc().sub === 'free') return smsNotSubscribed();
  /* Sub-accounts are NOT sent to a different screen — the Buy control above carries the
     permission (진아 §2 "충전 권한"). ⚠ DEVIATION: the spec's AC also restricts 잔액·사용내역
     조회 to the Master account, so a sub-account seeing the balance and the two tables goes
     beyond it. That is a permission rule rather than a layout call, so it is logged for
     진아님 (Gap I) rather than decided here. If it comes back as Master-only viewing, the
     tab needs a no-access state again. */
  /* Purchase history was removed 2026-09-09 (Grace). the credit usage history now carries the
     purchases as credit-in rows, and the money side of a purchase — amount, card, receipt —
     lives in Billing history on the Subscription tab, which has always held every pack row.
     The 4-tab layout dropped this card for exactly that reason back in August; the two
     layouts agree again.
     ⚠ 제니 PB 3.6.0 asks the vendor's credit screen for 구매 내역 **with receipt links**, and
     that requirement now has no home here — the receipt link only exists in Billing history.
     Logged in the Gap; if PB 3.6.0 is held to, this card comes back. */
  /* Credits first, money second: this tab's subject is the balance, and "where did my
     credits go?" is the question the vendor arrives with. The payment trail follows it. */
  return smsGateAndCredits() + creditHistorySection() + smsBillingSection();
}

/* 4-tab layout (PRD §3.1–3.2's documented structure) — SMS folded into
   Subscription.

   Folding two tabs into one page is only worth doing if the result reads as FEWER
   things, not the same seven stacked in a longer column. So the tab is three named
   groups, and every card belongs to exactly one of them:

     Shopcord subscription — what you pay for the platform. The group head carries
                             the status pill and Cancel/Resume, so the card inside
                             is just plan, price, dates and billed-to.
     SMS                   — the number, the credits, auto-recharge. One subject:
                             what sends and what it draws from.
     Billing               — the card pool and the history. Both belong here because
                             both are about money moving, and the card pool serves
                             the subscription and the packs equally (§4.1).

   Two consequences worth stating. Purchase history is DROPPED, not moved: Billing
   history already carries every pack row with the same receipts. And Usage history
   is not a fourth section — it is the second view of the history region, behind a
   Charges / SMS usage switch, so the money story and the credit story share a place
   without ever sharing a screen. */
function mergedBillingBody() {
  const s = sc();
  const subscribed = s.sub !== 'free';

  /* §3.4's "three stacked sections" are the CARDS, not groups of cards — Section 1
     Subscription, Section 2 Payment methods, Section 3 Billing history, which is
     exactly what the 5-tab billing tab renders. So merged, the honest structure is
     the doc's three sections plus SMS, and the only thing needing a group header is
     SMS, because it is the only one that holds several cards.

     An earlier version wrapped all three in invented groups named Subscription /
     SMS / Billing. Grace: "청구내역이 결국 빌링이잖아?" — right, and worse, "Billing"
     collided with the tab's own name while containing the billing history. Gone.

     Usage history moves into SMS rather than living behind a switch on the history
     card: §12.3.3 is charges, 통합 v0.6 §7.6's usage history belongs to the credit
     dashboard, and this puts each where its own doc says it goes. */
  const smsGroup = h`
    <div class="group">
      <div class="group-head">
        <div>
          <div class="group-title">SMS</div>
          <!-- The description names what the group HOLDS, so in the two access states it
               would describe cards that are not there — credits and usage for a sub-account,
               a balance for a number still under review. Empty rather than reworded: the one
               card inside already says what it is. -->
          <div class="group-desc">${subscribed
            ? 'Your sending number, the credits it draws from, and what used them.'
            : 'Included once you subscribe.'}</div>
        </div>
      </div>
      <div class="group-body">${subscribed
        ? smsGateAndCredits() + creditHistorySection()
        : smsNotSubscribed()}</div>
    </div>`;

  return subscriptionSection() + smsGroup + paymentMethodsSection() + billingHistorySection();
}
