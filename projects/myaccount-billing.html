/* Export stays a CSV of the orders in the current view — POs are a separate action. */
function exportOrders() {
  const esc = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const line = (a) => a.map(esc).join(',');
  const csv = [line(['Order Date', 'Order #', 'Buyer', 'Linesheet', 'Total', 'Shipment Created', 'Next Ship Deadline', 'Status'])]
    .concat(ORDERS.map(o => line([o.date, o.no, o.buyer, o.ls, o.total, o.ship, o.dl, o.status]))).join('\r\n');
  const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `shopcord-orders-${ORD_TODAY}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Export ready', `${ORDERS.length} orders · shopcord-orders-${ORD_TODAY}.csv`);
}

function render() {
  const s = sc();
  const screen = s.screen;

  document.getElementById('main').innerHTML =
    screen === 'orders' ? screenOrders()
    : screen === 'orderDetail' ? screenOrderDetail()
    : screen === 'campaign' ? screenCampaign()
    : screen === 'smsOverview' ? screenSmsOverview()
    : screen === 'smsChat' ? screenSmsChat()
    : screenAccount();

  // sidebar active state
  document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('active'));
  // Figma shows the footer with no selected state — "My Account" is always bold.
  if (screen === 'campaign') document.querySelector('[data-goto="campaign"]').classList.add('active');
  if (screen === 'orders' || screen === 'orderDetail') document.querySelector('[data-goto="orders"]').classList.add('active');
  document.getElementById('sb-acct-dot').hidden =
    !(inGrace() || (s.credits && s.credits.sms === 0));   // expiry no longer signals anything (§4.3.2)

  // transient event acknowledgement
  document.getElementById('toast-root').innerHTML = S.toast ? h`
    <div class="toast-wrap"><div class="toast ${S.toast.kind && S.toast.kind !== 'success' ? 'is-' + S.toast.kind : ''}" role="status" aria-live="polite">
      <span class="toast-ico">${S.toast.kind === 'info' ? ICO.info : ICO.check}</span>
      <div class="toast-body">
        <div class="toast-title">${S.toast.title}</div>
        ${S.toast.msg ? h`<div class="toast-msg">${S.toast.msg}</div>` : ''}
      </div>
    </div></div>` : '';

  // overlay — drawer for input, modal for confirmation only
  const root = document.getElementById('modal-root');
  if (!S.modal) root.innerHTML = '';
  else {
    const o = OVERLAYS[S.modal];
    /* data-modal makes each overlay addressable by its own key. The annotation layer resolves
       CSS selectors and document.querySelector returns the FIRST match, so a selector like
       ".modal .summary-box" silently lands on whichever modal renders that class first — pin 11
       (the SUBSCRIBE confirmation) was drawing on both purchase modals until this existed.
       Same trick as data-email on the shared email overlay. */
    root.innerHTML = o.kind === 'drawer'
      ? `<div class="drawer-scrim" data-act="scrim"></div><aside class="drawer" role="dialog" data-modal="${S.modal}">${o.render()}</aside>`
      : `<div class="scrim" data-act="scrim" data-modal="${S.modal}">${o.render()}</div>`;
  }

  // Annotation pins are positioned from the live DOM, so they re-place after every render.
  // This must run AFTER the overlay is painted: anTargets() scopes to the open modal, and
  // an empty #modal-root would leave the page's own pins sitting on top of the scrim.
  // Synchronous, not requestAnimationFrame: a backgrounded tab suspends animation frames
  // and the pins would then describe the previous state.
  if (typeof anSync === 'function' && typeof AN !== 'undefined' && AN.on) anSync();

  renderProto();
}

// ── Events ──────────────────────────────────────────────────────────────────
window.addEventListener('afterprint', () => { delete document.body.dataset.print; });

document.addEventListener('click', (e) => {
  const scEl = e.target.closest('[data-scenario]');
  if (scEl) { setScenario(scEl.dataset.scenario); return; }

  const tabEl = e.target.closest('[data-tab]');
  if (tabEl) { goTab(tabEl.dataset.tab); return; }

  const gotoEl = e.target.closest('[data-goto]');
  if (gotoEl) { go(gotoEl.dataset.goto); return; }

  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const act = actEl.dataset.act;

  switch (act) {
    // Orders — the PO's download entry points (§15.2 ① · PB 6.4.0)
    case 'ordToggle': {
      const no = actEl.dataset.val;
      if (S.ordAll) { S.ordSel = ORDERS.map(o => o.no); S.ordAll = false; }
      const set = new Set(S.ordSel || []);
      if (set.has(no)) set.delete(no); else set.add(no);
      S.ordSel = [...set]; render(); break;
    }
    case 'ordTogglePage': {
      const size = S.ordSize || 10, page = S.ordPage || 0;
      const shown = ORDERS.slice(page * size, page * size + size).map(o => o.no);
      if (S.ordAll) { S.ordAll = false; S.ordSel = []; render(); break; }
      const set = new Set(S.ordSel || []);
      const all = shown.every(no => set.has(no));
      shown.forEach(no => { if (all) set.delete(no); else set.add(no); });
      S.ordSel = [...set]; render(); break;
    }
    case 'ordSelMatching': S.ordAll = true; render(); break;
    case 'ordClear':       S.ordSel = []; S.ordAll = false; render(); break;
    case 'ordPage':        S.ordPage = Number(actEl.dataset.val); S.ordSel = []; S.ordAll = false; render(); break;   // a selection belongs to its page
    case 'ordDownloadPOs': {
      const picked = ordEffSel();
      const n = picked.filter(no => ordHasPO(ordFind(no))).length;
      const skip = picked.length - n;
      S.ordSel = []; S.ordAll = false;
      showToast(`${n} PO${n === 1 ? '' : 's'} downloaded`,
        `POs_${ORD_TODAY}.zip` + (skip ? ` · ${skip} not yet confirmed, skipped` : ''));
      render(); break;
    }
    case 'ordOpen': {
      const o = ordFind(actEl.dataset.val);
      setScenario(ordHasPO(o) ? 'orderDetail' : 'orderDetailNew');
      S.ordNo = o.no; render(); break;
    }
    case 'ordBack':       setScenario('ordersList'); break;
    case 'ordDownloadPO': S.docKey = 'po'; openModal('doc'); break;
    case 'ordExport':     exportOrders(); break;
    // Card entry is inline: land on Payment methods, expand the form, focus it.
    case 'addCard':
      if (sc().screen !== 'account') setScenario(sc().cardBad ? 'failed' : 'active');
      S.cardFlash = false;
      openModal('addCard');   // an overlay — no need to leave the screen
      break;
    case 'cardCancel':   closeModal(); break;
    case 'saveCard':
      S.modal = null;
      if (S.key === 'failed') {
        setScenario('restored');
        showToast('Payment restored',
          'Mastercard ····8210 was charged $20.00. Your subscription is active again' + (hasCredits() ? ' and your SMS credits are unfrozen.' : '.'));
      } else if (S.cardReturn) {
        // §14.2 step 2 — enrolment returns to the confirmation, it is not the end of the
        // flow. Without this the vendor has a card and no subscription. The flag is set by
        // whoever sent them here, so the picker's Add and the no-card path both come back.
        if (!sc().cards.length) sc().cards = ['visa'];   // the card just saved — it stays saved if the vendor stops at the confirmation
        S.modal = S.cardReturn; S.cardReturn = null; S.cardStep = null; render(); break;
      }
      S.cardFlash = true; render();
      setTimeout(() => { S.cardFlash = false; render(); }, 1800);
      break;

    // §6.2 step 1 → 2 or 3: no card enrols first, an existing card goes straight
    // to the confirmation. Either way consent is recorded before anything charges.
    case 'subscribe':
      S.consent = false;   // a fresh dialog is never pre-consented (PB 2.3.0)
      S.cardStep = null;   // and it opens on the card that is actually on file
      // A declined default is checked BEFORE the confirmation screen: consenting to a charge
      // we expect to fail is worse than one extra step (PB 1.8.0 · §5.1).
      // 🔴 That check is also why "the default card is declined" cannot arise INSIDE the
      // popup today. If K-22 is ever reversed, the card slot needs a change control here.
      if (defaultDeclined()) { S.tab = 'billing'; openModal('subscribeBlocked'); }
      // §14.2 step 2 — no card enrols FIRST, in its own modal, because Balance's widget cannot
      // be embedded in the confirmation (PM, 9/22). saveCard brings the vendor back here.
      else if (!sc().cards.length) { S.cardReturn = 'confirmSubscribe'; S.tab = 'billing'; openModal('addCard'); }
      else { S.tab = 'billing'; S.modal = 'confirmSubscribe'; render(); }
      break;
    // Adding a card from the confirmation's picker: same modal, same return.
    case 'subAddCard': S.cardReturn = 'confirmSubscribe'; openModal('addCard'); break;
    /* Choosing a card here IS setting the default (PB 1.4.0), so it reorders the list exactly
       the way `setDefault` does, then carries the vendor on to the confirmation screen rather
       than dropping them back on the page to press Subscribe a second time. */
    case 'subPickCard': {
      const id = actEl.dataset.val;
      sc().cards = [id, ...sc().cards.filter(x => x !== id)];
      sc().cardBad = false;   // the declined card is no longer the one being charged
      S.cardStep = null;      // back to the filled view, now showing the card just chosen
      S.modal = 'confirmSubscribe'; render();
      showToast('Default card changed', `${CARDS[id].name} ···· ${CARDS[id].last4} will be charged.`);
      break;
    }
    // Confirming the cancel modal used to just close it, leaving the vendor on the
    // screen they were cancelling from — the state they landed in didn't exist.
    case 'doCancelSub':
      S.modal = null; setScenario('cancelling'); S.tab = 'billing';   // the scenario carrying cancelAt
      // Not `canceled` — that is the state after the period ends (§7). Telling the
      // vendor "paid features are off" the instant they confirm was false for a month.
      showToast('Cancellation scheduled',
        `Your subscription stays active until ${clock().next}. Resume any time before then and nothing is charged.`);
      render();
      break;
    /* §3.5 재개 (해지 철회) ONLY — the period is still running, so this clears the flag and
       charges nothing (PB 2.7.0 "무결제 복귀"). The subscription and its consent are the
       same ones, so §14.2 is not re-run. Coming back from `canceled` is a different thing
       — "신규 구독 플로우" — and goes through `subscribe`. */
    case 'resumeSub': {
      S.modal = null; setScenario('active'); S.tab = 'billing';
      showToast('Subscription resumed',
        'Your subscription continues as normal. Nothing was charged — the current period was already paid for.');
      render();
      break;
    }
    // PB 2.3.0 stores the consent, so the box has to be ticked before anything is recorded.
    case 'consentToggle': S.consent = !S.consent; render(); break;
    // The card slot's three views (Grace, 9/22) — never a second dialog.
    case 'cardPick':     S.cardStep = 'pick'; render(); break;
    case 'cardSlotBack': S.cardStep = null;   render(); break;
    case 'doSubscribe': {
      /* §14.2 ④⑤ resolve here: consent stored, subscription started, card charged (nothing on
         a trial). A card always exists by now — the card modal ran first if there was none
         (§14.2 ②) — so PB 2.3.0's record can carry the card ID. */
      const trial = trialOffered();   // read before setScenario clears S.trialOffer
      S.modal = null;
      /* §3.2.2 ⑦ — 부여 판정은 과거 체험 이력. No history lands on the trial; history is
         charged on the spot (§3.5 · §5.5.3). */
      setScenario(trial ? 'trial' : 'active');
      S.tab = 'billing';
      showToast('Subscription started', trial
        ? `Your ${TRIAL_MONTHS}-month free trial has started. Nothing is charged until ${TRIAL.first}.`
        : `${TAX.total} was charged to your default card. Your subscription is active.`);
      render();
      break;
    }
    /* Pack purchase opens the MODAL now (meeting 9/10), from every entry point: the balance
       card's Buy credits, the out-of-credits banner, the prototype panel, and the campaign
       modal's "buy more than one pack" link. The button pressed still decides the type. */
    case 'buyPack':
      if (sc().screen !== 'account') setScenario('credits');
      S.tab = smsTab(); S.packType = actEl.dataset.val || (isUnified() ? 'credits' : 'sms'); S.packSel = 1;
      openModal('buyCredits');
      break;
    case 'histPage':     S.histPage = Number(actEl.dataset.val); render(); break;
    case 'sendWhen':     S.sendWhen = actEl.dataset.val; render(); break;
    case 'calOpen':      S.calOpen = !S.calOpen; if (!S.calOpen) S.calMonth = null; render(); break;
    case 'calMonth': {
      const a = S.calMonth ? dOf(S.calMonth) : dOf(S.schedDate);
      S.calMonth = fullD(new Date(a.getFullYear(), a.getMonth() + Number(actEl.dataset.val), 1));
      render(); break;
    }
    case 'pickDay':      S.schedDate = actEl.dataset.val; S.calOpen = false; S.calMonth = null; render(); break;
    // Switching the clock is a request to look at the picker, so the option that draws it
    // is selected too — otherwise the control changes something nothing on screen shows.
    case 'sendClock':    S.sendClock = actEl.dataset.val; S.sendWhen = 'later'; S.calOpen = false; clampSched(); render(); break;
    /* Figma 2776:501570 — the purchase confirms with the Sonner toast and nothing else:
       no success screen, no receipt shown, the modal simply closes behind it. The
       description slot is hidden in the design, so this one is title-only. */
    case 'packBuy':      closeModal(); showToast('SMS Credits Added Successfully'); break;
    case 'email':        S.emailKey = actEl.dataset.val; openModal('email'); break;
    case 'doc':          S.docKey = actEl.dataset.val; openModal('doc'); break;
    // The print stylesheet keys off this flag; clear it however the dialog closed.
    case 'printDoc':
      document.body.dataset.print = 'doc';
      window.print();
      break;
    case 'removeCard':   S.removeId = actEl.dataset.val || null; openModal('removeCard'); break;
    case 'creditsCardDemo': openModal('creditsCard'); break;
    case 'cancelSub':    openModal('cancelSub'); break;
    case 'confirmCharge':S.ccPackSel = null; openModal('confirmCharge'); break;
    case 'ccPackSel':  S.ccPackSel = Number(actEl.dataset.val); render(); break;
    case 'drainCredits': {
      const cD = sc().credits;
      cD.sms = 0; cD.smsRes = 0; cD.mms = 0; cD.mmsRes = 0; cD.free = 0;
      // renderProto only - see the button's comment. The screen must stay as it was.
      renderProto();
      break;
    }
    case 'chPage':     S.chPage = Number(actEl.dataset.val); render(); break;
    case 'balView':    S.balView = actEl.dataset.val; render(); break;
    case 'creditPop':    S.creditPop = !S.creditPop; render(); break;
    case 'holdCount':    S.holdCount = Number(actEl.dataset.val); render(); break;
    case 'holdPop':      S.holdPop = !S.holdPop; render(); break;
    // In production this lands on Campaigns filtered to Scheduled; the mockup has the list
    // on the Marketing dashboard, so it goes there.
    case 'goCampaigns':  setScenario('smsOverview'); break;
    /* PM: 길어지면 MMS 2크레딧 변경 시 색상/숫자 변경. Toggling the attachment is the explicit
       half; the implicit half (text past two segments) is derived in screenCampaign. */
    case 'campMms':      S.campMms = !S.campMms; render(); break;
    case 'exportHistory': exportBillingHistory(); break;
    case 'exportSmsBilling': exportSmsBilling(); break;
    case 'exportCredits': exportCreditHistory(); break;
    case 'schedule':     openModal('schedule'); break;
    /* The cutover notice lives in the world BEFORE the switch, which the release-2 clock is
       already past — so it is a flag rather than a scenario, and the drawer shows it in
       place of the reservation notice. */
    case 'confirmChargeDemo': setScenario('campaignShort'); openModal('confirmCharge'); break;
    /* The blocker, straight to it. Same state the Send button would have produced: a campaign
       that WAS affordable and a balance since emptied. The step-by-step version lives in the
       Mid-compose drain group — that one exists to show the STALE SCREEN, which this cannot. */
    case 'drainedDemo': {
      setScenario('campaignLow');
      const cD = sc().credits;
      cD.sms = 0; cD.smsRes = 0; cD.mms = 0; cD.mmsRes = 0; cD.free = 0;
      openModal('sendBlocked');
      break;
    }
    // Step two. The campaign is still on screen behind it, so this is the shortfall flow
    // (Confirm & Send), not the balance card's "choose an amount" one.
    case 'blockedBuy': S.ccPackSel = null; openModal('confirmCharge'); break;
    // 'active' has a card, so this lands on §6.2 step 3 rather than enrolment.
    /* Two shapes of the confirmation, and ONE step in front of it (PM, 2026-09-22 — the widget
       has to be its own modal). The confirmation always names a card, because by the time it
       opens one exists; what forks it is 과거 체험 이력 (§3.2.2 ⑦), not card presence. The
       no-card case is therefore a demo of the STEP BEFORE: the card modal, which hands back. */
    case 'subscribeDemo':
      setScenario('nocard'); S.consent = false; S.cardStep = null;
      S.cardReturn = 'confirmSubscribe'; S.tab = 'billing'; openModal('addCard'); break;
    case 'trialSubscribeDemo':
      setScenario('active'); S.trialOffer = true; S.tab = 'billing'; openModal('confirmSubscribe'); break;
    case 'blockedSubscribeDemo': setScenario('canceledGrace'); S.tab = 'billing'; openModal('subscribeBlocked'); break;
    // The same §14.2 consent screen a returning vendor sees. Only the welcome-credit row differs.
    case 'resubscribeDemo': setScenario('canceled'); S.tab = 'billing'; openModal('confirmSubscribe'); break;
    case 'subscribePromptDemo': setScenario('nocard'); S.tab = 'billing'; openModal('subscribePrompt'); break;
    /* THE SCREEN CANNOT BE TRUSTED AT CLICK TIME (Grace, 2026-09-14). The campaign screen is
       painted once; an inbound chat can spend the rest of the balance while the vendor is
       still writing, and nothing pushes that back to this page - so Send stays enabled and
       the cost line keeps saying the send is affordable. Pressing it has to re-read the
       balance, and when it no longer covers the campaign the vendor is told what changed
       rather than watching a send quietly fail.
       This is not a mockup-only nicety: the same re-check has to happen SERVER-SIDE at send
       time, because the client's number is always a snapshot.
       The block is its own SHORT modal (Grace, 9/14) and buying is the step after it, so the
       purchase modal keeps exactly one shape and one title (I-33). */
    case 'sendNow': {
      const sN = sc();
      const availAtClick = isUnified()
        ? unifiedTotals(sN.credits).remaining - unifiedTotals(sN.credits).reserved
        : sN.credits.sms - sN.credits.smsRes;
      const needAtClick = campNeed(sN);
      if (availAtClick < needAtClick) { openModal('sendBlocked'); break; }
      closeModal();
      break;
    }
    case 'close':        closeModal(); break;
    case 'scrim':        if (e.target.classList.contains('scrim') || e.target.classList.contains('drawer-scrim')) closeModal(); break;
    // Only swap scenarios when we have to leave the campaign screen — from an
    // account screen this must keep the state the vendor is actually in, or
    // Update payment silently teleports them out of expired / canceled / past_due.
    case 'goBilling':
      closeModal();
      if (sc().screen !== 'account') setScenario(sc().cardBad ? 'failed' : 'active');
      S.tab = 'billing'; render();
      break;
    /* Release 1 has no SMS tab and no credits, so switching to it has to leave any
       state that only exists in release 2 — otherwise the screen shows a campaign
       spending credits that cannot be bought yet. */
    case 'release':
      S.release = Number(actEl.dataset.val); S.modal = null;
      if (isR1()) {
        if (sc().screen !== 'account') setScenario('active');
        S.tab = 'billing';
      }
      render();
      break;
    /* Closing the modal matters here: it may be showing SMS packs while the model just
       became unified, and a picker for a type that no longer exists is a dead end. */
    case 'creditModel':  S.creditModel = actEl.dataset.val; S.modal = null; S.packType = isUnified() ? 'credits' : 'sms'; render(); break;
    // Switching to merged while sitting on the SMS tab would leave S.tab pointing
    // at a tab that no longer renders, so land on the tab that absorbed it.
    case 'tabLayout':
      S.tabLayout = actEl.dataset.val; S.modal = null;
      if (isMerged() && S.tab === 'sms') S.tab = 'billing';
      render();
      break;
    case 'packSel':      S.packSel = Number(actEl.dataset.val); render(); break;
    /* Promotes the card that was pressed. It used to swap slots 0 and 1 regardless of which
       row the button sat on, so with three cards the wrong one was promoted. */
    case 'setDefault': {
      const id = actEl.dataset.val;
      const c = sc().cards;
      sc().cards = id ? [id, ...c.filter(x => x !== id)] : [c[1], c[0], ...c.slice(2)].filter(Boolean);
      /* DECLINED can only ever mark the DEFAULT card — PB 1.8.0 gives no backup card, so a
         decline can only have come from the one being charged. Once that card is not the
         default any more the mark has no target, and leaving it set made the badge JUMP to
         whichever card took the top slot. */
      sc().cardBad = false;
      render(); break;
    }
    case 'copyText':     copyText(actEl.dataset.val, actEl); break;
    case 'scrollCards':  document.getElementById('section-cards')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); break;
    /* In the product this link opens Balance's HOSTED PDF — §6.2 "Balance 자동 PDF 링크",
       §12.3.3.1 "영수증 링크", PB 6.1.0 "결제 성공 응답의 PDF URL 저장 → 히스토리 링크". There is
       no in-app receipt viewer in any doc. The prototype opens a modal because we cannot
       render Balance's file: the modal stands in for that PDF and shows what it must carry
       (the field list is the Balance request, G-2d / F-5 ③). The email's `View receipt`
       button points at the same URL. */
    // The row is the receipt's subject, so the link carries it.
    case 'receipt':
      e.preventDefault();
      S.receiptRow = { date: actEl.dataset.date, amt: actEl.dataset.amt, type: actEl.dataset.type };
      S.receiptSent = false;
      openModal('receipt');
      break;
    case 'emailReceipt':
      // PM 9/2 flow: the button becomes the confirmation and cannot be pressed twice for the
      // same receipt; the toast says where it went. What arrives is EMAILS.receipt.
      S.receiptSent = true;
      showToast('Receipt sent', 'Sent to your account email.');
      render();
      break;
  }
});

  { id: 'S19', group: true, sel: '.chat-grid', title: 'SMS Chat — two credit states', tags: 'DEV / PM',

  { id: 'S30', group: true, sel: '[data-sched="date"]', title: 'Send Time date — capped while the switch happens', tags: 'DEV / PM',
    bullets: [

  { id: '18', sel: '[data-banner="chargeback"], #sec-subscription .tip[data-block="chargeback"]', title: 'Chargeback — banner and blocked Subscribe', tags: 'DEV / PM',
    bullets: [
      'Two surfaces that layer: the banner carries the approved sentence, the disabled button’s tooltip carries what it means in practice.',
      '§7.4 gives the banner as a fixed STRING — pasted, not written: “A dispute was filed with your card issuer for a subscription payment, so your subscription has been canceled. You can subscribe again once the dispute is resolved or a different payment method is verified. Questions? Contact {support}.” §7.4 also forbids 사기·부정 같은 단정 표현.',
      'A banner, not a clause on the section footnote — §7.4’s copy announces the cancellation itself.',
      'The chargeback cancellation is the only <b>immediate</b> one in the product (§7.1-2); every other waits for the period to end.',
      'The card is not the problem: the account is blocked because a charge was reversed. Same greyed button as 17, different cause.',
      '§7.1.2’s words are 재구독 차단, so the entry point is what gets blocked — disabled rather than hidden, because §7.1.2 asks for the block to be shown with its reason.',
      'Tooltip string: “Resubscribing is blocked while the chargeback is open. It lifts when the dispute resolves in your favour, or when the recovery invoice for it is paid. Adding a new card does not lift it.”',
      'v2.5 §7.4-2 — 승소 → 자금 복귀 즉시 해제, 수수료 청구 없음 (§7.2) · 패소 → 분쟁 금액 + PG 수수료를 #3 회수 인보이스로 청구하고 결제가 확인된 뒤 해제.',
      '새 카드 등록만으로는 풀지 않는다 (§7.4-2).',
      'No date is promised — the release depends on a dispute we do not control.',
    ],
    edge: [
      '🔴 The banner and the tooltip agree only if <i>verified</i> means PAID. §7.4 says “a different payment method is verified”; §7.4-2 says 새 카드 등록만으로는 풀지 않는다. To confirm with the PM — if <i>verified</i> means mere registration, the tooltip has to go.',
      '🔴 <code>{support}</code> has no destination in any document, so the address is printed as text: <code>vendorsupport@shopcord.com</code>. A <code>mailto:</code> is silently dead on webmail and this admin is desktop-only.',
      '🔴 That address is the billing mail’s sender. Whether chargeback enquiries belong in that inbox rather than a dispute queue is an operations call — the PRD has no support-channel clause.',
      '🔴 법무 확인 대기 (§7.4-2) — 수수료 완납을 재구독 조건으로 두는 것이 법무 승인 범위 안인지, ToS 차지백 조항에 명시가 필요한지.',
      'It outranks the card block: a chargeback vendor with a declined card sees this reason, not 17’s.',
      '§7.4-4 leaves 영구 폐쇄 검토 to a human. Nothing here may imply the block is permanent, and nothing may imply it is not.',
    ],
    refs: '§7.4 · §7.1.2 · §7.2 · §7.4-2 · §7.4-4 · PB 2.7.0' },

  { id: '11', sel: '#sub-summary', title: 'Confirmation — the five facts and the card row', tags: 'DEV / PM',
    bullets: [
      'Before consent the screen states plan · price · cycle · card · first charge date (§14.2 ③) as four rows: <code>Price</code>, <code>Charged today</code>, <code>Next charge</code>, <code>Card</code>.',
      'The <code>Card</code> row shows the default card, the one that is charged (PB 1.8.0): brand and last four, then <code>Change</code>.',
      'Pressing <code>Change</code> opens a picker under the box: the other saved cards with <code>Use this card</code>, and <code>Add a payment method</code>, which opens the card modal and returns here. The card picked becomes the default (PB 1.4.0).',
      'No trial history → the trial shape: the same rows, <code>Charged today $0.00</code>, and <code>Next charge</code> is the trial end, which is the first charge (§14.2 ③ · §3.2.2 ④). Trial history → charged today (§3.2.2 ⑦).',
      'The next charge falls on the same day each month (§3.3).',
    ],
    edge: [
      '🔴 §3.2.2 ⑤ says a trial creates no $0 charge display (“$0 결제·전액 할인 표시도 만들지 않음”). The <code>Charged today $0.00</code> row follows a PM request, so either the PRD is amended or the row is removed.',
      'A declined default never reaches this screen. Subscribe checks it first and opens the block instead (PB 1.8.0 · §5.1).',
    ],
    refs: '§14.2 · §3.2.2 · §3.3 · PB 1.4.0 · PB 1.8.0' },

  { id: '12', sel: '.modal .consent-note', title: 'Clickwrap consent — the only consent point', tags: 'DEV / PM',
    bullets: [
      'The sentence states the amount, the cycle, the tax, the card, the start date, and that it runs until cancelled: <i>…charge $20.00 per month, plus applicable sales tax, to Visa ···· 4242 for my Shopcord subscription, beginning {date}, until I cancel.</i> On a trial the date is the trial end (§3.4).',
      'The checkbox gates <code>Subscribe</code> and opens unticked every time.',
      'Pressing <code>Subscribe</code> stores the consent, starts the subscription and charges the card in one step. On a trial nothing is charged (§14.2 ④⑤).',
      'Stored with the consent: acceptance time · plan · card ID · wording version (PB 2.3.0). This record is the chargeback evidence (§7.1.3).',
      '<code>Not now</code> and the × close it and land on the Subscription tab. A card saved on the way stays saved; no consent is recorded.',
    ],
    edge: [
      '🔴 §3.4 and PB 2.3.0 specify an explicit <code>I Consent</code> click (legal advice). Here a checkbox gates <code>Subscribe</code>, so either the PRD is amended or this reverts.',
      'The sentence differs from §3.4’s example: it names the card and the start date. PB 2.3.0 stores the wording version, so legal has to see this wording.',
      'The Terms of Use link has no destination yet (§11).',
    ],
    refs: '§3.4 · §14.2 · PB 2.3.0 · §7.1.3' },

  { id: '13', sel: '#card-form .inline-form-title', title: 'Card modal — Add a New Card', tags: 'DEV',
    bullets: [
      'Card number, expiry, CVC and the billing address are Balance’s widget; we design the container, not the inputs (§13.2). The address runs Country or region · Address line 1 · Address line 2 · City · State and ZIP.',
      'No other input is asked of the vendor. The buyer entity is created in the background from the account email (§13.2 ②).',
      'The first card saved becomes the default (§13.2 ③ · PB 1.1.1).',
      'Opened from the subscribe flow, the modal adds one line above the buttons: <i>You’ll review your plan and confirm your subscription on the next step. Nothing is charged yet.</i> <code>Save card</code> then opens the confirmation (§14.2 ②→③).',
      'Opened anywhere else (the Subscription tab’s Add buttons, the failure banner), <code>Save card</code> saves the card and closes the modal (§13.1).',
      '<code>Cancel</code> and the × close it. Nothing is consented here.',
    ],
    edge: [
      'Balance’s real widget also asks for first and last name. The mockup leaves those two fields out.',
      'A widget or registration failure shows inside this modal with a retry, never bouncing the vendor out (PB 1.1.2).',
    ],
    refs: '§13.1 · §13.2 · §14.2 · PB 1.1.1 · PB 1.1.2' },

  { id: '14', sel: '.scrim:not([data-modal="sendBlocked"]) .modal-confirm .confirm-title', title: 'Destructive confirmations', tags: 'DEV',
    bullets: [
      '<b>Cancel subscription</b> — states the date access runs to and that resuming before it costs nothing. From <code>active</code> this sets the <b>end-of-period flag</b>, not an immediate cancellation (PB 2.7.0). From <code>past_due</code> it cancels <b>immediately</b>.',
      '<b>Remove card</b> — names the card, states which card keeps billing, and that cards are re-added rather than edited.',
      'Both are irreversible for the vendor, which is why they are modals at all.',
    ],
    refs: '§3.5 · PB 2.7.0 · PB 1.5.0 · §13.3.5' },

  /* ── Email (§16 · PB 7.x) — eleven notifications ─────────────────────────────── */
  { id: 'E1', sel: '.email-modal', title: 'Notification emails — the set', tags: 'DEV / PM', group: true,
    bullets: [
      'Twenty-seven mails, grouped by where each one comes from: <b>13 are in the PRD</b> (the clause names trigger and channel), <b>7 are ours</b> (no PRD trigger exists; five of them still need a PB id), <b>7 belong to the SMS credits PRD</b>. The chip in each header says which.',
      'The channel is part of the spec (§16): email+SMS+in-app for the urgent money events — D0 failure, D+7 auto-cancel, the card campaign — and email only for the trial-end notice, the recovery invoice and every cancellation mail.',
      'Every send is a trigger, never a schedule.',
      'Figma board 326:826552 covers 10 of the 27. Each header prints the node id, or says the board has none, with the known mismatch beside it.',
    ],
    edge: [
      'v2.5 deleted three: PB 7.3~7.5, the card-expiry ladder, is abolished. The only expiry surface left is the date in red on the card (§4.3 · PB 1.2.0).',
      'Five need a PB id — the signup-charge decline, the receipt sent on request, and the three number reminders. The ended-subscription notice has one in the subscription Figma.',
      'Where the board and the build disagree, the build is newer: four frames are stale captures and two are misnamed.',
      'PB 7.1.1 (D+3 reminder) has no mail drawn, and nor does PB 7.1.2’s auto-cancel mail — only its banner exists.',
      'Wording is in no PRD. Trigger and channel are the spec; the ten house rules are the style contract, and the QA reference carries the full list.',
    ],
    refs: '§16 · PB 7.1 – 7.12 · Figma 326:826552' },

  { id: 'E2', sel: '.em-subj', title: 'Subject line', tags: 'DEV',
    bullets: [
      'Every subject names the thing and its identifier — amount, card, invoice number or date — so the mail is findable in a search months later.',
      'No urgency words in the subject. The deadline goes in the body, where the date can be exact.',
    ],
    edge: [
      'Sender is <code>vendorsupport@shopcord.com</code> across all of them.',
    ],
    refs: '§16' },

  { id: 'E3', sel: '.em-cta', title: 'The CTA', tags: 'DEV',
    bullets: [
      'One action per mail. §12.3 sends every card-management route to the Subscription tab, so that is where the recovery CTAs land.',
      'The exception is the recovery invoice’s <code>Pay now</code> — Balance’s payment page (card or ACH), which must work with no saved card and no session. 🔴 Nothing is attached any more (2026-09-23), so that page is the buyer\u2019s and the vendor\u2019s only sight of the document \u2014 §6.1 puts our PDF on it for the vendor and §6.2 does not say the same for the buyer.',
    ],
    edge: [
      'Receipt auth is ours to decide now that we generate and host the PDF (v2.5 §6.1).',
    ],
    refs: '§6.2 · §12.3 · PB 6.1.0' },

  { id: 'M-signupFail', sel: '.email-modal[data-email="signupFail"] .em-card', title: 'Signup charge declined', tags: 'DEV / PM',
    bullets: [
      'The very first charge fails, so the subscription never starts — this is not the grace flow. Nothing to keep running, no 7-day clock.',
      'Card-side only: a PG timeout or server fault at signup never touches vendor state or notifications (v2.5 §5.1).',
    ],
    edge: [
      '🔴 No PB id. PB 7.1 covers a failure on an existing subscription; this moment is not in the table.',
    ],
    refs: '§5.1 · §14.2' },

  { id: 'M-payFail', sel: '.email-modal[data-email="payFail"] .em-card', title: 'Subscription charge failed — D0', tags: 'DEV',
    bullets: [
      'Sent the day the charge fails, opening the 7-day grace (§5.2).',
      'Email + in-app banner. The banner reaches every My Account tab and the campaign screen — the one surface carrying the fix (§12.3).',
      'Says <code>Update your card</code> and links the tab (PB 7.1).',
      'The sub-line carries the deadline, not a loss: inside the grace the vendor keeps everything (§5.2), so it reads <i>your subscription is active until {grace end}</i>.',
      'The amount carries tax — §3.3.1 names the failure notice as one of the nine surfaces where sales tax must appear. Never the <code>$20.00</code> list price.',
      'One mail, two bodies: it branches on <code>failKind()</code> — <code>insufficient_funds</code> says we retry once a day, everything else says we will not retry (v2.5 §5.1).',
    ],
    edge: [
      '🔴 SMS is assigned and not drawn. PB 7.1 says 이메일+SMS+인앱 배너 and §16 reserves 이메일+SMS for this trigger and the D+7 auto-cancel. No document defines the recipient: §12.4-4 and PB 1.9.0 fix 빌링 알림 수신자 = MASTER 이메일, and no clause names a vendor phone number, a consent for one, or a PB row that builds the path.',
      'It does not fire on a PG timeout or server fault — those never reach <code>past_due</code> (v2.5 §5.1).',
    ],
    refs: 'PB 7.1 · §5.1 · §5.2' },

  { id: 'M-restored', sel: '.email-modal[data-email="restored"] .em-card', title: 'Payment restored', tags: 'DEV',
    bullets: [
      'Fires when the grace resolves — the card was updated and the charge went through, settling the missed cycle in full.',
      'Email + in-app, no SMS.',
    ],
    edge: [
      'The only positive notification in the set. Without it a vendor who fixed their card never hears that it worked.',
    ],
    refs: 'PB 7.2 · §5.2' },

  { id: 'M-trialEnding', sel: '.email-modal[data-email="trialEnding"] .em-card', title: 'Trial ends in 7 days', tags: 'DEV / PM',
    bullets: [
      'PB 7.11 · §3.2.2 ⑥.',
      'It is a chargeback defence, not a courtesy: an unexpected first charge becomes a chargeback, which costs a fee + immediate cancellation + a resubscribe block (§7). The clickwrap (§3.4) is the other half.',
      'Four facts fixed by the spec: trial end date · first charge date · amount · card last 4. The end and the first charge are one date (§3.2.2 ④), so the box carries it once.',
      'Amount is 세전 + 예상 세액. The rate is looked up at charge time (§3.3.1 · PB 2.12.0), so both lines read <code>Estimated</code> and the mail says the total may move.',
    ],
    edge: [
      'Email only — no banner, no SMS (§3.2.2 ⑥). The end date is on the Subscription tab year-round (§12.3.1).',
      'No card-update nudge — v2.5 abolished card-expiry prompting everywhere (§4.3).',
      'No CTA: there is nothing the vendor has to do.',
      '🔴 The cancel sentence is ours. §3.2.3 gives the fact; §3.2.2 ⑥ kept the trial clock off the product surface. The sentence is in, the link is not — to confirm with the PM.',
    ],
    refs: 'PB 7.11 · §3.2.2 \u2463\u2465 · §3.2.3 · §3.3.1 · PB 2.12.0' },

  { id: 'M-campCanceled', sel: '.email-modal[data-email="campCanceled"] .em-card', title: 'Scheduled campaign canceled — credits went to chat', tags: 'DEV / PM',
    bullets: [
      'SMS PRD §5.1 names this mail: 끼어든 chat으로 잔액부족 → 캠페인 취소 통지(이메일 + 어드민 화면) 및 재send/schedule 권유.',
      'Not the schedCanceled banner: that fires when a subscription ends; this is credit contention inside a healthy account.',
      'No money moved, and that is the first sentence. Scheduled credits are a hold, not a deduction (§11-A/B) — releasing a hold is neither a refund nor a charge.',
      'The cause is explained, not named: chat cannot be gated and a campaign can wait (SMS PRD §5.1).',
      'The CTA is one step — 충전 후 원클릭 재발송 (SMS PRD §5.1), so the button buys and reschedules rather than dropping the vendor on a balance screen.',
    ],
    edge: [
      '🔴 No PB id. The SMS PRD gives the trigger and the channel; the PB list has no entry. The PM has to create one.',
      '🔴 The in-app half is not built. §5.1 asks for 이메일 + 어드민 화면 and only the mail exists; the campaign list is the obvious place and it is an SMS surface.',
      '부분 발송 없음 (§5.1) — it is all or nothing, so there is no partially-sent state to report.',
    ],
    refs: 'SMS PRD §5.1 · §11-A · §11-B · NO PB ID' },

  { id: 'M-subCanceled', sel: '.email-modal[data-email="subCanceled"] .em-card, .email-modal[data-email="subCanceledNoTfn"] .em-card', title: 'Subscription canceled', tags: 'DEV / PM',
    bullets: [
      'The half of §3.5 that had no mail: a subscription ends two ways, and only the automatic one was notified (PB 7.1.2).',
      'Two groups, opposite markers — <b>What still works</b> (§5.5.2) and <b>Paused until you subscribe again</b> (§3.2.1).',
      'The paused set is §3.2.1’s boundary, exactly two rows: opening/confirming an order, and SMS Campaigns and Chat.',
      '재구독 is a condition, not a status, so it sits in its own block: new cycle, immediate first charge, no second trial (§3.2.2 ⑦ · §5.5.3).',
      'CTA is <code>Subscribe again</code>, the same words as the Subscription tab button.',
      'Held credits are pre-deduction, so a scheduled campaign’s hold releases back to Available (선불 스펙 — Hold 해제, 차감 전이므로 환불 아님).',
    ],
    edge: [
      'The manual-cancel mail has a PB entry in the subscription Figma; PB 7.1.2 covers the D+7 automatic one.',
      'Two entries, one template: <i>with SMS number</i> and <i>no SMS number</i>. Production sends one, picked by whether the vendor ever onboarded SMS.',
      'No number means no SMS anywhere in the mail — the credits line and the number block drop out, and the locked-feature line names only order opening/confirming.',
      'The number is <b>held until</b> a date, never <b>deleted on</b> one: no PRD carries the rule and we cannot promise a carrier will keep it.',
      'Once the hold ends, SMS Campaigns and Chat history is gone from the vendor’s account, and the mail says so from the vendor’s side. The backend keeps the history for internal use, so nothing here promises deletion.',
    ],
    refs: '§3.5 · §5.5.2 · §5.5.3 · §3.2.1' },

  { id: 'M-numberD30', sel: '.email-modal[data-email="numberD30"] .em-card', title: 'Reserved number — 30 days left', tags: 'DEV / PM',
    bullets: [
      'First of three. The hold is 3 months from the day the subscription ended, and the reminders land at D-30, D-7 and D-1.',
      'Three and not one, because the hold clock is invisible: a cancelled vendor has stopped visiting and nothing on screen counts it down.',
      'Only this one names the remaining schedule.',
      'All three share one body builder — the countdown lives in the subject and the heading only.',
      'Each one says the credits are safe: credits are held, never forfeited (§5).',
    ],
    edge: [
      '🔴 No PB id. The 3-month rule itself is confirmed.',
      'Only for vendors who hold a number.',
    ],
    refs: '§3.5 · NUMBER_HOLD_MONTHS' },

  { id: 'M-numberD7', sel: '.email-modal[data-email="numberD7"] .em-card', title: 'Reserved number — 7 days left', tags: 'DEV',

      'Second reminder. Identical body — the countdown is in the subject and the heading (M-numberD30).',

  { id: 'M-numberD1', sel: '.email-modal[data-email="numberD1"] .em-card', title: 'Reserved number — released tomorrow', tags: 'DEV / PM',

      'The heading says <code>Tomorrow is the last day</code> rather than a date — the one place the series breaks parallel.',

  { id: 'M-receipt', sel: '.email-modal[data-email="receiptAuto"] .em-card, .email-modal[data-email="receipt"] .em-card', title: 'Receipt', tags: 'DEV / PM',
    bullets: [
      'Two entries, one document. <b>Sent automatically</b> is PB 6.1.0’s main path: payment succeeds → our PDF is generated and stored → the mail goes out, with a link in Billing history (§12.3.3-3). <b>Sent on request</b> is the receipt modal’s Send to email.',
      'One builder, one opening sentence apart — same PDF, same box, same references.',
      'Both go to the MASTER account email (§12.4-4), never an address typed at send time.',
      'The PDF is ours (§6.1 · PB 6.1.0) and carries the six fields the spec names: pre-tax · tax · total · card last 4 · charge date · Balance transaction number. The charge time prints as <code>12:00 AM PT</code>, the batch time (§3.3-3). Balance’s own receipt PDF and email are switched off by configuration.',
      '🔴 <b>No attachment (Grace, 2026-09-23 — 첨부가 안 된다는 회신).</b> §12.3.3-3 specifies 영수증 PDF를 <b>첨부한</b> 이메일, so this is a deviation from doc-specified behaviour and the PRD needs the correction. What replaces it: the box in this mail carries all six PB 6.1.0 fields, so the <b>mail itself is a usable receipt</b>, and <code>View receipt</code> is the route to the stored PDF. A vendor who never clicks still has the numbers.',
      'It renders in a plain client frame, not the branded card — a receipt is a document, not a campaign.',
      'The body is three tiers: ① the <b>amount</b> as a hero with <i>Paid {date} · {card}</i> under it · ② the <b>breakdown</b> — Subtotal · Sales tax with its place and rate · Total (§3.3.1) · ③ the <b>references</b> in small grey type — service period and receipt no.',
      'The line item is <b>pre-tax</b>: Subtotal is $20.00 and only the bottom line is the taxed total.',
    ],
    edge: [
      'PB 6.1.0 lists the PDF’s fields and the body shows the same set — 세전 · 세금 · 합계 · 카드 끝4 · 결제일 · Balance 거래번호. A field in one and not the other is a defect either way.',
      '🔴 The receipt-number format is ours — no PRD gives one. <code>SC-R-2026-04182</code> is a placeholder printed on a file the vendor keeps, so it needs deciding.',
    ],
    refs: '§6.1 · §6.2 · §12.3.3 · PB 6.1.0' },




  { id: 'M-recovery', sel: '.email-modal[data-email="recovery"] .em-card', title: 'Recovery invoice issued', tags: 'DEV',
    bullets: [
      'Never a subscription bill — 구독료로 인보이스가 나가는 경우는 없다 (§6.3.1). This is a settlement-side debt (§6.3.2): money already paid out to the vendor that has to come back.',
      'Sent when that balance could not be collected: payout offset first, then a bank debit retried daily for seven days (§6.3.2). Non-US vendors skip the debit and invoice as soon as the offset falls short.',
      'The lines are §6.3.4’s, verbatim, each as ONE string — <code>제목 - 부제 (Reference)</code>, one line per reason (사유별로): <i>Refund clawback</i> · <i>Chargeback reversal</i> · <i>Chargeback fee</i> · <i>Settlement adjustment</i>.',
      'The string is intact; the type is tiered — reason bold, explanation plain, reference small and grey, split at the first “ - ” and the last “ (”.',
      'Three totals, never one (§6.3.4): <code>Invoice amount</code> → <code>Recovered from payouts</code> → <code>Total due</code>. The invoice is always the REMAINDER — 상계·데빗으로 못 걷은 잔액.',
      'Due = issued + 7 days (§6.4-3 · PB 6.2.0). ACH reaching processing inside the window counts as paid, and the payment page stays valid past the date — there is no link expiry.',
      'No sales tax (§6.4-6) — 회수금이라 매출이 아니다.',
      '<b>One way out, and it is in the mail:</b> <code>Pay now</code> settles this invoice by card or ACH <b>with no saved card required</b> (§6.2). 🔴 The second CTA was <b>deleted 2026-09-23</b> (Grace) even though §6.2 and PB 6.2.0 both name it — <i>Pay now + Update payment</i>. The saved card pays the SUBSCRIPTION; this debt was chased through payout offset and then a bank debit (§6.3.2), neither of which the card touches, so the link pointed at something that had not failed. The PRD needs the correction, or the link comes back.',
      'Email only — no SMS, no banner.',
    ],

let AN = { on: false, q: '', sel: null, all: false };

function anTargets() {
  // With an overlay open, only annotate the overlay — background pins would sit on top of
  // the scrim and read as belonging to the modal.
  const root = document.getElementById('modal-root');
  const overlay = root && root.firstElementChild ? root : null;
  const out = [];
  for (const a of ANNOS) {
    const el = document.querySelector(a.sel);
    if (!el || el.offsetParent === null) continue;
    if (overlay && !overlay.contains(el)) continue;
    out.push([a, el]);
  }
  /* Both the pins and the panel read this list, and a reader scans a page from the top.
     Source order put every SMS item after Billing history and T1 last of all, though on
     screen T1 sits beside the price near the top — on the 4-tab layout, where Subscription
     and SMS Credits share one page, that made the list read as two specs shuffled together.
     Document order is the page's own order, and a container sorts before what it holds, so
     a group lands directly above its own items. */
  out.sort(([, x], [, y]) => {
    if (x === y) return 0;
    const p = x.compareDocumentPosition(y);
    if (p & Node.DOCUMENT_POSITION_FOLLOWING) return -1;
    if (p & Node.DOCUMENT_POSITION_PRECEDING) return 1;
    return 0;
  });
  return out;
}

function anDraw() {
  const layer = document.getElementById('an-layer');
  if (!AN.on) { layer.innerHTML = ''; return; }
  const sx = window.scrollX, sy = window.scrollY;
  layer.innerHTML = anTargets().map(([a, el]) => {
    const r = el.getBoundingClientRect();
    const pad = a.group ? 8 : 4;
    /* The BOX always keeps the element's own geometry. Clamping it to the viewport made
       every item scrolled past the top redraw as a full-width band across the page, because
       the top was pulled down to the scroll position while the height stayed. */
    const t = r.top + sy - pad, l = r.left + sx - pad;
    const w = r.width + pad * 2, hgt = r.height + pad * 2;
    /* Only the PIN is clamped, and only INSIDE its own box: a section wrapper runs edge to
       edge, so an unclamped pin lands off-screen and is clipped to its last character —
       'G2' then reads as '2'. Bounded by the box, a pin scrolls away with its element
       instead of piling up at the top edge. */
    const pt = Math.min(Math.max(t - 11, sy + 2), t + hgt - 22);
    const pl = Math.min(Math.max(l - 8, sx + 2), l + w - 22);
    const sel = AN.sel === a.id ? ' is-sel' : '';
    return `<div class="an-mark${a.group ? ' is-group' : ''}${sel}" style="top:${t}px;left:${l}px;width:${w}px;height:${hgt}px"></div>
      <div class="an-pin${a.group ? ' is-group' : ''}${sel}" data-anpin="${a.id}" style="top:${pt}px;left:${pl}px">${a.id}</div>`;
  }).join('');
}

const anAvail = () => {
  const c = sc().credits || { sms: 0, smsRes: 0, mms: 0, mmsRes: 0 };
  const u = unifiedTotals(c);
  return u.remaining - u.reserved;
};
/* The cases a single line can belong to. Each one reads the scenario the demo panel is on,
   so a new scenario needs no entry here — only a state it already sets. */
const AN_CASES = {
  healthy:    { label: 'Healthy',          on: () => sc().sub === 'active' && !sc().trial && !sc().cancelAt },
  trial:      { label: 'Free trial',       on: () => !!sc().trial },
  cancelling: { label: 'Cancel scheduled', on: () => !!sc().cancelAt },
  grace:      { label: 'In grace',         on: () => sc().sub === 'past_due' },
  canceled:   { label: 'Canceled',         on: () => sc().sub === 'canceled' && !sc().chargeback },
  chargeback: { label: 'Dispute',          on: () => !!sc().chargeback },
  freePlan:   { label: 'Free plan',        on: () => sc().sub === 'free' },
  subAcct:    { label: 'Sub account',      on: () => sc().role === 'sub' },
  cardExp:    { label: 'Card expired',     on: () => (sc().cards || []).includes('visaO') },
  numberGone: { label: 'Hold expired',     on: () => !!sc().numberReleased },
  freeCredit: { label: 'Free credits',     on: () => ((sc().credits || {}).free || 0) > 0 },
  low:        { label: 'Running low',      on: () => { const a = anAvail(); return a > 0 && a <= lowThreshold(); } },
  zero:       { label: 'Out of credits',   on: () => anAvail() === 0 },
  ordNew:     { label: 'Not confirmed',    on: () => sc().screen === 'orderDetail' && !ordHasPO(ordCur()) },
};
/* A line may open with "@case " — one or more case names joined by | — and then belongs to
   those cases only. THIS STATE shows a card as the spec for the case on screen, which is
   what someone reviewing that case needs; ALL keeps every line and labels the scoped ones,
   so the same card still reads as the component's whole spec. */
function anWhen(b) {
  const m = /^@([A-Za-z|]+)\s+/.exec(b);
  if (!m) return { t: b, on: true, tag: '' };
  const keys = m[1].split('|');
  return { t: b.slice(m[0].length),
           on: keys.some(k => AN_CASES[k] && AN_CASES[k].on()),
           tag: keys.map(k => (AN_CASES[k] || {}).label || k).join(' · ') };
}
function anBody(a) {
  const li = (arr) => (arr || []).map(anWhen).filter(x => AN.all || x.on)
    .map(x => `<li>${x.tag && AN.all ? `<span class="an-when">${x.tag}</span>` : ''}${x.t}</li>`).join('');
  const b = li(a.bullets), e = li(a.edge);
  if (!b && !e) return '<div class="an-nostate">Nothing specific to this state — switch to ALL for the full item.</div>';
  return (b ? `<ul class="an-ul">${b}</ul>` : '')
       + (e ? `<div class="an-sub">EDGE CASES</div><ul class="an-ul">${e}</ul>` : '');
}
function anPanel() {
  const root = document.getElementById('an-panel-root');
  if (!AN.on) { root.innerHTML = ''; return; }
  const q = AN.q.trim().toLowerCase();
  const hit = (a) => !q || (a.id + ' ' + a.title + ' ' + a.refs + ' ' + a.bullets.join(' ') + ' ' + (a.edge || []).join(' '))
    .toLowerCase().replace(/<[^>]+>/g, '').includes(q);
  const targets = anTargets();
  const live = new Set(targets.map(([a]) => a.id));
  const rank = new Map(targets.map(([a], i) => [a.id, i]));
  /* An item sits under the innermost group whose element contains it, so the card for a
     detail is read beneath the section it belongs to rather than beside it. The nesting is
     derived from the DOM, not declared, so it follows whatever the state actually renders. */
  const groups = targets.filter(([a]) => a.group);
  const parentOf = new Map();
  for (const [a, el] of targets) {
    let bestEl = null;
    for (const [g, gel] of groups) {
      if (g.id === a.id || !gel.contains(el)) continue;
      if (!bestEl || bestEl.contains(gel)) bestEl = gel;
    }
    parentOf.set(a.id, !!bestEl);
  }
  // Default view is the current state's items — that is what the pins on screen point at.
  // ALL keeps the full reference available, with absent items dimmed, after the live ones.
  const at = (a) => rank.has(a.id) ? rank.get(a.id) : 1e6 + ANNOS.indexOf(a);
  const shown = ANNOS.filter(a => hit(a) && (AN.all || live.has(a.id))).sort((x, y) => at(x) - at(y));
  root.innerHTML = `
  <aside class="an-panel">
    <div class="an-head">
      <h2>Annotations</h2><span class="an-count">· ${shown.length === ANNOS.length ? ANNOS.length + ' items' : shown.length + ' of ' + ANNOS.length}</span>
      <button class="an-copy" data-ancopy="*">COPY ALL</button>
      <button class="an-x" data-anclose="1" title="Close annotations">${ICO.x}</button>
    </div>
    <div class="an-search">
      <input id="an-q" type="search" placeholder="Search annotations…" value="${AN.q.replace(/"/g, '&quot;')}">
      <span class="an-scope">
        <button data-anscope="state" class="${AN.all ? '' : 'is-on'}">THIS STATE</button>
        <button data-anscope="all" class="${AN.all ? 'is-on' : ''}">ALL</button>
      </span>
    </div>
    <div class="an-list">
      ${shown.length ? shown.map(a => `
        <div class="an-card${AN.sel === a.id ? ' is-sel' : ''}${live.has(a.id) ? '' : ' is-off'}${parentOf.get(a.id) ? ' is-child' : ''}" id="an-card-${a.id}" data-ancard="${a.id}">
          <div class="an-card-h"><span class="an-badge">${a.id}</span><span class="an-card-t">${a.title}</span>${live.has(a.id) ? '' : '<span class="an-off-note">not in this state</span>'}<span class="an-tags">${a.tags}</span><button class="an-copy" data-ancopy="${a.id}">COPY</button></div>
          ${anBody(a)}
          <div class="an-sub doc">${a.refs}</div>
        </div>`).join('') : `<div class="an-none">${AN.all ? 'No matching annotations' : 'Nothing annotated in this state — switch to ALL'}</div>`}
    </div>
  </aside>`;
}

/* Annotations have to leave this page — into Figma, a spec doc, a ticket — so each card
   and the whole set copy as plain text. Tags are stripped; bullets keep their order and the
   EDGE CASES split, because that split is the part a developer scans for. */
const anStrip = (s) => s.replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
function anText(a) {
  const L = [`[${a.id}] ${a.title}  (${a.tags})`, a.refs];
  const line = (b) => { const w = anWhen(b); return '- ' + (w.tag ? '[' + w.tag + '] ' : '') + anStrip(w.t); };
  a.bullets.forEach(b => L.push(line(b)));
  if (a.edge && a.edge.length) { L.push('EDGE CASES'); a.edge.forEach(b => L.push(line(b))); }
  return L.join('\n');
}
function anCopy(id, btn) {
  const body = id === '*'
    ? ['Shopcord Phase 2.5 — Subscription · developer annotations',
       'PRD v2.5 · ' + ANNOS.length + ' items', ''].concat(ANNOS.map(anText)).join('\n\n')
    : anText(ANNOS.find(x => x.id === id));
  const done = () => { if (!btn) return; const t = btn.textContent; btn.textContent = 'COPIED'; btn.classList.add('is-done');
                       setTimeout(() => { btn.textContent = t; btn.classList.remove('is-done'); }, 1200); };
  // navigator.clipboard needs a secure context — fine on a served page, absent on file://
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(body).then(done, () => anCopyFallback(body, done)); }
  else anCopyFallback(body, done);
}
/* The annotation panel's copy already solved the hard parts — secure-context check and the
   textarea fallback — so this reuses them. It differs only in feedback: an icon swap rather
   than a label, because this button sits inside a sentence and must not change its width. */
function copyText(text, btn) {
  const done = () => {
    if (!btn) return;
    const was = btn.innerHTML;
    btn.innerHTML = ICO.check; btn.classList.add('is-done');
    setTimeout(() => { btn.innerHTML = was; btn.classList.remove('is-done'); }, 1400);
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => anCopyFallback(text, done));
  else anCopyFallback(text, done);
}

function anCopyFallback(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { /* nothing else to try */ }
  ta.remove();
}

/* The PO and receipt papers scroll inside their own container, not the window, so a
   window scroll listener never hears them and their pins stay where the page last drew
   them. Capture-phase listening on `document` did not fire either, so each scrollable
   element in the open overlay gets its own listener, once. */
function anBindScroll() {
  const root = document.getElementById('modal-root');
  if (!root) return;
  for (const el of root.querySelectorAll('*')) {
    if (el.dataset.anScroll) continue;
    const oy = getComputedStyle(el).overflowY;
    if (oy !== 'auto' && oy !== 'scroll') continue;
    el.dataset.anScroll = '1';
    el.addEventListener('scroll', () => { if (AN.on) anDraw(); }, { passive: true });
  }
}
function anSync() { anPanel(); anDraw(); anBindScroll(); }
function setAnOpen(on) {
  AN.on = on; AN.sel = null;
  document.body.classList.toggle('an-open', on);
  document.getElementById('an-fab').classList.toggle('is-on', on);
  anSync();
}
document.getElementById('an-fab').addEventListener('click', () => setAnOpen(!AN.on));
addEventListener('scroll', () => { if (AN.on) anDraw(); }, { passive: true });
addEventListener('resize', () => { if (AN.on) anDraw(); });
/* Typing has to update the estimate without a full render — a re-render would drop the
   caret mid-sentence. So the two numbers that move are patched in place, and the rest of the
   screen (the cost line in the right column) is re-rendered only when the SEGMENT COUNT
   changes, which is the only moment the money actually moves. */
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'ord-size') { S.ordSize = Number(e.target.value); S.ordPage = 0; S.ordSel = []; S.ordAll = false; render(); return; }
  const ta = e.target && e.target.closest && e.target.closest('[data-camp-text]');
  if (ta) {
    const prev = S.campText == null ? DEFAULT_CAMP_TEXT : S.campText;
    const prevSegs = prev.length <= 160 ? 1 : Math.ceil(prev.length / 153);
    S.campText = ta.value;
    const segs = ta.value.length <= 160 ? 1 : Math.ceil(ta.value.length / 153);
    if (segs !== prevSegs) { const at = ta.selectionStart; render();
      const t2 = document.querySelector('[data-camp-text]'); if (t2) { t2.focus(); t2.setSelectionRange(at, at); } return; }
    const meta = document.getElementById('msg-meta');
    if (meta) meta.querySelector('.mm-seg').textContent = String(ta.value.length);
    return;
  }
  if (e.target && e.target.id === 'an-q') { AN.q = e.target.value; const c = e.target.selectionStart; anPanel(); const i = document.getElementById('an-q'); if (i) { i.focus(); i.setSelectionRange(c, c); } }
});
/* Dragging across a card is a text selection, not a click on the card. The card click
   rebuilds the panel, which destroys the range before Cmd+C can read it — so a live selection
   inside the panel wins and the card stays put. The range is tested against the panel, not the
   card, because a selection may run from one card into the next. */
function anSelecting() {
  const s = window.getSelection();
  if (!s || s.isCollapsed || !s.rangeCount) return false;
  const root = document.getElementById('an-panel-root');
  return !!root && root.contains(s.getRangeAt(0).commonAncestorContainer);
}
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-anclose]')) { setAnOpen(false); return; }
  const sc_ = e.target.closest('[data-anscope]');
  if (sc_) { AN.all = sc_.dataset.anscope === 'all'; anSync(); return; }
  const cp = e.target.closest('[data-ancopy]');
  if (cp) { e.stopPropagation(); anCopy(cp.dataset.ancopy, cp); return; }
  const pin = e.target.closest('[data-anpin]');
  /* Press the same pin again to drop the spotlight — a dim with no way out is a trap, and
     Escape already belongs to the panel. */
  if (pin) {
    AN.sel = AN.sel === pin.dataset.anpin ? null : pin.dataset.anpin;
    anSync();
    if (AN.sel) document.getElementById('an-card-' + AN.sel)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const card = e.target.closest('[data-ancard]');
  if (card && !anSelecting()) { AN.sel = card.dataset.ancard; anSync(); const a = ANNOS.find(x => x.id === AN.sel); document.querySelector(a.sel)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
});

function setProtoOpen(open) {
  document.getElementById('proto-panel').hidden = !open;
  document.body.classList.toggle('proto-open', open);
}
document.getElementById('proto-fab').addEventListener('click', () => {
  setProtoOpen(document.getElementById('proto-panel').hidden);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  // An open overlay takes the key first, so Escape never closes both at once.
  if (S.modal) { closeModal(); return; }
  if (AN.on) { setAnOpen(false); return; }
  closeModal();
});

render();
setProtoOpen(true);
</script>
</body>
</html>
