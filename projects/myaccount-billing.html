.unlock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.unlock-item { display: flex; gap: 12px; padding: 16px; border: 1px solid var(--border-elements); border-radius: 10px; }
.unlock-ico { width: 32px; height: 32px; border-radius: 8px; background: var(--muted); color: var(--fg-secondary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.unlock-ico svg { width: 16px; height: 16px; }
.unlock-title { font-size: 13px; font-weight: 600; }
.unlock-desc { margin-top: 3px; font-size: 12px; line-height: 16px; color: var(--fg-secondary); }
@media (max-width: 720px) { .unlock-grid { grid-template-columns: 1fr; } }

/* ============ Campaign send (Figma 3202:22463) ============ */
.crumb { font-size: 12px; color: var(--fg-muted); margin-bottom: 10px; }
.camp-title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.camp-actions { display: flex; gap: 8px; flex-shrink: 0; }
/* MEASURED OFF FIGMA, not invented (Grace, 2026-09-10: 지금 박스 사이즈 다 다르잖아! Phase1
   에서 만든거를 다 다르게 만들면 목업을 맞출수가 없어). The auto-layout panel on 864:370779
   gives these outright: left column **W 960 Fill**, right column **W 488**, column gap **24**,
   card padding **24**, and the right column's own stack gap **16**. 960 + 24 + 488 = **1472**,
   which is the same content width the Overview page uses (823:352793's frames are 1472 wide).
   We had `1fr 1fr` at gap 20 inside a 1024 measure, so every box on this page was a different
   size from the design and nothing could be checked against it. */
/* This page measures 1472, not --content-w 1024: 960 + 24 + 488. Scoped to the campaign
   screen so no other page moves. */
.body.camp { max-width: calc(1472px + var(--content-gutter) * 2); }
.body.camp > * { max-width: 1472px; }
.page-head.camp { max-width: calc(1472px + var(--content-gutter) * 2); }
/* RESPONSIVE BY RATIO (Grace, 2026-09-10). Fixed 960/488 matched Figma at one width and
   broke everywhere else. `960fr 488fr` keeps the design's proportion at ANY width, and the
   arithmetic lands exactly on Figma's numbers at the 1472 measure: the gap comes off first
   (1472 - 24 = 1448), then 1448 splits 960:488 into 960 and 488. So the design width is
   reproduced to the pixel and every narrower width is the same shape, smaller. */
.camp-grid { display: grid; grid-template-columns: minmax(0, 960fr) minmax(0, 488fr); gap: 24px; align-items: start; }
/* Below this the preview column is too narrow to be a phone, so the ratio stops helping and
   the two columns stack instead. */
@media (max-width: 980px) { .camp-grid { grid-template-columns: 1fr; } .preview-card { position: static; } }
.camp-col { display: flex; flex-direction: column; gap: 24px; }
/* The right column stacks at 16, not 24 - Figma gives the two columns different gaps. */
.camp-col:last-child { gap: 16px; }
.camp-grid .section-card { padding: 24px; }
.camp-card-title { font-size: 14px; font-weight: 600; }
.camp-card-sub { margin-top: 4px; font-size: 12px; color: var(--fg-secondary); }
.camp-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.ls-meta { margin-top: 10px; border: 1px solid var(--border-elements); border-radius: 8px; overflow: hidden; }
/* The row used to be three loose runs of text in one nowrap-less flex, so in a half-width
   column the values broke away from their labels — "Selected / Buyers" on two lines and
   "End Date" stranded above its date. Each label+value is now ONE nowrap pair, and the row
   wraps BETWEEN pairs, so it degrades by stacking whole facts instead of splitting them. */
.ls-meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; padding: 9px 12px; font-size: 12px; background: var(--muted); border-bottom: 1px solid var(--border-elements); }
.ls-meta-row:last-child { border-bottom: none; }
.ls-pair { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }

/* radio card — design system 4607:65567 */
.radio-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.radio-card { display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer; font-family: inherit; }
.radio-card:hover { border-color: var(--accent); }
.radio-card.is-sel { border: 2px solid var(--accent); padding: 15px; background: var(--muted); }
.radio { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 50%; background: #fff; flex-shrink: 0; margin-top: 1px; display: inline-flex; align-items: center; justify-content: center; }
.radio-card.is-sel .radio { border-color: var(--fg); }
.radio-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); }
.radio-body { display: flex; flex-direction: column; gap: 6px; }
.radio-label { font-size: 14px; line-height: 1; color: var(--fg); }
.radio-card.is-sel .radio-label { font-weight: 500; }
.radio-desc { font-size: 12px; line-height: 16px; color: var(--fg-secondary); }
.sched-detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-elements); }
.sched-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.sched-field { position: relative; display: flex; flex-direction: column; gap: 8px; }
.sched-lab { font-size: 13px; font-weight: 500; color: var(--fg); }
.input-btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; cursor: pointer; }
.input-btn svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--fg-secondary); }
.input-btn.is-open { border-color: var(--fg); }
.sched-help { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; line-height: 16px; color: var(--fg-secondary); }
.sched-help svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 2px; }
/* The picker floats over the card rather than pushing the reservation note down — the note
   is about the same decision and must not jump while a date is being chosen. */
.cal-pop { position: absolute; top: 100%; left: 0; margin-top: 6px; z-index: 30; width: 268px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); box-shadow: 0 10px 28px rgba(0,0,0,.12); }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px; }
.cal-title { font-size: 13px; font-weight: 600; }
.cal-nav { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-secondary); font-size: 15px; line-height: 1; cursor: pointer; }
.cal-nav:hover { background: var(--muted); color: var(--fg); }
.cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-dow span { padding: 2px 0 4px; text-align: center; font-size: 11px; color: var(--fg-muted); }
.cal-cell { display: block; width: 100%; }
.cal-day { width: 100%; height: 32px; border: 0; border-radius: 8px; background: transparent; font: 500 13px inherit; color: var(--fg); cursor: pointer; }
.cal-day:not([disabled]):hover { background: var(--muted); }
.cal-day.is-sel { background: var(--fg); color: #fff; }
.cal-day.is-past { color: var(--fg-muted); cursor: default; }
.cal-day.is-off { color: var(--border-elements); cursor: default; }
/* The one new state. Colour and strikethrough are the supplied spec's own values, so they
   sit outside the token set on purpose — see the item on this field. */
.cal-day.is-blocked { color: #a8416a; background: #fcf0f4; text-decoration: line-through; text-decoration-thickness: 1px; cursor: default; }
.cal-cell .tip-bubble { right: auto; left: 50%; transform: translateX(-50%); width: 190px; }
.cal-note { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--border-elements); font-size: 11.5px; line-height: 16px; color: var(--fg-secondary); }
.cal-note svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 2px; }

/* preview */
.preview-card { position: sticky; top: 16px; }
.phone { margin-top: 14px; border: 1px solid var(--border-elements); border-radius: 12px; padding: 18px 16px; min-height: 300px; }
.phone-num { text-align: center; font-size: 12px; font-weight: 500; background: var(--muted); border-radius: 999px; padding: 5px 12px; display: inline-block; margin: 0 auto 16px; width: auto; }
.phone { text-align: center; }
.bubble { text-align: left; display: inline-block; max-width: 78%; background: var(--muted); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 19px; }
.preview-note { margin-top: 14px; font-size: 11px; line-height: 16px; color: var(--fg-muted); }

/* the cost line is where the pre-send check lives — it already existed */
.cost-line { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-elements); font-size: 12px; line-height: 17px; color: var(--fg-secondary); }
.cost-line.short { display: flex; gap: 8px; color: #7c5a2e; background: var(--badge-amber); border: 1px solid #f0dcc0; border-radius: 8px; padding: 11px 13px; margin-top: 14px; }
.cost-line.short strong { color: #6b4a22; }
.cost-ico { width: 16px; height: 16px; flex-shrink: 0; color: var(--badge-amber-fg); }
.cost-ico svg { width: 16px; height: 16px; }

@media (max-width: 1180px) { .camp-grid { grid-template-columns: 1fr; } }

/* ============ Modal ============ */
.scrim { position: fixed; inset: 0; background: rgba(31,31,31,.4); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 200; }
/* every modal is 480 max — same measure as the drawer */
.modal { width: 100%; max-width: 480px; max-height: calc(100vh - 48px); overflow-y: auto; background: var(--card); border-radius: 16px; box-shadow: var(--shadow-lg); }
/* SHORT SCREENS (Grace, 2026-09-11: 13인치나 11인치같은 모니터에서는 너무 길수있는데).
   Measured at 1366x768 with the PM's full disclosure: the purchase modal is 780px against
   720px of room — 60px over — and `Confirm & Send` lands BELOW the fold. The old rule scrolled
   the WHOLE modal, so the title and the button both slid away and the vendor had to scroll to
   find the thing they came to press.
   Now the head and the foot are pinned and only the body scrolls, so **the primary action is
   always on screen at any height**, and the consent line sits directly above it — the last
   thing read before pressing, which is where a consent belongs.
   Scoped with :has() so modals that have no .modal-body (the confirm dialogs) keep the plain
   behaviour rather than getting clipped by overflow:hidden. */
.modal:has(> .modal-body) { display: flex; flex-direction: column; overflow: hidden; }
.modal:has(> .modal-body) > .modal-head,
.modal:has(> .modal-body) > .modal-foot { flex: 0 0 auto; }
.modal:has(> .modal-body) > .modal-body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 0; }
.modal-title { font-size: 18px; font-weight: 700; }
.modal-sub { margin-top: 4px; font-size: 13px; color: var(--fg-secondary); }
.modal-x { width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: var(--fg-muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.modal-x:hover { background: var(--muted); color: var(--fg); }
.modal-body { padding: 20px 24px; }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 24px 22px; border-top: 1px solid var(--border-elements); margin-top: 4px; }
.modal-foot .left-note { margin-right: auto; font-size: 12px; color: var(--fg-muted); }
/* The escape hatch is a text link, not a second button, and it does NOT take the accent —
   the modal already has one pink control and the rule is one per screen. In the footer it
   competed for width with Cancel / Confirm and wrapped to two lines, so it sits in the body
   under what gets charged, where it has the full measure. */
.helper-consent { margin-top: 10px; font-size: 12px; line-height: 17px; color: var(--fg-muted); }
.helper-consent strong { font-weight: 600; color: var(--fg-secondary); }
.modal-body .linkbtn { display: inline-block; margin-top: 14px; color: var(--fg-secondary); font-size: 12px; font-weight: 500; text-decoration: underline; }
.modal-band { position: relative; background: var(--primary); color: #fff; padding: 22px 24px; border-radius: 16px 16px 0 0; text-align: center; }
.modal-band-title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.modal-x-light { position: absolute; top: 14px; right: 14px; color: #fff; opacity: .85; }
.modal-x-light:hover { opacity: 1; }
.plan-hero-bare { background: transparent; padding: 6px 0 18px; justify-content: center; text-align: center; }
.btn-block { width: 100%; justify-content: center; }
.pitch { text-align: center; }
.pitch-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 6px; }
.pitch-hero .plan-hero-price { font-size: 48px; line-height: 52px; }
.pitch-title { font-size: 15px; font-weight: 700; margin: 6px 0 12px; }
.pitch .unlock-grid { text-align: left; max-width: 560px; margin: 0 auto; }
.pitch-cta { max-width: 560px; margin: 20px auto 0; }
/* Own class for the Send-to-email row. It first reused the paper footer's class and flexed
   that footer into columns (Grace, 9/2: "찌그러지는데"); the paper footer itself was then
   removed as non-PRD content, but keep this name separate from anything on the paper. */
.rcpt-send { display: flex; justify-content: flex-end; padding: 0 24px 22px; }
.rcpt-send /* Figma Button 695:27205 — icons are 16px and the 8px flex gap is the ONLY spacing.
   The 6px margin on top of that gap was ours, and it made every icon button read 14px
   loose instead of 8. */
.btn svg { width: 16px; height: 16px; }
.modal-link { display: block; width: 100%; margin-top: 12px; background: none; border: 0; padding: 6px; font: inherit; font-size: 13px; color: var(--fg-secondary); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.modal-link:hover { color: var(--fg); }

/* Group header — only the merged 4-tab layout uses these. Folding two tabs into one
   page is only worth doing if the result reads as a few things instead of many, so
   the merged tab is three labelled groups. The header carries the group's name and,
   for the subscription group, its status and action too — the card inside then drops
   its own head rather than repeating the name one line below it. */
.group { margin-top: 26px; }
.group:first-child { margin-top: 0; }
.group-head { display: flex; align-items: flex-start; gap: 14px; padding: 0 2px 12px; }
.group-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.group-desc { margin-top: 2px; font-size: 12.5px; color: var(--fg-secondary); }
.group-actions { margin-left: auto; flex-shrink: 0; }
.group-body { display: flex; flex-direction: column; gap: 14px; }


/* Consent row — §6.2 step 4 records consent as chargeback evidence, so it has to
   be an affirmative act, not fine print. Selection uses the system's 2px #404040
   selected-state border, keeping the one saturated pink for the primary button. */
/* Clickwrap consent. RESTORED as a checkbox on 2026-09-22 (Grace), reversing the 8/28 call
   that made the primary button the whole act. Figma 2329:49591 draws it this way and gates
   the button on it. 🔴 DEVIATION: §3.4 and PB 2.3.0 both say "I Consent" 명시 클릭, and that
   wording is 법무 권고 (8/26) — the PRD has to be amended or this reverted. Gap K-36.
   Still no bordered box around the row: the checkbox is the control, and a box around the
   sentence would read as a second one (affordance-rules). */
.consent-note { font-size: 12.5px; line-height: 19px; color: var(--fg-secondary); margin-top: 18px;
  display: grid; grid-template-columns: 16px 1fr; gap: 10px; align-items: start; cursor: pointer; }
.consent-note strong { color: var(--fg); font-weight: 600; }
.chk { width: 16px; height: 16px; margin-top: 1px; border: 1.5px solid var(--border-strong, #d9d2c9);
  border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background .12s, border-color .12s; }
.chk svg { width: 11px; height: 11px; opacity: 0; stroke: #fff; stroke-width: 3; }
.consent-note.is-on .chk { background: var(--accent); border-color: var(--accent); }
.consent-note.is-on .chk svg { opacity: 1; }

/* ============ Right drawer ============
   Project rule: modals are CONFIRMATION ONLY.
   Anything the vendor has to fill in or choose opens here, or expands inline. */
.drawer-scrim { position: fixed; inset: 0; background: rgba(31,31,31,.35); z-index: 200; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100vw;
  background: var(--card); box-shadow: var(--shadow-lg); z-index: 201;
  display: flex; flex-direction: column;
  animation: drawerIn .22s cubic-bezier(.22,1,.36,1);
}
@keyframes drawerIn { from { transform: translateX(100%); } to { transform: none; } }
@media (min-width: 1240px) { body.proto-open .drawer { right: 356px; } }
.drawer-head { flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 16px; border-bottom: 1px solid var(--border-elements); }
.drawer-title { font-size: 18px; font-weight: 700; }
.drawer-sub { margin-top: 4px; font-size: 13px; color: var(--fg-secondary); line-height: 18px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
.drawer-foot { flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--border-elements); background: var(--card); }
.drawer-foot .left-note { margin-right: auto; font-size: 12px; color: var(--fg-muted); }

/* inline card entry form (Payment methods) — a card is a row added to a list that is
   already on this page, so it expands in place instead of opening an overlay. */
/* One accent per screen: the form is a quiet neutral surface and lets the
   primary button carry the only saturated pink in view. */
.inline-form { border: 1px solid var(--border-muted); border-radius: 12px; background: var(--muted); padding: 20px; margin-bottom: 14px; animation: inlineIn .18s ease-out; }
/* Card entry became a modal on 2026-08-24. Its inner markup still uses the inline-form
   classes, so the padding that .inline-form used to supply moves onto the modal. */
.modal.card-modal { padding: 20px 22px 22px; }

/* ============ Email ============
   Figma node 317:816391 — the transactional shell Shopcord ALREADY sends, so these
   templates are dressed in it rather than in something invented. Two things it does
   not share with the product: the type is Arial, because it is email and web-safe
   fonts are the constraint; and the CTA pink is the email's own #e53a85, not
   --primary. Measurements are the node's — 600 canvas, 540 card, 480 content column,
   30px gutters, 50px CTA, 0.64px tracking on the uppercase label.

   The preview around it is reviewer scaffolding: the header carries the PB id, the
   recipient and the channels, and the subject line sits in a mail-client bar, because
   the subject is as much of the deliverable as the body. */
.email-modal { width: 100%; max-width: 700px; max-height: calc(100vh - 48px); display: flex; flex-direction: column;
  background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-lg); }
.em-head { flex-shrink: 0; padding: 16px 20px; border-bottom: 1px solid var(--border-elements); background: var(--bg);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.em-spec { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-muted); }
.em-meta { margin-top: 7px; font-size: 12px; line-height: 18px; color: var(--fg-secondary); }
.em-chan { display: inline-flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
.em-chip { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; padding: 2px 7px; border-radius: 999px;
  background: var(--badge-blue); color: #4a6285; }
.em-chip.off { background: #f4f4f5; color: var(--fg-muted); text-decoration: line-through; }
/* The source chip answers one question — is this mail in the PRD — so it gets the badge
   tokens the rest of the file uses for state, not a new palette. Green is not "good", it is
   "specified"; amber is not "broken", it is "ours, and it needs a PB id". */
.em-src { display: inline-block; margin-right: 7px; padding: 2px 7px; border-radius: 999px;
  font-size: 10px; font-weight: 700; letter-spacing: .06em; vertical-align: 1px; }
.em-src.is-prd  { background: var(--badge-green); color: var(--badge-green-fg); }
.em-src.is-ours { background: var(--badge-amber); color: var(--badge-amber-fg); }
.em-src.is-r2   { background: var(--badge-gray);  color: var(--badge-gray-fg); }
/* Figma presence is a reference line, not a state — so it is small grey text with one
   keyword lifted, rather than a second row of coloured pills competing with the source chip. */
.em-fig { margin-top: 5px; font-size: 10.5px; line-height: 15px; color: var(--fg-muted); font-weight: 400;
  letter-spacing: 0; text-transform: none; }
.em-fig-k { font-weight: 700; letter-spacing: .05em; margin-right: 6px; }
.em-fig-k.is-yes { color: var(--badge-blue-fg); }
.em-fig-k.is-no  { color: var(--badge-amber-fg); }
.em-scroll { flex: 1; overflow-y: auto; background: #e7e2dc; padding: 22px; }
.em-frame { width: 600px; max-width: 100%; margin: 0 auto; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.10); }
.em-subj { background: #fff; padding: 13px 20px; border-bottom: 1px solid var(--border-elements);
  font-size: 11.5px; line-height: 17px; color: var(--fg-muted); }
.em-subj b { display: block; margin-top: 3px; font-size: 13.5px; color: var(--fg); font-weight: 600; }

/* ---- the shell itself ---- */
.em-canvas { background: var(--email-bg); padding: 30px 0 40px; font-family: Arial, Helvetica, sans-serif; }
.em-logo { text-align: center; font-size: 20px; line-height: 21px; font-weight: 700; letter-spacing: -.03em; color: #1f1f1f; }
.em-logo span { color: var(--email-accent); }
.em-card { width: 540px; max-width: calc(100% - 24px); margin: 30px auto 0; background: #fff; border-radius: 8px;
  padding: 30px 30px 38px; color: #333; }
.em-title { font-size: 22px; line-height: 32px; font-weight: 700; text-align: center; }
.em-sub { margin-top: 8px; font-size: 16px; line-height: 24px; font-weight: 700; text-align: center; }
.em-rule { width: 60px; height: 1px; background: #d8d3ce; margin: 30px auto 0; }
.em-content { margin-top: 30px; display: flex; flex-direction: column; gap: 24px; font-size: 16px; line-height: 24px; }
.em-content > p { margin: 0; }
.em-link { font-weight: 700; text-decoration: underline; color: #333; }
.em-cta { display: block; height: 50px; line-height: 50px; border-radius: 8px; background: var(--email-accent); color: #fff;
  text-align: center; font-size: 16px; font-weight: 700; letter-spacing: .64px; text-transform: uppercase; text-decoration: none; }
.em-sign { margin-top: 30px; font-size: 16px; line-height: 24px; color: #333; }
.em-footer { width: 540px; max-width: calc(100% - 24px); margin: 50px auto 0; text-align: center;
  font-family: Arial, Helvetica, sans-serif; font-size: 11px; line-height: 18px; color: #666; }
.em-footer div + div { margin-top: 4px; }
.em-footer u { text-decoration: underline; }
/* Not in the node — invoices need a figure the eye can land on, and a sentence cannot
   carry four numbers. Kept in the shell's type and colour so it reads as part of it. */
.em-box { border: 1px solid #e5e0da; border-radius: 8px; overflow: hidden; }
.em-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 15px; font-size: 15px; }
.em-row + .em-row { border-top: 1px solid #e5e0da; }
.em-row .k { color: #666; }
.em-row .v { font-weight: 700; text-align: right; }
.em-row.tot { background: var(--email-bg); }
.em-row.tot .v { font-size: 19px; }
/* §6.3.4 gives the recovery invoice a LINE, not a label/value pair: 제목 - 부제 (Reference).
   One invoice can carry several, one per reason, so it has to stack rather than sit in a
   right-aligned cell. */
.em-line { padding: 12px 15px; font-size: 15px; line-height: 21px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.em-line .t { flex: 1; min-width: 0; }
.em-line .t b { font-weight: 700; }
.em-line .ref, .inv-line .ref { display: block; margin-top: 1px; font-size: 13px; line-height: 18px; color: #8a837c; }
.em-line .v { white-space: nowrap; font-weight: 700; }
.inv-line b { font-weight: 700; }
.em-line + .em-line, .em-line + .em-row, .em-row + .em-line { border-top: 1px solid #e5e0da; }
/* A receipt is read in one glance for the amount, then scanned for the rest. Six identical
   rows made the receipt number as loud as the money (Grace, 9/14: "되게 이상한데?"), so the
   figure leads and the reference lines sit under the box, quiet. */
.em-amt { padding: 20px 15px 16px; text-align: center; border-bottom: 1px solid #e5e0da; }
.em-amt-v { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; color: #1f1f1f; }
.em-amt-k { margin-top: 5px; font-size: 14px; color: #666; }
.em-meta { margin-top: 14px; display: grid; gap: 4px; font-size: 13.5px; color: #77706a; }
.em-meta b { color: #444; font-weight: 600; }
.em-plain { background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f1f1f; font-size: 13px; }
.em-plainsender { display: flex; gap: 12px; padding: 16px 20px 12px; }
.em-plainavatar { width: 36px; height: 36px; border-radius: 50%; background: var(--email-accent); color: #fff; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.em-plainwho b { font-weight: 600; }
.em-plaintime { margin-left: 8px; font-size: 12px; color: var(--fg-muted); }
.em-plainline { margin-top: 3px; font-size: 12.5px; color: var(--fg-secondary); }
.em-plainline .k { color: var(--fg-muted); margin-right: 6px; }
.em-plainattach { margin: 0 20px; border-top: 1px solid var(--border-elements); border-bottom: 1px solid var(--border-elements); padding: 10px 0 12px; }
.em-plainattach-h { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-secondary); margin-bottom: 8px; }
.em-plainattach-h svg { width: 12px; height: 12px; }
.em-plainattach .muted, .em-plainbody .muted { color: var(--fg-muted); }
.em-plainfile { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--muted); border-radius: 6px; font-size: 12.5px; }
.em-plainfile svg { width: 13px; height: 13px; color: var(--fg-secondary); flex-shrink: 0; }
.em-plainpdf { font-size: 9px; font-weight: 800; letter-spacing: .04em; color: #fff; background: #c0392b; border-radius: 3px; padding: 2px 4px; }
.em-plainfile b { font-weight: 600; }
.em-plainbody { padding: 0; }
.em-plainbody .em-canvas { padding: 24px 0 28px; }
.em-plainreply { display: flex; gap: 6px; padding: 18px 20px 22px; }
.em-plainreply span { font-size: 12px; padding: 6px 12px; border: 1px solid var(--border-muted); border-radius: 4px; background: #fff; color: var(--fg); }
.em-ul { margin: 0; padding-left: 22px; }
.em-ul li + li { margin-top: 8px; }
/* The cancellation mail's two answers (PM's layout, 9/14). A vendor opens this asking two
   things — what did I lose, and what do I still have — and a flat bullet list gave both the
   same weight. Opposite markers do the work the list could not. Label styling is .em-sms-k's,
   already in this file, so this adds a layout, not a type voice. */
.em-group-k { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #7d766c; }
.em-group ul { margin: 11px 0 0; padding: 0; list-style: none; }
.em-group li { position: relative; padding-left: 26px; font-size: 15px; line-height: 23px; }
.em-group li + li { margin-top: 7px; }
.em-group li::before { position: absolute; left: 2px; top: 0; font-weight: 700; }
.em-group.keeps li::before { content: "\2713"; color: #1a8a53; }
.em-group.paused li { color: #77706a; }
.em-group.paused li::before { content: "\2014"; color: #a8a29a; font-weight: 400; }
/* A condition, not a status — so it leaves the list and sits in its own block. */
.em-callout { background: var(--email-bg); border-radius: 8px; padding: 14px 16px; font-size: 15px; line-height: 23px; }
/* The SMS tail is an addendum: the rule and the dot say "a different thing starts here". */
.em-hr { height: 1px; background: #e5e0da; }
.em-tag { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; }
.em-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--email-accent); flex-shrink: 0; }
.em-q { font-size: 15px; line-height: 23px; color: #77706a; }
.em-q b { color: #1f1f1f; font-weight: 700; }
.em-sms { width: 540px; max-width: calc(100% - 24px); margin: 18px auto 0; }
.em-sms-k { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #7d766c; }
.em-sms-bubble { margin-top: 7px; background: #fff; border-radius: 12px; padding: 12px 15px;
  font-size: 13px; line-height: 19px; box-shadow: var(--shadow-xs); }
.em-open { width: 540px; max-width: calc(100% - 24px); margin: 16px auto 0; background: var(--sonner-bg-warning);
  border-radius: 10px; padding: 12px 14px; font-size: 12px; line-height: 18px; color: #7c5a1f; }
.em-open b { font-weight: 700; }

/* ============ Generated document (PO) ============
   Structure follows the current FashionGo PO, which is what §5.1's attachment spec says
   to reference (Figma 326:823247 — a flattened screenshot, so there is nothing to
   pixel-match; what it offers is an information architecture that has survived real
   wholesale use). Bordered blocks, a size grid inside each line, and a totals stack.
   The CONTENT is Shopcord's, and the differences are deliberate — see docPO. */
.doc-modal { width: 100%; max-width: 940px; max-height: calc(100vh - 48px); display: flex; flex-direction: column;
  background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-lg); }
/* A viewer toolbar, not a review header. The spec id, the recipient and the chips used to
   sit here and they are the reason the thing read as "what am I looking at" — that is
   reviewer furniture on top of a document. It lives in the panel list instead, where the
   reviewer already is. What a PDF viewer shows is the file and what you can do with it. */
.doc-head { flex-shrink: 0; padding: 11px 14px 11px 18px; border-bottom: 1px solid var(--border-elements);
  background: var(--card); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.doc-name { font-size: 13px; font-weight: 600; color: var(--fg); }
.doc-actions { display: flex; align-items: center; gap: 6px; }
.doc-scroll { flex: 1; overflow-y: auto; background: #b9b4ae; padding: 26px 22px; }
/* Documents inside the viewer are SHEETS: US Letter at 96dpi (816 × 1056), real page
   margins, a shadow so the edge reads, and the gray behind them a PDF viewer uses.
   Type is sized to the page (9–11pt printed), not to the screen — that is most of what
   makes a document look like a document rather than a web page. */
.sheet { width: 816px; min-height: 1056px; margin: 0 auto; background: #fff;
  padding: 48px 54px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.sheet + .sheet { margin-top: 24px; }

/* The PO wears the SETTLEMENT statement's visual language (Figma 326:823258) — that node
   is the design reference: big left title with a muted number under it, brand and
   generated-on to the right, then ONE bordered card holding everything, muted small
   labels over bold values, thin-ruled rows, an oversized total.
   Its CONTENT is not borrowed. The content reference is the current FashionGo PO, which
   is what §5.1 names — adapted to Shopcord, because the platforms differ. The two
   references do different jobs and neither does the other's. */
/* Figma 326:823040 — the PO layout Grace's side picked. A flat table with ONE ROW PER
   COLOURWAY rather than a grid nested inside each style: the same numbers, but the page
   reads top to bottom in one pass and every row carries its own money. Header is the
   wordmark and title on the left with a fact list on the right over a heavy rule; the
   parties sit in a single bordered box split down the middle. */
.po-paper { color: #1a1a1a; font-size: 11px; line-height: 16px; }
.po-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; }
.po-brandmark { font-size: 13px; font-weight: 700; letter-spacing: -.02em; }
.po-brandmark span { color: var(--email-accent); }
.po-title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin-top: 3px; }
.po-facts { min-width: 268px; }
.po-fact { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 2.5px 0; }
.po-fact .k { color: #8a8378; }
.po-fact .v { font-weight: 700; text-align: right; }
.po-pill { display: inline-block; padding: 1px 9px; border: 1px solid #1a1a1a; border-radius: 999px;
  font-size: 9px; font-weight: 700; letter-spacing: .05em; }
.po-rule { height: 2px; background: #1a1a1a; margin: 12px 0 15px; }

.po-parties { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #ddd8d2; }
.po-party { padding: 12px 16px; }
.po-party + .po-party { border-left: 1px solid #ddd8d2; }
.po-k { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8a8378; }
.po-name { margin-top: 6px; font-size: 12px; font-weight: 700; }
.po-line { color: #3a3a3a; }
.po-sub { margin-top: 11px; padding-top: 10px; border-top: 1px dashed #ddd8d2; }
.po-sub .po-k { margin-bottom: 5px; }

.po-tbl { width: 100%; border-collapse: collapse; margin-top: 16px; }
.po-tbl th { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8a8378;
  text-align: left; padding: 0 8px 7px 0; border-bottom: 1px solid #cfc9c2; white-space: nowrap; }
.po-tbl th.n, .po-tbl td.n { text-align: right; padding-right: 0; }
.po-tbl th.n { padding-right: 0; }
.po-tbl td { padding: 9px 8px 9px 0; border-bottom: 1px solid #efece8; vertical-align: top; }
.po-opt { font-weight: 700; }
.po-style { margin-top: 1px; font-size: 10px; color: #8a8378; white-space: nowrap; }
.po-run { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; white-space: nowrap; }

.po-sums { margin-top: 14px; display: flex; justify-content: flex-end; }
.po-sums-in { min-width: 292px; }
.po-sum { display: flex; justify-content: space-between; gap: 20px; padding: 3px 0; }
.po-sum.tot { margin-top: 7px; padding-top: 10px; border-top: 1px solid #1a1a1a; font-size: 15px; font-weight: 700; }
.po-ship { margin-top: 5px; text-align: right; font-size: 10px; color: #8a8378; font-style: italic; }

/* No rule under a label. A rule between a label and the value it labels breaks the pair
   the eye is trying to read as one thing, and six of them turned this page into stripes.
   Sections are separated by SPACE — the same vocabulary the settlement statement uses,
   where rules divide rows of data and never a label from its value. */
.po-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 30px; margin-top: 30px; }
.po-meta-v { margin-top: 6px; }
.po-meta-v.soft { color: #8a8378; }
.po-note { margin-top: 28px; }
.po-note-v { margin-top: 6px; color: #3a3a3a; }
/* Terms is a labelled block like the others, not a floating outlined box — an outlined
   box reads as a control here, and the italic grey already says "placeholder". */
.po-legal { margin-top: 28px; }
.po-legal-v { margin-top: 6px; font-size: 10.5px; color: #9a9389; font-style: italic; }
.po-cont { display: flex; justify-content: space-between; gap: 20px; padding-bottom: 12px;
  border-bottom: 1px solid #ddd8d2; color: #8a8378; }
.po-cont b { color: #1a1a1a; font-weight: 700; }
.po-foot { margin-top: 24px; padding-top: 13px; border-top: 1px solid #ddd8d2; display: flex;
  justify-content: space-between; gap: 20px; font-size: 10px; color: #8a8378; }

@page { size: letter portrait; margin: 0; }
@media print {
  body[data-print="doc"] { background: #fff; }
  body[data-print="doc"] > *:not(#modal-root) { display: none !important; }
  body[data-print="doc"] #modal-root .scrim { position: static; background: none; padding: 0; display: block; }
  body[data-print="doc"] .doc-modal { max-width: none; max-height: none; border-radius: 0; box-shadow: none; display: block; }
  body[data-print="doc"] .doc-head { display: none !important; }
  body[data-print="doc"] .doc-scroll { overflow: visible; background: #fff; padding: 0; }
  body[data-print="doc"] .po-paper { max-width: none; box-shadow: none; padding: 40px 46px; }
  body[data-print="doc"] .po-line, body[data-print="doc"] .po-top,
  body[data-print="doc"] .po-boxrow, body[data-print="doc"] .po-bottom { break-inside: avoid; }
}

/* ---- settlement statement ----
   Figma 326:823258 — the PDF settlement already sends. Design taken as directed: a big
   title with a muted statement number, the brand and generation date on the right, and
   ONE bordered card holding a vendor block, a settlement date, and a summary whose
   adjustments nest under their total. */
.stmt { color: #1a1a1a; font-size: 12px; line-height: 18px; }
.stmt-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 32px; margin-bottom: 18px; }
.stmt-title { font-size: 21px; line-height: 27px; font-weight: 700; letter-spacing: -.02em; }
.stmt-no { margin-top: 6px; font-size: 13px; color: #9a9a9a; }
.stmt-brand { font-size: 19px; font-weight: 700; text-align: right; }
.stmt-gen { margin-top: 6px; font-size: 13px; color: #9a9a9a; text-align: right; }
.stmt-card { padding-top: 22px; border-top: 1px solid #e8e6e3; margin-top: 20px; }
.stmt-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.stmt-k { font-size: 13px; color: #9a9a9a; }
.stmt-name { margin-top: 8px; font-weight: 700; }
.stmt-line { color: #3a3a3a; }
.stmt-gap { margin-top: 14px; }
.stmt-date { margin-top: 8px; font-size: 17px; font-weight: 700; }
.stmt-sum-k { margin-top: 30px; font-size: 13px; color: #9a9a9a; }
.stmt-row { display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
  padding: 13px 0; border-bottom: 1px solid #efece8; font-weight: 700; }
.stmt-sub { display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
  padding: 5px 0 5px 24px; color: #7a7a7a; font-weight: 400; border-bottom: 0; }
.stmt-sub + .stmt-row { border-top: 1px solid #efece8; }
.stmt-total { display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
  padding: 18px 0 4px; font-size: 20px; font-weight: 700; }

/* ---- receipt: a FIELD SPEC drawn as the document ----
   Balance renders the real thing, so this is not a visual template to hand them. It is
   the field list arranged the way a receipt arranges fields, because that is the form in
   which "these must be present" is actually reviewable — a bulleted list of field names
   hides whether the document would make sense. Every value here is either doc-grounded
   or marked as a request. */
.rcpt { max-width: 620px; margin: 0 auto; background: #fff; border: 1px solid #e2ddd7; border-radius: 6px;
  padding: 30px 34px; color: #1c1c1c; font-size: 12.5px; line-height: 18px; }
/* Inside a sheet the page already is the paper, so the receipt drops its own frame. */
.sheet .rcpt { max-width: none; border: 0; border-radius: 0; padding: 0; }
/* In the vendor's modal the modal IS the sheet, so the paper drops its own frame. */
.modal.rcpt-modal { max-width: 620px; padding: 0; position: relative; overflow: visible; }   /* 620 — Grace, 9/2; was 680 */
/* The close button lives in its own band above the paper (Grace, 9/2: it sat on top of the
   RECEIPT heading). Paper top padding clears the 32px button plus a gap. */
.rcpt-modal .rcpt { max-width: none; border: 0; border-radius: 16px; padding: 60px 38px 34px; }
.rcpt-modal .modal-x { position: absolute; top: 16px; right: 16px; }
.rcpt-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
  padding-bottom: 18px; border-bottom: 1px solid #e2ddd7; }
.rcpt-brand { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.rcpt-brand span { color: var(--email-accent); }
.rcpt-org { margin-top: 7px; color: #6b6b6b; }
.rcpt-doc { text-align: right; }
.rcpt-doc-k { font-size: 15px; font-weight: 700; letter-spacing: .1em; }
.rcpt-paid { display: inline-block; margin-top: 7px; padding: 2px 9px; border-radius: 999px;
  background: var(--badge-green); color: var(--badge-green-fg); font-size: 10px; font-weight: 700; letter-spacing: .06em; }
.rcpt-paid.due { background: var(--badge-red); color: var(--badge-red-fg); }
.rcpt-note { margin-top: 20px; padding-top: 14px; border-top: 1px solid #eeeae4; font-size: 11.5px; line-height: 17px; color: #6d675f; }
.rcpt-note b { color: #1c1c1c; }
.rcpt-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 20px; }
.rcpt-k { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #8a8378; }
.rcpt-v { margin-top: 6px; }
.rcpt-v .muted { color: #6b6b6b; }
.rcpt-tbl { width: 100%; border-collapse: collapse; margin-top: 22px; }
.rcpt-tbl th { text-align: left; font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: #8a8378; padding: 0 0 8px; border-bottom: 1px solid #1c1c1c; }
.rcpt-tbl th.n, .rcpt-tbl td.n { text-align: right; }
.rcpt-tbl td { padding: 11px 0; border-bottom: 1px solid #eeeae4; }
.rcpt-sums { margin-top: 14px; display: flex; justify-content: flex-end; }
.rcpt-sums-in { min-width: 250px; }
.rcpt-sum { display: flex; justify-content: space-between; padding: 4px 0; }
.rcpt-sum.tot { margin-top: 5px; padding-top: 9px; border-top: 1px solid #1c1c1c; font-size: 14px; font-weight: 700; }

/* ---- reference card: notes under the spec ----
   The receipt is Balance's PDF. Drawing a version of it would be inventing another
   company's document, and a reviewer would then measure our build against a picture
   nobody agreed to. So this states what it is, what we hand over, and what is still
   unanswered — and looks deliberately like a spec, not a design. */
.ref-card { max-width: 720px; margin: 0 auto; background: var(--card); border: 1px solid var(--border-elements);
  border-radius: 12px; padding: 24px 26px; }
.ref-warn { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--sonner-bg-warning);
  color: #7c5a1f; font-size: 13px; line-height: 19px; }
.ref-sec { margin-top: 22px; }
.ref-k { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted);
  padding-bottom: 7px; border-bottom: 1px solid var(--border-elements); }
.ref-v { margin-top: 10px; font-size: 13.5px; line-height: 20px; color: var(--fg-secondary); }
.ref-v b { color: var(--fg); font-weight: 600; }
.ref-v ul { margin: 8px 0 0; padding-left: 19px; }
.ref-v li + li { margin-top: 5px; }
.ref-src { margin-top: 4px; font-size: 11.5px; color: var(--fg-muted); }
.ref-tbl { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
.ref-tbl th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--fg-muted); padding: 0 10px 7px 0; border-bottom: 1px solid var(--border-elements); }
.ref-tbl td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--border-elements); vertical-align: top;
  color: var(--fg-secondary); line-height: 19px; }
.ref-tbl td:first-child { color: var(--fg); font-weight: 600; width: 38%; }
.ref-tbl td:last-child { padding-right: 0; font-size: 11.5px; color: var(--fg-muted); width: 30%; }
.ref-tbl tr.want td:first-child::after { content: 'REQUESTED'; margin-left: 8px; font-size: 9px; font-weight: 700;
  letter-spacing: .05em; padding: 1px 5px; border-radius: 3px; background: var(--badge-amber); color: var(--badge-amber-fg); vertical-align: 2px; }

/* ============ Confirmation popup ============
   Figma "Payment & Billing Update" node 1:22320 (Popup-Discard). The design system's
   alert-style confirm, and it is NOT the wide modal above — measured differences, all
   taken from the node: 8px radius (not 16), a 1px elements border, 24px padding and
   24px gaps, a 16/24 semibold title (not 18/700) beside a 32px error-tinted circle,
   14/20 body text at full --fg (not 13px secondary), and NO close X (hidden in the
   component).
   The two buttons are EQUAL and fill the row: the safe one carries a full-strength
   #1f1f1f border rather than the muted one, so neither choice is visually suppressed —
   which is also what keeps the cancel path from becoming a dark pattern. */
.modal.modal-confirm { max-width: 620px; padding: 24px; border: 1px solid var(--border); border-radius: 8px;
  display: flex; flex-direction: column; gap: 24px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1); }
.confirm-top { display: flex; align-items: center; gap: 8px; }
.confirm-ico { width: 32px; height: 32px; border-radius: 9999px; background: var(--sonner-bg-error);
  color: var(--sonner-fg-error); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.confirm-ico svg { width: 16px; height: 16px; }
.confirm-title { font-size: 16px; line-height: 24px; font-weight: 600; color: #0a0a0a; }
.confirm-detail { font-size: 14px; line-height: 20px; color: var(--fg); }
.confirm-detail > p { font-weight: 500; margin: 0; }
.confirm-detail ul { margin: 20px 0 0; padding-left: 21px; list-style: disc; }
.confirm-detail li { font-weight: 400; }
.confirm-detail li + li { margin-top: 2px; }
.confirm-foot { display: flex; gap: 8px; }
.confirm-foot .btn { flex: 1 0 0; min-width: 0; }
.confirm-foot .btn-outline { border-color: var(--fg); box-shadow: none; }
@keyframes inlineIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.inline-form-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.inline-form-title { font-size: 14px; font-weight: 700; }
.inline-form-sub { margin-top: 3px; font-size: 12px; color: var(--fg-secondary); }
.inline-form-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-elements); }
/* The label carries the amount, so it changes width with the selection ($28.00 →
   $230.00) and dragged Cancel sideways on every click. A floor wide enough for the
   longest amount holds both buttons still. */
.inline-form-foot .btn-primary { min-width: 132px; justify-content: center; }
.inline-form-foot .left-note { margin-right: auto; font-size: 12px; color: var(--fg-muted); }
/* height is reserved so the Balance widget growing (state field, inline errors)
   doesn't shove the card list down mid-entry */
/* No min-height reserve — the mock's field set is static, so the frame sizes to content and
   there is no jump to absorb. Balance's real widget loads async; if it flashes, give the frame
   back a reserve sized to the widget, not to ours. */
/* the row that was just added gets a moment of attention */
@keyframes cardFlash {
  0%, 65% { box-shadow: 0 0 0 3px var(--badge-green); border-color: var(--badge-green-fg); }
  100%    { box-shadow: 0 0 0 3px var(--primary-soft); border-color: var(--primary); }
}
.card-row.is-new { animation: cardFlash 1.8s ease-out; }

/* inline edit panel (auto-recharge) */
/* An edit panel is not a selection — it uses the same neutral surface as the
   card-entry form. Pink-soft belongs to the active tab only. */

/* Balance widget placeholder — the parent panel already provides the surface,
   so this adds no third container of its own */
.pg-frame { padding: 0; }
.pg-frame-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--badge-blue-fg); background: var(--badge-blue); padding: 3px 8px; border-radius: 10px; margin-bottom: 14px; }
.pg-frame-tag svg { width: 11px; height: 11px; flex-shrink: 0; }
.pg-field { margin-bottom: 12px; }
.pg-field-label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--fg-secondary); margin-bottom: 8px; display: block; }
.pg-input { height: 36px; background: #fff; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; line-height: 20px; color: var(--fg-muted); }
.pg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
/* Billing address is six fields, not one (Grace, 2026-09-22), laid out the way payment forms
   lay it out — the reference is Stripe's Address Element, which is what a vendor has seen
   everywhere else: Country first (it decides whether the rest reads State/ZIP or
   Province/Postcode), then line 1, line 2, City, then State and ZIP sharing a row because
   they are one line on an envelope. The names are the processor's own — address_line1/line2
   is what Stripe, Braintree and Adyen call them, and what AVS checks.
   EVERY field is labelled, like the card fields above. The first attempt labelled only the
   group and left the rest as placeholders, which payment forms avoid: a placeholder vanishes
   the moment you type, and an address is exactly where people re-check what went in which box.
   ⚠ This is a MOCK of Balance's widget (§13.2) — the real field set is theirs, and dev has to
   confirm it against the widget spec. What this fixes is that ours looked like nothing anyone
   uses. */
.pg-group { font-size: 12px; font-weight: 700; color: var(--fg); margin: 20px 0 12px; }
.pg-input.is-select::after { content: '\2304'; margin-left: auto; color: var(--fg-secondary); font-size: 13px; }
/* A card already on file fills this same block instead of replacing it (Grace, 9/22). Muted
   ground + full-strength text = a value that is THERE but not typeable — the treatment the
   file already uses for facts that cannot be pressed. §13.3.5 forbids in-place editing, so
   a filled box that still looked like an input would invite exactly what the spec refuses. */
.pg-input.is-filled { background: var(--muted); color: var(--fg); border-color: transparent; }
.pg-input.is-filled.is-select::after { content: none; }
.pg-note { margin-top: 12px; font-size: 11px; color: var(--fg-muted); line-height: 16px; }

/* pack picker */
/* auto-fit, so the two columns become one inside a narrow card (4-tab layout, small
   screens) instead of squeezing a receipt into 250px. */
/* The two columns END TOGETHER. `align-items: start` left the summary floating with its
   bottom edge halfway up the pack list, so the panel had a ragged foot; stretching the
   summary and pushing its total block down with `margin-top: auto` (below) turns that
   leftover space into the gap above `Charged today` — the receipt shape, where the amount
   sits at the bottom rule. Collapses to one column under ~660px, where neither applies. */
/* 280 (Grace, 2026-09-09 - she showed the two-column render and asked whether that is
   what clicking Buy credits should give: yes, and it kept collapsing).
   auto-fit keeps two tracks only while 2 x min + gap fits. Now that the panel is NESTED,
   the width available is the balance card's inner 652 minus the panel's own 40 = 612 in
   the review layout (the prototype panel takes 320px off the viewport); at full
   --content-w 1024 it is 936. min 320 needed 658 and min 300 needed 618 - both fell a
   few pixels short of 612 and stacked the summary under the packs. 280 needs 578, which
   clears the narrow case with room and gives 459px columns at full width. */
.buy-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; align-items: stretch; margin-top: 16px; }
.pack-list { display: flex; flex-direction: column; gap: 10px; }
/* Selection card — design system node 4607:65567.
   default 1px border · hover 1px accent · selected 2px accent. Not pink:
   the accent border is how this system marks a chosen option. */
/* A row per pack: radio for "pick one", count on the left, price right-aligned so the
   three prices form a column you can compare. The 2px selected border is the project's
   selection treatment; the radio says it is a choice, which a border alone does not. */
.pack-opt { transition: border-color .13s ease, background-color .13s ease; display: grid; grid-template-columns: 15px 1fr auto; align-items: center; gap: 12px; padding: 15px 16px; border: 1px solid var(--border); border-radius: 10px; text-align: left; cursor: pointer; background: var(--card); font: inherit; }
.pack-radio { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border-muted); background: var(--card); }
.pack-opt.is-sel .pack-radio { border: 4px solid var(--accent); }
.pack-opt:hover { border-color: var(--fg-muted); }
.pack-opt.is-sel:hover { border-color: var(--accent); }
.pack-opt.is-sel { border: 2px solid var(--accent); padding: 14px 15px; background: var(--muted); }
.pack-opt.is-sel .pack-count { font-weight: 700; }
/* nowrap so the bonus badge cannot drop to a second line and make the two bonus rows
   20px taller than the other two (Grace's nested-panel layout, 2026-09-09). The count and
   the badge together are ~164px against ~166px available in the narrow review column, so
   the only thing that was breaking the row was the browser's freedom to wrap between
   "credits" and the badge. At the real content width the column is 459px and there is room
   to spare. */
.pack-count { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pack-unit { font-size: 12px; font-weight: 500; color: var(--fg-secondary); }
.pack-price { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
/* The bonus is a FACT about the pack, so it is a quiet chip on the count it modifies —
   not a coloured call-out beside the price, which would read as an offer we are pushing
   (진아 spec §3 gives +5% / +10%; the accent stays reserved, [[shopcord-accent-usage]]). */
.pack-bonus { margin-left: 8px; padding: 2px 7px; border-radius: 6px; background: var(--badge-green); color: var(--badge-green-fg); font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; vertical-align: 1px; white-space: nowrap; }
/* Two chips that hug their text. The first attempt was a full-width two-cell bar and
   at 1,000px it was a grey slab with two short labels adrift in it — the same mistake
   the auto-recharge summary made earlier today, and the same fix: supporting facts take
   the room they need and no more. Chips keep the pair scannable without a surface that
   claims the whole width. */
.rate-banner { display: flex; align-items: flex-start; gap: 12px; margin-top: 16px; padding: 13px 16px; border-radius: 10px; background: var(--badge-blue); }
.rate-banner-ico { flex-shrink: 0; width: 28px; height: 28px; border-radius: 14px; background: #fff; color: var(--badge-blue-fg); display: flex; align-items: center; justify-content: center; }
.rate-banner-ico svg { width: 15px; height: 15px; }
.rate-banner-title { font-size: 13px; font-weight: 500; color: var(--badge-blue-fg); }
.rate-banner-title strong { font-weight: 700; }
.rate-banner-sub { margin-top: 2px; font-size: 12px; color: var(--badge-blue-fg); opacity: .85; }
/* The free grant said as a TINTED NOTE, not muted grey text (Grace, 9/8: 첫 구독 시 3,000을
   주는데 임팩트가 약해). It is the rate banner's geometry — the in-card note this file already
   uses in the buy panel — with the success palette that `.alert-success` defines and nothing
   had used yet. No new graphic, and the accent pink stays reserved. A page-level banner was
   the other option and is NOT taken: §16 assigns the banner channel to the payout reminder
   and payment failure only, so a third use would be a channel no doc has given us. */
/* The deadline is a `.plan-when` row, borrowed verbatim from the Free plan block
   (Grace, 9/8 — 컨시스턴시): label, the value in bold, a middle dot, then the secondary
   fact. It used to be tacked onto the end of a sentence with an em-dash, which said the
   same kind of thing in a second grammar. Only the colour is overridden — the geometry,
   weights and the dot come from the sibling. */
.rate-banner .plan-when { margin-top: 6px; font-size: 12px; color: inherit; opacity: .9; }
.rate-banner .plan-when strong { color: inherit; }
.rate-banner.is-free { background: var(--badge-green); margin-top: 12px; }
.rate-banner.is-free .rate-banner-ico { color: var(--badge-green-fg); }
.rate-banner.is-free .rate-banner-title, .rate-banner.is-free .rate-banner-sub { color: #3d7666; }
/* ONE state, no date-driven variant (Grace, 9/8). An amber-near-the-deadline version was
   built and removed the same hour: it needed a threshold no document gives, and a note that
   changes colour by date is a second state to keep true in every screen and every doc.
   The deadline is in the line either way — a countdown reads as urgent on its own.
   (Grace also asked whether "9 days left" should sit under Buy credits. It should not: the
   credits expiring are the FREE ones and buying does not save them, so a deadline beside
   that button points at the wrong action. What saves them is sending a campaign.) */
.bs-change strong { animation: figureIn .22s ease-out; }
@keyframes figureIn { from { opacity: .25; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
.rate-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.section-head .rate-strip { margin-top: 0; margin-left: auto; margin-right: 14px; align-self: center; }
/* Filled, not outlined, and only slightly rounded: in this UI an outlined pill IS a
   button (.btn-outline), so the first version invited a press. A tint with no border
   reads as a label — same grouping, no affordance. */
.rate-chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 11px; border-radius: 7px; background: var(--muted); font-size: 12px; color: var(--fg-secondary); }
.rate-chip strong { font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }
/* ONE CARD, and the figure leads it (Grace, 9/8 — settled after four tries).
   What each try got wrong, so none of them comes back:
     · number left + METER right — the right half held one thin line, the left held three
       stacked things (비지/슬로우). The meter was the imbalance.
     · the subscription card's `plan-row` — a tinted box has to wrap a *thing*; a sentence
       plus rate chips is not one, and the figure landed right of two small lines (어색).
     · two `card(01)` stat cards — available and reserved are not two KPIs, they are two
       pieces of ONE balance, and a border between them makes them read as unrelated
       (왜 굳이 두 박스로 쪼개).
   So: the number and its unit on one baseline, one sentence under it, the rate chips as a
   caption, and the state badge up in the head beside the card's name. No bar — a meter
   needs a denominator and a prepaid balance that never resets has none (Twilio and the
   coin platforms show a plain figure; Mailchimp can use a bar only because its credits
   expire every cycle — Research doc, 9/8 section). */
/* PREVIEW ONLY, behind a panel switch — the live card is unchanged while it is off.
   Second attempt (Grace, 9/9: 사선 말고, 좀 더 두껍게, 글씨도 잘 보이게). What changed:
     · 22px instead of 8 — a bar that carries words has to be tall enough to hold them
     · the hatching is gone. Two tints of ONE hue instead: solid green for what can be spent,
       a pale green for what is held. Same pool, two states, no texture noise — and the pale
       tint is still not grey, which is the thing that made the old bar read as "used"
     · the numbers moved INSIDE the segments, so the bar is the sentence rather than needing
       one under it. A segment narrower than a fifth of the bar drops its label instead of
       clipping it. */
/* FULL WIDTH — it ends under Buy credits, on the card's own right edge (Grace, 9/9: 중간에
   짤리니까 뭔가 부족). The 440px cap that the old thin bar needed does not apply here: a
   capped 8px line read as a proportion the eye had to measure, while this one states its two
   numbers at the ends, so length is a frame rather than something to judge. */
.bal-gauge { display: flex; margin-top: 14px; height: 22px; border-radius: 6px; overflow: hidden; background: var(--muted); }
/* 12px, not 11 — every other small label in this card is 12px (rate chips, the note under
   the bar), and 11 was a step smaller than anything around it for no reason.
   And the filled segment is `--success` DARKENED to #15803d: white on #16a34a measured
   3.3:1, under the 4.5:1 AA needs for text this size (the 3:1 large-text exemption starts at
   18.66px bold). #15803d takes it to 5.0:1. Only this bar uses the darker green, and only
   because text sits on it — the meter and the green badges keep the token as it is. */
.bal-gauge > div { display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.bal-gauge .g-avail { background: #15803d; color: #fff; }
.bal-gauge .g-held { background: #dff0e4; color: #2f6b4f; justify-content: flex-end; }
.bal-gauge .g-held.is-narrow, .bal-gauge .g-avail.is-narrow { padding: 0; }
.bal-total { margin-top: 6px; font-size: 12px; color: var(--fg-secondary); }
/* THREE FIGURES, EQUAL RANK — the third option (Grace, 9/9). No bar: the HR systems that
   solve this exact trio (Total / Scheduled / Available, the PTO shape) show numbers, not a
   stacked bar — Workday · BambooHR · Eddy · Workable · Aboard all do, and Aboard's docs say
   outright there are no progress bars. Same type size for all three is what makes them peers;
   the labels sit above, as `card(01)`'s header/Data pair does.
   ⚠ Worth knowing while comparing: the same reference set puts AVAILABLE first and hides the
   total (Eddy shows employees the available balance only — a manager has to open a modal for
   the accrued figure). Equal rank is therefore a deliberate departure from it, not a copy. */
/* NO OPERATORS (Grace, 9/9: 저런 표현은 UI적으로 좋은 게 아닌 것 같아). A minus and an equals
   made the row read as a spreadsheet formula — the vendor parses it instead of reading it.
   The relation is carried by LAYOUT instead: the three sit at even intervals across the card,
   so they read as one measured set, and the result lands on the card's right edge under Buy
   credits — the actionable number in the same column as the action. The `credits` unit is
   gone too; it was a stray word after the last figure and the card's own title already says it. */
.bal-trio { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 18px 40px; }
/* ============ Balance, option D — the statement shape ============
   Grace, 2026-09-09: 셋다 부족해보여. 정확하게 지금 토탈이 얼마이고 너가 예약해놓은게
   얼마이고 그걸빼면 가능한 발란스는 얼마다! 이걸 잘 보여주는 UI가 필요해.
   The answer was already in the file, two feet below this card: .buy-summary states a
   subtraction with a right-aligned figure column and ONE rule above the result. Every
   invoice, receipt and bank statement says "minus" that way, which is why it needs no
   minus sign - a rule above a figure reads as "this is what the lines above come to".
   So this is not a new pattern, it is the sibling component's grammar applied to the
   balance: inputs first at 15px, the result under the rule at the card's hero size.
   Reading order is exactly her sentence: total, then what is committed, then what is left. */
/* ============ SMS Chat (Figma 942:92352) ============
   REBUILT 2026-09-11 after Grace: 화면이 엉망 진창이네 / 피그마랑 완전 다른데. It was — I had
   drawn it from a screenshot without reading the columns, the same mistake as the campaign
   page. The three columns are not the same kind of thing and that is what I had missed:
     · LEFT  (360) — ONE white card holding header, search, segmented tabs and the list
     · CENTRE(768) — a GREY panel; only the header bar and the composer are white cards on it
     · RIGHT (360) — no card at all: a stack of cards on the page ground
   1536 content, gaps 24, ratio units so the proportion holds at any width. */
/* minmax(0, …) because an `fr` track will not shrink below its content's min-content width,
   and the right column's pager was forcing it 44px past its share — the ratio measured 2.132
   but the third column was 378 against the first's 334. With the floor at 0 the tracks are
   exactly 360 : 768 : 360 at every width. */
.chat-grid { display: grid; grid-template-columns: minmax(0, 360fr) minmax(0, 768fr) minmax(0, 360fr); gap: 24px; align-items: stretch; margin-top: 20px; }
@media (max-width: 1100px) { .chat-grid { grid-template-columns: 1fr; } }

/* — left — */
.chat-list { background: var(--card); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; min-height: 620px; }
.chat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; }
.chat-head-t { font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.chat-head-t svg { width: 14px; height: 14px; color: var(--fg-muted); }
.chat-search { padding: 0 20px 14px; }
.chat-seg { display: flex; margin: 0 20px 8px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.chat-seg button { flex: 1; height: 36px; border: none; background: var(--card); font: inherit; font-size: 13px; font-weight: 500; color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.chat-seg button.is-on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.chat-seg .n { min-width: 18px; height: 18px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }
.conv-list { flex: 1; overflow-y: auto; }
.conv { display: block; width: 100%; text-align: left; padding: 14px 20px; border: none; border-top: 1px solid var(--border); background: transparent; font: inherit; cursor: pointer; }
.conv:first-child { border-top: none; }
.conv:hover { background: #fcfbfa; }
.conv.is-on { background: var(--muted); }
.conv-top { display: flex; align-items: center; gap: 8px; }
.conv-num { font-size: 15px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.conv-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
.conv-when { margin-left: auto; font-size: 12px; color: var(--fg-muted); white-space: nowrap; flex-shrink: 0; }
.conv-co { margin-top: 4px; font-size: 14px; color: var(--fg); }
.conv-who { margin-top: 2px; font-size: 14px; color: var(--fg-muted); }

/* — centre: a grey panel, white cards floating on it — */
.chat-thread { background: var(--muted); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; min-height: 620px; }
.thread-head { display: flex; align-items: center; gap: 12px; padding: 18px 20px; background: var(--card); border-bottom: 1px solid var(--border); font-size: 15px; }
.thread-head .t-num { font-weight: 700; font-size: 17px; }
.thread-head .t-div { width: 1px; height: 16px; background: var(--border-muted); }
.thread-head .t-co { color: var(--fg-secondary); }
.thread-body { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.bub-row { display: flex; flex-direction: column; gap: 6px; max-width: 56%; }
.bub-row.out { align-self: flex-end; align-items: flex-end; }
.bub { padding: 12px 16px; border-radius: 10px; font-size: 14px; line-height: 21px; }
.bub-row.in .bub { background: var(--card); }
.bub-row.out .bub { background: #fdfaea; }
.bub-when { font-size: 12px; color: var(--fg-muted); }
.composer { margin: 0 20px 20px; background: var(--card); border-radius: 12px; padding: 16px 18px; }
.composer textarea { width: 100%; border: none; outline: none; resize: none; font: inherit; font-size: 14px; min-height: 52px; background: transparent; color: var(--fg); }
.composer textarea::placeholder { color: var(--fg-muted); }
.composer-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.composer-foot svg { width: 16px; height: 16px; }
.composer-foot .c-attach { display: inline-flex; width: 18px; height: 18px; color: var(--fg-secondary); }
.composer-foot .right { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-secondary); white-space: nowrap; }
.composer-foot .mm-sep { color: var(--border-muted); }
/* CUTOFF NOTICE — replaces the composer, not a bubble in the thread. See Gap I-37. */
.composer-block { margin: 0 20px 20px; background: var(--badge-amber); border: 1px solid #f0dcc0; border-radius: 12px; padding: 16px 18px; display: flex; align-items: flex-start; gap: 12px; }
.composer-block .cb-ico { color: var(--badge-amber-fg); display: inline-flex; width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
